# One cluster of the office platform: the whole of what an organisation keeps.
#
# Three objects: Flux managing itself, the platform version, and every choice you make.
# install.sh writes this from your variables; docs/install.md walks it.
---
# 1. Flux. Applied once by hand; reconciled from `sync` ever after if you set it. Without
#    `sync` this file is the state: re-applying it is the upgrade, which is fine to start.
apiVersion: fluxcd.controlplane.io/v1
kind: FluxInstance
metadata: {name: flux, namespace: flux-system}
spec:
  distribution: {version: "2.x", registry: ghcr.io/fluxcd}
  components: [source-controller, kustomize-controller, helm-controller, notification-controller]
  cluster:
    type: kubernetes
    networkPolicy: false             # true only if your CNI enforces NetworkPolicy
  # Later, when this file lives in a source of its own — one of:
  # sync: {kind: GitRepository, url: https://github.com/example-org/office-cluster, ref: refs/heads/main, path: .}
  # sync: {kind: OCIRepository, url: oci://registry.example.org/office/clusters, ref: latest, path: prod, pullSecret: harbor-auth}
---
# 2. The platform version. THIS LINE IS THE UPGRADE, and editing it back is the rollback.
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata: {name: platform, namespace: flux-system}
spec:
  interval: 30m
  url: oci://harbor.mijnbureau.haaijer.dev/office/charts/control-plane
  ref: {tag: "2.2.14"}
  secretRef: {name: harbor-auth}       # omit for a public registry
---
# 3. Your choices. charts/control-plane/values.yaml documents each key; the schema rejects
#    anything else, so a typo is a refused release with a message.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata: {name: platform, namespace: flux-system}
spec:
  interval: 30m
  chartRef: {kind: OCIRepository, name: platform}
  install: {disableWait: true}         # readiness is watched on the Flux objects, not through Helm
  upgrade: {disableWait: true}
  values:
    domain: example.org
    storageClass: longhorn
    gateway: {ip: 10.0.0.5, tlsIssuer: letsencrypt-gateway, acmeEmail: ops@example.org}
    size: medium                       # small | medium | large
    apps:
      docs: true
      drive: true
      collabora: true                  # Drive needs it
      find: true                       # Docs needs it
      calendars: true
      projects: true
      meet: true                       # brings LiveKit with it
      messages: false                  # mail: needs port 25 both ways (apps/messages/README.md)
    objectStore:
      mode: garage                     # or external: your S3, credentials in a Secret
    cluster:                           # what the platform installs because the cluster lacks it
      gateway: {install: true, className: eg}
      certManager: {install: true}
      loadBalancer: {kind: metallb, install: true, pool: ["10.0.0.5/32", "10.0.0.6/32"]}
    smtp: {configured: false}          # true once the smtp-credentials Secret exists
    registry: {url: oci://harbor.mijnbureau.haaijer.dev/office, pullSecret: harbor-auth}
