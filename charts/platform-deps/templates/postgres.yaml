{{- if .Values.postgres.enabled }}
{{- $app := include "platform.app" . }}
{{- $p := .Values.postgres }}
{{- $keys := include "platform.profile" (list $ "postgres" $p.env) | fromYaml }}
{{- $db := $p.database | default $app }}
{{- $cred := $p.credentialSecret | default (printf "%s-db" $app) }}
# The role's password is generated by the platform layer (adr/0107); this reshapes it
# into the key names {{ $p.env }} applications expect, so the app consumes the whole Secret
# with one `envFrom` and no credential passes through Helm values.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $app }}-postgres
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $p.refreshInterval | quote }}
  secretStoreRef: {kind: ClusterSecretStore, name: {{ .Values.platform.stores.data }}}
  target:
    name: {{ $app }}-postgres
    creationPolicy: Owner
    template:
      data:
        {{- if hasKey $keys "engine" }}
        {{ index $keys "engine" }}: {{ $p.engine | quote }}
        {{- end }}
        {{ index $keys "host" }}: {{ $p.host | quote }}
        {{ index $keys "port" }}: {{ $p.port | quote }}
        {{ index $keys "dbname" }}: {{ $db | quote }}
        {{ index $keys "username" }}: "{{ `{{ .username }}` }}"
        {{ index $keys "password" }}: "{{ `{{ .password }}` }}"
  data:
    - {secretKey: username, remoteRef: {key: {{ $cred }}, property: username}}
    - {secretKey: password, remoteRef: {key: {{ $cred }}, property: password}}
{{- end }}
