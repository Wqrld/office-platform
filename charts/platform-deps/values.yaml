# The application these dependencies belong to. Every Secret, bucket and OIDC client is
# named from it, so an app file normally sets this and almost nothing else.
app: ""
tenant: office

# Where the 30-platform layer put the shared datastores. These are defaults, not knobs —
# an app overriding them is a smell, but a second cluster with different names needs them.
platform:
  stores:
    data: office-data              # ClusterSecretStore holding datastore credentials
    identity: office-identity      # ClusterSecretStore holding OIDC client secrets
  passwordGenerator: office-password

postgres:
  enabled: false
  env: canonical                   # key profile — adr/0106
  database: ""                     # defaults to .Values.app
  host: office-pg-rw.office-data.svc.cluster.local
  port: 5432
  engine: django.db.backends.postgresql_psycopg2
  credentialSecret: ""             # defaults to <app>-db, created by 30-platform
  refreshInterval: 1h

cache:
  enabled: false
  env: canonical
  uses: [cache]                    # which instances this app needs
  instances:
    # `credentialSecret` is the ASSEMBLED Secret, not the generate-once one that feeds it —
    # `platform/secrets/valkey-users.yaml`. Pointing at `valkey-*-users` instead
    # resolves for the users that predate the split and fails for every app added after.
    cache:
      host: valkey-cache.office-data.svc.cluster.local
      port: 6379
      db: 1
      credentialSecret: valkey-cache-acl
    broker:
      host: valkey-broker.office-data.svc.cluster.local
      port: 6379
      db: 0
      credentialSecret: valkey-broker-acl
  refreshInterval: 1h

# One shared instance, an internal user and an index prefix per app (06-datastores.md).
opensearch:
  enabled: false
  env: canonical
  host: opensearch-cluster-master.office-data.svc.cluster.local
  port: 9200
  username: ""                     # defaults to .Values.app
  indexPrefix: ""                  # defaults to .Values.app; the tenant boundary (adr/0111)
  # TLS from a cluster-internal CA. Encryption only: Find hardcodes verify_certs=False, so
  # there is no server authentication on that path (adr/0111).
  useSSL: true
  credentialSecret: ""             # defaults to opensearch-user-<app>, created by 30-platform
  refreshInterval: 1h

objectstore:
  enabled: false
  env: canonical
  # `garage` provisions a bucket and a key on the platform's own store. `external` points
  # at any S3-compatible store the organisation already runs: like smtp, the endpoint,
  # region and credential are applied by hand into office-data once (docs/bootstrap.md) as
  # a Secret with keys endpoint, region, accessKeyId, secretAccessKey. Bucket names stay
  # the platform's (<app>); the organisation creates them, and CORS for Drive's browser
  # upload is theirs to configure there. The Secret the app reads is identical either way.
  mode: garage                     # garage | external
  credentialSecret: object-store   # external only, in the office-data store
  refreshInterval: 1h              # external only
  bucket: ""                       # defaults to .Values.app
  globalAlias: ""                  # defaults to bucket; set explicitly when restoring data
  cluster: {name: office-s3, namespace: office-data}
  quota: {maxSize: ""}
  deletionPolicy: Retain
  # Where a BROWSER can reach this bucket. Only correct for an app that presigns to the
  # browser, and only if the store is actually published there (adr/0110). Rendered
  # through `tpl`; the profile picks the env name. In external mode the endpoint is already
  # public, so only non-emptiness matters: it flags "this app presigns" and the text is unused.
  publicEndpoint: ""
  # Garage is not AWS. Since 2025 the AWS SDKs send checksum algorithms that non-AWS S3
  # implementations may reject; these make boto3 ask for one only when the call needs it.
  awsChecksumWorkaround: true

# Outbound mail. The relay credential is the one secret on this platform that cannot be
# generated: it is issued by a mail provider, applied by hand into office-data once
# (docs/bootstrap.md), and read from there by every app that sends. HOST, PORT, TLS FLAGS AND
# THE FROM-ADDRESS ALL LIVE IN THAT SECRET TOO, not here — switching provider is then one
# `kubectl` and nothing about mail is in git.
#
# Outbound TCP 25 is blocked by this platform's provider (measured), so the relay must answer
# on 587 or 465.
smtp:
  enabled: false
  env: canonical
  # The Django backend class. A constant rather than a credential, but it belongs in the same
  # Secret as the host it points at — see postgres.engine for the same reasoning.
  backend: django.core.mail.backends.smtp.EmailBackend
  credentialSecret: smtp-credentials   # in the office-data store; applied by hand, not generated
  refreshInterval: 1h

# Public DNS suffix. Supplied by the app file as ${BASE_DOMAIN} — Flux substitutes it into
# the HelmRelease values before the release is applied.
baseDomain: ""

oidc:
  enabled: false
  client: ""                       # defaults to .Values.app; also names the Keycloak client
  realm: office
  idHost: id                       # <idHost>.<baseDomain> is the browser-facing issuer
  internalUrl: http://keycloak-service.office-identity.svc.cluster.local:8080
  host: ""                         # redirect host; defaults to <app>.<baseDomain>
  scopes: [openid, email, profile] # `profile` carries given_name/family_name — without it
                                   # every user's display name is their email address
  clientSecretKey: ""              # defaults to oidc-client-<client>
  refreshInterval: 1h

  # Defaults are the secure end of each choice. An app relaxes one deliberately, in its own
  # file, where the relaxation is visible.
  signAlgo: RS256
  requireHttps: true
  useNonce: true
  # Closed provisioning. An app whose users should be created on first login sets this
  # true; the failure when it is wrong is a refused login, which is loud, not silent.
  createUser: false
  fallbackToEmail: true
  allowDuplicateEmails: false
  storeAccessToken: true
  storeIdToken: true
  storeRefreshToken: false
  fullnameFields: [given_name, family_name]
  shortnameField: name
  extraEnv: {}

# Secrets generated once, in-cluster, and never derived at render time (adr/0005).
#
#   generated:
#     docs-django:
#       - {env: DJANGO_SECRET_KEY, draw: secretkey}
#
# A LIST, not a map: `dataFrom` is ordered, its order is part of the spec, and Helm sorts
# map keys — so a map would let a re-sort silently rewrite the object.
#
# Each entry takes its OWN draw, so two variables in one Secret are never equal. The draw
# name is internal to the ExternalSecret and never appears in the Secret it produces.
# `generator` names the ClusterGenerator for that one draw; the default is
# `platform.passwordGenerator` (40 characters). Django's SECRET_KEY wants 50 or more —
# its deploy check (security.W009) says so on every heartbeat — so that entry names
# `office-token-50`:
#
#       - {env: DJANGO_SECRET_KEY, draw: secretkey, generator: office-token-50}
#
# THESE OBJECTS CANNOT GAIN A VARIABLE once drawn. `refreshInterval: "0"` means written
# once and never again, not "re-draw on a spec change": an added entry never appears while
# ESO still reports `secret synced`. Give a live application a second `generated` Secret
# and a second `envFrom` instead.
generated: {}
