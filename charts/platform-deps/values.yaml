# What an app needs before it starts. values.schema.json describes each key; an app file
# normally sets `app`, `env` and which kinds are enabled.
app: ""
tenant: office

# Where the platform layer put the shared datastores: defaults, not knobs.
platform:
  stores:
    data: office-data              # ClusterSecretStore holding datastore credentials
    identity: office-identity      # ClusterSecretStore holding OIDC client secrets
  passwordGenerator: office-password

env: ""                            # lasuite | find | calendars | projects | messages

postgres:
  enabled: false
  env: ""
  database: ""                     # defaults to .Values.app
  host: office-pg-rw.office-data.svc.cluster.local
  port: 5432
  engine: django.db.backends.postgresql_psycopg2
  credentialSecret: ""             # defaults to <app>-db, created by 30-platform
  refreshInterval: 1h

# Two instances, cache and broker: platform/valkey/README.md.
cache:
  enabled: false
  env: ""
  uses: [cache]                    # which instances this app needs
  instances:
    # `credentialSecret` is the ASSEMBLED Secret, not the generate-once one (schema).
    cache:
      host: valkey-cache.office-data.svc.cluster.local
      port: 6379
      db: 1
      credentialSecret: valkey-cache-acl
    broker:
      host: valkey-broker.office-data.svc.cluster.local
      port: 6379
      db: 0
      credentialSecret: valkey-broker-acl
  refreshInterval: 1h

# One shared instance, an internal user and an index prefix per app (adr/0111).
opensearch:
  enabled: false
  env: ""
  host: opensearch-cluster-master.office-data.svc.cluster.local
  port: 9200
  username: ""                     # defaults to .Values.app
  indexPrefix: ""                  # defaults to .Values.app; the tenant boundary (adr/0111)
  useSSL: true
  credentialSecret: ""             # defaults to opensearch-user-<app>, created by 30-platform
  caSecret: ""                     # for an app that verifies the certificate
  caPath: /etc/opensearch-ca/ca.crt
  refreshInterval: 1h

objectstore:
  enabled: false
  env: ""
  mode: garage                     # garage | external
  credentialSecret: object-store   # external only, in the office-data store
  refreshInterval: 1h              # external only
  bucket: ""                       # defaults to .Values.app
  globalAlias: ""                  # defaults to bucket; set explicitly when restoring data
  cluster: {name: office-s3, namespace: office-data}
  quota: {maxSize: ""}
  deletionPolicy: Retain
  publicEndpoint: ""               # only for an app that presigns to the browser (adr/0110)
  awsChecksumWorkaround: true      # Garage is not AWS

# The relay is a hand-applied Secret; outbound 25 is blocked, so it answers on 587 or 465.
smtp:
  enabled: false
  env: ""
  backend: django.core.mail.backends.smtp.EmailBackend
  credentialSecret: smtp-credentials   # in the office-data store; applied by hand, not generated
  refreshInterval: 1h

baseDomain: ""                     # supplied as ${BASE_DOMAIN} by the app file

oidc:
  enabled: false
  env: django                      # django | discovery
  client: ""                       # defaults to .Values.app; also names the Keycloak client
  realm: office
  idHost: id                       # <idHost>.<baseDomain> is the browser-facing issuer
  internalUrl: http://keycloak-service.office-identity.svc.cluster.local:8080
  host: ""                         # redirect host; defaults to <app>.<baseDomain>
  scopes: [openid, email, profile] # `profile`, or every display name is an email address
  clientSecretKey: ""              # defaults to oidc-client-<client>
  refreshInterval: 1h

  # The secure end of each choice; an app relaxes one in its own file, where it is visible.
  signAlgo: RS256
  requireHttps: true
  useNonce: true
  createUser: true                 # the realm decides who exists; registration is off there
  fallbackToEmail: true
  allowDuplicateEmails: false
  storeAccessToken: true
  storeIdToken: true
  storeRefreshToken: false
  fullnameFields: [given_name, family_name]
  shortnameField: name
  extraEnv: {}

# Secrets generated once, in-cluster: an ORDERED list per Secret that can never gain an
# entry once drawn (schema).
#   docs-django:
#     - {env: DJANGO_SECRET_KEY, draw: secretkey, generator: office-token-50}
generated: {}

# Values both ends of an app-to-app exchange read, drawn once in office-data:
#   docs-search: {SEARCH_INDEXER_SECRET: {from: find-service-tokens, key: docs}}
shared: {}
