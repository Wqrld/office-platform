# The application table: every app the platform knows, and the only place anything is said
# per app outside apps/<app>/ (apps/README.md, Adding an application). tests/build.py asserts
# this file, apps/ and examples/cluster.yaml agree.
#
# What the control plane reads:
#   default: true|false            on or off when the organisation's `apps:` does not say;
#                                  none on an internal app
#   internal: true                 not chosen: pulled in by what requires it, dropped with it
#   requires: [app, ...]           what must run first; Flux enforces it with `dependsOn`
#   hosts: [name, ...]             its subdomains, so the certificate's SANs: an app that is
#                                  off has none and needs no DNS record
#   switcher: {name, logo, maturity}  its entry in every switcher (SERVICES_JSON), logo a
#                                  path on its first host; none on an app no user opens
#
# What the platform provisions, in platform-tenants' spelling. Every app's fields, enabled or
# not, reach that chart as TENANTS_JSON, so a disabled app comes back with its data
# (adr/0107); its reconcile Jobs pick up a new entry.
#   postgres: {extensions: [...]}  a role and a database on the shared cluster
#   cache: [cache, broker]         a password and an ACL user per Valkey instance, with the
#                                  instance's shared line (platform-tenants' `valkeyAcl`)
#   acl: {<instance>: "+cmd ..."}  added to that shared line, on that instance only
#   oidc: {...}                    a realm client, its secret generated and read back:
#       shape: lasuite             the default: a confidential browser client with lasuite's
#                                  back- and front-channel logout at /api/v1.0/logout/
#       shape: login               a browser client without logout; `redirect` its callback
#       shape: resource-server     no browser, no flow: it only introspects tokens
#       description, name          what the admin console shows; name defaults to the app
#       accessTokenLifespan        seconds, per client; the realm default is 300
#       audiences: [client]        clients added to this one's access-token `aud`
#   search: [pattern, ...]         an OpenSearch user granted exactly these index patterns
#   bucket: true                   may create a bucket and a key on the platform's Garage
#
# Collabora is NOT an OIDC client: Drive hands it a WOPI token, its only credential.
collabora:
  default: true
  hosts: [collabora]

# `configure-wopi` calls Collabora's discovery at install. The logo is Drive's header mark.
drive:
  default: true
  requires: [collabora]
  hosts: [drive]
  switcher: {name: Drive, logo: /assets/logo-icon_beta.svg, maturity: stable}
  postgres: {extensions: [ltree, pg_trgm, unaccent]}
  cache: [cache, broker]
  bucket: true
  oidc: {description: Drive — bestanden delen en samen bewerken}

# Docs calls it at the public URL (apps/find/surround.yaml), so it needs its SAN.
find:
  default: true
  hosts: [find]
  postgres: {}
  cache: [cache]
  # Its name is also the audience Find resolves indices from: it stays `find`.
  oidc: {shape: resource-server, description: Find — zoeken over alle applicaties}
  search: [find-*]

# The search-flags Job and reindex assume Find.
docs:
  default: true
  requires: [find]
  hosts: [docs]
  switcher: {name: Docs, logo: /assets/icon-docs.svg, maturity: stable}
  postgres: {extensions: [pg_trgm, unaccent]}
  cache: [cache, broker]
  bucket: true
  oidc:
    description: Docs — samen werken aan documenten
    # Must exceed 900, or search falls back to titles after 5 minutes (apps/docs/README.md).
    accessTokenLifespan: 1200
    # Without `find` in `aud`, Find cannot introspect a Docs token (apps/docs/README.md).
    audiences: [find]

# Its SAN is every CalDAV client's handshake too. One database, two schemas; the initdb Job
# needs CONNECT on `postgres`, which PUBLIC has on a stock cluster.
calendars:
  default: true
  hosts: [calendars]
  switcher: {name: Calendars, logo: /favicon.png, maturity: beta}
  postgres: {}
  cache: [cache, broker]
  # Dramatiq's dispatch script calls KEYS (platform/valkey/README.md).
  acl: {broker: +keys}
  oidc: {description: Calendars — agenda's delen en vergaderingen plannen}

# DATABASE_URL is assembled unescaped (hence no symbols in generated passwords). No logout
# endpoints, so `shape: login` (apps/projects/README.md, Known gaps).
projects:
  default: true
  hosts: [projects]
  switcher: {name: Projects, logo: /oss/light/logomark.svg, maturity: beta}
  postgres: {}
  cache: [cache]
  # node_redis's ready check is INFO, which is @dangerous.
  acl: {cache: +info}
  bucket: true
  oidc: {shape: login, redirect: /oidc-callback, description: "Projects — borden, lijsten en kaarten voor projectbeheer"}

# Off by default: it needs port 25 open both ways and a PTR (apps/messages/README.md, Mail
# DNS). `mx.` is an A record, never HTTPS, so not a host here.
messages:
  default: false
  hosts: [messages]
  switcher: {name: Messages, logo: /images/pwa/icons/ios/32.png, maturity: alpha}
  postgres: {extensions: [unaccent]}
  # The cache is Django's and rspamd's (Lua, @scripting: in the shared line); the broker is
  # mail delivery.
  cache: [cache, broker]
  bucket: true
  oidc: {description: Messages — gedeelde mailboxen}
  # The index name is fixed in its code (search/mapping.py).
  search: [messages]

# Meet's media. `livekit.` is signalling; `turn.` is an A record, never HTTPS, so not a host.
livekit:
  internal: true
  hosts: [livekit]
  # Room state and the egress queue: a lost record is a dropped call. SUBSCRIBE is in `&*`.
  cache: [broker]

# Transcripts go to Docs (`docs-meet`, apps/docs/deps.yaml); the broker is the summary
# service's Celery.
meet:
  default: true
  requires: [docs, livekit]
  hosts: [meet]
  switcher: {name: Meet, logo: /favicon-32x32.png, maturity: beta}
  postgres: {extensions: [pg_trgm]}
  cache: [cache, broker]
  bucket: true
  oidc: {description: Meet — videovergaderen}
