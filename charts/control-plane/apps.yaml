# The application table: every app the platform knows, what it needs running first, and
# the hostnames it serves — the one place the dependencies between applications are
# stated (Flux enforces them with `dependsOn` and health gating) and the one place the
# certificate's SAN list comes from, so an app that is off has no SAN and needs no record.
#
# `internal: true` marks an app an organisation does not choose: it is pulled in by
# whatever requires it and dropped with it. `switcher` is the app's entry in every app
# switcher (name, logo path on its first host, maturity) — SERVICES_JSON in cluster-vars
# is built from the enabled apps' entries, so an app that is off is in no switcher. An app
# without one is one no user opens by hand: Collabora is only ever an iframe inside Drive,
# Find is an API Docs calls, LiveKit is media. Adding an application is one entry here and
# one directory under apps/ with its sizes. tests/build.py asserts this file and apps/ agree.
collabora: {hosts: [collabora]}
# Drive's `configure-wopi` Job calls Collabora's discovery endpoint at install.
# `logo-icon_beta.svg` is the mark Drive's own header renders (cunningham-tokens.ts).
drive: {requires: [collabora], hosts: [drive], switcher: {name: Drive, logo: /assets/logo-icon_beta.svg, maturity: stable}}
# No browser reaches Find, but Docs does — over the public URL, because a pod-to-pod call
# carries no X-Forwarded-Proto and Find 301s it (apps/find/README.md). Without its SAN
# the handshake fails and search silently falls back to title-only.
find: {hosts: [find]}
# Docs' search-flags Job and its reindex both assume Find exists.
docs: {requires: [find], hosts: [docs], switcher: {name: Docs, logo: /assets/icon-docs.svg, maturity: stable}}
# Also the host CalDAV clients connect to, so its SAN is every client's handshake.
calendars: {hosts: [calendars], switcher: {name: Calendars, logo: /favicon.png, maturity: beta}}
# Its gaufre is the app's own LaGaufreButton, configured through THEME (apps/projects).
projects: {hosts: [projects], switcher: {name: Projects, logo: /oss/light/logomark.svg, maturity: beta}}
# Mail also arrives on the Gateway's `smtp` listener, as `mx.` — which is an A record and no
# host here: it is never served over HTTPS, so it has no business on the certificate. The
# MTA's STARTTLS certificate is its own (apps/messages/surround.yaml).
messages: {hosts: [messages], switcher: {name: Messages, logo: /images/pwa/icons/ios/32.png, maturity: alpha}}
# WebRTC media; nothing but Meet uses it. `livekit.*` is the SIGNALLING host, a WebSocket
# through the Gateway; media goes through the Gateway's L4 listeners (adr/0113). `turn.*`
# is an A record to the Gateway but no host here: it is never served over HTTPS, so it
# has no business on the certificate.
livekit: {internal: true, hosts: [livekit]}
# Meet's backend hands the browser LiveKit's address; transcripts are delivered as Docs
# documents (apps/docs/meet-token.yaml).
meet: {requires: [docs, livekit], hosts: [meet], switcher: {name: Meet, logo: /favicon-32x32.png, maturity: beta}}
