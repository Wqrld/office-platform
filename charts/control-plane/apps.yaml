# The application table: every app the platform knows, and the one place anything is said
# per app outside its apps/<app>/ directory. Adding an application is one entry here, plus
# that directory with its sizes, its source pin (templates/sources.yaml), its updatecli file
# and its test case; tests/build.py asserts this file, apps/ and examples/cluster.yaml agree.
#
# What an entry says, in two groups. The first is what the control plane reads:
#
#   default: true|false            on or off when an organisation's values do not say —
#                                  what `apps:` in the values falls back to. No default on
#                                  an internal app: it is not chosen.
#   internal: true                 an app an organisation does not choose: it is pulled in by
#                                  whatever requires it and dropped with it
#   requires: [app, ...]           what must run first — the one place the dependencies
#                                  between applications are stated; Flux enforces them with
#                                  `dependsOn` and health gating
#   hosts: [name, ...]             the subdomains it serves — the certificate's SAN list comes
#                                  from here, so an app that is off has no SAN and needs no record
#   switcher: {name, logo, maturity}  its entry in every app switcher, logo a path on its
#                                  first host. SERVICES_JSON in cluster-vars is built from the
#                                  enabled apps' entries, so an app that is off is in no
#                                  switcher. An app without one is one no user opens by hand:
#                                  Collabora is only ever an iframe inside Drive, Find is an API
#                                  Docs calls, LiveKit is media.
#
# The second is what the platform provisions for it, in platform-tenants' own spelling: the
# control plane hands every app's fields, enabled or not, to that chart as TENANTS_JSON, so
# a disabled app comes back with its data (adr/0107). Nothing to run by hand afterwards: the
# realm and OpenSearch reconcile Jobs pick a new entry up.
#
#   postgres: {extensions: [...]}  a role and a database on the shared cluster
#   cache: [cache, broker]         one generated password and one ACL user per Valkey instance,
#                                  with the instance's shared permissions (platform-tenants'
#                                  `valkeyAcl`)
#   acl: {<instance>: "+cmd ..."}  permissions added to that shared line, on that instance only
#   oidc: {...}                    a client in the realm, its secret generated by platform-
#                                  tenants and read back by the app:
#       shape: lasuite             the default — a confidential browser client with the
#                                  lasuite back- and front-channel logout at /api/v1.0/logout/
#       shape: login               a browser client without logout endpoints; `redirect` is
#                                  its one callback path
#       shape: resource-server     no browser, no flow: it only introspects tokens
#       description, name          what the admin console shows; name defaults to the app's
#       accessTokenLifespan        seconds, per client; the realm default is 300
#       audiences: [client]        clients added to this one's access-token `aud`
#   search: [pattern, ...]         an OpenSearch user whose role grants exactly these index
#                                  patterns — the tenant boundary
#   bucket: true                   may create a bucket and a key on the platform's Garage
#
# Collabora is NOT an OIDC client: it never talks to Keycloak. Drive hands it a short-lived
# WOPI access token, and it authenticates back to Drive with that token alone.
collabora:
  default: true
  hosts: [collabora]

# Drive's `configure-wopi` Job calls Collabora's discovery endpoint at install.
# `logo-icon_beta.svg` is the mark Drive's own header renders (cunningham-tokens.ts).
drive:
  default: true
  requires: [collabora]
  hosts: [drive]
  switcher: {name: Drive, logo: /assets/logo-icon_beta.svg, maturity: stable}
  postgres: {extensions: [ltree, pg_trgm, unaccent]}
  cache: [cache, broker]
  bucket: true
  oidc: {description: Drive — bestanden delen en samen bewerken}

# No browser reaches Find, but Docs does — over the public URL, because a pod-to-pod call
# carries no X-Forwarded-Proto and Find 301s it (apps/find/README.md). Without its SAN
# the handshake fails and search silently falls back to title-only.
find:
  default: true
  hosts: [find]
  postgres: {}
  cache: [cache]
  # A resource SERVER: it only introspects access tokens other clients issued, so no
  # browser reaches it and it needs no grant — a confidential client authenticates to the
  # introspection endpoint with its secret alone. Its name is also the audience Find
  # resolves its searchable indices from, so it stays `find` (apps/find/deps.yaml,
  # OIDC_RS_CLIENT_ID).
  oidc: {shape: resource-server, description: Find — zoeken over alle applicaties}
  # `find-*` and nothing else: cluster_composite_ops comes with every role, for the bulk
  # indexing path — without it `manage.py index` fails on the first batch.
  search: [find-*]

# Docs' search-flags Job and its reindex both assume Find exists.
docs:
  default: true
  requires: [find]
  hosts: [docs]
  switcher: {name: Docs, logo: /assets/icon-docs.svg, maturity: stable}
  postgres: {extensions: [pg_trgm, unaccent]}
  cache: [cache, broker]
  bucket: true
  oidc:
    description: Docs — samen werken aan documenten
    # It MUST exceed 900. At login mozilla-django-oidc sets `oidc_id_token_expiration =
    # now + OIDC_RENEW_ID_TOKEN_EXPIRY_SECONDS`, whose default is 900s and which Docs does
    # not expose — so the refresh middleware does nothing for the first 15 minutes. At the
    # realm's 300s the token dies at minute 5 and search silently falls back to titles
    # until minute 15. After the first refresh lasuite tracks the real `expires_in`, so
    # only the first window is wrong.
    accessTokenLifespan: 1200
    # Puts `find` in the access token's `aud`. Without it Keycloak refuses to introspect a
    # Docs token for Find and returns `active: false` — Find 400s, and Docs swallows that
    # into the title-only search fallback. Verified: a freshly minted token introspects as
    # inactive until this mapper exists.
    audiences: [find]

# Also the host CalDAV clients connect to, so its SAN is every client's handshake.
# One database, two schemas: Django's `public`, SabreDAV's `sabre`. Its initdb Job opens
# `postgres` first, so the role needs CONNECT there — PUBLIC has it on a stock cluster.
# Dramatiq's result backend shares the `cache` credential: same instance, same user.
calendars:
  default: true
  hosts: [calendars]
  switcher: {name: Calendars, logo: /favicon.png, maturity: beta}
  postgres: {}
  cache: [cache, broker]
  # `+keys` on top of the shared shape, and ONLY on the broker. Dramatiq's dispatch is a Lua
  # script that calls KEYS, which lives in @dangerous — so the worker fails with `ACL
  # failure in script: User calendars has no permissions to run the 'keys' command` and
  # retries forever, three seconds at a time. Celery never calls KEYS, which is why Docs
  # and Drive have never needed this.
  #
  # It grants no reach these users do not already have: every pattern is `~*`. It does make
  # the case for narrowing those patterns sharper, since KEYS turns "can read any key" into
  # "can enumerate every key" — see platform/valkey/README.md.
  acl: {broker: +keys}
  oidc: {description: Calendars — agenda's delen en vergaderingen plannen}

# Its gaufre is the app's own LaGaufreButton, configured through THEME (apps/projects).
# DATABASE_URL is assembled unescaped, which is why the generator has no symbols.
# No back- or front-channel logout URL: Projects has neither endpoint. Its logout sends the
# browser to Keycloak's end_session endpoint, so a logout started here ends both; one
# started in another app leaves this session alive until its token expires.
projects:
  default: true
  hosts: [projects]
  switcher: {name: Projects, logo: /oss/light/logomark.svg, maturity: beta}
  postgres: {}
  cache: [cache]
  # node_redis (Sails' sessions and socket.io adapter) sends INFO as its ready check, and
  # INFO is @dangerous — without it the client never becomes ready.
  acl: {cache: +info}
  bucket: true
  oidc: {shape: login, redirect: /oidc-callback, description: "Projects — borden, lijsten en kaarten voor projectbeheer"}

# Off until an organisation has port 25 open in BOTH directions and a PTR record for its
# egress address — apps/messages/README.md, Mail DNS.
# Mail also arrives on the Gateway's `smtp` listener, as `mx.` — which is an A record and no
# host here: it is never served over HTTPS, so it has no business on the certificate. The
# MTA's STARTTLS certificate is its own (apps/messages/surround.yaml).
messages:
  default: false
  hosts: [messages]
  switcher: {name: Messages, logo: /images/pwa/icons/ios/32.png, maturity: alpha}
  postgres: {extensions: [unaccent]}
  # The cache is Django's and, through the same URL, rspamd's (apps/messages): Bayes,
  # reputation and ratelimit state, loaded as Lua scripts — @scripting, which the shared
  # line allows. Tested against exactly these permissions; eviction costs rspamd
  # retraining, not mail. The broker is its Celery: inbound delivery, outbound sending,
  # imports, reindexing.
  cache: [cache, broker]
  bucket: true
  oidc: {description: Messages — gedeelde mailboxen}
  # The index is named `messages`, fixed in its code (search/mapping.py) — no prefix to
  # configure, so the pattern pins the name itself.
  search: [messages]

# WebRTC media; nothing but Meet uses it. `livekit.*` is the SIGNALLING host, a WebSocket
# through the Gateway; media goes through the Gateway's L4 listeners (adr/0113). `turn.*`
# is an A record to the Gateway but no host here: it is never served over HTTPS, so it
# has no business on the certificate.
livekit:
  internal: true
  hosts: [livekit]
  # Room state, node registry and the egress request queue: broker only, since a lost room
  # record is a dropped call. Its Redis client also SUBSCRIBEs, which `&*` covers.
  cache: [broker]

# Meet's backend hands the browser LiveKit's address; transcripts are delivered as Docs
# documents (apps/docs/meet-token.yaml). The broker is its summary service's Celery — the
# transcript queue.
meet:
  default: true
  requires: [docs, livekit]
  hosts: [meet]
  switcher: {name: Meet, logo: /favicon-32x32.png, maturity: beta}
  postgres: {extensions: [pg_trgm]}
  cache: [cache, broker]
  bucket: true
  oidc: {description: Meet — videovergaderen}
