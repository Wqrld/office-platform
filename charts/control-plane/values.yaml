# The organisation's contract with the platform. values.schema.json describes every key and
# refuses anything else; examples/cluster.yaml is the whole file an organisation keeps.

# ---------------------------------------------------------------- what an organisation chooses
domain: ""                        # public DNS suffix: docs.<domain>, id.<domain>…
storageClass: longhorn
gateway:
  ip: ""                          # the shared Gateway's address — a MetalLB pool address
  tlsIssuer: letsencrypt-gateway  # ClusterIssuer for the one SAN certificate
  acmeEmail: ""                   # Let's Encrypt's contact for the certificate
  extraCertificates: []           # TLS Secrets in office-system for hosts routed outside the platform
size: medium                      # small | medium | large — apps/README.md, Sizing
apps: {}                          # <app>: true|false; the rest take charts/control-plane/apps.yaml's default
objectStore:
  mode: garage                    # garage | external (an S3 store of the organisation's)
# What the platform installs because the cluster lacks it (adr/0112).
cluster:
  gateway:
    install: false                # Envoy Gateway, with the Gateway API CRDs
    className: eg                 # the GatewayClass the Gateway attaches to
  certManager:
    install: false                # cert-manager, with enableGatewayAPI
  loadBalancer:
    kind: metallb                 # metallb: the Gateway pinned to gateway.ip; none: the cluster allocates
    install: false
    pool: []                      # for MetalLB: "10.0.0.5/32", "10.0.0.5-10.0.0.6"
smtp:
  configured: false               # false ships a placeholder relay (docs/install.md, "Mail")

# ---------------------------------------------------------------- platform defaults
source:
  url: https://github.com/Wqrld/office-platform   # this repository or a fork, at this chart's tag
  secretRef: ""                   # a Flux git Secret for a private repository
reconcile:
  interval: 30m
  retryInterval: 2m
  timeout: 10m
