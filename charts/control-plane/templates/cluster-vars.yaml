# The scalars the layers substitute (`postBuild.substituteFrom`), derived from the typed
# values above rather than written by hand: one input, one artifact, nothing twice.
apiVersion: v1
kind: ConfigMap
{{ include "platform.metadata" "cluster-vars" }}
data:
  BASE_DOMAIN: {{ .Values.domain | quote }}
  # Each app's HelmReleases pick their sizing from `<app>-sizes` by this key
  # (apps/README.md, Sizing); a size the ConfigMap lacks is a HelmRelease that says so.
  SIZE: {{ .Values.size | quote }}
  STORAGE_CLASS: {{ .Values.storageClass | quote }}
  GATEWAY_IP: {{ .Values.gateway.ip | quote }}
  GATEWAY_CLASS: {{ .Values.cluster.gateway.className | quote }}
  LB_ANNOTATIONS: {{ include "platform.lbAnnotations" (list . .Values.gateway.ip) | quote }}
  {{- with .Values.cluster.loadBalancer }}{{ if .install }}
  LB_POOL: {{ .pool | toJson | quote }}
  {{- end }}{{ end }}
  TLS_ISSUER: {{ .Values.gateway.tlsIssuer | quote }}
  ACME_EMAIL: {{ .Values.gateway.acmeEmail | quote }}
  S3_MODE: {{ .Values.objectStore.mode | quote }}
  TLS_HOSTS: {{ include "platform.tlsHosts" . | quote }}
  MONITORING_MODE: {{ include "platform.monitoringMode" . | quote }}
  ALERT_EMAIL: {{ .Values.monitoring.email | quote }}
  PROBE_TARGETS: {{ include "platform.probeTargets" . | quote }}
  GATEWAY_CERTS: {{ include "platform.gatewayCerts" . | quote }}
  SERVICES_JSON: {{ include "platform.servicesJson" . | quote }}
  TENANTS_JSON: {{ include "platform.tenantsJson" . | quote }}
