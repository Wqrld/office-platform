# Chart sources the layers before the apps read, and the chart repositories. An app's own
# git source is in apps/<app>/source.yaml, applied with its release: from here the control
# plane moved every app's chart at once, before its layer applied the values that go with it,
# so each bumped app upgraded twice and ran a new chart with old images in between. Upstream
# pins are literal: updatecli rewrites them (updatecli/README.md). La Suite publishes no Helm
# repository, so its charts come from pinned git tags — see docs/adr/0104.
{{- /* Written out per source on purpose, `interval` and `ignore` included: updatecli's
patterns are anchored to each source's url line, and a source generated from a table
has none to anchor to. An HTTP HelmRepository is an index of every version, refreshed at
its interval: at 24h a bumped pin newer than the last fetch failed SourceNotReady for up to a
day, so 1h. A git tag or OCI pin is fetched when it changes, whatever the interval. */}}
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
{{ include "platform.metadata" "cloudnative-pg" }}
spec:
  interval: 1h
  url: https://cloudnative-pg.github.io/charts
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
{{ include "platform.metadata" "external-secrets" }}
spec:
  interval: 1h
  url: https://charts.external-secrets.io
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
{{ include "platform.metadata" "valkey" }}
spec:
  interval: 1h
  url: https://valkey.io/valkey-helm/
---
# kube-prometheus-stack (under monitoring.mode: platform) and the blackbox exporter.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
{{ include "platform.metadata" "prometheus-community" }}
spec:
  interval: 1h
  url: https://prometheus-community.github.io/helm-charts
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
{{ include "platform.metadata" "opensearch" }}
spec:
  interval: 1h
  url: https://opensearch-project.github.io/helm-charts
---
# Collabora is the exception to adr/0104: it is not a La Suite application and it DOES
# publish a chart repository, so it is an ordinary pinned HelmRelease.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
{{ include "platform.metadata" "collabora" }}
spec:
  interval: 1h
  url: https://collaboraonline.github.io/online
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
{{ include "platform.metadata" "garage-operator" }}
spec:
  interval: 24h
  type: oci
  url: oci://ghcr.io/rajsinghtech/charts
---
# Our own charts, built from the platform source at this chart's version (config.yaml), so a
# control plane can only ever pair with the platform charts it was released with.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmChart
{{ include "platform.metadata" "platform-deps" }}
spec:
  interval: 30m
  chart: ./charts/platform-deps
  sourceRef: {kind: GitRepository, name: office-config}
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmChart
{{ include "platform.metadata" "platform-app" }}
spec:
  interval: 30m
  chart: ./charts/platform-app
  sourceRef: {kind: GitRepository, name: office-config}
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmChart
{{ include "platform.metadata" "platform-tenants" }}
spec:
  interval: 30m
  chart: ./charts/platform-tenants
  sourceRef: {kind: GitRepository, name: office-config}
{{- if .Values.cluster.gateway.install }}
---
# Envoy Gateway, with the Gateway API CRDs in its chart — only when the platform installs
# the Gateway (cluster/gateway).
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
{{ include "platform.metadata" "envoy-gateway" }}
spec:
  interval: 24h
  url: oci://docker.io/envoyproxy/gateway-helm
  ref: {tag: v1.7.0}
{{- end }}
{{- if .Values.cluster.certManager.install }}
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
{{ include "platform.metadata" "jetstack" }}
spec:
  interval: 1h
  url: https://charts.jetstack.io
{{- end }}
{{- if .Values.cluster.loadBalancer.install }}
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
{{ include "platform.metadata" "metallb" }}
spec:
  interval: 1h
  url: https://metallb.github.io/metallb
{{- end }}
