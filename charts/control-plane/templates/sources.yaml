# Chart sources — every pin the platform runs, in one file. Upstream pins are literal:
# updatecli rewrites them here (updatecli/README.md). La Suite publishes no Helm
# repository, so its charts come from pinned git tags — see docs/adr/0104.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
{{ include "platform.metadata" "cloudnative-pg" }}
spec:
  interval: 24h
  url: https://cloudnative-pg.github.io/charts
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
{{ include "platform.metadata" "external-secrets" }}
spec:
  interval: 24h
  url: https://charts.external-secrets.io
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
{{ include "platform.metadata" "valkey" }}
spec:
  interval: 24h
  url: https://valkey.io/valkey-helm/
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
{{ include "platform.metadata" "opensearch" }}
spec:
  interval: 24h
  url: https://opensearch-project.github.io/helm-charts
---
# Chart lives in-tree at src/helm/impress; the git tag is the pin.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
{{ include "platform.metadata" "suitenumerique-docs" }}
spec:
  interval: 24h
  url: https://github.com/suitenumerique/docs
  ref: {tag: v5.5.0}
  ignore: |
    /*
    !/src/helm
---
# Chart lives in-tree at src/helm/drive; the git tag is the pin.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
{{ include "platform.metadata" "suitenumerique-drive" }}
spec:
  interval: 24h
  url: https://github.com/suitenumerique/drive
  ref: {tag: v0.21.2}
  ignore: |
    /*
    !/src/helm
---
# Chart lives in-tree at src/helm/find; there is no tag to pin. `suitenumerique/find` has
# never cut a release — zero git tags — so this is the one source pinned to a COMMIT, the
# single departure from adr/0104. See apps/find/README.md.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
{{ include "platform.metadata" "suitenumerique-find" }}
spec:
  interval: 24h
  url: https://github.com/suitenumerique/find
  ref: {branch: main, commit: 025e6d02ea08c46ef831a70f0ae1a41036c5a7c9}
  ignore: |
    /*
    !/src/helm
---
# Collabora is the exception to adr/0104: it is not a La Suite application and it DOES
# publish a chart repository, so it is an ordinary pinned HelmRelease.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
{{ include "platform.metadata" "collabora" }}
spec:
  interval: 24h
  url: https://collaboraonline.github.io/online
---
# Calendars. The same arrangement as Projects: the chart is src/helm/calendars in the fork,
# not in any upstream tag yet (v0.1.0 predates it; the upstreaming PR is open), and the
# fork's tag also publishes the images. Those have to be the fork's: upstream's images
# predate the `dockerflow` endpoints behind this chart's probes, and the fork's tags also
# carry the CI fix that makes them run non-root. When the PR lands, only the url changes.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
{{ include "platform.metadata" "wqrld-calendars" }}
spec:
  interval: 24h
  url: https://github.com/Wqrld/calendars
  ref: {tag: v0.1.1}
  ignore: |
    /*
    !/src/helm
---
# Projects. suitenumerique/projects ships no chart; ours is written in the application's
# own repo (src/helm/projects, copied from Docs' so it reads as theirs) and the upstreaming
# PR is open. Until it lands, the chart comes from the FORK's git tag — the same tag that
# publishes the image (apps/projects/README.md, Pins) — so one pin moves both. When the PR
# lands, only the url changes: suitenumerique/projects at the tag that carries the chart.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
{{ include "platform.metadata" "wqrld-projects" }}
spec:
  interval: 24h
  url: https://github.com/Wqrld/projects
  ref: {tag: v1.3.1}
  ignore: |
    /*
    !/src/helm
---
# Messages. The same arrangement as Projects: suitenumerique/messages ships no chart, ours is
# src/helm/messages (copied from Docs') in the fork, and the fork's tag also publishes the
# images — including the MPA (rspamd), which upstream builds but does not publish
# (apps/messages/README.md, Pins). When the PR lands, only the url changes.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
{{ include "platform.metadata" "wqrld-messages" }}
spec:
  interval: 24h
  url: https://github.com/Wqrld/messages
  ref: {tag: v0.9.0-office.1}
  ignore: |
    /*
    !/src/helm
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
{{ include "platform.metadata" "garage-operator" }}
spec:
  interval: 24h
  type: oci
  url: oci://ghcr.io/rajsinghtech/charts
---
# Our own charts, at THIS chart's version: release.sh publishes the config artifact and all
# four charts under one number, so nothing here is ever bumped by hand and a control plane
# can only ever pair with the platform charts it was released with. The registry is the
# organisation's one knob in this file.
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
{{ include "platform.metadata" "platform-deps" }}
spec:
  interval: 30m
  url: {{ .Values.registry.url }}/charts/platform-deps
  ref: {tag: {{ include "platform.version" . | quote }}}
  {{- include "platform.pullSecret" . | nindent 2 }}
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
{{ include "platform.metadata" "platform-app" }}
spec:
  interval: 30m
  url: {{ .Values.registry.url }}/charts/platform-app
  ref: {tag: {{ include "platform.version" . | quote }}}
  {{- include "platform.pullSecret" . | nindent 2 }}
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
{{ include "platform.metadata" "platform-tenants" }}
spec:
  interval: 30m
  url: {{ .Values.registry.url }}/charts/platform-tenants
  ref: {tag: {{ include "platform.version" . | quote }}}
  {{- include "platform.pullSecret" . | nindent 2 }}
---
# Chart lives in-tree at src/helm/meet; the git tag is the pin.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
{{ include "platform.metadata" "suitenumerique-meet" }}
spec:
  interval: 24h
  url: https://github.com/suitenumerique/meet
  ref: {tag: v1.31.0}
  ignore: |
    /*
    !/src/helm
---
# LiveKit. Not a La Suite application, and it DOES publish a Helm repository
# (https://helm.livekit.io) — but that index stopped being updated at livekit-server 1.9.0
# and egress 1.8.4 (mid-2025), while the chart repository itself is current and its last
# git tag is v1.5.2, older still. So this is the second commit pin after Find's, for the
# same reason: there is no tag that names the chart we deploy. Both charts (`livekit-server`
# and `egress`) live at the repository root. The IMAGES are pinned separately in
# apps/livekit/release.yaml — the charts' appVersion lags the images by several releases.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
{{ include "platform.metadata" "livekit-helm" }}
spec:
  interval: 24h
  url: https://github.com/livekit/livekit-helm
  ref: {branch: master, commit: 8f0ad0809c2be8cbed375a6f8bef10625e5e8a2b}
  ignore: |
    /*
    !/livekit-server
    !/egress
{{- if .Values.cluster.gateway.install }}
---
# Envoy Gateway, with the Gateway API CRDs in its chart — only when the platform installs
# the Gateway (cluster/gateway).
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
{{ include "platform.metadata" "envoy-gateway" }}
spec:
  interval: 24h
  url: oci://docker.io/envoyproxy/gateway-helm
  ref: {tag: v1.7.0}
{{- end }}
{{- if .Values.cluster.certManager.install }}
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
{{ include "platform.metadata" "jetstack" }}
spec:
  interval: 24h
  url: https://charts.jetstack.io
{{- end }}
{{- if .Values.cluster.loadBalancer.install }}
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
{{ include "platform.metadata" "metallb" }}
spec:
  interval: 24h
  url: https://metallb.github.io/metallb
{{- end }}
