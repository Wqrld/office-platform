{{- $table := include "platform.apps" . | fromYaml }}
{{- $base := ternary "objectstore" "platform" (eq .Values.objectStore.mode "garage") }}
{{- /*
One Kustomization per enabled application, each its own directory under apps/. The size
reaches it as `SIZE` in cluster-vars: each HelmRelease reads its numbers from the app's
`<app>-sizes` ConfigMap by that key. `APP` names the namespace (apps/namespace.yaml).
An app that is off is not emitted: its Kustomization is deleted, and that prunes its namespace.
*/}}
{{- range $name := include "platform.enabledApps" . | fromYamlArray }}
{{- $deps := list $base }}
{{- range (index $table $name).requires }}{{ $deps = append $deps (printf "app-%s" .) }}{{ end }}
---
{{ include "platform.kustomization" (dict "root" $ "name" (printf "app-%s" $name)
     "path" (printf "./apps/%s" $name) "dependsOn" $deps
     "substitute" (dict "APP" $name) "keep" false) }}
{{- end }}
