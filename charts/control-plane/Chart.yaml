apiVersion: v2
name: control-plane
description: >-
  The Flux control plane of the office platform, rendered from an organisation's choices.
  One release of this chart is one version of the platform: the config artifact it points
  at carries the same version.
type: application
# The platform version. release.sh sets both in all four charts at once; never by hand.
# Templates read appVersion — helm-controller suffixes `version` with the OCI digest.
version: 2.2.5
appVersion: "2.2.5"
