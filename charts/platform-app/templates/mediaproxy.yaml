{{- /* The nginx config as a named template, so the Deployment can hash the RENDERED file:
       a template fix shipped in a chart bump must restart the proxy just as a values change
       does (0.2.9's proxy_hide_header did not, and the old config ran until a restart by
       hand). Top-level because `define` must be; the values come in through the dict. */ -}}
{{- define "platform.mediaProxy.conf" -}}
{{- $root := .root }}{{- $m := .m }}{{- $s3 := .s3 }}
server {
  listen 8080;
  charset utf-8;
  server_tokens off;

  location = /healthz { access_log off; return 200 "ok\n"; }

  client_max_body_size {{ $m.maxBodySize }};
{{- range $loc := $m.locations }}

  location {{ $loc.path }} {
    auth_request /media-auth;
    auth_request_set $authHeader        $upstream_http_authorization;
    auth_request_set $authDate          $upstream_http_x_amz_date;
    auth_request_set $authContentSha256 $upstream_http_x_amz_content_sha256;

    proxy_set_header Authorization        $authHeader;
    proxy_set_header X-Amz-Date           $authDate;
    proxy_set_header X-Amz-Content-SHA256 $authContentSha256;

    # Path-style, so the bucket name is part of the path.
    proxy_pass       http://{{ $s3 }}/{{ $m.objectstore.bucket }}/;
    proxy_set_header Host {{ $s3 }};

    # Not optional: these are user uploads on the application's own origin, so
    # without it a stored .html or .svg is a stored-XSS primitive.
    add_header Content-Security-Policy "default-src 'none'" always;
    {{- range $h, $v := ($loc.headers | default dict) }}
    {{- /* REPLACE, not add: `add_header` appends, and the bucket may already send the
           same header (an egress upload carries `Content-Disposition: inline`). Two
           Content-Disposition headers are NS_ERROR_CORRUPTED_CONTENT in Firefox. */}}
    proxy_hide_header {{ $h }};
    add_header {{ $h }} {{ $v | quote }} always;
    {{- end }}
  }
{{- end }}

  location /media-auth {
    internal;
    # The session cookie rides along, which is how the backend knows who is asking;
    # X-Original-URL is how it learns which attachment.
    proxy_pass              http://{{ $m.auth.service }}.{{ $root.Release.Namespace }}.svc.cluster.local:{{ $m.auth.port }}{{ $m.auth.path }};
    proxy_set_header        X-Forwarded-Proto https;
    proxy_set_header        Host              $host;
    proxy_set_header        X-Real-IP         $remote_addr;
    proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header        X-Original-URL    $request_uri;
    proxy_set_header        X-Original-Method $request_method;
    proxy_pass_request_body off;
    proxy_set_header        Content-Length "";
  }
}
{{- end }}
{{- if .Values.mediaProxy.enabled }}
{{- $app := include "platform.app.name" . }}
{{- $m := .Values.mediaProxy }}
{{- $name := printf "%s-media-proxy" $app }}
{{- $selector := dict "app.kubernetes.io/name" $name }}
{{/* The selector's own name wins: a Deployment selector is immutable and this one must
     match the object Docs already runs, so that release can be adopted. */}}
{{- $labels := mustMerge (deepCopy $selector) (include "platform.labels" (list .) | fromYaml) }}
{{- $s3 := printf "%s:%d" $m.objectstore.host (int $m.objectstore.port) }}
# The `/media` route's backend — adr/0109 for why a running pod lives in the surround.
#
# La Suite authorises an attachment by SUBREQUEST: ask the backend "may this session read
# this key?", then replay the S3 authorization headers it answers with onto the bucket.
# Envoy Gateway's extAuth cannot express it — `extAuth.http.path` is a prefix and Envoy
# appends the original path, so the check 404s and denies everything.
#
# WHAT WOULD REMOVE THIS: media served through the application's own backend, or a fixed
# (non-prefixed) ext-auth path in Envoy Gateway.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- toYaml $labels | nindent 4 }}
  annotations:
    # nginx configuration is full of $variables and Flux's postBuild substitution would
    # expand every one of them to the empty string — $host, $request_uri and the
    # auth_request_set values all vanish, and the proxy silently serves 403s.
    kustomize.toolkit.fluxcd.io/substitute: disabled
data:
  default.conf: |
{{ include "platform.mediaProxy.conf" (dict "root" $ "m" $m "s3" $s3) | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- toYaml $labels | nindent 4 }}
spec:
  replicas: {{ $m.replicas }}
  selector:
    matchLabels:
      {{- toYaml $selector | nindent 6 }}
  template:
    metadata:
      annotations:
        # nginx reads its config once at startup, so a ConfigMap change needs a restart.
        checksum/config: {{ include "platform.mediaProxy.conf" (dict "root" $ "m" $m "s3" $s3) | sha256sum }}
      labels:
        {{- toYaml $selector | nindent 8 }}
    spec:
      priorityClassName: {{ $m.priorityClassName }}
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: nginx
          # Fully qualified: this cluster's CRI-O resolves a bare name against quay.io.
          # The unprivileged image listens on 8080 as uid 101 — no root, no capabilities.
          image: {{ $m.image }}
          ports:
            - {name: http, containerPort: 8080}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            {{- toYaml $m.resources | nindent 12 }}
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
            initialDelaySeconds: 3
          volumeMounts:
            - {name: conf, mountPath: /etc/nginx/conf.d}
            - {name: cache, mountPath: /var/cache/nginx}
            - {name: run, mountPath: /var/run}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: conf
          configMap: {name: {{ $name }}}
        - {name: cache, emptyDir: {}}
        - {name: run, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- toYaml $labels | nindent 4 }}
spec:
  selector:
    {{- toYaml $selector | nindent 4 }}
  ports:
    - {name: http, port: 8080, targetPort: 8080}
{{- end }}
