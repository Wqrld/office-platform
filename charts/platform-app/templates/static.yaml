{{- if .Values.staticFiles.enabled }}
{{- $f := .Values.staticFiles }}
{{- $name := printf "%s-static" (include "platform.app" .) }}
{{- $files := $f.filesConfigMap | default (printf "%s-gaufre" (include "platform.app" .)) }}
{{- /*
A few files served from the application's own origin, for upstream frontends that take a
URL rather than content (Drive's `FRONTEND_JS_URL`). The files come from a ConfigMap made
elsewhere so they stay real files; nginx reads them per request and a mounted ConfigMap
updates in place, so editing them needs no restart. Everything here is public, cached and
read-only. `servicesConfigMap` — the switcher's service list, substituted per cluster — is
projected into the same directory: two ConfigMaps, one /srv, and still updated in place
(a subPath mount would not be).
*/}}
{{- $sources := list (dict "configMap" (dict "name" $files)) }}
{{- with $f.servicesConfigMap }}{{ $sources = append $sources (dict "configMap" (dict "name" .)) }}{{ end }}
{{- $conf := printf `server {
  listen 8080;
  charset utf-8;
  server_tokens off;
  location = /healthz { access_log off; return 200 "ok\n"; }
  location %s {
    alias /srv/;
    add_header Cache-Control "public, max-age=%v" always;
    add_header X-Content-Type-Options nosniff always;
    types { application/javascript js; text/css css; image/svg+xml svg; application/json json; }
  }
}` $f.path $f.maxAge }}
# The implied `static` route's backend (platform.app.routes), at `staticFiles.path`.
{{ include "platform.nginx" (dict "root" . "name" $name "confName" (printf "%s-conf" $name) "conf" $conf "w" $f
     "volumes" (list (dict "name" "files" "projected" (dict "sources" $sources)))
     "mounts" (list (dict "name" "files" "mountPath" "/srv"))) }}
{{- end }}
