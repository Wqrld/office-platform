# The surround: everything around what the upstream chart's release created, nothing that
# is the application itself (history/design/04-platform-charts.md). values.schema.json
# describes each key.
app: ""
tenant: office
baseDomain: ""                     # supplied as ${BASE_DOMAIN} by the app file

gateway:
  name: office
  namespace: office-system
  sectionName: https

# One HTTPRoute per entry, grouped by backend; each field is in the schema. For example:
#   - {name: api, backend: {name: docs-backend, port: 80}, paths: [/api], requestBuffer: 100Mi}
routes: []

websocketIdleTimeout: 24h

pdb:
  enabled: false                   # set by the size profile, with the replicas
  maxUnavailable: 1                # never minAvailable: on one replica it blocks every drain
  components: {}                   # name -> selector labels

networkPolicy:
  enabled: true                    # NOT ENFORCED on this cluster (adr/0103)
  # {datastore: postgres|cache|objectstore|opensearch}, {identity: true},
  # {app: collabora, port: 9980} or {external: true, port: 443}
  egress: []
  datastores:
    postgres:    {namespace: office-data, port: 5432}
    cache:       {namespace: office-data, port: 6379}
    objectstore: {namespace: office-data, port: 3900}
    opensearch:  {namespace: office-data, port: 9200}
  identity:      {namespace: office-identity, port: 8080}
  namespaceLabel: kubernetes.io/metadata.name

# The `/media` route's backend (adr/0109).
mediaProxy:
  enabled: false
  replicas: 1
  auth: {service: "", port: 80, path: ""}   # `path` must end in `/`
  objectstore:
    host: office-s3.office-data.svc.cluster.local
    port: 3900
    bucket: ""                     # no default: silently proxying the wrong bucket is worse
  maxBodySize: 10m                 # the auth subrequest's body, not the download
  locations: []                    # e.g. {path: /media/, headers: {Content-Disposition: attachment}}
  image: docker.io/nginxinc/nginx-unprivileged:1.29-alpine
  priorityClassName: office-app
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {memory: 128Mi}

# A few files from the app's own origin, plus the `static` route (apps/README.md, The switcher).
staticFiles:
  enabled: false
  replicas: 1
  path: /custom/          # nginx location; files are served directly beneath it
  filesConfigMap: ""      # ConfigMap whose keys are the filenames to serve; default <app>-gaufre
  servicesConfigMap: office-services   # a second ConfigMap in the same directory; "" for none
  maxAge: 300
  image: docker.io/nginxinc/nginx-unprivileged:1.29-alpine
  priorityClassName: office-app
  resources:
    requests: {cpu: 10m, memory: 16Mi}
    limits: {memory: 64Mi}

extraObjects: []
