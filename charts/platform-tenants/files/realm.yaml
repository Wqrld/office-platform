# The `office` realm, every setting but the clients (templates/keycloak.yaml adds those),
# reconciled by keycloak-config-cli on every change. `$(env:NAME)` is its substitution from
# the Job's environment, so secrets never pass through git or Helm; neither Helm nor Flux
# touches it. No `users`: they are the organisation's, made in the admin console, and an
# imported user would lack `default-roles-office` (the Account Console would 401).
realm: office
displayName: Office
displayNameHtml: "<b>Office</b>"
enabled: true
defaultSignatureAlgorithm: RS256
registrationAllowed: false
editUsernameAllowed: false
loginWithEmailAllowed: true
# Needs the relay below, or the link fails on the send. `verifyEmail` stays OFF: turning
# it on locks every existing user out until they verify.
resetPasswordAllowed: true
duplicateEmailsAllowed: false
# Checked when a password is set, so existing passwords stay valid until their next change.
passwordPolicy: "length(12) and notUsername and notEmail and passwordHistory(3)"
rememberMe: true
# At least the apps' own 12h sessions: Docs refreshes the token only when the user
# searches, so a shorter Keycloak session dies under a live Docs one and every search 401s
# (docs/adr/0116). The RememberMe variants are unset, so they fall back to these.
ssoSessionIdleTimeout: 43200
ssoSessionMaxLifespan: 43200
revokeRefreshToken: true
# Rotation stays on, but Docs searches as you type: several XHRs refresh at once, the rest
# present the consumed token, and with zero reuse the session dies ("Maximum allowed
# refresh token reuse exceeded").
refreshTokenMaxReuse: 3
# The relay account (platform/identity/smtp.yaml), a placeholder until one exists. Both TLS
# flags come from that one Secret, so the realm and the apps agree; a map of STRINGS.
smtpServer:
  host: $(env:SMTP_HOST)
  port: $(env:SMTP_PORT)
  from: $(env:SMTP_FROM)
  fromDisplayName: Office
  auth: "true"
  user: $(env:SMTP_USER)
  password: $(env:SMTP_PASSWORD)
  starttls: $(env:SMTP_STARTTLS)
  ssl: $(env:SMTP_SSL)

internationalizationEnabled: true
supportedLocales: [en, nl]
defaultLocale: nl
# Tuned on the legacy realm, not guessed.
bruteForceProtected: true
permanentLockout: false
bruteForceStrategy: LINEAR
failureFactor: 30
maxFailureWaitSeconds: 900
minimumQuickLoginWaitSeconds: 60
waitIncrementSeconds: 60
quickLoginCheckMilliSeconds: 1000
maxDeltaTimeSeconds: 43200
eventsEnabled: true
eventsExpiration: 86400
adminEventsEnabled: true
