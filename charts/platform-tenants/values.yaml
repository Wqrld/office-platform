# What the platform provisions per application. values.schema.json describes each key; an
# entry's shape is charts/control-plane/apps.yaml's header, which hands every app over as
# TENANTS_JSON (platform/tenants.yaml). Keycloak's database is the one entry of its own.
apps:
  keycloak:
    postgres: {}

# Each instance's ACL line, before an app's `acl` extras. No ambient access: these ACLs are
# the only isolation between apps (adr/0103). `+flushdb` for Django's `cache.clear()`.
valkeyAcl:
  default: "off -@all"
  cache: "~* &* +@all -@dangerous +flushdb"
  broker: "~* &* +@all -@dangerous"

legacyValkeyUsers: [docs]        # drawn before per-app generation; a re-draw logs users out

domain: ""                       # ${BASE_DOMAIN}; the clients' URLs are https://<app>.<domain>
objectStore: garage              # ${S3_MODE}; grants only exist when the platform runs the store
tenant: office                   # apps live in <tenant>-<app>
namespaces: {data: office-data, identity: office-identity}
postgresCluster: office-pg
garageCluster: office-s3
passwordGenerator: office-password

# The realm reconcile Job. keycloak-config-cli moves with Keycloak (schema).
keycloak:
  url: http://keycloak-service.office-identity.svc:8080
  adminSecret: keycloak-bootstrap-admin
  smtpSecret: smtp-credentials
  image: docker.io/adorsys/keycloak-config-cli:6.5.1-26.5.5

# The OpenSearch security reconcile Job. The image stays at the server's tag (schema).
opensearch:
  host: opensearch-cluster-master.office-data.svc
  adminTlsSecret: opensearch-admin-tls
  image: docker.io/opensearchproject/opensearch:3.8.0
