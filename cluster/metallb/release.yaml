# MetalLB in L2 mode: no BGP, so neither FRR backend. The pool is config/.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata: {name: metallb, namespace: metallb-system}
spec:
  interval: 30m
  chart:
    spec:
      chart: metallb
      version: "0.16.1"
      sourceRef: {kind: HelmRepository, name: metallb, namespace: flux-system}
  install: {crds: Create, disableWaitForJobs: true}
  upgrade: {crds: CreateReplace, disableWaitForJobs: true}
  values:
    frrk8s: {enabled: false}
    speaker: {frr: {enabled: false}}
