# Everything that can be checked without a cluster. Each step runs a script you can run
# locally (AGENTS.md, Checks); tests/toolchain.sh installs the pinned tools below.
name: pr

on:
  pull_request:
  push:
    branches: [master, "release-*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUX_VERSION: "2.9.1"
  HELM_VERSION: "3.19.2"
  CONFTEST_VERSION: "0.61.2"
  KUBECONFORM_VERSION: "0.7.0"
  DYFF_VERSION: "1.12.0"
  GITLEAKS_VERSION: "8.28.0"
  GITLINT_VERSION: "0.19.1"
  PYYAML_VERSION: "6.0.1"
  PYTEST_VERSION: "9.1.1"
  RUFF_VERSION: "0.16.10"

jobs:
  charts:
    name: charts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0
        with: {python-version: "3.12"}
      - run: pip install --quiet "pyyaml==${PYYAML_VERSION}" "pytest==${PYTEST_VERSION}" && ./tests/toolchain.sh helm
      - name: unit tests
        run: pytest -q tests/unit
      - name: helm lint
        run: |
          for c in platform-deps platform-tenants; do helm lint "charts/$c" --strict; done
          helm lint charts/platform-app --strict --values tests/cases/minimal-app.yaml   # `app` is required
          helm lint charts/control-plane --strict --values tests/cases/cluster-default.yaml
      - name: values schema
        run: ./tests/schema.py
      - name: golden files
        run: ./tests/golden.py

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0
        with: {python-version: "3.12"}
      - run: pip install --quiet "ruff==${RUFF_VERSION}"
      - name: ruff
        run: ruff check .
      - name: every named path exists
        run: ./tests/refs.py
      - name: shellcheck   # comes with the runner image
        run: shellcheck install.sh release.sh tests/*.sh platform/identity/vendor/keycloak-operator/update.sh

  build:
    name: flux build + kubeconform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0
        with: {python-version: "3.12"}
      - run: pip install --quiet "pyyaml==${PYYAML_VERSION}" && ./tests/toolchain.sh helm flux kubeconform
      # Also fails on any ${VAR} left unsubstituted: nothing else errors on one.
      - name: flux build every layer
        run: ./tests/build.py built
      - name: kubeconform
        run: ./tests/kubeconform.sh tests/golden built

  render-diff:
    name: render-diff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with:
          fetch-depth: 0    # both sides of the diff have to exist locally
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0
        with: {python-version: "3.12"}
      - run: pip install --quiet "pyyaml==${PYYAML_VERSION}" && ./tests/toolchain.sh helm flux dyff
      # Never fails; it puts the diff in the job summary.
      - name: What this changes about what gets applied
        run: |
          {
            echo '## render-diff'
            echo
            echo '```'
            ./tests/render-diff.sh 2>&1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  binding:
    name: binding check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0
        with: {python-version: "3.12"}
      - run: pip install --quiet "pyyaml==${PYYAML_VERSION}" && ./tests/toolchain.sh helm flux
      # The one check that notices an upstream rename; the next two reuse its fetched charts.
      - name: binding
        run: ./tests/binding.py
      - name: secrets reach their workloads
        run: ./tests/check-secrets.py
      - name: pods can start
        run: ./tests/startup.py

  profiles:
    name: size profiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0
        with: {python-version: "3.12"}
      - run: pip install --quiet "pyyaml==${PYYAML_VERSION}" && ./tests/toolchain.sh helm flux
      - name: profiles
        run: ./tests/profiles.py

  policy:
    name: static rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
      - run: ./tests/toolchain.sh conftest
      # Rule tests first: a suite that has only seen compliant input looks like an empty one.
      - name: policy unit tests
        run: conftest verify --policy policy/charts && conftest verify --policy policy/config
      - name: rendered output
        run: conftest test --policy policy/charts --parser yaml --all-namespaces tests/golden/
      - name: pins and remediation
        run: conftest test --policy policy/config --parser yaml --all-namespaces apps/ platform/ infra/ tests/golden/

  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with:
          fetch-depth: 0     # history too: adr/0005 is about what ever reached git
      - run: ./tests/toolchain.sh gitleaks
      - name: Working tree
        run: gitleaks dir . --no-banner --redact
      - name: History
        run: gitleaks git . --no-banner --redact

  commits:
    name: commit messages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'   # only a PR has a range to lint
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with:
          fetch-depth: 0
      - run: pip install --quiet "gitlint==${GITLINT_VERSION}"
      - name: gitlint
        run: |
          gitlint --commits "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
