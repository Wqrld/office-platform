# Everything that can be checked without a cluster, on every PR.
#
#   charts:  lint -> schema -> golden
#   config:  flux build -> kubeconform -> render-diff -> binding + check-secrets -> profiles -> policy
#
# Every job runs a script from tests/ or policy/ rather than inlining commands here, so the
# same check runs identically on a laptop and in CI; tests/toolchain.sh installs the pinned
# tools. Actions are pinned to commit SHAs.
name: pr

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUX_VERSION: "2.9.1"
  HELM_VERSION: "3.19.2"
  CONFTEST_VERSION: "0.61.2"
  KUBECONFORM_VERSION: "0.7.0"
  DYFF_VERSION: "1.12.0"
  GITLEAKS_VERSION: "8.28.0"
  GITLINT_VERSION: "0.19.1"
  PYYAML_VERSION: "6.0.1"

jobs:
  charts:
    name: charts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0
        with: {python-version: "3.12"}
      - run: pip install --quiet "pyyaml==${PYYAML_VERSION}" && ./tests/toolchain.sh helm
      # --strict turns the INFO about a missing icon into nothing, but turns a genuinely
      # malformed Chart.yaml into a failure. The cases themselves render in the golden step.
      - name: helm lint
        run: |
          for c in platform-deps platform-app platform-tenants; do helm lint "charts/$c" --strict; done
          helm lint charts/control-plane --strict --values tests/cases/cluster-prod.yaml
      - name: values schema
        run: ./tests/schema.py
      - name: golden files
        run: ./tests/golden.py

  build:
    name: flux build + kubeconform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0
        with: {python-version: "3.12"}
      - run: pip install --quiet "pyyaml==${PYYAML_VERSION}" && ./tests/toolchain.sh helm flux kubeconform
      # Fails on any ${VAR} that survives substitution: an unknown variable is an error
      # nowhere else, and the app serves a hostname that resolves for nobody.
      - name: flux build every layer
        run: ./tests/build.py built
      - name: kubeconform
        run: ./tests/kubeconform.sh tests/golden built

  render-diff:
    name: render-diff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with:
          fetch-depth: 0    # both sides of the diff have to exist locally
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0
        with: {python-version: "3.12"}
      - run: pip install --quiet "pyyaml==${PYYAML_VERSION}" && ./tests/toolchain.sh helm flux dyff
      # Never fails the build: it makes the change visible, in the job summary, because a
      # diff nobody reads is the same as no diff.
      - name: What this changes about what gets applied
        run: |
          {
            echo '## render-diff'
            echo
            echo '```'
            ./tests/render-diff.sh 2>&1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  binding:
    name: binding check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0
        with: {python-version: "3.12"}
      - run: pip install --quiet "pyyaml==${PYYAML_VERSION}" && ./tests/toolchain.sh helm flux
      # The one check that notices an upstream rename: our own output does not change, so
      # goldens, render-diff and kubeconform stay green while the routes point at nothing.
      - name: binding
        run: ./tests/binding.py
      # Same fetched charts: the envFrom patches hit exactly the workloads they should.
      - name: secrets reach their workloads
        run: ./tests/check-secrets.py

  profiles:
    name: size profiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0
        with: {python-version: "3.12"}
      - run: pip install --quiet "pyyaml==${PYYAML_VERSION}" && ./tests/toolchain.sh helm flux
      # Not a proof the platform serves 5,000 people; a proof the profiles still say what
      # they claim, which is the part that rots.
      - name: profiles
        run: ./tests/profiles.py

  policy:
    name: static rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
      - run: ./tests/toolchain.sh conftest
      # Both directions for every rule, and the rule tests run BEFORE the rules are applied:
      # a policy suite that has only ever seen compliant input is indistinguishable from an
      # empty one.
      - name: policy unit tests
        run: conftest verify --policy policy/charts && conftest verify --policy policy/config
      - name: rendered output
        run: conftest test --policy policy/charts --parser yaml --all-namespaces tests/golden/
      - name: pins and remediation
        run: conftest test --policy policy/config --parser yaml --all-namespaces apps/ platform/ infra/ tests/golden/

  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with:
          fetch-depth: 0     # history too: adr/0005 is about what ever reached git
      - run: ./tests/toolchain.sh gitleaks
      - name: Working tree
        run: gitleaks dir . --no-banner --redact
      - name: History
        run: gitleaks git . --no-banner --redact

  commits:
    name: commit messages
    runs-on: ubuntu-latest
    # Only a PR has a range to lint. On a push to main the commits are already in.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with:
          fetch-depth: 0
      - run: pip install --quiet "gitlint==${GITLINT_VERSION}"
      # The gitmoji convention, enforced by .gitlint. The range is the PR's own commits.
      - name: gitlint
        run: |
          gitlint --commits "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
