# Weekly upstream version bumps. One PR for the whole run, not one per dependency: the
# config ships as a single versioned artifact anyway, so the bumps are reviewed and
# released together, and a reviewer reads one diff instead of six.
name: upstream-updates

on:
  schedule:
    - cron: "0 8 * * 1"   # Mondays 08:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  updatecli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0

      - uses: updatecli/updatecli-action@4b17f4ea784de29f71f85f9bc4955402ba1ae53c   # v2.100.0
        with:
          version: 0.120.1   # pinned: the tool that manages our pins is itself pinned

      # Runs first so the log shows what WOULD change even when the apply step then makes
      # it so — the diff is the reviewable artefact when a target unexpectedly fails.
      - name: What is out of date
        run: updatecli diff --config updatecli/updatecli.d --values updatecli/values.yaml

      - name: Apply
        run: updatecli apply --config updatecli/updatecli.d --values updatecli/values.yaml

      # Not an updatecli target: a version bump here is five whole files, not a line, and
      # updatecli's kind:file can only rewrite a line. Idempotent — no-op if already
      # current — so it costs nothing to run every week. See updatecli/README.md.
      - name: Keycloak operator
        run: platform/identity/vendor/keycloak-operator/update.sh

      - uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676   # v7.0.11
        with:
          branch: updatecli/upstream
          # Matches .gitlint: an emoji, a parenthesised scope, then the subject.
          commit-message: "⬆️ (deps) bump upstream pins"
          title: "⬆️ (deps) bump upstream pins"
          body: |
            Opened by `updatecli`, plus the Keycloak operator check
            (`platform/identity/vendor/keycloak-operator/update.sh`) if it found a newer
            tag. Nothing outside these pins is touched, and both steps fail rather than
            skip when something they expect to find is missing.

            Before merging, for anything that moved a major or minor:

            - read the upstream release notes for values-schema changes — a bumped chart
              with a renamed key installs cleanly and misconfigures the workload
            - a Keycloak bump touches five vendored files — diff them against the release
              notes, not just the version comment
            - `./release.sh <next version>` after merge; the bump is not live until the
              config artifact is re-pushed and the layers report the new revision
