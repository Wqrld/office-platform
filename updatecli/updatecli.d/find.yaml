# Find has no releases at all — zero git tags — so there is no version to track. What moves
# is the HEAD of `main`, and the two pins that must move together with it: the GitRepository
# commit in sources.yaml and the image digest in the release's post-renderer.
#
# They are two independent references to the same upstream state and nothing enforces that
# they correspond. Keeping them in ONE manifest is what makes a bump a single reviewable
# change rather than two that can half-land.
name: "La Suite Find"

sources:
  commit:
    name: "HEAD of find/main"
    # Not `gitbranch`: that returns a branch NAME (the newest one), not a commit.
    kind: shell
    spec:
      command: git ls-remote https://github.com/suitenumerique/find refs/heads/main | cut -f1

  digest:
    name: "digest of lasuite/find:main"
    kind: dockerdigest
    spec:
      image: "lasuite/find"
      tag: main
    transformers:
      - trimprefix: "main@"  # dockerdigest returns `<tag>@sha256:…`

targets:
  chart:
    name: "GitRepository commit"
    kind: file
    sourceid: commit
    spec:
      file: "charts/control-plane/templates/sources.yaml"
      matchpattern: '(url: https://github\.com/suitenumerique/find\n  ref: \{branch: main, commit: )[0-9a-f]{40}\}'
      replacepattern: '${1}{{ source "commit" }}}'

  image:
    name: "post-renderer image digest"
    kind: file
    sourceid: digest
    spec:
      file: "apps/find/release.yaml"
      matchpattern: 'digest: sha256:[0-9a-f]{64}'
      replacepattern: 'digest: {{ source "digest" }}'
