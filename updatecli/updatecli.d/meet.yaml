# Meet: one git tag drives the chart pin AND every image tag, like Docs — the chart
# declares `appVersion: latest`, so the images are pinned explicitly in release.yaml.
name: "La Suite Meet"

sources:
  meet:
    name: "latest Meet release"
    kind: gittag
    spec:
      url: "https://github.com/suitenumerique/meet"
      versionfilter:
        kind: semver
        pattern: ">=1.31.0"

targets:
  chart:
    name: "GitRepository tag"
    kind: file
    sourceid: meet
    spec:
      file: "charts/control-plane/templates/sources.yaml"
      matchpattern: '(url: https://github\.com/suitenumerique/meet\n  ref: \{tag: )v[0-9]+\.[0-9]+\.[0-9]+\}'
      replacepattern: '${1}{{ source "meet" }}}'

  # Every `tag: vX.Y.Z` in release.yaml — the backend's top-level `image` and the six
  # per-component overrides. One pattern: they must never hold different values.
  images:
    name: "workload image tags"
    kind: file
    sourceid: meet
    spec:
      file: "apps/meet/release.yaml"
      matchpattern: '(image: \{tag: |image:\n(?:[ \t]*#.*\n)*[ \t]+tag: )v[0-9]+\.[0-9]+\.[0-9]+'
      replacepattern: '${1}{{ source "meet" }}'
