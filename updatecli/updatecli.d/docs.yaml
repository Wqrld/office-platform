# Docs: one git tag of the FORK pins the chart AND the four images, like Drive. The fork is
# upstream main plus the title in exports (apps/docs/README.md, The fork); its `office`
# branch publishes ghcr.io/wqrld/docs-{backend,frontend,y-provider,yhub} on every
# `v*-office.*` tag, and the images carry the git tag unchanged. Pointing this back at
# `suitenumerique/docs` before upstream releases the feature would silently drop it.
name: "La Suite Docs"

sources:
  docs:
    name: "latest Docs office release"
    kind: gittag
    spec:
      url: "https://github.com/Wqrld/docs"
      versionfilter:
        kind: regex
        pattern: '^v\d+\.\d+\.\d+-office\.\d+$'

targets:
  # sources.yaml holds several documents, and updatecli's yamlpath engine writes to EVERY
  # document whose path matches, so this is a text match anchored to the repository url.
  chart:
    name: "GitRepository tag"
    kind: file
    sourceid: docs
    spec:
      file: "charts/control-plane/templates/sources.yaml"
      matchpattern: '(url: https://github\.com/Wqrld/docs\n  ref: \{tag: )v[0-9]+\.[0-9]+\.[0-9]+-office\.[0-9]+\}'
      replacepattern: '${1}{{ source "docs" }}}'

  # Four tags in release.yaml — the backend takes the top-level `image`, the others override
  # it. One pattern because they must never hold different values.
  images:
    name: "workload image tags"
    kind: file
    sourceid: docs
    spec:
      file: "apps/docs/release.yaml"
      matchpattern: '(tag: )v[0-9]+\.[0-9]+\.[0-9]+-office\.[0-9]+'
      replacepattern: '${1}{{ source "docs" }}'
