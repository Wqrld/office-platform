# Calendars: one git tag of the FORK drives the chart pin AND the image tags, like Projects —
# the chart lives at `src/helm/calendars` in the fork, and the images are tagged from the same
# git tag with the `v` stripped (`v0.1.1` publishes `…-backend:0.1.1`).
#
# THE SOURCE IS THE FORK, NOT UPSTREAM, and pointing it at `suitenumerique/calendars` would
# be a silent DOWNGRADE: upstream's newest tag is v0.1.0, which predates both the chart and
# the `dockerflow` health endpoints its probes need. See apps/calendars/README.md.
name: "La Suite Calendars"

sources:
  release:
    name: "latest Calendars release"
    kind: gittag
    spec:
      url: "https://github.com/Wqrld/calendars"
      versionfilter:
        kind: semver
        pattern: ">=0.1.1"

  image:
    name: "latest Calendars release, as an image tag"
    kind: gittag
    spec:
      url: "https://github.com/Wqrld/calendars"
      versionfilter:
        kind: semver
        pattern: ">=0.1.1"
    transformers:
      - trimprefix: "v"

targets:
  chart:
    name: "GitRepository tag"
    kind: file
    sourceid: release
    spec:
      file: "charts/control-plane/templates/sources.yaml"
      matchpattern: '(url: https://github\.com/Wqrld/calendars\n  ref: \{tag: )v[0-9]+\.[0-9]+\.[0-9]+\}'
      replacepattern: '${1}{{ source "release" }}}'

  # Three tags in one file — backend (the top-level `image`), frontend and caldav. One
  # pattern rather than three yamlpath keys because they must never hold different values:
  # a partial match is not a state worth being able to express. Quoted and without a `v`,
  # which is also what keeps this pattern away from Docs' and Drive's `tag: vX.Y.Z` pins.
  images:
    name: "workload image tags"
    kind: file
    sourceid: image
    spec:
      file: "apps/calendars/release.yaml"
      matchpattern: 'tag: "[0-9]+\.[0-9]+\.[0-9]+"'
      replacepattern: 'tag: "{{ source "image" }}"'
