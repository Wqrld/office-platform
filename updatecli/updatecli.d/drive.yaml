# Drive, the same shape as docs.yaml: La Suite publishes no Helm repository (adr/0104), so
# one git tag pins the chart AND the images. The chart declares `appVersion: latest`, which
# pins nothing, so the image tags are set explicitly and must move with it.
name: "La Suite Drive"

sources:
  drive:
    name: "latest Drive release"
    kind: gittag
    spec:
      url: "https://github.com/suitenumerique/drive"
      versionfilter:
        kind: semver
        # A floor, not a ceiling. Drive also publishes `-preprod` tags on the same commits;
        # semver treats a prerelease as lower than the release, so they are not offered.
        pattern: ">=0.21.0"

targets:
  chart:
    name: "GitRepository tag"
    kind: file
    sourceid: drive
    spec:
      file: "charts/control-plane/templates/sources.yaml"
      matchpattern: 'url: https://github\.com/suitenumerique/drive\n  ref: \{tag: v[0-9]+\.[0-9]+\.[0-9]+\}'
      replacepattern: 'url: https://github.com/suitenumerique/drive\n  ref: {tag: {{ source "drive" }}}'

  # Two tags in release.yaml — the backend takes the top-level `image`, the frontend
  # overrides it. One pattern rather than two yamlpath keys because they must never hold
  # different values; a partial match is not a state we want to be able to express.
  images:
    name: "workload image tags"
    kind: file
    sourceid: drive
    spec:
      file: "apps/drive/release.yaml"
      matchpattern: '(image: \{tag: |image:\n(?:[ \t]*#.*\n)*[ \t]+tag: )v[0-9]+\.[0-9]+\.[0-9]+'
      replacepattern: '${1}{{ source "drive" }}'
