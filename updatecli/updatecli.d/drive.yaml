# Drive: one git tag of the FORK pins the chart AND both images, like Projects. The fork is
# upstream main plus document thumbnails (apps/drive/README.md, The fork); its `office`
# branch publishes ghcr.io/wqrld/drive-{backend,frontend} on every `v*-office.*` tag, and the
# images carry the git tag unchanged. Pointing this back at `suitenumerique/drive` before
# upstream releases thumbnails would silently drop them.
name: "La Suite Drive"

sources:
  drive:
    name: "latest Drive office release"
    kind: gittag
    spec:
      url: "https://github.com/Wqrld/drive"
      versionfilter:
        kind: regex
        pattern: '^v\d+\.\d+\.\d+-office\.\d+$'

targets:
  chart:
    name: "GitRepository tag"
    kind: file
    sourceid: drive
    spec:
      file: "charts/control-plane/templates/sources.yaml"
      matchpattern: '(url: https://github\.com/Wqrld/drive\n  ref: \{tag: )v[0-9]+\.[0-9]+\.[0-9]+-office\.[0-9]+\}'
      replacepattern: '${1}{{ source "drive" }}}'

  # Two tags in release.yaml — the backend takes the top-level `image`, the frontend
  # overrides it. One pattern rather than two yamlpath keys because they must never hold
  # different values; a partial match is not a state we want to be able to express.
  images:
    name: "workload image tags"
    kind: file
    sourceid: drive
    spec:
      file: "apps/drive/release.yaml"
      matchpattern: '(tag: )v[0-9]+\.[0-9]+\.[0-9]+-office\.[0-9]+'
      replacepattern: '${1}{{ source "drive" }}'
