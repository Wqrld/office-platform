# Upstream chart sources. La Suite publishes no Helm repository, so its charts come
# from pinned git tags — see platform/docs/adr/0104.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata: {name: cloudnative-pg, namespace: flux-system}
spec:
  interval: 24h
  url: https://cloudnative-pg.github.io/charts
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata: {name: external-secrets, namespace: flux-system}
spec:
  interval: 24h
  url: https://charts.external-secrets.io
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata: {name: valkey, namespace: flux-system}
spec:
  interval: 24h
  url: https://valkey.io/valkey-helm/
---
# Chart lives in-tree at src/helm/impress; the git tag is the pin.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata: {name: suitenumerique-docs, namespace: flux-system}
spec:
  interval: 24h
  url: https://github.com/suitenumerique/docs
  ref: {tag: v5.5.0}
  ignore: |
    /*
    !/src/helm
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata: {name: garage-operator, namespace: flux-system}
spec:
  interval: 24h
  type: oci
  url: oci://ghcr.io/rajsinghtech/charts
