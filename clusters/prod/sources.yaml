# Upstream chart sources. La Suite publishes no Helm repository, so its charts come
# from pinned git tags — see platform/docs/adr/0104.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata: {name: cloudnative-pg, namespace: flux-system}
spec:
  interval: 24h
  url: https://cloudnative-pg.github.io/charts
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata: {name: external-secrets, namespace: flux-system}
spec:
  interval: 24h
  url: https://charts.external-secrets.io
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata: {name: valkey, namespace: flux-system}
spec:
  interval: 24h
  url: https://valkey.io/valkey-helm/
---
# Chart lives in-tree at src/helm/impress; the git tag is the pin.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata: {name: suitenumerique-docs, namespace: flux-system}
spec:
  interval: 24h
  url: https://github.com/suitenumerique/docs
  ref: {tag: v5.5.0}
  ignore: |
    /*
    !/src/helm
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata: {name: garage-operator, namespace: flux-system}
spec:
  interval: 24h
  type: oci
  url: oci://ghcr.io/rajsinghtech/charts
---
# Our own charts. Pinned exactly, never a semver range in prod (05-app-contract.md).
# Published by platform/scripts/publish.sh; platform-lib is vendored into the two
# application charts at package time, so nothing references it directly.
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata: {name: platform-deps, namespace: flux-system}
spec:
  interval: 30m
  url: oci://harbor.mijnbureau.haaijer.dev/office/charts/platform-deps
  ref: {tag: "0.1.1"}
  secretRef: {name: harbor-auth}
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata: {name: platform-app, namespace: flux-system}
spec:
  interval: 30m
  url: oci://harbor.mijnbureau.haaijer.dev/office/charts/platform-app
  ref: {tag: "0.1.1"}
  secretRef: {name: harbor-auth}
