apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: {name: 20-infra, namespace: flux-system}
spec:
  interval: 30m
  retryInterval: 2m
  timeout: 10m
  prune: true
  wait: true
  sourceRef: {kind: OCIRepository, name: flux-system}
  path: ./infra
  postBuild:
    substituteFrom: [{kind: ConfigMap, name: cluster-vars}]
