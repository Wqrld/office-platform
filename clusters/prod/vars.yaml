apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-vars
  namespace: flux-system
data:
  BASE_DOMAIN: haaijer.dev
  STORAGE_CLASS: longhorn
  TENANT: office
  # Public address of the shared Gateway. Currently a spare MetalLB address while the
  # legacy ingress-nginx still holds 45.136.141.136; becomes .136 at cutover.
  GATEWAY_IP: "45.136.141.168"
  # Swap to letsencrypt-gateway once the Gateway owns the public IP.
  TLS_ISSUER: letsencrypt-prod
