apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: {name: 30-platform, namespace: flux-system}
spec:
  interval: 30m
  retryInterval: 2m
  timeout: 10m
  prune: true
  wait: true
  sourceRef: {kind: OCIRepository, name: office-config}
  # THE ONLY LINE THAT MAKES THIS A DEMO. Everything else in this directory is prod's file
  # with a different domain.
  path: ./environments/small/platform
  dependsOn: [{name: 20-infra}]
  postBuild:
    substituteFrom: [{kind: ConfigMap, name: cluster-vars}]
