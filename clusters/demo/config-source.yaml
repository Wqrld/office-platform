# The pinned source for everything this cluster actually runs.
#
# There are two tags on `office/config` and the split is deliberate:
#
#   :latest   — moving. The FluxInstance syncs `clusters/prod` from it, so this tag
#               carries only the control plane: the layer definitions, the cluster vars,
#               and the version pointer below.
#   :<X.Y.Z>  — immutable. `infra/`, `platform/` and `apps/` are read from here. This is
#               what the workloads come from, and it advances ONLY by editing the tag in
#               this file. A stray `flux push` to :latest cannot move production.
#
# Why the FluxInstance itself stays on :latest: `flux-instance.yaml` lives inside the
# synced path, so pinning it deadlocks — the pointer to a new version would live inside
# the version Flux is not yet pulling, and it could never learn the new tag exists.
# Putting the pointer in a separate object that :latest carries breaks that cycle.
#
# DEMO'S POINTER IS MOVED BY HAND, AND THAT IS THE POINT. `release.sh` rewrites
# `clusters/prod/config-source.yaml` and only that one, so this tag does not follow prod's.
# A rehearsal environment that always ran the same version as production would have nothing
# to rehearse — demo is where a version is pointed FIRST, watched, and only then written
# into prod's pointer.
#
# The workflow: `./release.sh <version>` publishes and moves prod. To rehearse instead,
# publish with release.sh, then revert prod's pointer in the same commit and set this one.
# If that dance happens more than a couple of times, give release.sh a `--cluster` flag
# rather than keeping it in someone's head.
#
# Release and rollback are both `./release.sh <version>`; see config/README.md.
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata: {name: office-config, namespace: flux-system}
spec:
  interval: 5m
  url: oci://harbor.mijnbureau.haaijer.dev/office/config
  ref: {tag: "1.4.2"}
  secretRef: {name: harbor-auth}
