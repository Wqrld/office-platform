apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-vars
  namespace: flux-system
data:
  # A DIFFERENT DOMAIN AND A DIFFERENT TENANT, deliberately. `${TENANT}` has been in every
  # name since day one for exactly this (adr/0008); demo is the first thing that proves it
  # was worth the trouble.
  BASE_DOMAIN: demo.haaijer.dev
  STORAGE_CLASS: longhorn
  TENANT: demo
  # Its own MetalLB address. The Gateway is a cluster-scoped singleton per install, so demo
  # cannot share prod's — see README.md on why demo is a separate cluster, not a second
  # namespace set on this one. Free pool addresses at the time of writing: .166 .154 .156
  GATEWAY_IP: "45.136.141.166"
  TLS_ISSUER: letsencrypt-gateway
