apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-vars
  namespace: flux-system
data:
  # A different domain and a different Gateway address. That is the whole difference from
  # prod, together with the two `path:` lines that select the small profile. Resource names
  # are NOT parameterised by environment — see README.md.
  BASE_DOMAIN: demo.haaijer.dev
  STORAGE_CLASS: longhorn
  # Its own MetalLB address. The Gateway is a cluster-scoped singleton per install, so demo
  # cannot share prod's — see README.md on why demo is a separate cluster, not a second
  # namespace set on this one. Free pool addresses at the time of writing: .166 .156
  # (.154 is prod LiveKit — see LIVEKIT_IP in clusters/prod/vars.yaml).
  GATEWAY_IP: "45.136.141.166"
  TLS_ISSUER: letsencrypt-gateway
  # LiveKit's media address (see prod). Demo needs its own, like the Gateway.
  LIVEKIT_IP: "45.136.141.156"
