# Size profile `small` — the platform layer. 5-50 people, one node, no HA. The datastores
# are most of an empty environment's floor. `instances`/`replicas` stay the base's 1: on
# one node a second copy buys latency, not availability.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

patches:
  # Valkey: half of each. `maxmemory` is what the container grows to; nothing else caps it.
  - target: {kind: HelmRelease, name: valkey-cache, namespace: office-data}
    patch: |
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata: {name: valkey-cache, namespace: office-data}
      spec:
        values:
          valkeyConfig: |
            maxmemory 128mb
            maxmemory-policy allkeys-lru
            save ""

  # The broker stays `noeviction` at every size; only the ceiling moves (platform/valkey/README.md).
  - target: {kind: HelmRelease, name: valkey-broker, namespace: office-data}
    patch: |
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata: {name: valkey-broker, namespace: office-data}
      spec:
        values:
          valkeyConfig: |
            maxmemory 128mb
            maxmemory-policy noeviction
            appendonly yes

  # Postgres: 20Gi -> 8Gi. A ONE-WAY door: a volume expands online and never shrinks, so
  # this is for an environment built small, not one moved down a size.
  - target: {kind: Cluster, name: office-pg, namespace: office-data}
    patch: |
      apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      metadata: {name: office-pg, namespace: office-data}
      spec:
        storage:
          size: 8Gi
        postgresql:
          parameters:
            # 200 is sized for Django + Celery across ten apps with no pooler. A demo runs a
            # handful of workers, and every backend slot is preallocated shared memory.
            max_connections: "100"

  # Keycloak, under the base's measured 768Mi floor: the JVM sizes its heap to the limit,
  # so the limit is what shrinks it.
  - target: {kind: Keycloak, name: keycloak, namespace: office-identity}
    patch: |
      apiVersion: k8s.keycloak.org/v2beta1
      kind: Keycloak
      metadata: {name: keycloak, namespace: office-identity}
      spec:
        resources:
          requests: {cpu: 100m, memory: 512Mi}
          limits: {memory: 1Gi}

  # Garage: 20Gi + 2Gi -> 8Gi + 1Gi, the same one-way door.
  - target: {kind: GarageCluster, name: office-s3, namespace: office-data}
    patch: |
      - op: replace
        path: /spec/storage/data/size
        value: 8Gi
      - op: replace
        path: /spec/storage/metadata/size
        value: 1Gi
