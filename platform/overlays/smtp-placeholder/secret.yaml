apiVersion: v1
kind: Secret
metadata:
  name: smtp-credentials
  namespace: office-data
  labels:
    office.haaijer.dev/placeholder: "true"
  annotations:
    office.haaijer.dev/warning: "SMTP not configured — invitations and password reset will not work"
# `data`, not `stringData`: `flux build` re-types quoted strings, and the checks read it.
data:
  host: c210cC1ub3QtY29uZmlndXJlZC5pbnZhbGlk   # smtp-not-configured.invalid
  port: NTg3   # 587
  username: cGxhY2Vob2xkZXI=   # placeholder
  password: cGxhY2Vob2xkZXI=   # placeholder
  useTLS: dHJ1ZQ==   # true
  useSSL: ZmFsc2U=   # false
stringData:
  from: noreply@${BASE_DOMAIN}
