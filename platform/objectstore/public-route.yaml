# The Garage S3 API, published for one bucket, for Drive's presigned browser uploads
# (adr/0110). THE PATH PREFIX IS THE SCOPE: path-style, so a bucket is a prefix, and adding
# one here publishes that bucket — a security decision, not a routing tweak.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: office-s3
  namespace: office-data
spec:
  parentRefs:
    - {name: office, namespace: office-system, sectionName: https}
  hostnames: ["s3.${BASE_DOMAIN}"]
  rules:
    - matches:
        - {path: {type: PathPrefix, value: /drive/}}
      backendRefs:
        - {name: office-s3, port: 3900}
---
# CORS at the edge: the operator's CRDs cannot set Garage's. A leaked URL is covered by the
# 60-second expiry and the single-key PUT-only signature.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: office-s3
  namespace: office-data
spec:
  targetRefs:
    - {group: gateway.networking.k8s.io, kind: HTTPRoute, name: office-s3}
  cors:
    allowOrigins: ["https://drive.${BASE_DOMAIN}"]
    allowMethods: [GET, HEAD, PUT, OPTIONS]
    # Which headers boto3 signs is botocore's decision; naming them breaks on an upgrade.
    allowHeaders: ["*"]
    exposeHeaders: [ETag]
    maxAge: 10m
---
# No requestBuffer: Envoy would hold a large upload whole, and OOM. Drive caps size itself.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: office-s3
  namespace: office-data
spec:
  targetRefs:
    - {group: gateway.networking.k8s.io, kind: HTTPRoute, name: office-s3}
  timeout:
    http:
      requestTimeout: 1h
