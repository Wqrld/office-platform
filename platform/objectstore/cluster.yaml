apiVersion: garage.rajsingh.info/v1beta2
kind: GarageCluster
metadata:
  name: office-s3
  namespace: office-data
spec:
  # Pin Garage like a database major version. The operator speaks Admin API v2, which
  # requires Garage >= 2.0.0; below that every admin call 404s.
  # `image` is the FULL reference and overrides `imageRepository` entirely. It must also
  # be registry-qualified: this cluster's CRI-O resolves a bare name against quay.io, so
  # an unqualified string fails with a confusing 404 for `quay.io/v2.3.0:latest`.
  image: docker.io/dxflrs/garage:v2.3.0
  replication:
    # CANNOT BE CHANGED IN PLACE — raising this requires destroying and rebuilding the
    # cluster. One node, so one copy; revisit only when a second node exists, and expect
    # a rebuild when you do.
    factor: 1
  storage:
    replicas: 1
    priorityClassName: office-data
    # Sized for this node, not aspirationally: Longhorn has ~85Gi free with the legacy
    # stack still running, and Docs' entire media set is ~100MB. Growing a Longhorn
    # volume is an online expand; shrinking one is a rebuild.
    data:
      size: 20Gi
      storageClassName: ${STORAGE_CLASS}
    metadata:
      size: 2Gi
      storageClassName: ${STORAGE_CLASS}
    # Default is Retain, which is correct — but it means deleting this cluster leaves
    # volumes behind to be cleaned up by hand.
  admin:
    adminTokenSecretRef: {name: office-s3-admin-token, key: token}
  s3Api:
    # Set explicitly: an empty region makes SigV4 signing flaky in some SDKs. The legacy
    # stack hardcoded eu-west-1 for exactly this reason.
    region: eu-west-1
