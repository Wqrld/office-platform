apiVersion: garage.rajsingh.info/v1beta2
kind: GarageCluster
metadata:
  name: office-s3
  namespace: office-data
spec:
  # Pinned like a database major. The operator speaks Admin API v2 (Garage >= 2.0.0; below,
  # every admin call 404s). The FULL, registry-qualified reference: it overrides
  # `imageRepository`, and CRI-O resolves a bare name against quay.io.
  image: docker.io/dxflrs/garage:v2.3.0
  replication:
    # CANNOT BE CHANGED IN PLACE: raising it is a rebuild. One node, so one copy.
    factor: 1
  storage:
    replicas: 1
    priorityClassName: office-data
    # The image (FROM scratch, no USER) wrote its existing files as root, so non-root needs
    # fsGroup: Longhorn's fsGroupPolicy makes the kubelet chgrp and chmod g+rwX both
    # volumes on mount, which is what lets uid 1000 write them. The CRD has no
    # initContainer hook to chown instead (v0.7.7's StorageSpec).
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      fsGroup: 1000
      seccompProfile: {type: RuntimeDefault}
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities: {drop: ["ALL"]}
      readOnlyRootFilesystem: true     # a static binary; it writes only its two volumes
    # Growing a volume is online; shrinking is a rebuild. The reclaim policy is the
    # default Retain, so a deleted cluster leaves its volumes to clean up by hand.
    data:
      size: 20Gi
      storageClassName: ${STORAGE_CLASS}
    metadata:
      size: 2Gi
      storageClassName: ${STORAGE_CLASS}
  admin:
    adminTokenSecretRef: {name: office-s3-admin-token, key: token}
  s3Api:
    # An empty region makes SigV4 signing flaky in some SDKs.
    region: eu-west-1
