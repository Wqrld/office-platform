# Who, outside office-data, may point a GarageBucket or GarageKey at this cluster.
#
# This lives in the platform layer rather than beside the application on purpose: the
# operator's admission webhook rejects a cross-namespace reference at dry-run time, so a
# grant shipped in the same Kustomization as the bucket it authorises is evaluated too
# late and the whole apply fails. 30-platform reconciles before 40-apps, which is the
# ordering this needs.
apiVersion: garage.rajsingh.info/v1beta1
kind: GarageReferenceGrant
metadata: {name: office-docs, namespace: office-data}
spec:
  from:
    - {kind: GarageBucket, namespace: office-docs}
    - {kind: GarageKey, namespace: office-docs}
  to:
    - {kind: GarageCluster, name: office-s3}
---
apiVersion: garage.rajsingh.info/v1beta1
kind: GarageReferenceGrant
metadata: {name: office-drive, namespace: office-data}
spec:
  from:
    - {kind: GarageBucket, namespace: office-drive}
    - {kind: GarageKey, namespace: office-drive}
  to:
    - {kind: GarageCluster, name: office-s3}
