# PHASE 1 OF THE HANDOVER TO platform-tenants — delete this file in the next release. The
# two generated passwords are live (apps read them), so the tenants chart ADOPTS these
# objects rather than drawing new ones: platform/kustomization.yaml gives them Helm's
# ownership metadata and `prune: disabled`. The security config they fed is now the tenants
# chart's `opensearch-security` Secret plus its reconcile Job.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: opensearch-user-find, namespace: office-data}
spec:
  refreshInterval: "0"
  target: {name: opensearch-user-find, creationPolicy: Owner}
  dataFrom:
    - sourceRef:
        generatorRef: {apiVersion: generators.external-secrets.io/v1alpha1, kind: ClusterGenerator, name: office-password}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: opensearch-user-messages, namespace: office-data}
spec:
  refreshInterval: "0"
  target: {name: opensearch-user-messages, creationPolicy: Owner}
  dataFrom:
    - sourceRef:
        generatorRef: {apiVersion: generators.external-secrets.io/v1alpha1, kind: ClusterGenerator, name: office-password}
