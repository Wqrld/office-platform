# The `find` internal user's password, and the security config that carries its hash.
#
# Split for the same reason the Valkey users are: the generator draws a NEW value on every
# invocation, so the password is generated once here and only ever read afterwards.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: opensearch-user-find, namespace: office-data}
spec:
  refreshInterval: "0"          # generate once; re-drawing locks Find out of its own index
  target: {name: opensearch-user-find, creationPolicy: Owner}
  dataFrom:
    - sourceRef:
        generatorRef: {apiVersion: generators.external-secrets.io/v1alpha1, kind: ClusterGenerator, name: office-password}
---
# The whole `opensearch-security` directory, rendered from that password. The chart mounts
# this Secret over the directory, so all six files must be present or the plugin refuses to
# initialise.
#
# `refreshInterval: "0"` here is not about generation — it is because `bcrypt` re-salts on
# every render, so any refresh would rewrite this Secret with a different (still valid) hash
# and roll the StatefulSet for nothing.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: opensearch-security-config, namespace: office-data}
spec:
  refreshInterval: "0"
  secretStoreRef: {kind: ClusterSecretStore, name: office-data}
  target:
    name: opensearch-security-config
    creationPolicy: Owner
    template:
      data:
        config.yml: |
          _meta:
            type: "config"
            config_version: 2
          config:
            dynamic:
              authc:
                basic_internal_auth_domain:
                  description: "HTTP basic against the internal user database"
                  http_enabled: true
                  transport_enabled: true
                  order: 0
                  http_authenticator:
                    type: basic
                    challenge: true
                  authentication_backend:
                    type: intern

        # No `admin` user: cluster administration is the admin certificate only, so there is
        # no all_access password to leak. bcrypt's cost-10 default is what OpenSearch expects.
        internal_users.yml: |
          _meta:
            type: "internalusers"
            config_version: 2
          find:
            hash: "{{ bcrypt .password }}"
            reserved: false
            description: "Find service account"

        # `indices_all` over `find-*` and nothing else — this is the tenant boundary
        # (adr/0111). cluster_composite_ops is required for the bulk indexing path;
        # without it `manage.py index` fails on the first batch.
        roles.yml: |
          _meta:
            type: "roles"
            config_version: 2
          find_service:
            reserved: false
            cluster_permissions:
              - "cluster_composite_ops"
            index_permissions:
              - index_patterns:
                  - "find-*"
                allowed_actions:
                  - "indices_all"

        roles_mapping.yml: |
          _meta:
            type: "rolesmapping"
            config_version: 2
          find_service:
            reserved: false
            users:
              - "find"

        action_groups.yml: |
          _meta:
            type: "actiongroups"
            config_version: 2

        tenants.yml: |
          _meta:
            type: "tenants"
            config_version: 2
  data:
    - {secretKey: password, remoteRef: {key: opensearch-user-find, property: password}}
