# One generated password per Postgres role, born in office-data where CNPG reads it.
# `refreshInterval: "0"` means generate once and never again — rotating underneath a
# running Django app would present as an outage, not as a rotation.
#
# CNPG's DatabaseRole wants a `kubernetes.io/basic-auth` Secret and takes the password
# from the `password` key; the `username` key is ours, so consumers can build a DSN
# without the role name being written down twice.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: keycloak-db, namespace: office-data}
spec:
  refreshInterval: "0"
  target:
    name: keycloak-db
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      data:
        username: keycloak
        password: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef: {apiVersion: generators.external-secrets.io/v1alpha1, kind: ClusterGenerator, name: office-password}
