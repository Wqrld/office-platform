# Reading one generated password from two namespaces. A role password is needed by CNPG in
# office-data AND by the app in its own namespace, and every `generatorRef` draws a NEW
# value. So it is generated once where it is owned and read back elsewhere through ESO's
# `kubernetes` provider; apps only ever see a Secret.
#
# Only `get` is granted (every ExternalSecret names its key; ESO's SelfSubjectRulesReview
# needs nothing beyond system:basic-user). Cluster-scoped so every app namespace can read,
# and `conditions` keeps it to those: without it any namespace could read any credential.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-reader
  namespace: office-data
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eso-reader
  namespace: office-data
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eso-reader
  namespace: office-data
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: eso-reader}
subjects:
  - {kind: ServiceAccount, name: eso-reader, namespace: office-data}
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: office-data
spec:
  conditions: [{namespaceRegexes: ["^office-"]}]
  provider:
    kubernetes:
      remoteNamespace: office-data
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
          namespace: office-data
      auth:
        serviceAccount: {name: eso-reader, namespace: office-data}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-reader
  namespace: office-identity
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eso-reader
  namespace: office-identity
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eso-reader
  namespace: office-identity
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: eso-reader}
subjects:
  - {kind: ServiceAccount, name: eso-reader, namespace: office-identity}
---
# Client secrets are born here, because Keycloak is the only component that can be told
# one rather than read one. Applications read them back through this store.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: office-identity
spec:
  conditions: [{namespaceRegexes: ["^office-"]}]
  provider:
    kubernetes:
      remoteNamespace: office-identity
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
          namespace: office-identity
      auth:
        serviceAccount: {name: eso-reader, namespace: office-identity}
