# Reading one generated password from two namespaces.
#
# The problem: a credential like the `docs` Postgres role password is needed by CNPG (in
# office-data, where the Cluster lives) AND by the application (in its own namespace).
# An ESO generator cannot serve both — every `generatorRef` invocation produces a NEW
# password, so two ExternalSecrets against the same generator give two different values.
#
# The fix is ESO's own `kubernetes` provider: generate once in the owning namespace, then
# read that Secret back from elsewhere as if it were any other secret backend. Apps still
# only ever see a Secret; they never learn where it came from (P4).
#
# RBAC note: the SelfSubjectRulesReview that ESO performs when validating a store needs no
# grant — `system:basic-user` is bound to system:authenticated, which includes these
# ServiceAccounts. Only `get` on secrets has to be granted explicitly, and only `get` is:
# every ExternalSecret names its key, nothing `find`s. The stores are cluster-scoped so
# every app namespace can read through them, and `conditions` keeps it to those namespaces
# — without it any namespace on the cluster could read any platform credential.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-reader
  namespace: office-data
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eso-reader
  namespace: office-data
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eso-reader
  namespace: office-data
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: eso-reader}
subjects:
  - {kind: ServiceAccount, name: eso-reader, namespace: office-data}
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: office-data
spec:
  conditions: [{namespaceRegexes: ["^office-"]}]
  provider:
    kubernetes:
      remoteNamespace: office-data
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
          namespace: office-data
      auth:
        serviceAccount: {name: eso-reader, namespace: office-data}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-reader
  namespace: office-identity
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eso-reader
  namespace: office-identity
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eso-reader
  namespace: office-identity
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: eso-reader}
subjects:
  - {kind: ServiceAccount, name: eso-reader, namespace: office-identity}
---
# Client secrets are born here, because Keycloak is the only component that can be told
# one rather than read one. Applications read them back through this store.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: office-identity
spec:
  conditions: [{namespaceRegexes: ["^office-"]}]
  provider:
    kubernetes:
      remoteNamespace: office-identity
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
          namespace: office-identity
      auth:
        serviceAccount: {name: eso-reader, namespace: office-identity}
