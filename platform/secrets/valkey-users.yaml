# Valkey ACL passwords, in two halves: they are GENERATED one user at a time, and they are
# ASSEMBLED into the single Secret per instance that the chart wants.
#
# WHY IT IS SPLIT. The chart reads user passwords from one Secret per instance, keyed by
# username, and requires a password for EVERY declared ACL user — including `default`, even
# when `default` is disabled. The obvious shape is one generate-once ExternalSecret per
# instance with a `dataFrom` entry per user. That shape cannot gain a user, and all three
# ways out of it were tried against this cluster:
#
#   * `refreshInterval: "0"` does not mean "re-draw when the spec changes". It means the
#     ExternalSecret is written once and never again. Adding an entry bumps the object's
#     `metadata.generation`, ESO leaves `status.syncedResourceVersion` on the previous
#     generation, and it goes on reporting `Ready=True / secret synced` while the Secret
#     never gains the key. Valkey's init container then refuses to start with
#     `ERROR: No password found for user <name>` — measured, in production, adding `drive`.
#   * Forcing it re-draws EVERY entry, so adding the Nth application rotates the passwords
#     of the other N-1 and takes their caches and Celery brokers down until each restarts.
#   * A second ExternalSecret with `creationPolicy: Merge` cannot help: ESO refuses to write
#     into a Secret another ExternalSecret owns — `SecretOwnedByOther`.
#
# So generation and assembly become different objects. A per-user Secret is generate-once
# and never changes shape; an assembler only READS, so it is idempotent and may refresh.
#
# ADDING AN APPLICATION is then additive: one `valkey-user-<app>` ExternalSecret, and one
# line in each assembler. Nothing that already exists is rewritten, and nothing rotates.
---
# The two originals. They predate this design and are RETAINED as the source of record for
# `default` and `docs` — those passwords are live, and re-drawing them would log every Docs
# user out. Do not add users here. Nothing reads these Secrets except the assemblers.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: valkey-cache-users, namespace: office-data}
spec:
  refreshInterval: "0"          # generate once; never rotate underneath a running app
  target: {name: valkey-cache-users, creationPolicy: Owner}
  dataFrom:
    - sourceRef: {generatorRef: {apiVersion: generators.external-secrets.io/v1alpha1, kind: ClusterGenerator, name: office-password}}
      rewrite: [{regexp: {source: "password", target: "default"}}]
    - sourceRef: {generatorRef: {apiVersion: generators.external-secrets.io/v1alpha1, kind: ClusterGenerator, name: office-password}}
      rewrite: [{regexp: {source: "password", target: "docs"}}]
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: valkey-broker-users, namespace: office-data}
spec:
  refreshInterval: "0"
  target: {name: valkey-broker-users, creationPolicy: Owner}
  dataFrom:
    - sourceRef: {generatorRef: {apiVersion: generators.external-secrets.io/v1alpha1, kind: ClusterGenerator, name: office-password}}
      rewrite: [{regexp: {source: "password", target: "default"}}]
    - sourceRef: {generatorRef: {apiVersion: generators.external-secrets.io/v1alpha1, kind: ClusterGenerator, name: office-password}}
      rewrite: [{regexp: {source: "password", target: "docs"}}]
---
# One generate-once Secret per application, holding its password on each instance. Two
# draws, so an app's cache credential is not also its broker credential.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: valkey-user-drive, namespace: office-data}
spec:
  refreshInterval: "0"
  target: {name: valkey-user-drive, creationPolicy: Owner}
  dataFrom:
    - sourceRef: {generatorRef: {apiVersion: generators.external-secrets.io/v1alpha1, kind: ClusterGenerator, name: office-password}}
      rewrite: [{regexp: {source: "password", target: "cache"}}]
    - sourceRef: {generatorRef: {apiVersion: generators.external-secrets.io/v1alpha1, kind: ClusterGenerator, name: office-password}}
      rewrite: [{regexp: {source: "password", target: "broker"}}]
---
# The assemblers — what `auth.usersExistingSecret` points at.
#
# These generate nothing. Every value is read back through the `office-data` store, so a
# refresh is a no-op and the interval can be an ordinary hour rather than "0". That is the
# whole point of the split: this object CAN change shape safely, and the objects that
# cannot change shape never have to.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: valkey-cache-acl, namespace: office-data}
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: office-data}
  target:
    name: valkey-cache-acl
    creationPolicy: Owner
    template:
      data:
        default: "{{ .default }}"
        docs: "{{ .docs }}"
        drive: "{{ .drive }}"
  data:
    - {secretKey: default, remoteRef: {key: valkey-cache-users, property: default}}
    - {secretKey: docs, remoteRef: {key: valkey-cache-users, property: docs}}
    - {secretKey: drive, remoteRef: {key: valkey-user-drive, property: cache}}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: valkey-broker-acl, namespace: office-data}
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: office-data}
  target:
    name: valkey-broker-acl
    creationPolicy: Owner
    template:
      data:
        default: "{{ .default }}"
        docs: "{{ .docs }}"
        drive: "{{ .drive }}"
  data:
    - {secretKey: default, remoteRef: {key: valkey-broker-users, property: default}}
    - {secretKey: docs, remoteRef: {key: valkey-broker-users, property: docs}}
    - {secretKey: drive, remoteRef: {key: valkey-user-drive, property: broker}}
