# Valkey ACL passwords: GENERATED one application at a time, ASSEMBLED into the one Secret
# per instance the chart wants. Adding an app is a `valkey-user-<app>` ExternalSecret plus
# one line in each assembler — see platform/valkey/README.md for why it is not simpler.
#
# Short version: a generate-once ExternalSecret cannot gain a key. `refreshInterval: "0"`
# means written once and never again, not "re-draw on a spec change", so an added entry
# never appears while ESO still reports `secret synced`. Forcing it re-draws everything and
# rotates the other apps' passwords; `creationPolicy: Merge` is refused with
# `SecretOwnedByOther`. So generation and assembly are separate objects: the generators
# never change shape, and the assemblers only read, so they can.
---
# The two originals, retained as the source of record for `default` and `docs`: those
# passwords are live and re-drawing them would log every Docs user out. Do not add users
# here — nothing reads these except the assemblers.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: valkey-cache-users, namespace: office-data}
spec:
  refreshInterval: "0"          # generate once; never rotate underneath a running app
  target: {name: valkey-cache-users, creationPolicy: Owner}
  dataFrom:
    - sourceRef: {generatorRef: {apiVersion: generators.external-secrets.io/v1alpha1, kind: ClusterGenerator, name: office-password}}
      rewrite: [{regexp: {source: "password", target: "default"}}]
    - sourceRef: {generatorRef: {apiVersion: generators.external-secrets.io/v1alpha1, kind: ClusterGenerator, name: office-password}}
      rewrite: [{regexp: {source: "password", target: "docs"}}]
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: valkey-broker-users, namespace: office-data}
spec:
  refreshInterval: "0"
  target: {name: valkey-broker-users, creationPolicy: Owner}
  dataFrom:
    - sourceRef: {generatorRef: {apiVersion: generators.external-secrets.io/v1alpha1, kind: ClusterGenerator, name: office-password}}
      rewrite: [{regexp: {source: "password", target: "default"}}]
    - sourceRef: {generatorRef: {apiVersion: generators.external-secrets.io/v1alpha1, kind: ClusterGenerator, name: office-password}}
      rewrite: [{regexp: {source: "password", target: "docs"}}]
---
# One generate-once Secret per application. Two draws, so its cache credential is not also
# its broker credential.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: valkey-user-drive, namespace: office-data}
spec:
  refreshInterval: "0"
  target: {name: valkey-user-drive, creationPolicy: Owner}
  dataFrom:
    - sourceRef: {generatorRef: {apiVersion: generators.external-secrets.io/v1alpha1, kind: ClusterGenerator, name: office-password}}
      rewrite: [{regexp: {source: "password", target: "cache"}}]
    - sourceRef: {generatorRef: {apiVersion: generators.external-secrets.io/v1alpha1, kind: ClusterGenerator, name: office-password}}
      rewrite: [{regexp: {source: "password", target: "broker"}}]
---
# One draw only: Find has no Celery tasks, so it never needs a broker credential.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: valkey-user-find, namespace: office-data}
spec:
  refreshInterval: "0"
  target: {name: valkey-user-find, creationPolicy: Owner}
  dataFrom:
    - sourceRef: {generatorRef: {apiVersion: generators.external-secrets.io/v1alpha1, kind: ClusterGenerator, name: office-password}}
      rewrite: [{regexp: {source: "password", target: "cache"}}]
---
# Two draws. The THIRD Dramatiq URL — the result backend — deliberately shares the `cache`
# credential: it points at the same valkey-cache instance, so it is the same ACL user and
# a separate draw would only be a second password for one login.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: valkey-user-calendars, namespace: office-data}
spec:
  refreshInterval: "0"
  target: {name: valkey-user-calendars, creationPolicy: Owner}
  dataFrom:
    - sourceRef: {generatorRef: {apiVersion: generators.external-secrets.io/v1alpha1, kind: ClusterGenerator, name: office-password}}
      rewrite: [{regexp: {source: "password", target: "cache"}}]
    - sourceRef: {generatorRef: {apiVersion: generators.external-secrets.io/v1alpha1, kind: ClusterGenerator, name: office-password}}
      rewrite: [{regexp: {source: "password", target: "broker"}}]
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: valkey-user-meet, namespace: office-data}
spec:
  refreshInterval: "0"
  target: {name: valkey-user-meet, creationPolicy: Owner}
  dataFrom:
    - sourceRef: {generatorRef: {apiVersion: generators.external-secrets.io/v1alpha1, kind: ClusterGenerator, name: office-password}}
      rewrite: [{regexp: {source: "password", target: "cache"}}]
    - sourceRef: {generatorRef: {apiVersion: generators.external-secrets.io/v1alpha1, kind: ClusterGenerator, name: office-password}}
      rewrite: [{regexp: {source: "password", target: "broker"}}]
---
# Cache only, for sessions and socket.io's pub/sub between replicas. No broker: there is no
# task queue in Projects.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: valkey-user-projects, namespace: office-data}
spec:
  refreshInterval: "0"
  target: {name: valkey-user-projects, creationPolicy: Owner}
  dataFrom:
    - sourceRef: {generatorRef: {apiVersion: generators.external-secrets.io/v1alpha1, kind: ClusterGenerator, name: office-password}}
      rewrite: [{regexp: {source: "password", target: "cache"}}]
---
# LiveKit is not an application in the Django sense but it is a Valkey client: room state
# and the egress request queue live in Redis. Broker only — `noeviction` is what a queue
# needs, and a lost room record is a dropped call.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: valkey-user-livekit, namespace: office-data}
spec:
  refreshInterval: "0"
  target: {name: valkey-user-livekit, creationPolicy: Owner}
  dataFrom:
    - sourceRef: {generatorRef: {apiVersion: generators.external-secrets.io/v1alpha1, kind: ClusterGenerator, name: office-password}}
      rewrite: [{regexp: {source: "password", target: "broker"}}]
---
# The assemblers — what `auth.usersExistingSecret` points at. They generate nothing, so a
# refresh is a no-op and the interval can be an ordinary hour.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: valkey-cache-acl, namespace: office-data}
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: office-data}
  target:
    name: valkey-cache-acl
    creationPolicy: Owner
    template:
      data:
        default: "{{ .default }}"
        docs: "{{ .docs }}"
        drive: "{{ .drive }}"
        find: "{{ .find }}"
        calendars: "{{ .calendars }}"
        meet: "{{ .meet }}"
        projects: "{{ .projects }}"
  data:
    - {secretKey: default, remoteRef: {key: valkey-cache-users, property: default}}
    - {secretKey: docs, remoteRef: {key: valkey-cache-users, property: docs}}
    - {secretKey: drive, remoteRef: {key: valkey-user-drive, property: cache}}
    - {secretKey: find, remoteRef: {key: valkey-user-find, property: cache}}
    - {secretKey: calendars, remoteRef: {key: valkey-user-calendars, property: cache}}
    - {secretKey: meet, remoteRef: {key: valkey-user-meet, property: cache}}
    - {secretKey: projects, remoteRef: {key: valkey-user-projects, property: cache}}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: valkey-broker-acl, namespace: office-data}
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: office-data}
  target:
    name: valkey-broker-acl
    creationPolicy: Owner
    template:
      data:
        default: "{{ .default }}"
        docs: "{{ .docs }}"
        drive: "{{ .drive }}"
        calendars: "{{ .calendars }}"
        meet: "{{ .meet }}"
        livekit: "{{ .livekit }}"
  data:
    - {secretKey: default, remoteRef: {key: valkey-broker-users, property: default}}
    - {secretKey: docs, remoteRef: {key: valkey-broker-users, property: docs}}
    - {secretKey: drive, remoteRef: {key: valkey-user-drive, property: broker}}
    - {secretKey: calendars, remoteRef: {key: valkey-user-calendars, property: broker}}
    - {secretKey: meet, remoteRef: {key: valkey-user-meet, property: broker}}
    - {secretKey: livekit, remoteRef: {key: valkey-user-livekit, property: broker}}
