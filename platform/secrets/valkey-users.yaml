# The Valkey chart reads user passwords from one Secret per instance, keyed by username,
# and requires a password for EVERY declared ACL user — including `default`, even when
# `default` is disabled. Each dataFrom entry invokes the generator separately, so each
# user gets a distinct password.
#
# ADDING A USER IS A NEW EXTERNALSECRET BELOW, NEVER AN EDIT TO THESE TWO.
#
# `refreshInterval: "0"` does not mean "re-draw when the spec changes" — it means the
# ExternalSecret is written once and never again. Adding a fourth `dataFrom` entry here
# bumps the object's generation, ESO leaves `syncedResourceVersion` on the old generation,
# still reports `Ready=True secret synced`, and the new key never appears. Valkey's init
# container then refuses to start with `ERROR: No password found for user <name>` while
# the running pod keeps serving — measured, in production, adding `drive`.
#
# Forcing it (`force-sync`) is worse than useless: it re-draws EVERY entry, so adding the
# Nth application rotates the passwords of the other N-1 and takes their caches down until
# each is restarted.
#
# So the shared object is created once, and every user after the first arrives as its own
# `creationPolicy: Merge` ExternalSecret, which adds one key and touches nothing else.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: valkey-cache-users, namespace: office-data}
spec:
  refreshInterval: "0"          # generate once; never rotate underneath a running app
  target: {name: valkey-cache-users, creationPolicy: Owner}
  dataFrom:
    - sourceRef: {generatorRef: {apiVersion: generators.external-secrets.io/v1alpha1, kind: ClusterGenerator, name: office-password}}
      rewrite: [{regexp: {source: "password", target: "default"}}]
    - sourceRef: {generatorRef: {apiVersion: generators.external-secrets.io/v1alpha1, kind: ClusterGenerator, name: office-password}}
      rewrite: [{regexp: {source: "password", target: "docs"}}]
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: valkey-broker-users, namespace: office-data}
spec:
  refreshInterval: "0"
  target: {name: valkey-broker-users, creationPolicy: Owner}
  dataFrom:
    - sourceRef: {generatorRef: {apiVersion: generators.external-secrets.io/v1alpha1, kind: ClusterGenerator, name: office-password}}
      rewrite: [{regexp: {source: "password", target: "default"}}]
    - sourceRef: {generatorRef: {apiVersion: generators.external-secrets.io/v1alpha1, kind: ClusterGenerator, name: office-password}}
      rewrite: [{regexp: {source: "password", target: "docs"}}]
---
# `drive`, on both instances. Merge, not Owner: these add one key to the Secret the
# ExternalSecrets above created and leave `default` and `docs` exactly as they are.
#
# Two objects rather than one because the two instances are separate Secrets, and the
# passwords must differ — an app that reuses one credential across the cache and the broker
# gets no isolation from its own eviction policy.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: valkey-cache-user-drive, namespace: office-data}
spec:
  refreshInterval: "0"
  target: {name: valkey-cache-users, creationPolicy: Merge}
  dataFrom:
    - sourceRef: {generatorRef: {apiVersion: generators.external-secrets.io/v1alpha1, kind: ClusterGenerator, name: office-password}}
      rewrite: [{regexp: {source: "password", target: "drive"}}]
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: valkey-broker-user-drive, namespace: office-data}
spec:
  refreshInterval: "0"
  target: {name: valkey-broker-users, creationPolicy: Merge}
  dataFrom:
    - sourceRef: {generatorRef: {apiVersion: generators.external-secrets.io/v1alpha1, kind: ClusterGenerator, name: office-password}}
      rewrite: [{regexp: {source: "password", target: "drive"}}]
