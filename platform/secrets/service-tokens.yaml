# Shared app-to-app tokens. Born here rather than in either application's namespace because
# both ends must read the SAME value, and `platform-deps.generated` draws a fresh one per
# call — the problem stores.yaml exists to solve.
#
# 50 characters, not 40: Find's Service.token carries CheckConstraint(token__length=50).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: find-service-tokens, namespace: office-data}
spec:
  refreshInterval: "0"          # rotating this de-authenticates Docs' indexer mid-flight
  target: {name: find-service-tokens, creationPolicy: Owner}
  dataFrom:
    - sourceRef:
        generatorRef: {apiVersion: generators.external-secrets.io/v1alpha1, kind: ClusterGenerator, name: office-token-50}
      rewrite: [{regexp: {source: "password", target: "docs"}}]
---
# Meet's five shared tokens, one draw each. Meet is not one process but a pipeline —
# backend → summary API → whisperx → Docs → back to the backend — and every hop is a bearer
# token that BOTH sides must know. They live here for the same reason as Find's: the two
# ends are in different namespaces and `platform-deps.generated` cannot hand one value to
# two releases.
#
#   summary   backend → summary service (SUMMARY_SERVICE_API_TOKEN / tenant api_key)
#   webhook   summary service → backend (SUMMARY_SERVICE_WEBHOOK_API_TOKEN / webhook_api_key)
#   docs      summary service → Docs (create-for-owner; Docs' DJANGO_SERVER_TO_SERVER_API_TOKENS)
#   whisperx  summary service → the whisperx API in office-meet (API_KEY at both ends)
#   livekit   the LiveKit API SECRET. The api KEY is the literal `office`, and it is also
#             the LiveKit → backend webhook credential (LiveKit signs webhooks with it).
#             LiveKit, egress and the Meet backend all read this one value.
#
# 50 characters for all five: the summary service enforces min_length=8 on api_key and
# nothing here has an upper bound. Rotating any of them is a coordinated restart of both
# ends, which is what `refreshInterval: "0"` is protecting.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: meet-service-tokens, namespace: office-data}
spec:
  refreshInterval: "0"
  target: {name: meet-service-tokens, creationPolicy: Owner}
  dataFrom:
    - sourceRef:
        generatorRef: {apiVersion: generators.external-secrets.io/v1alpha1, kind: ClusterGenerator, name: office-token-50}
      rewrite: [{regexp: {source: "password", target: "summary"}}]
    - sourceRef:
        generatorRef: {apiVersion: generators.external-secrets.io/v1alpha1, kind: ClusterGenerator, name: office-token-50}
      rewrite: [{regexp: {source: "password", target: "webhook"}}]
    - sourceRef:
        generatorRef: {apiVersion: generators.external-secrets.io/v1alpha1, kind: ClusterGenerator, name: office-token-50}
      rewrite: [{regexp: {source: "password", target: "docs"}}]
    - sourceRef:
        generatorRef: {apiVersion: generators.external-secrets.io/v1alpha1, kind: ClusterGenerator, name: office-token-50}
      rewrite: [{regexp: {source: "password", target: "whisperx"}}]
    - sourceRef:
        generatorRef: {apiVersion: generators.external-secrets.io/v1alpha1, kind: ClusterGenerator, name: office-token-50}
      rewrite: [{regexp: {source: "password", target: "livekit"}}]
