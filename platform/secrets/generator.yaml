# Passwords are generated once, in-cluster, and never derived at render time from a master
# secret — that is the single biggest change from the legacy stack (history/design/adr/0005). Nothing here
# is a secret; it is the recipe for making one.
#
# No symbols: these passwords end up inside connection URIs, and percent-encoding bugs in
# that path present as authentication failures that are miserable to diagnose.
apiVersion: generators.external-secrets.io/v1alpha1
kind: ClusterGenerator
metadata:
  name: office-password
spec:
  kind: Password
  generator:
    passwordSpec:
      length: 40
      digits: 8
      symbols: 0
      symbolCharacters: ""
      noUpper: false
      allowRepeat: true
---
# Service-to-service tokens. Separate from `office-password` only because Find stores its
# token in a column with `CheckConstraint(token__length=50)` — a 40-character password is
# rejected at registration. Do not change the length of `office-password` instead: it is
# generate-once and every live credential came from it.
apiVersion: generators.external-secrets.io/v1alpha1
kind: ClusterGenerator
metadata:
  name: office-token-50
spec:
  kind: Password
  generator:
    passwordSpec:
      length: 50
      digits: 8
      symbols: 0
      symbolCharacters: ""
      noUpper: false
      allowRepeat: true
