# The recipe for passwords generated once, in-cluster (history/design/adr/0005). No symbols:
# they end up inside connection URIs, where encoding bugs read as authentication failures.
apiVersion: generators.external-secrets.io/v1alpha1
kind: ClusterGenerator
metadata:
  name: office-password
spec:
  kind: Password
  generator:
    passwordSpec:
      length: 40
      digits: 8
      symbols: 0
      symbolCharacters: ""
      noUpper: false
      allowRepeat: true
---
# Find's token column requires exactly 50. Never change `office-password` instead: every
# live credential came from it.
apiVersion: generators.external-secrets.io/v1alpha1
kind: ClusterGenerator
metadata:
  name: office-token-50
spec:
  kind: Password
  generator:
    passwordSpec:
      length: 50
      digits: 8
      symbols: 0
      symbolCharacters: ""
      noUpper: false
      allowRepeat: true
