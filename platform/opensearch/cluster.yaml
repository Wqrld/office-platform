# One shared OpenSearch for every application that needs full-text search: Find on the
# `find-*` pattern, Messages on its one `messages` index. Per-app isolation is an internal
# user whose role grants only that pattern — adr/0111.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata: {name: opensearch, namespace: office-data}
spec:
  interval: 30m
  chart:
    spec:
      chart: opensearch
      version: "3.8.0"
      sourceRef: {kind: HelmRepository, name: opensearch, namespace: flux-system}
  install: {disableWaitForJobs: true}
  upgrade: {disableWaitForJobs: true}
  # A hand-scaled or hand-edited datastore is put back, and Flux says so (adr/0119).
  driftDetection: {mode: enabled}
  values:
    singleNode: true
    replicas: 1
    priorityClassName: office-data

    # Pinned apart from the chart, so a chart bump cannot move the server.
    image:
      tag: "3.8.0"

    # Not the chart's 1000m/100Mi: too much CPU for an idle server, and memory below the
    # JVM heap, which is how a pod is OOMKilled while its request claims it needs nothing.
    resources:
      requests: {cpu: 200m, memory: 1Gi}
    opensearchJavaOpts: "-Xmx1g -Xms1g"

    persistence:
      enabled: true
      size: 10Gi
      storageClass: ${STORAGE_CLASS}
      # No root chown initContainer: fsGroup does it (local-path volumes are world-writable).
      enableInitChown: false

    # With the chart's own settings: PSA `restricted`.
    podSecurityContext:
      fsGroupChangePolicy: OnRootMismatch
      seccompProfile: {type: RuntimeDefault}
    securityContext:
      allowPrivilegeEscalation: false

    # A privileged initContainer, which baseline PSA refuses; the node's vm.max_map_count is
    # already 1048576.
    sysctlInit: {enabled: false}

    extraEnvs:
      # Ours, not the demo certificates and config; unset, the image also demands
      # OPENSEARCH_INITIAL_ADMIN_PASSWORD.
      - name: DISABLE_INSTALL_DEMO_CONFIG
        value: "true"

    secretMounts:
      - name: node-tls
        secretName: opensearch-node-tls
        path: /usr/share/opensearch/config/certs
      - name: admin-tls
        secretName: opensearch-admin-tls
        path: /usr/share/opensearch/config/admin-certs

    securityConfig:
      enabled: true
      config:
        # First boot only: every file but the users, who are added by the tenants chart's
        # reconcile Job (charts/platform-tenants/templates/opensearch.yaml).
        securityConfigSecret: opensearch-security

    config:
      # Replaces the chart's default file wholesale. Paths are relative to the config dir.
      opensearch.yml: |
        cluster.name: opensearch-cluster
        network.host: 0.0.0.0

        plugins.security.ssl.transport.pemcert_filepath: certs/tls.crt
        plugins.security.ssl.transport.pemkey_filepath: certs/tls.key
        plugins.security.ssl.transport.pemtrustedcas_filepath: certs/ca.crt
        plugins.security.ssl.transport.enforce_hostname_verification: false

        plugins.security.ssl.http.enabled: true
        plugins.security.ssl.http.pemcert_filepath: certs/tls.crt
        plugins.security.ssl.http.pemkey_filepath: certs/tls.key
        plugins.security.ssl.http.pemtrustedcas_filepath: certs/ca.crt

        # Seeds .opendistro_security from the mounted files on FIRST boot only.
        plugins.security.allow_default_init_securityindex: true
        plugins.security.nodes_dn:
          - "CN=opensearch-cluster-master,O=office"
        plugins.security.authcz.admin_dn:
          - "CN=opensearch-admin,O=office"
        plugins.security.audit.type: internal_opensearch
        plugins.security.restapi.roles_enabled: ["all_access", "security_rest_api_access"]
