# LimitRanges for the platform's namespaces: `defaultRequest` AND NOTHING ELSE, which is the
# whole design. No `min`, no `max`, so it can refuse nothing; it only fills in a request
# where a container declared none, and is safe on a running cluster.
#
# Why: the datastores in `office-data` declare no requests, and a pod with none is
# BestEffort: the scheduler thinks the node emptier than it is, and under memory pressure
# the kubelet evicts BestEffort FIRST, so the databases die to save the applications.
# 50m/256Mi is a floor that stops a container being counted as zero, not a size; a workload
# that deserves a real number carries its own `resources`.
#
# It applies at pod creation, so on an existing cluster requests rise (by ~300m/1536Mi in
# `office-data`) as pods are replaced: capacity always used, never counted.
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: office-data
spec:
  limits:
    - type: Container
      defaultRequest: {cpu: 50m, memory: 256Mi}
---
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: office-identity
spec:
  limits:
    - type: Container
      defaultRequest: {cpu: 50m, memory: 256Mi}
