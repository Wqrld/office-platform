apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - guardrails.yaml
  - gateway/namespace.yaml
  - gateway/priorityclasses.yaml
  - gateway/envoyproxy.yaml
  - gateway/gateway.yaml
  - gateway/certificate.yaml
  - gateway/clusterissuer.yaml
  - gateway/traffic.yaml
  - secrets/generator.yaml
  - secrets/stores.yaml
  - tenants.yaml
  - secrets/opensearch-users.yaml
  - secrets/service-tokens.yaml
  - postgres/cluster.yaml
  - valkey/cache.yaml
  - valkey/broker.yaml
  - opensearch/certificate.yaml
  - opensearch/cluster.yaml
  # objectstore/ is its own layer — see objectstore/kustomization.yaml
  - identity/namespace.yaml
  - identity/vendor/keycloak-operator   # vendored upstream, pinned in its kustomization
  - identity/keycloak.yaml
  - identity/smtp.yaml               # the relay account, read by the tenants chart's realm Job
  - identity/realm.yaml


# PHASE 1 OF THE HANDOVER TO platform-tenants, for the OpenSearch users and the realm. The
# next release deletes secrets/opensearch-users.yaml, identity/realm.yaml and this block.
#   * opensearch-user-*: claimed by the tenants release, which needs Helm's ownership
#     metadata on them; `prune: disabled` so removing the file never lets ESO delete a live
#     password.
#   * the KeycloakRealmImport: `prune: disabled` before it leaves git. Deleting it would not
#     delete the realm — the operator's controller has no cleanup and the CR no finalizer —
#     but it is the realm, and it is not removed on an argument.
patches:
  - target: {kind: ExternalSecret, namespace: office-data, name: "opensearch-user-.*"}
    patch: |
      - {op: add, path: /metadata/labels, value: {app.kubernetes.io/managed-by: Helm}}
      - {op: add, path: /metadata/annotations, value: {meta.helm.sh/release-name: tenants, meta.helm.sh/release-namespace: office-data, kustomize.toolkit.fluxcd.io/prune: disabled}}
  - target: {kind: KeycloakRealmImport}
    patch: |
      - {op: add, path: /metadata/annotations, value: {kustomize.toolkit.fluxcd.io/prune: disabled}}
