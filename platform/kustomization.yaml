apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - guardrails.yaml
  - gateway/namespace.yaml
  - gateway/priorityclasses.yaml
  - gateway/envoyproxy.yaml
  - gateway/gateway.yaml
  - gateway/certificate.yaml
  - gateway/clusterissuer.yaml
  - gateway/traffic.yaml
  - secrets/generator.yaml
  - secrets/stores.yaml
  - secrets/valkey-users.yaml
  - secrets/database-users.yaml
  - secrets/opensearch-users.yaml
  - secrets/service-tokens.yaml
  - postgres/cluster.yaml
  - postgres/databases.yaml
  - valkey/cache.yaml
  - valkey/broker.yaml
  - opensearch/certificate.yaml
  - opensearch/cluster.yaml
  - objectstore/admin-token.yaml
  - objectstore/cluster.yaml
  - objectstore/reference-grants.yaml
  - objectstore/public-route.yaml
  - identity/namespace.yaml
  - identity/vendor/keycloak-operator   # vendored upstream, pinned 26.7.3 — see its kustomization
  - identity/keycloak.yaml
  - identity/smtp.yaml               # the relay account, read in for realm.yaml's placeholders
  - identity/realm.yaml
  # gateway/deferred/ is deliberately absent — see gateway/deferred/README.md
