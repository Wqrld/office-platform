apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: office
  namespace: office-system
spec:
  gatewayClassName: eg                      # the cluster's existing Envoy Gateway
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: office-gateway
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces: {from: Same}            # only the redirect below
    # One listener, no hostname: Envoy selects the certificate by SNI. Adding an
    # application therefore never edits this file — its host goes in the control plane's
    # app table, which is where certificate.yaml's SAN list comes from, and it ships its
    # own HTTPRoute.
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: office-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              office.haaijer.dev/gateway-access: "true"
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-redirect
  namespace: office-system
spec:
  parentRefs:
    - name: office
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect: {scheme: https, statusCode: 301}
