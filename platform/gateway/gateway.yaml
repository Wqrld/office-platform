apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: office
  namespace: office-system
spec:
  gatewayClassName: ${GATEWAY_CLASS}        # the cluster's, or ours (cluster/gateway/config)
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: office-gateway
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces: {from: Same}            # only the redirect below
    # One listener, no hostname: Envoy selects the certificate by SNI. Adding an
    # application therefore never edits this file — its host goes in the control plane's
    # app table, which is where certificate.yaml's SAN list comes from, and it ships its
    # own HTTPRoute.
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        # office-tls, then `gateway.extraCertificates`: Envoy picks one by SNI.
        certificateRefs: ${GATEWAY_CERTS}
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              office.haaijer.dev/gateway-access: "true"
    # WebRTC media for LiveKit, proxied at L4 (adr/0113): Envoy's UDP proxy gives each
    # client its own upstream socket, which is the NAT every SFU already expects. The
    # Gateway is therefore the ONE LoadBalancer, on any provider. Open even with Meet off;
    # without its routes the ports answer nothing.
    - name: rtc-tcp
      protocol: TCP
      port: 7881
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              office.haaijer.dev/gateway-access: "true"
    - name: rtc-udp
      protocol: UDP
      port: 7882
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              office.haaijer.dev/gateway-access: "true"
    - name: turn-udp
      protocol: UDP
      port: 3478
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              office.haaijer.dev/gateway-access: "true"
    # Inbound mail for Messages, the MX (apps/messages/surround.yaml). Plain TCP: STARTTLS
    # is the MTA's own, and it needs the sender's address, which reaches it as a PROXY
    # header. Open even with Messages off, answering nothing.
    - name: smtp
      protocol: TCP
      port: 25
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              office.haaijer.dev/gateway-access: "true"
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-redirect
  namespace: office-system
spec:
  parentRefs:
    - name: office
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect: {scheme: https, statusCode: 301}
