apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: office
  namespace: office-system
spec:
  gatewayClassName: ${GATEWAY_CLASS}        # the cluster's, or ours (cluster/gateway/config)
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: office-gateway
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces: {from: Same}            # only the redirect below
    # One listener, no hostname: certificates by SNI, so a new app never edits this file.
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        # office-tls, then `gateway.extraCertificates`: Envoy picks one by SNI.
        certificateRefs: ${GATEWAY_CERTS}
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              office.haaijer.dev/gateway-access: "true"
    # LiveKit's media at L4 (adr/0113), so the Gateway is the ONE LoadBalancer. Open even
    # with Meet off, answering nothing.
    - name: rtc-tcp
      protocol: TCP
      port: 7881
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              office.haaijer.dev/gateway-access: "true"
    - name: rtc-udp
      protocol: UDP
      port: 7882
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              office.haaijer.dev/gateway-access: "true"
    - name: turn-udp
      protocol: UDP
      port: 3478
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              office.haaijer.dev/gateway-access: "true"
    # Messages' MX (apps/messages/surround.yaml). Plain TCP: STARTTLS is the MTA's own.
    # Open even with Messages off, answering nothing.
    - name: smtp
      protocol: TCP
      port: 25
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              office.haaijer.dev/gateway-access: "true"
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-redirect
  namespace: office-system
spec:
  parentRefs:
    - name: office
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect: {scheme: https, statusCode: 301}
