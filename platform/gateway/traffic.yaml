# Gateway-wide client connection settings; ClientTrafficPolicy attaches only to a Gateway or
# its listeners. An app's per-route `requestBuffer` needs `bufferLimit` here too: Envoy will
# not buffer more than the connection's buffer, and the 32KiB default truncates uploads
# without an error.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: office
  namespace: office-system
spec:
  targetRefs:
    - {group: gateway.networking.k8s.io, kind: Gateway, name: office}
  # Collabora puts the WOPI source URL, percent-encoded, INSIDE the websocket path
  # (/cool/https%3A%2F%2Fdrive…/ws). Envoy's defaults unescape `%2F%2F` to `//`, merge it to
  # `/` and 307 to a corrupt WOPISrc: measured, every editing session looped. Raw paths
  # also suit the object store, whose keys are arbitrary text. Route matching sees the raw
  # path, so an encoded slash escapes a prefix deny (apps/collabora/release.yaml).
  path:
    escapedSlashesAction: KeepUnchanged
    disableMergeSlashes: true
  # Overrides the app's own. No includeSubDomains: the base domain may host things not ours.
  headers:
    lateResponseHeaders:
      set:
        - {name: Strict-Transport-Security, value: max-age=31536000}
        - {name: X-Content-Type-Options, value: nosniff}
  connection:
    bufferLimit: 100Mi
  timeout:
    http:
      # Docs' editor websocket is idle for minutes; Envoy's default would drop it.
      streamIdleTimeout: 1h
