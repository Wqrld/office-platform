# Gateway-wide client connection settings. The pair to any app's
# BackendTrafficPolicy.requestBuffer: Envoy will not buffer a request larger than the
# connection's own buffer, so setting one without the other silently caps uploads at
# 32KiB — the default — and presents as a truncated body rather than an error.
#
# This is on the Gateway rather than per-app because ClientTrafficPolicy only attaches to
# a Gateway or one of its listeners. Adding an application does not edit this file; the
# per-route limit is the app's to set, downward from here.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: office
  namespace: office-system
spec:
  targetRefs:
    - {group: gateway.networking.k8s.io, kind: Gateway, name: office}
  # Collabora addresses an editing session by putting the WOPI source URL, percent-encoded,
  # INSIDE the websocket path: /cool/https%3A%2F%2Fdrive…%2Fwopi%2Ffiles%2F<id>/ws.
  #
  # Envoy's defaults destroy that. `escapedSlashesAction` defaults to UnescapeAndRedirect,
  # so `%2F%2F` becomes `//`, slash-merging then collapses it to `/`, and the client gets a
  # 307 to a URL whose WOPISrc is corrupt. Measured: every editing session 307'd in a loop.
  #
  # Keeping the path unchanged is also the more correct behaviour for the object store
  # route, where a key is arbitrary text. It costs the convenience of `//api` normalising
  # to `/api`; route matching sees the raw path either way, so an encoded slash cannot be
  # used to slip past a PathPrefix match.
  path:
    escapedSlashesAction: KeepUnchanged
    disableMergeSlashes: true
  # Set on every response, overriding the app's own. No includeSubDomains: each app host
  # carries it itself, and the base domain may host things that are not ours.
  headers:
    lateResponseHeaders:
      set:
        - {name: Strict-Transport-Security, value: max-age=31536000}
        - {name: X-Content-Type-Options, value: nosniff}
  connection:
    bufferLimit: 100Mi
  timeout:
    http:
      # Long-lived websockets (Docs' collaborative editor) are idle for minutes at a
      # time. Envoy's default stream idle timeout would drop them.
      streamIdleTimeout: 1h
