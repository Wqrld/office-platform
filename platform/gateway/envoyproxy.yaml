# Attached to our Gateway (not to the shared `eg` GatewayClass) so that reusing the
# cluster's existing Envoy Gateway installation stays side-effect free.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: office-gateway
  namespace: office-system
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        # MetalLB's pin to ${GATEWAY_IP}, or nothing when the cluster's own provider allocates.
        annotations: ${LB_ANNOTATIONS}
      envoyDeployment:
        replicas: 1
        pod:
          priorityClassName: office-critical
