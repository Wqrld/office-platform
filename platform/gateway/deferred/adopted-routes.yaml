# Pre-existing services that were reachable only through ingress-nginx. They are routed
# here so that retiring nginx does not take them down. They are not part of the office
# platform; they are infrastructure we inherited and must not break.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  parentRefs:
    - {name: office, namespace: office-system, sectionName: https}
  hostnames: [longhorn.mijnbureau.haaijer.dev]
  rules:
    - backendRefs: [{name: longhorn-frontend, port: 80}]
---
# The Longhorn UI has no authentication of its own and can delete volumes. Under
# ingress-nginx it carried no allowlist either, so this is a deliberate tightening
# rather than a port of existing behaviour.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: longhorn-allowlist
  namespace: longhorn-system
spec:
  targetRefs:
    - {group: gateway.networking.k8s.io, kind: HTTPRoute, name: longhorn}
  authorization:
    defaultAction: Deny
    rules:
      - name: allowlist
        action: Allow
        principal:
          clientCIDRs: [45.136.141.0/24, 164.138.252.98/32, 188.91.204.185/32]
