# One SAN certificate for every platform hostname; the Gateway's single HTTPS listener
# selects from it by SNI. Adding an application is one dnsName here — the Gateway is
# never edited. See platform/docs/adr/0105.
#
# RULE: a hostname may be listed here only once its DNS resolves to the Gateway.
# Let's Encrypt fails the whole certificate if any single SAN fails validation, so one
# mispointed record takes down TLS for every application. This is why Harbor and the
# Longhorn UI are absent — they still resolve to ingress-nginx (see deferred/).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: office-tls
  namespace: office-system
spec:
  secretName: office-tls
  issuerRef:
    name: ${TLS_ISSUER}
    kind: ClusterIssuer
  dnsNames:
    - id.${BASE_DOMAIN}      # Keycloak
    - docs.${BASE_DOMAIN}    # Docs
    - drive.${BASE_DOMAIN}   # Drive
    - collabora.${BASE_DOMAIN}  # Collabora Online, the WOPI editor Drive embeds
    # The Garage S3 API, published for ONE bucket so Drive's browser uploads can be
    # presigned against a host the browser can reach — platform/docs/adr/0110.
    - s3.${BASE_DOMAIN}
