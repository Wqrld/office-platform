# One SAN certificate for every platform hostname; the Gateway's HTTPS listener selects from
# it by SNI (docs/adr/0105). A hostname may be served only once its DNS resolves to the
# Gateway: Let's Encrypt fails the whole certificate if one SAN fails validation.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: office-tls
  namespace: office-system
spec:
  secretName: office-tls
  issuerRef:
    name: ${TLS_ISSUER}
    kind: ClusterIssuer
  # The enabled apps' `hosts` from the control plane's app table, plus `s3.*` while the
  # platform runs the object store; never edited by hand.
  dnsNames: ${TLS_HOSTS}
