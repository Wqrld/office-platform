# Harbor predates this platform and is also the Flux artifact source, so it must keep
# working across the gateway cutover. Routing it here is what lets ingress-nginx be
# retired. Ported from `harby-harbor-ingress`, preserving both of its material
# behaviours: the source-IP allowlist and unlimited request body size.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: harbor
  namespace: harbor
spec:
  parentRefs:
    - name: office
      namespace: office-system
      sectionName: https
  hostnames: [harbor.mijnbureau.haaijer.dev]
  rules:
    # Longest-prefix wins in Gateway API regardless of order, so /api/ and friends
    # take precedence over / without needing to be ordered.
    - matches:
        - {path: {type: PathPrefix, value: /api/}}
        - {path: {type: PathPrefix, value: /service/}}
        - {path: {type: PathPrefix, value: /v2/}}
        - {path: {type: PathPrefix, value: /c/}}
      backendRefs: [{name: harby-harbor-core, port: 80}]
    - matches:
        - {path: {type: PathPrefix, value: /}}
      backendRefs: [{name: harby-harbor-portal, port: 80}]
---
# Replaces nginx's `whitelist-source-range`. Dropping it during the migration would
# expose Harbor's login and registry to the internet.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: harbor-allowlist
  namespace: harbor
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: harbor
  authorization:
    defaultAction: Deny
    rules:
      - name: allowlist
        action: Allow
        principal:
          clientCIDRs:
            - 45.136.141.0/24
            - 164.138.252.98/32
            - 188.91.204.185/32
            - 10.244.0.0/16      # in-cluster: Flux pulling artifacts
