# The relay account, read into Keycloak's namespace.
#
# It is applied by hand into office-data exactly once (docs/install.md) — an SMTP account
# is issued by a mail provider, so it is one of the two credentials on this platform that
# cannot be generated in-cluster. This is the same office-data bridge the applications use
# through platform-deps; the keys stay canonical and the tenants chart's realm Job does the
# spelling (charts/platform-tenants/files/realm.yaml, smtpServer).
#
# `refreshInterval` is a real interval, not the `"0"` of the generate-once objects: nothing
# here is drawn, so re-reading it is how a rotated relay password reaches the cluster. The
# realm takes it when the Job next runs — README.md, Rotating the relay.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: smtp-credentials, namespace: office-identity}
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: office-data}
  target: {name: smtp-credentials, creationPolicy: Owner}
  data:
    - {secretKey: host,     remoteRef: {key: smtp-credentials, property: host}}
    - {secretKey: port,     remoteRef: {key: smtp-credentials, property: port}}
    - {secretKey: username, remoteRef: {key: smtp-credentials, property: username}}
    - {secretKey: password, remoteRef: {key: smtp-credentials, property: password}}
    - {secretKey: useTLS,   remoteRef: {key: smtp-credentials, property: useTLS}}
    - {secretKey: useSSL,   remoteRef: {key: smtp-credentials, property: useSSL}}
    - {secretKey: from,     remoteRef: {key: smtp-credentials, property: from}}
