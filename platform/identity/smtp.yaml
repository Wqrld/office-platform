# The relay account, applied by hand into office-data once (docs/install.md), read into
# Keycloak's namespace; the realm Job does the spelling (charts/platform-tenants/files/realm.yaml).
# A real refreshInterval: re-reading is how a rotated password arrives (README.md).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: smtp-credentials, namespace: office-identity}
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: office-data}
  target: {name: smtp-credentials, creationPolicy: Owner}
  data:
    - {secretKey: host,     remoteRef: {key: smtp-credentials, property: host}}
    - {secretKey: port,     remoteRef: {key: smtp-credentials, property: port}}
    - {secretKey: username, remoteRef: {key: smtp-credentials, property: username}}
    - {secretKey: password, remoteRef: {key: smtp-credentials, property: password}}
    - {secretKey: useTLS,   remoteRef: {key: smtp-credentials, property: useTLS}}
    - {secretKey: useSSL,   remoteRef: {key: smtp-credentials, property: useSSL}}
    - {secretKey: from,     remoteRef: {key: smtp-credentials, property: from}}
