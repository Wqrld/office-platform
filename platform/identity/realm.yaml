# The realm is declarative config in git; secrets in it are not.
#
# `placeholders` turns each entry into an environment variable on the import Job, and
# Keycloak's importer resolves a placeholder in the realm against it. So the `docs` client
# secret is generated once by ESO (identity/keycloak.yaml), written into Keycloak here, and
# read by Docs from the same Secret — one value, two consumers, never a literal in git.
#
# TWO SYNTAX TRAPS, and both fail silently by storing the placeholder text as the secret:
#   1. Keycloak's own importer wants ${NAME}. `$(env:NAME)` is keycloak-config-cli syntax —
#      what the legacy stack used — and Keycloak stores it verbatim.
#   2. ${NAME} is also Flux's postBuild substitution syntax, so Flux would blank it before
#      Keycloak ever saw it. `$${NAME}` escapes it: Flux emits a literal ${NAME} and still
#      substitutes ${BASE_DOMAIN} elsewhere in this same file.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: realm-user-passwords, namespace: office-identity}
spec:
  # Generate once. Rotating these under a logged-in user would look like an outage.
  refreshInterval: "0"
  target: {name: realm-user-passwords, creationPolicy: Owner}
  dataFrom:
    - sourceRef: {generatorRef: {apiVersion: generators.external-secrets.io/v1alpha1, kind: ClusterGenerator, name: office-password}}
      rewrite: [{regexp: {source: "password", target: "l.f.haaijer"}}]
    - sourceRef: {generatorRef: {apiVersion: generators.external-secrets.io/v1alpha1, kind: ClusterGenerator, name: office-password}}
      rewrite: [{regexp: {source: "password", target: "k.e.roelofs"}}]
    - sourceRef: {generatorRef: {apiVersion: generators.external-secrets.io/v1alpha1, kind: ClusterGenerator, name: office-password}}
      rewrite: [{regexp: {source: "password", target: "o.adams"}}]
    - sourceRef: {generatorRef: {apiVersion: generators.external-secrets.io/v1alpha1, kind: ClusterGenerator, name: office-password}}
      rewrite: [{regexp: {source: "password", target: "r.i.rupert"}}]
    - sourceRef: {generatorRef: {apiVersion: generators.external-secrets.io/v1alpha1, kind: ClusterGenerator, name: office-password}}
      rewrite: [{regexp: {source: "password", target: "s.molinagarcia"}}]
---
apiVersion: k8s.keycloak.org/v2beta1
kind: KeycloakRealmImport
metadata:
  name: office
  namespace: office-identity
spec:
  keycloakCRName: keycloak
  placeholders:
    CLIENT_SECRET_DOCS:  {secret: {name: oidc-client-docs, key: secret}}
    CLIENT_SECRET_DRIVE: {secret: {name: oidc-client-drive, key: secret}}
    CLIENT_SECRET_FIND:  {secret: {name: oidc-client-find, key: secret}}
    CLIENT_SECRET_CALENDARS: {secret: {name: oidc-client-calendars, key: secret}}
    CLIENT_SECRET_MEET:  {secret: {name: oidc-client-meet, key: secret}}
    PW_LFHAAIJER:      {secret: {name: realm-user-passwords, key: l.f.haaijer}}
    PW_KEROELOFS:      {secret: {name: realm-user-passwords, key: k.e.roelofs}}
    PW_OADAMS:         {secret: {name: realm-user-passwords, key: o.adams}}
    PW_RIRUPERT:       {secret: {name: realm-user-passwords, key: r.i.rupert}}
    PW_SMOLINAGARCIA:  {secret: {name: realm-user-passwords, key: s.molinagarcia}}
    # The relay account, read into this namespace by smtp.yaml. Placeholders are the only
    # way a secret reaches the realm, and smtpServer is a map of STRINGS in the CRD — hence
    # the TLS flags travelling as "true"/"false" rather than as booleans.
    SMTP_HOST:     {secret: {name: smtp-credentials, key: host}}
    SMTP_PORT:     {secret: {name: smtp-credentials, key: port}}
    SMTP_USER:     {secret: {name: smtp-credentials, key: username}}
    SMTP_PASSWORD: {secret: {name: smtp-credentials, key: password}}
    SMTP_STARTTLS: {secret: {name: smtp-credentials, key: useTLS}}
    SMTP_SSL:      {secret: {name: smtp-credentials, key: useSSL}}
    SMTP_FROM:     {secret: {name: smtp-credentials, key: from}}
  realm:
    realm: office
    displayName: Office
    displayNameHtml: "<b>Office</b>"
    enabled: true
    defaultSignatureAlgorithm: RS256
    # Users arrive through this realm only; self-registration is not part of the product.
    registrationAllowed: false
    editUsernameAllowed: false
    loginWithEmailAllowed: true
    # Needs smtpServer below, and is worthless without it: without a relay the "Forgot
    # password?" link renders and then fails on the send. `verifyEmail` stays OFF — turning
    # it on retroactively locks every existing user out until they verify.
    resetPasswordAllowed: true
    duplicateEmailsAllowed: false
    rememberMe: true
    revokeRefreshToken: true
    # Rotation stays on, but zero reuse cannot survive a browser. Docs searches as you type,
    # so several XHRs hit the refresh middleware at once; the first rotates the token and
    # the rest present the consumed one. Keycloak answers "Maximum allowed refresh token
    # reuse exceeded", then "Session doesn't have required client" for everything after —
    # the session is dead and every search 401s until the user logs in again.
    refreshTokenMaxReuse: 3
    # Outbound mail. Every value is a placeholder resolved at import time except the display
    # name — none of the relay's details are in git, not even the host.
    #
    # `$${NAME}` and not `${NAME}`: the second is Flux's own postBuild syntax and would be
    # blanked before Keycloak ever saw it. See the header of this file.
    #
    # 587/STARTTLS or 465/SSL, never 25: outbound TCP 25 is blocked by this platform's
    # provider (measured). The two flags are mutually exclusive and both come from the one
    # hand-applied Secret, so the realm cannot disagree with the applications about which
    # of them is in use.
    smtpServer:
      host: "$${SMTP_HOST}"
      port: "$${SMTP_PORT}"
      from: "$${SMTP_FROM}"
      fromDisplayName: Office
      auth: "true"
      user: "$${SMTP_USER}"
      password: "$${SMTP_PASSWORD}"
      starttls: "$${SMTP_STARTTLS}"
      ssl: "$${SMTP_SSL}"

    internationalizationEnabled: true
    supportedLocales: [en, nl]
    defaultLocale: nl
    # Carried over from the legacy realm: these numbers were tuned there, not guessed.
    bruteForceProtected: true
    permanentLockout: false
    bruteForceStrategy: LINEAR
    failureFactor: 30
    maxFailureWaitSeconds: 900
    minimumQuickLoginWaitSeconds: 60
    waitIncrementSeconds: 60
    quickLoginCheckMilliSeconds: 1000
    maxDeltaTimeSeconds: 43200
    eventsEnabled: true
    eventsExpiration: 86400
    adminEventsEnabled: true
    clients:
      - clientId: docs
        name: Docs
        description: Docs — samen werken aan documenten
        enabled: true
        alwaysDisplayInConsole: true
        protocol: openid-connect
        publicClient: false
        clientAuthenticatorType: client-secret
        secret: "$${CLIENT_SECRET_DOCS}"
        rootUrl: https://docs.${BASE_DOMAIN}
        baseUrl: https://docs.${BASE_DOMAIN}
        adminUrl: https://docs.${BASE_DOMAIN}
        redirectUris: ["https://docs.${BASE_DOMAIN}/*"]
        webOrigins: ["https://docs.${BASE_DOMAIN}"]
        standardFlowEnabled: true
        implicitFlowEnabled: false
        # Docs is a browser application. A password grant would be a second, weaker way
        # in that nothing needs.
        directAccessGrantsEnabled: false
        serviceAccountsEnabled: false
        frontchannelLogout: true
        attributes:
          backchannel.logout.url: https://docs.${BASE_DOMAIN}/api/v1.0/logout/
          backchannel.logout.session.required: "true"
          frontchannel.logout.url: https://docs.${BASE_DOMAIN}/api/v1.0/logout/
          frontchannel.logout.session.required: "false"
          post.logout.redirect.uris: https://docs.${BASE_DOMAIN}/*
          # Per-client, and it MUST exceed 900. At login mozilla-django-oidc sets
          # `oidc_id_token_expiration = now + OIDC_RENEW_ID_TOKEN_EXPIRY_SECONDS`, whose
          # default is 900s and which Docs does not expose — so the refresh middleware does
          # nothing for the first 15 minutes. At the realm's 300s the token dies at minute 5
          # and search silently falls back to titles until minute 15. After the first
          # refresh lasuite tracks the real `expires_in`, so only the first window is wrong.
          # The realm default stays 300s for every other client.
          access.token.lifespan: "1200"
        # Puts `find` in the access token's `aud`. Without it Keycloak refuses to introspect
        # a Docs token for Find and returns `active: false` — Find 400s, and Docs swallows
        # that into the title-only search fallback. Verified: a freshly minted token
        # introspects as inactive until this mapper exists.
        protocolMappers:
          - name: find-audience
            protocol: openid-connect
            protocolMapper: oidc-audience-mapper
            config:
              included.client.audience: find
              access.token.claim: "true"
              id.token.claim: "false"
      # Drive. Same shape as Docs — a confidential browser client, no password grant, no
      # service account. Collabora is NOT a client here: it never talks to Keycloak. It is
      # handed a short-lived WOPI access token minted by Drive, and it authenticates back to
      # Drive with that token alone.
      - clientId: drive
        name: Drive
        description: Drive — bestanden delen en samen bewerken
        enabled: true
        alwaysDisplayInConsole: true
        protocol: openid-connect
        publicClient: false
        clientAuthenticatorType: client-secret
        secret: "$${CLIENT_SECRET_DRIVE}"
        rootUrl: https://drive.${BASE_DOMAIN}
        baseUrl: https://drive.${BASE_DOMAIN}
        adminUrl: https://drive.${BASE_DOMAIN}
        redirectUris: ["https://drive.${BASE_DOMAIN}/*"]
        webOrigins: ["https://drive.${BASE_DOMAIN}"]
        standardFlowEnabled: true
        implicitFlowEnabled: false
        directAccessGrantsEnabled: false
        serviceAccountsEnabled: false
        frontchannelLogout: true
        attributes:
          backchannel.logout.url: https://drive.${BASE_DOMAIN}/api/v1.0/logout/
          backchannel.logout.session.required: "true"
          frontchannel.logout.url: https://drive.${BASE_DOMAIN}/api/v1.0/logout/
          frontchannel.logout.session.required: "false"
          post.logout.redirect.uris: https://drive.${BASE_DOMAIN}/*
      - clientId: calendars
        name: Calendars
        description: Calendars — agenda's delen en vergaderingen plannen
        enabled: true
        alwaysDisplayInConsole: true
        protocol: openid-connect
        publicClient: false
        clientAuthenticatorType: client-secret
        secret: "$${CLIENT_SECRET_CALENDARS}"
        rootUrl: https://calendars.${BASE_DOMAIN}
        baseUrl: https://calendars.${BASE_DOMAIN}
        adminUrl: https://calendars.${BASE_DOMAIN}
        redirectUris: ["https://calendars.${BASE_DOMAIN}/*"]
        webOrigins: ["https://calendars.${BASE_DOMAIN}"]
        standardFlowEnabled: true
        implicitFlowEnabled: false
        directAccessGrantsEnabled: false
        serviceAccountsEnabled: false
        frontchannelLogout: true
        attributes:
          backchannel.logout.url: https://calendars.${BASE_DOMAIN}/api/v1.0/logout/
          backchannel.logout.session.required: "true"
          frontchannel.logout.url: https://calendars.${BASE_DOMAIN}/api/v1.0/logout/
          frontchannel.logout.session.required: "false"
          post.logout.redirect.uris: https://calendars.${BASE_DOMAIN}/*
      - clientId: meet
        name: Meet
        description: Meet — videovergaderen
        enabled: true
        alwaysDisplayInConsole: true
        protocol: openid-connect
        publicClient: false
        clientAuthenticatorType: client-secret
        secret: "$${CLIENT_SECRET_MEET}"
        rootUrl: https://meet.${BASE_DOMAIN}
        baseUrl: https://meet.${BASE_DOMAIN}
        adminUrl: https://meet.${BASE_DOMAIN}
        redirectUris: ["https://meet.${BASE_DOMAIN}/*"]
        webOrigins: ["https://meet.${BASE_DOMAIN}"]
        standardFlowEnabled: true
        implicitFlowEnabled: false
        directAccessGrantsEnabled: false
        serviceAccountsEnabled: false
        frontchannelLogout: true
        attributes:
          backchannel.logout.url: https://meet.${BASE_DOMAIN}/api/v1.0/logout/
          backchannel.logout.session.required: "true"
          frontchannel.logout.url: https://meet.${BASE_DOMAIN}/api/v1.0/logout/
          frontchannel.logout.session.required: "false"
          post.logout.redirect.uris: https://meet.${BASE_DOMAIN}/*
      # Find is a resource SERVER, not a login client: it only introspects access tokens
      # other clients already issued. So no browser ever reaches it, and it needs no grant
      # of its own — a confidential client authenticates to the introspection endpoint with
      # its secret alone. Hence no rootUrl, no redirectUris, no logout attributes, and every
      # flow off.
      #
      # `clientId` is also the audience Find resolves its searchable indices from, so it
      # must stay `find` and must match config/apps/find/deps.yaml's OIDC_RS_CLIENT_ID.
      - clientId: find
        name: Find
        description: Find — zoeken over alle applicaties
        enabled: true
        alwaysDisplayInConsole: false
        protocol: openid-connect
        publicClient: false
        clientAuthenticatorType: client-secret
        secret: "$${CLIENT_SECRET_FIND}"
        standardFlowEnabled: false
        implicitFlowEnabled: false
        directAccessGrantsEnabled: false
        serviceAccountsEnabled: false
    # These emails are load-bearing: the restored Docs database identifies users by
    # `sub` first and falls back to email, so an email that does not match here orphans
    # that user's documents. Taken from `select email from impress_user`.
    # `realmRoles` is NOT optional here. A realm import takes the user representation
    # literally: no `realmRoles` key means no roles at all, not "the realm defaults".
    # Only users created through registration or the admin API get `default-roles-<realm>`
    # applied for them. Without it a user's access token carries no `aud: account` and an
    # empty `resource_access`, so every Account Console REST call 401s and the console
    # renders "Something went wrong". Docs still logs in, because it reads the ID token and
    # never looks at roles — which is exactly why this stayed invisible.
    users:
      - username: l.f.haaijer
        email: l.f.haaijer@student.utwente.nl
        firstName: Luc
        lastName: Haaijer
        emailVerified: true
        enabled: true
        realmRoles: [default-roles-office]
        credentials: [{type: password, value: "$${PW_LFHAAIJER}", temporary: false}]
      - username: k.e.roelofs
        email: k.e.roelofs@student.utwente.nl
        firstName: Karsten
        lastName: Roelofs
        emailVerified: true
        enabled: true
        realmRoles: [default-roles-office]
        credentials: [{type: password, value: "$${PW_KEROELOFS}", temporary: false}]
      - username: o.adams
        email: o.adams@student.utwente.nl
        firstName: Olaf
        lastName: Adams
        emailVerified: true
        enabled: true
        realmRoles: [default-roles-office]
        credentials: [{type: password, value: "$${PW_OADAMS}", temporary: false}]
      - username: r.i.rupert
        email: r.i.rupert@student.utwente.nl
        firstName: Ruud
        lastName: Rupert
        emailVerified: true
        enabled: true
        realmRoles: [default-roles-office]
        credentials: [{type: password, value: "$${PW_RIRUPERT}", temporary: false}]
      - username: s.molinagarcia
        email: s.molinagarcia@student.utwente.nl
        firstName: Sergio
        lastName: Molina Garcia
        emailVerified: true
        enabled: true
        realmRoles: [default-roles-office]
        credentials: [{type: password, value: "$${PW_SMOLINAGARCIA}", temporary: false}]
