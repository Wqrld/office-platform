# PHASE 1 — delete in the next release (platform/kustomization.yaml). The realm is
# charts/platform-tenants/files/realm.yaml now; this stub carries no settings. The
# operator's import is create-only and skips an existing realm, so nothing live changes.
apiVersion: k8s.keycloak.org/v2beta1
kind: KeycloakRealmImport
metadata:
  name: office
  namespace: office-identity
spec:
  keycloakCRName: keycloak
  realm:
    realm: office
    enabled: true
