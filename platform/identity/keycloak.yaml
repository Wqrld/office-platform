apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: keycloak-bootstrap-admin, namespace: office-identity}
spec:
  refreshInterval: "0"
  target:
    name: keycloak-bootstrap-admin
    creationPolicy: Owner
    template:
      data:
        username: admin
        password: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef: {apiVersion: generators.external-secrets.io/v1alpha1, kind: ClusterGenerator, name: office-password}
---
# The `docs` OIDC client secret. Generated here, in Keycloak's namespace, and read by
# BOTH sides: the realm import substitutes it into the client definition, and Docs reads
# it back through the `office-identity` ClusterSecretStore. Neither side holds the value
# in git — 07-identity-and-secrets.md, "One name, two consumers".
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: oidc-client-docs, namespace: office-identity}
spec:
  refreshInterval: "0"
  target:
    name: oidc-client-docs
    creationPolicy: Owner
    template:
      data:
        secret: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef: {apiVersion: generators.external-secrets.io/v1alpha1, kind: ClusterGenerator, name: office-password}
---
# The `drive` OIDC client secret. Same shape, same reasoning as `docs` above: one value,
# written into Keycloak by the realm import and read back by the application, never in git.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: oidc-client-drive, namespace: office-identity}
spec:
  refreshInterval: "0"
  target:
    name: oidc-client-drive
    creationPolicy: Owner
    template:
      data:
        secret: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef: {apiVersion: generators.external-secrets.io/v1alpha1, kind: ClusterGenerator, name: office-password}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: keycloak-db, namespace: office-identity}
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: office-data}
  target:
    name: keycloak-db
    creationPolicy: Owner
  data:
    - {secretKey: username, remoteRef: {key: keycloak-db, property: username}}
    - {secretKey: password, remoteRef: {key: keycloak-db, property: password}}
---
apiVersion: k8s.keycloak.org/v2beta1
kind: Keycloak
metadata:
  name: keycloak
  namespace: office-identity
spec:
  instances: 1
  db:
    vendor: postgres
    host: office-pg-rw.office-data.svc.cluster.local
    port: 5432
    database: keycloak
    usernameSecret: {name: keycloak-db, key: username}
    passwordSecret: {name: keycloak-db, key: password}
  hostname:
    # The browser-facing origin. Backend services do NOT use this — see backchannelDynamic.
    hostname: "https://id.${BASE_DOMAIN}"
    # THE setting that makes in-cluster OIDC work. With it, Keycloak accepts requests on
    # the internal Service URL and answers with URLs derived from the request, while
    # still advertising the external host to browsers. Without it, an app doing its token
    # exchange against http://keycloak-service:8080 gets rejected, and the failure looks
    # exactly like a wrong client secret. (08-app-inventory.md, "Upstream gotchas")
    backchannelDynamic: true
  http:
    # TLS terminates at the shared Gateway; the hop from Envoy to Keycloak is in-cluster.
    # Do not also set KC_HTTP_ENABLED in additionalOptions — Kubernetes 1.34 rejects a pod
    # spec with a duplicate env var name, and that is exactly how it would be emitted.
    httpEnabled: true
  proxy:
    headers: xforwarded
  ingress:
    # Routing is ours: an HTTPRoute on the shared Gateway, below.
    enabled: false
  bootstrapAdmin:
    # Only consulted the first time a Keycloak is created against an empty database. On
    # THIS cluster the CR landed before this stanza did, so the live admin credential is
    # the operator-generated `keycloak-initial-admin` Secret, not this one.
    user: {secret: keycloak-bootstrap-admin}
  networkPolicy:
    # This cluster's CNI enforces nothing (adr/0103). An operator-managed policy here
    # would imply isolation that does not exist.
    enabled: false
  scheduling:
    priorityClassName: office-critical
  resources:
    requests: {cpu: 200m, memory: 768Mi}
    limits: {memory: 1500Mi}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak
  namespace: office-identity
spec:
  parentRefs:
    - {name: office, namespace: office-system, sectionName: https}
  hostnames: ["id.${BASE_DOMAIN}"]
  rules:
    - backendRefs:
        - {name: keycloak-service, port: 8080}
