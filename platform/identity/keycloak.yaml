apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: keycloak-bootstrap-admin, namespace: office-identity}
spec:
  refreshInterval: "0"
  target:
    name: keycloak-bootstrap-admin
    creationPolicy: Owner
    template:
      data:
        username: admin
        password: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef: {apiVersion: generators.external-secrets.io/v1alpha1, kind: ClusterGenerator, name: office-password}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: keycloak-db, namespace: office-identity}
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: office-data}
  target:
    name: keycloak-db
    creationPolicy: Owner
  data:
    - {secretKey: username, remoteRef: {key: keycloak-db, property: username}}
    - {secretKey: password, remoteRef: {key: keycloak-db, property: password}}
---
apiVersion: k8s.keycloak.org/v2beta1
kind: Keycloak
metadata:
  name: keycloak
  namespace: office-identity
spec:
  instances: 1
  db:
    vendor: postgres
    host: office-pg-rw.office-data.svc.cluster.local
    port: 5432
    database: keycloak
    usernameSecret: {name: keycloak-db, key: username}
    passwordSecret: {name: keycloak-db, key: password}
  hostname:
    # The browser-facing origin.
    hostname: "https://id.${BASE_DOMAIN}"
    # THE setting that makes in-cluster OIDC work: requests on the internal Service get
    # URLs derived from the request, browsers still the external host. Without it a token
    # exchange against keycloak-service:8080 fails exactly like a wrong client secret.
    backchannelDynamic: true
  http:
    # TLS ends at the Gateway. Not also KC_HTTP_ENABLED in additionalOptions: Kubernetes
    # 1.34 rejects the duplicate env var it would emit.
    httpEnabled: true
  proxy:
    headers: xforwarded
  ingress:
    enabled: false
  bootstrapAdmin:
    # Read only when Keycloak first meets an empty database; the realm Job logs in with it.
    user: {secret: keycloak-bootstrap-admin}
  networkPolicy:
    # Enforced by nothing here (adr/0103), so it would imply isolation that does not exist.
    enabled: false
  scheduling:
    priorityClassName: office-critical
  resources:
    requests: {cpu: 200m, memory: 768Mi}
    limits: {memory: 1500Mi}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak
  namespace: office-identity
spec:
  parentRefs:
    - {name: office, namespace: office-system, sectionName: https}
  hostnames: ["id.${BASE_DOMAIN}"]
  rules:
    - backendRefs:
        - {name: keycloak-service, port: 8080}
