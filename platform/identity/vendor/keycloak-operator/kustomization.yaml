# Keycloak's operator ships as Kustomize manifests, not a chart, pinned 1:1 to the server
# version it runs. The five files beside this one are byte-identical copies of
#   https://github.com/keycloak/keycloak-k8s-resources/tree/26.8.0/kubernetes
# Never hand-edit them: `update.sh` re-downloads all five and rewrites the tag above;
# every change of ours is made here. The operator watches only its own namespace, so it
# lives beside the Keycloak CR.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: office-identity

resources:
  - keycloakoidcclients.k8s.keycloak.org-v1.yml
  - keycloakrealmimports.k8s.keycloak.org-v1.yml
  - keycloaks.k8s.keycloak.org-v1.yml
  - keycloaksamlclients.k8s.keycloak.org-v1.yml
  - kubernetes.yml

# setRoleBindingSubjects moves the ServiceAccount subjects too; without it the operator
# silently runs with no permissions.
transformers:
  - |-
    apiVersion: builtin
    kind: NamespaceTransformer
    metadata:
      name: office-identity
    setRoleBindingSubjects: allServiceAccounts
    fieldSpecs:
      - path: metadata/namespace
        create: true

# ...except the ClusterRoleBinding's hardcoded `keycloak`, which it will not overwrite.
patches:
  - target: {kind: ClusterRoleBinding, name: keycloak-operator-clusterrole-binding}
    patch: |-
      - op: replace
        path: /subjects/0/namespace
        value: office-identity

  # Upstream sets no securityContext; the image already runs as uid 1000, so this enforces
  # what is true. The JVM writes only /tmp.
  - target: {kind: Deployment, name: keycloak-operator}
    patch: |-
      - op: add
        path: /spec/template/spec/securityContext
        value: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      - op: add
        path: /spec/template/spec/containers/0/securityContext
        value: {allowPrivilegeEscalation: false, capabilities: {drop: ["ALL"]}, readOnlyRootFilesystem: true}
      - op: add
        path: /spec/template/spec/volumes
        value: [{name: tmp, emptyDir: {}}]
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts
        value: [{name: tmp, mountPath: /tmp}]
