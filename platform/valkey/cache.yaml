# The Django cache: evicting, no persistence, harmless to lose. Why two instances: README.md.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata: {name: valkey-cache, namespace: office-data}
spec:
  interval: 30m
  chart:
    spec:
      chart: valkey
      version: "0.12.0"
      sourceRef: {kind: HelmRepository, name: valkey, namespace: flux-system}
  # `auth.aclUsers`, one per app, from the tenants release (README.md, Adding an application).
  valuesFrom:
    - {kind: ConfigMap, name: valkey-cache-acl-values}
  install: {disableWaitForJobs: true}
  upgrade: {disableWaitForJobs: true}
  # A hand-scaled or hand-edited datastore is put back, and Flux says so (adr/0119).
  driftDetection: {mode: enabled}
  values:
    fullnameOverride: valkey-cache
    priorityClassName: office-data
    valkeyConfig: |
      maxmemory 256mb
      maxmemory-policy allkeys-lru
      save ""
    dataStorage: {enabled: false}
    auth:
      enabled: true
      usersExistingSecret: valkey-cache-acl
