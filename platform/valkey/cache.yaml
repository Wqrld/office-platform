# Two instances, not one. Eviction policy and persistence are per-instance settings; a
# logical DB number does not separate them. An evicting broker silently drops queued
# Celery tasks, which presents as "some uploads never get processed" (06-datastores.md).
#
# This one is the Django cache: evicting, no persistence, losing it is harmless.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata: {name: valkey-cache, namespace: office-data}
spec:
  interval: 30m
  chart:
    spec:
      chart: valkey
      version: "0.12.0"
      sourceRef: {kind: HelmRepository, name: valkey, namespace: flux-system}
  install: {disableWaitForJobs: true}
  upgrade: {disableWaitForJobs: true}
  values:
    fullnameOverride: valkey-cache
    priorityClassName: office-data
    valkeyConfig: |
      maxmemory 256mb
      maxmemory-policy allkeys-lru
      save ""
    dataStorage: {enabled: false}
    auth:
      enabled: true
      usersExistingSecret: valkey-cache-users
      aclUsers:
        # No ambient access: with no NetworkPolicy enforcement on this cluster
        # (adr/0103), these ACLs are the only isolation between applications.
        default:   {permissions: "off -@all"}
        docs:      {permissions: "~* &* +@all -@dangerous +flushdb"}
        drive:     {permissions: "~* &* +@all -@dangerous +flushdb"}
