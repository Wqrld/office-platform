# The Celery broker: never evicts, persists. Queued tasks are real work, not cache.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata: {name: valkey-broker, namespace: office-data}
spec:
  interval: 30m
  chart:
    spec:
      chart: valkey
      version: "0.12.0"
      sourceRef: {kind: HelmRepository, name: valkey, namespace: flux-system}
  install: {disableWaitForJobs: true}
  upgrade: {disableWaitForJobs: true}
  values:
    fullnameOverride: valkey-broker
    priorityClassName: office-data
    valkeyConfig: |
      maxmemory-policy noeviction
      appendonly yes
    dataStorage:
      enabled: true
      requestedSize: 5Gi
      className: ${STORAGE_CLASS}
    auth:
      enabled: true
      usersExistingSecret: valkey-broker-acl
      aclUsers:
        default:   {permissions: "off -@all"}
        docs:      {permissions: "~* &* +@all -@dangerous"}
        drive:     {permissions: "~* &* +@all -@dangerous"}
        # `+keys` on top of the shared shape, and ONLY here. Dramatiq's dispatch is a Lua
        # script that calls KEYS, which lives in @dangerous — so the worker fails with
        # `ACL failure in script: User calendars has no permissions to run the 'keys'
        # command` and retries forever, three seconds at a time. Celery never calls KEYS,
        # which is why Docs and Drive have never needed this.
        #
        # It grants no reach these users do not already have: every pattern here is `~*`.
        # It does make the case for narrowing those patterns sharper, since KEYS turns
        # "can read any key" into "can enumerate every key" — see README.md.
        calendars: {permissions: "~* &* +@all -@dangerous +keys"}
        # Meet's summary service (Celery) — the transcript queue.
        meet:      {permissions: "~* &* +@all -@dangerous"}
        # LiveKit: room state, node registry and the egress request queue. Its Redis client
        # also SUBSCRIBEs, which `&*` covers.
        livekit:   {permissions: "~* &* +@all -@dangerous"}
