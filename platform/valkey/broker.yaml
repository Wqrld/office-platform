# The Celery broker: never evicts, persists (README.md).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata: {name: valkey-broker, namespace: office-data}
spec:
  interval: 30m
  chart:
    spec:
      chart: valkey
      version: "1.0.0"
      sourceRef: {kind: HelmRepository, name: valkey, namespace: flux-system}
  # `auth.aclUsers`, as on the cache (cache.yaml).
  valuesFrom:
    - {kind: ConfigMap, name: valkey-broker-acl-values}
  install: {disableWaitForJobs: true}
  upgrade: {disableWaitForJobs: true}
  # A hand-scaled or hand-edited datastore is put back, and Flux says so (adr/0119).
  driftDetection: {mode: enabled}
  values:
    fullnameOverride: valkey-broker
    priorityClassName: office-data
    extraConfig: |
      maxmemory-policy noeviction
      appendonly yes
    persistence:
      enabled: true
      size: 5Gi
      storageClass: ${STORAGE_CLASS}
    # The chart's probes log in as `default`, which `valkeyAcl` turns off (platform-tenants): check the port.
    startupProbe: {enabled: true, customProbe: {tcpSocket: {port: 6379}, periodSeconds: 5, failureThreshold: 30}}
    livenessProbe: {enabled: true, customProbe: {tcpSocket: {port: 6379}, periodSeconds: 10}}
    readinessProbe: {enabled: true, customProbe: {tcpSocket: {port: 6379}, periodSeconds: 5}}
    auth:
      enabled: true
      usersExistingSecret: valkey-broker-acl
