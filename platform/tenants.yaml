# Everything the platform provisions per application, from every app's entry in
# charts/control-plane/apps.yaml, enabled or not (adr/0107), plus the Valkey ACL users.
# `apps` is block style: a flow map cannot hold a plain `${}`, and substituted into a block
# the one-line JSON is read back as a map.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata: {name: tenants, namespace: office-data}
spec:
  interval: 30m
  chartRef: {kind: HelmChart, name: platform-tenants, namespace: flux-system}
  # The reconcile Jobs wait on Keycloak and OpenSearch, which wait on this release's
  # Secrets: waiting on the Jobs would be a cycle. They retry on their own.
  install:
    disableWaitForJobs: true
    remediation: {retries: 3}
  upgrade:
    disableWaitForJobs: true
    remediation: {retries: 3}
  values:
    domain: ${BASE_DOMAIN}
    objectStore: ${S3_MODE}
    apps: ${TENANTS_JSON}
