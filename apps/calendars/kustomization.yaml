apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../namespace.yaml
  - ../services.yaml
  - deps.yaml
  - release.yaml
  - surround.yaml

configMapGenerator:
  # The size files, one ConfigMap key each; each HelmRelease picks its key with `${SIZE}`.
  - name: calendars-sizes
    namespace: office-calendars
    files:
      - small=sizes/small.yaml
      - medium=sizes/medium.yaml
      - large=sizes/large.yaml
      - platform-small=sizes/platform-small.yaml
      - platform-medium=sizes/platform-medium.yaml
      - platform-large=sizes/platform-large.yaml
    options:
      disableNameSuffixHash: true
      labels: {reconcile.fluxcd.io/watch: Enabled}   # a size change upgrades now, not in 30m

  # The switcher panel `LaGaufreV2` loads by URL (release.yaml's FRONTEND_LAGAUFRE_*),
  # shared with every app; the service list beside it is `../services.yaml`.
  - name: calendars-gaufre
    namespace: office-calendars
    files: [../gaufre.js]
    options:
      disableNameSuffixHash: true
