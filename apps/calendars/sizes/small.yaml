# Calendars at `small`. One worker process is right at this size.
# Four workloads, and the worker is the one that matters: `WORKER_CONCURRENCY` is a sizing
# decision, not a tuning knob — worker.py's argparse default is 4 processes, each a full
# Django. The three install Jobs inherit `backend.resources` and run alongside the
# workloads, so the install PEAK is these numbers plus another backend's worth.
backend:
  replicas: 1
  resources:
    requests: {cpu: 50m, memory: 384Mi}
    limits: {memory: 1Gi}
  envVars:
    WORKER_CONCURRENCY: "1"
  worker:
    replicas: 1
    resources:
      requests: {cpu: 25m, memory: 256Mi}
      limits: {memory: 768Mi}
frontend:
  replicas: 1
  resources:
    requests: {cpu: 10m, memory: 64Mi}
    limits: {memory: 128Mi}
caldav:
  replicas: 1
  resources:
    requests: {cpu: 25m, memory: 128Mi}
    limits: {memory: 384Mi}
