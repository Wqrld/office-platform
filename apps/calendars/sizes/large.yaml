# Calendars at `large`. Not validated against a running cluster: a shape to measure from.
# Budgets for what scales out are in platform-large.yaml.
backend:
  replicas: 3
  resources:
    requests: {cpu: 500m, memory: 1Gi}
    limits: {memory: 3Gi}
  envVars:
    WORKER_CONCURRENCY: "4"
  worker:
    replicas: 2
    resources:
      requests: {cpu: 250m, memory: 768Mi}
      limits: {memory: 2Gi}
frontend:
  replicas: 3
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {memory: 384Mi}
# caldav stays at ONE, and not because it is stateful — every byte it owns is in
# Postgres. It stays at one because nothing here has ever run two of them, and a second
# SabreDAV is only reached through Django's proxy anyway, so the capacity it would add is
# capacity the backend has to feed it first. Raise it with the backend, after measuring,
# and add its PDB in platform-large.yaml in the same edit.
caldav:
  replicas: 1
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 1Gi}
