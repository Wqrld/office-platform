# Calendars. The same arrangement as Projects: the chart is src/helm/calendars in the fork,
# not in any upstream tag yet (the upstreaming PR is not open yet), and the fork's tag also
# publishes the images. Those have to be the fork's: no upstream release has the
# `/__heartbeat__/` endpoint behind this chart's probes, and the fork's tags also carry
# the CI fix that makes them run non-root. When the PR lands, only the url changes.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata: {name: wqrld-calendars, namespace: flux-system}
spec:
  interval: 24h
  url: https://github.com/Wqrld/calendars
  ref: {tag: v0.2.2}
  ignore: |
    /*
    !/src/helm
