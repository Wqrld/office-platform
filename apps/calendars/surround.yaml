# Calendars — release 3 of 3: the surround. No media proxy: nothing declares a file field,
# so `/media` is empty.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata: {name: calendars-platform, namespace: office-calendars}
spec:
  interval: 30m
  dependsOn: [{name: calendars}]
  chartRef: {kind: HelmChart, name: platform-app, namespace: flux-system}
  valuesFrom: [{kind: ConfigMap, name: calendars-sizes, valuesKey: "platform-${SIZE}"}]
  values:
    app: calendars
    baseDomain: ${BASE_DOMAIN}

    routes:
      - backend: {name: calendars-frontend, port: 80}
        paths: [/]

      - name: api
        backend: {name: calendars-backend, port: 80}
        # `/caldav` goes to the BACKEND, never to calendars-caldav, and `/.well-known/caldav`
        # is served at the URL root, not under /api (README.md, CalDAV is never routed from
        # outside).
        paths: [/api, /external_api, /rsvp, /ical, /caldav, /.well-known/caldav, /admin, /static]
        # A first sync of a large calendar is one slow request, not a hung one. Nothing
        # uploads, so no requestBuffer.
        timeout: 300s

    staticFiles: {enabled: true}

    # `external: 443` is OIDC discovery and outbound channel sync.
    networkPolicy:
      egress:
        - {datastore: postgres}
        - {datastore: cache}
        - {identity: true}
        - {external: true, port: 443}
