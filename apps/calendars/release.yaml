# Calendars — release 2 of 3: the application, from the in-tree chart (`src/helm/calendars`)
# at the fork's git tag until the upstreaming PR lands (adr/0104). README.md for pins.
# CALDAV IS NEVER ROUTED FROM OUTSIDE: only Django's proxy reaches it (README.md).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: calendars
  namespace: office-calendars
spec:
  interval: 30m
  dependsOn: [{name: calendars-deps}]
  chart:
    spec:
      chart: src/helm/calendars
      sourceRef: {kind: GitRepository, name: wqrld-calendars, namespace: flux-system}
  # apps/README.md, Conventions. These Jobs are also hooks, which Helm waits on itself.
  install:
    disableWaitForJobs: true
  upgrade:
    disableWaitForJobs: true
    remediation:
      retries: 0
  # Lets www-data bind :80 (caldav.securityContext): the chart has no pod securityContext
  # for caldav, and this sysctl is one PSA allows.
  postRenderers:
    - kustomize:
        patches:
          - target: {kind: Deployment, name: calendars-caldav}
            patch: |
              - op: add
                path: /spec/template/spec/securityContext
                value: {sysctls: [{name: net.ipv4.ip_unprivileged_port_start, value: "80"}]}
  valuesFrom: [{kind: ConfigMap, name: calendars-sizes, valuesKey: "${SIZE}"}]
  values:
    # All three images are the fork's: upstream's lack the probes' endpoints and a non-root
    # user (README.md, Pins).
    image:
      repository: ghcr.io/wqrld/calendars-backend
      tag: "0.1.1"

    ingress: {enabled: false}
    ingressAdmin: {enabled: false}

    backend:
      pdb: {enabled: false}

      # 1001, as Docs' images, so an upstream root image starts too (README.md, Pins). The
      # frontend merges it.
      securityContext: &uid1001 {runAsUser: 1001, readOnlyRootFilesystem: true}
      persistence: {tmp: {type: emptyDir, mountPath: /tmp}}

      # Shared with the worker and both backend Jobs: they need the database and CalDAV keys.
      envFrom:
        - {secretRef: {name: calendars-postgres}}
        - {secretRef: {name: calendars-cache}}
        - {secretRef: {name: calendars-oidc}}
        - {secretRef: {name: calendars-django}}
        - {secretRef: {name: calendars-caldav}}
        # Here, not in `backend.django`: the worker sends the mail and reads only this block.
        - {secretRef: {name: calendars-smtp}}

      # DJANGO_CONFIGURATION must stay in this shared block, or the worker silently runs
      # Development (README.md, Known gaps).
      envVars:
        DJANGO_SETTINGS_MODULE: calendars.settings
        DJANGO_CONFIGURATION: Production
        DJANGO_ALLOWED_HOSTS: calendars.${BASE_DOMAIN}
        DJANGO_CSRF_TRUSTED_ORIGINS: https://calendars.${BASE_DOMAIN}
        DJANGO_LANGUAGE_CODE: nl-nl
        DJANGO_SUPERUSER_EMAIL: admin@${BASE_DOMAIN}
        LOGGING_LEVEL_LOGGERS_APP: INFO
        LOGGING_LEVEL_LOGGERS_ROOT: INFO

        APP_NAME: Calendars
        APP_URL: https://calendars.${BASE_DOMAIN}
        MEDIA_BASE_URL: https://calendars.${BASE_DOMAIN}
        LOGIN_REDIRECT_URL: https://calendars.${BASE_DOMAIN}
        LOGIN_REDIRECT_URL_FAILURE: https://calendars.${BASE_DOMAIN}
        LOGOUT_REDIRECT_URL: https://calendars.${BASE_DOMAIN}

        # The app's second from-address, read from the relay's rather than written twice.
        CALENDAR_INVITATION_FROM_EMAIL:
          {secretKeyRef: {name: calendars-smtp, key: DEFAULT_FROM_EMAIL}}

        # backend -> caldav; CALDAV_CALLBACK_BASE_URL below is the way back. Both in-cluster.
        CALDAV_URL: http://calendars-caldav:80

      # Stable Job names, so hooks (apps/README.md, Conventions). Reaches createsuperuser too.
      migrateJobAnnotations:
        helm.sh/hook: pre-install,pre-upgrade
        helm.sh/hook-delete-policy: before-hook-creation

      # The SPA's runtime config (`/api/v1.0/config/`); reaches the backend Deployment only.
      django:
        envVars:
          # THE GAUFRE: our two files, not the French government's (apps/README.md, The switcher).
          FRONTEND_LAGAUFRE_ENABLED: "true"
          FRONTEND_LAGAUFRE_WIDGET_PATH: https://calendars.${BASE_DOMAIN}/custom/gaufre.js
          FRONTEND_LAGAUFRE_WIDGET_API_URL: https://calendars.${BASE_DOMAIN}/custom/services.json
          # No silent login: the app has no such setting (README.md, Known gaps).

      # Upstream's command cannot work (README.md, chart change 5). `migrate` first: Helm
      # orders same-weight hooks by name, so this Job runs before `…-migrate` on a fresh
      # install. The org is made here because this account never logs in through OIDC.
      createsuperuser:
        command:
          - /bin/sh
          - -c
          - |
            python manage.py migrate --no-input
            python manage.py shell <<'PY'
            import os
            from django.contrib.auth import get_user_model
            from core.models import Organization

            User = get_user_model()
            email = os.environ["DJANGO_SUPERUSER_EMAIL"]
            org, _ = Organization.objects.get_or_create(
                external_id=email.split("@")[-1],
                defaults={"name": email.split("@")[-1]},
            )

            user = User.objects.filter(admin_email=email).first() or User(
                admin_email=email, email=email, language="nl-nl"
            )
            user.organization = org
            user.is_active = True
            user.is_staff = True
            user.is_superuser = True
            user.set_password(os.environ["DJANGO_SUPERUSER_PASSWORD"])
            user.save()
            print("superuser ready:", email, "in org", org.external_id)
            PY

      # The worker is sized in sizes/; its shutdown timeout is a known gap (README.md).

    frontend:
      image:
        repository: ghcr.io/wqrld/calendars-frontend
        tag: "0.1.1"
      pdb: {enabled: false}
      # NET_BIND_SERVICE only so the image's file-capability caddy can exec at all; it listens
      # on :8080. Remove when the image drops it (README.md, Gotchas). Caddy writes its XDG
      # dirs even with admin and auto_https off, hence the two emptyDirs.
      securityContext:
        <<: *uid1001
        capabilities:
          add: [NET_BIND_SERVICE]
      persistence:
        config: {type: emptyDir, mountPath: /config/caddy}
        data: {type: emptyDir, mountPath: /data/caddy}
      # No envVars: the SPA was built with an empty API origin, so it uses the page's own.

    caldav:
      image:
        repository: ghcr.io/wqrld/calendars-caldav
        tag: "0.1.1"
      pdb: {enabled: false}

      # www-data, not the chart's root: the postRenderers sysctl lets it bind :80. Also the
      # initdb Job's.
      securityContext:
        runAsNonRoot: true
        runAsUser: 33
        runAsGroup: 33
        capabilities: {drop: ["ALL"], add: []}
        readOnlyRootFilesystem: true
      # Apache's pid and lock dirs (/var/run and /var/lock link into /run) and PHP's temp.
      extraVolumes:
        - {name: apache-run, emptyDir: {}}
        - {name: apache-lock, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
      extraVolumeMounts:
        - {name: apache-run, mountPath: /run/apache2}
        - {name: apache-lock, mountPath: /run/lock/apache2}
        - {name: tmp, mountPath: /tmp}

      # The three shared API keys, read here by SabreDAV and above by Django.
      envFrom:
        - {secretRef: {name: calendars-caldav}}

      envVars:
        # SabreDAV reads libpq's PG* names: the same Secret re-keyed, rather than a profile
        # for one consumer.
        PGHOST:     {secretKeyRef: {name: calendars-postgres, key: DB_HOST}}
        PGPORT:     {secretKeyRef: {name: calendars-postgres, key: DB_PORT}}
        PGDATABASE: {secretKeyRef: {name: calendars-postgres, key: DB_NAME}}
        PGUSER:     {secretKeyRef: {name: calendars-postgres, key: DB_USER}}
        PGPASSWORD: {secretKeyRef: {name: calendars-postgres, key: DB_PASSWORD}}

        # Django keeps `public`; the initdb Job creates `sabre`.
        CALDAV_DB_SCHEMA: sabre
        # Must equal what Django's proxy strips, or PROPFIND works and calendars are unreachable.
        CALDAV_BASE_URI: /caldav/
        CALDAV_CALLBACK_BASE_URL: http://calendars-backend:80

      initdbJobAnnotations:
        helm.sh/hook: pre-install,pre-upgrade
        helm.sh/hook-delete-policy: before-hook-creation
