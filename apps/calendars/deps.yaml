# Calendars — release 1 of 3: what it needs before it starts. Conventions: apps/README.md.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata: {name: calendars-deps, namespace: office-calendars}
spec:
  interval: 30m
  chartRef: {kind: HelmChart, name: platform-deps, namespace: flux-system}
  values:
    app: calendars
    env: calendars
    baseDomain: ${BASE_DOMAIN}

    # One database, two schemas (release.yaml); SabreDAV reads it under PG* names.
    postgres: {enabled: true}

    # THREE URLs, hence the app's own profile: Dramatiq's result backend URL carries the
    # password, so it cannot be assembled with `valueFrom` in release.yaml.
    #
    # `results` is on the CACHE, not the broker. Results are held for 30 days: on the
    # `noeviction` broker a full result set stops the queue, on the `allkeys-lru` cache a
    # lost result is a `/tasks/<id>/` poll that returns nothing. Same instance as `cache`,
    # so the same ACL user; its own `db` keeps payloads out of the session keys.
    cache:
      enabled: true
      uses: [cache, broker, results]
      instances:
        results:
          host: valkey-cache.office-data.svc.cluster.local
          port: 6379
          db: 2
          credentialSecret: valkey-cache-acl

    oidc: {enabled: true}

    # Bare EMAIL_*, not DJANGO_EMAIL_*: the settings pass `environ_prefix=None` on every mail
    # value, and the from-address is Django's stock DEFAULT_FROM_EMAIL.
    smtp: {enabled: true}

    # Ordered, and can never gain an entry (apps/README.md, Conventions).
    generated:
      calendars-django:
        - {env: DJANGO_SECRET_KEY, draw: secretkey, generator: office-token-50}
        - {env: DJANGO_SUPERUSER_PASSWORD, draw: superuser}
        # Derives the Fernet keys for stored channel tokens; upstream's default is the
        # literal `calendars-default-salt-change-in-production`. Rotating it makes every
        # stored token undecryptable, so generate-once is exactly right.
        - {env: SALT_KEY, draw: salt}
      # Read by BOTH Django and SabreDAV, so both pods envFrom this one Secret.
      calendars-caldav:
        - {env: CALDAV_INBOUND_API_KEY,  draw: inbound}
        - {env: CALDAV_OUTBOUND_API_KEY, draw: outbound}
        - {env: CALDAV_INTERNAL_API_KEY, draw: internal}
