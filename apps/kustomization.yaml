# Explicit resource list: dropping a file into this directory must not silently deploy it.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Three releases per app, in this order: prerequisites, the upstream chart, the surround.
  # Secrets must exist before the workload that reads them, so they cannot come from the
  # surround; the surround attaches to workloads, so it cannot come first.
  # Collabora before Drive: Drive's `configure-wopi` Job calls Collabora's discovery
  # endpoint at install, and its HelmRelease dependsOn the Collabora one.
  - collabora/namespace.yaml
  - collabora/deps.yaml
  - collabora/release.yaml
  - collabora/surround.yaml
  - drive/namespace.yaml
  - drive/deps.yaml
  - drive/release.yaml
  - drive/surround.yaml
  # Find before Docs: Docs' search-flags Job and its reindex both assume Find exists.
  - find/namespace.yaml
  - find/deps.yaml
  - find/token.yaml
  - find/release.yaml
  - find/surround.yaml
  - docs/namespace.yaml
  - docs/deps.yaml
  - docs/search-token.yaml
  - docs/meet-token.yaml
  - docs/oidc-refresh-key.yaml
  - docs/release.yaml
  - docs/media-proxy.yaml
  - docs/surround.yaml
  # docs/reindex.yaml is applied by hand, not here — see its header.
  # Calendars depends on no other app, so its position here is free. Last, because it is
  # the newest and the ordering above encodes real dependencies that this one does not join.
  - calendars/namespace.yaml
  - calendars/deps.yaml
  - calendars/release.yaml
  - calendars/surround.yaml
  # LiveKit before Meet: Meet's backend hands the browser LiveKit's address and calls its
  # API for every room, and the egress webhook is the transcript pipeline's first hop.
  # Meet after Docs: transcripts are delivered as Docs documents (apps/docs/meet-token.yaml).
  - livekit/namespace.yaml
  - livekit/secrets.yaml
  - livekit/release.yaml
  - livekit/surround.yaml
  - meet/namespace.yaml
  - meet/deps.yaml
  - meet/tokens.yaml
  - meet/whisperx.yaml
  - meet/release.yaml
  - meet/surround.yaml

# The app switchers' files stay real .js/.json files rather than block scalars inside a
# HelmRelease, so they can be read, linted and edited as what they are. Each surround points
# at the ConfigMap by name (`staticFiles.filesConfigMap`).
configMapGenerator:
  - name: drive-switcher
    namespace: office-drive
    files: [switcher.js]
    options:
      disableNameSuffixHash: true
      annotations:
        # The file is full of $variables that postBuild substitution would blank.
        kustomize.toolkit.fluxcd.io/substitute: disabled

  # Meet: the same switcher.js, plus the nginx config that injects it — mounted over the
  # frontend image's own default.conf (apps/meet/release.yaml). Same `substitute:
  # disabled`, for the same reason; default.conf has nginx `$uri` variables of its own.
  - name: meet-frontend
    namespace: office-meet
    files: [switcher.js, meet/default.conf]
    options:
      disableNameSuffixHash: true
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled

  # Meet: two one-file Python patches, each imported at interpreter start by the process
  # it is mounted into as `sitecustomize.py` (the files say why). Nothing to substitute.
  - name: meet-patches
    namespace: office-meet
    files: [meet/summary-sitecustomize.py, meet/whisperx-sitecustomize.py]
    options:
      disableNameSuffixHash: true

  # Calendars' switcher is a REPLACEMENT for the widget script and the service list the
  # gaufre would otherwise load from static.suite.anct.gouv.fr and lasuite.numerique.gouv.fr;
  # both URLs are runtime settings there (apps/calendars/release.yaml), so nothing has to be
  # hidden the way it is for Drive. No `substitute: disabled` here, deliberately:
  # services.json needs ${BASE_DOMAIN} resolved, and gaufre.js is written with no dollar
  # sign in it so that substituting over the same ConfigMap cannot touch it.
  - name: calendars-gaufre
    namespace: office-calendars
    files: [calendars/gaufre.js, calendars/services.json]
    options:
      disableNameSuffixHash: true
