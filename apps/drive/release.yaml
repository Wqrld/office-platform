# Release 2 of 3: Drive, from DINUM's in-tree chart at git tag v0.21.2 (adr/0104).
#
# The chart has no `envFrom`, so drive-deps' Secrets are attached by the post-renderer at
# the bottom of this file. README.md has the reasoning; ./check-secrets.sh asserts it.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: drive
  namespace: office-drive
spec:
  interval: 30m
  dependsOn:
    - {name: drive-deps}
    # The `configure-wopi` Job calls Collabora's /hosting/discovery at install.
    - {name: collabora, namespace: office-collabora}
  chart:
    spec:
      chart: src/helm/drive
      sourceRef: {kind: GitRepository, name: suitenumerique-drive, namespace: flux-system}
      reconcileStrategy: Revision
  install:
    # The Jobs carry ttlSecondsAfterFinished, so waiting on them races garbage collection.
    disableWaitForJobs: true
  upgrade:
    disableWaitForJobs: true
    remediation:
      # A Helm rollback reverts the code and leaves the database schema migrated. Fail
      # forward, loudly, rather than silently running old code against a new schema.
      retries: 0
  values:
    image:
      # The chart declares appVersion: latest, which is useless as a pin.
      tag: v0.21.2

    # Routing is ours — surround.yaml. Already false at this tag; stated anyway so a
    # default flip upstream cannot quietly publish a second path to the application.
    ingress: {enabled: false}
    ingressAdmin: {enabled: false}
    ingressMedia: {enabled: false}
    ingressMediaPreview: {enabled: false}
    posthog:
      ingress: {enabled: false}
      ingressAssets: {enabled: false}

    # Unused — our own media proxy talks to Garage directly — but the chart creates this
    # ExternalName Service unconditionally, so point it somewhere true.
    serviceMedia:
      host: office-s3.office-data.svc.cluster.local
      port: 3900

    backend:
      replicas: 1
      pdb: {enabled: false}          # one replica: a PDB here can only block a drain
      resources:
        requests: {cpu: 100m, memory: 640Mi}
        limits: {memory: 2Gi}

      envVars:
        DJANGO_SETTINGS_MODULE: drive.settings
        DJANGO_CONFIGURATION: Production
        DJANGO_ALLOWED_HOSTS: drive.${BASE_DOMAIN}
        DJANGO_CSRF_TRUSTED_ORIGINS: https://drive.${BASE_DOMAIN}
        DJANGO_CORS_ALLOWED_ORIGINS: https://drive.${BASE_DOMAIN}
        DJANGO_CORS_ALLOW_ALL_ORIGINS: "false"
        DJANGO_SUPERUSER_EMAIL: admin@${BASE_DOMAIN}
        # No SMTP yet. `console` logs the mail instead of failing the request, so an
        # invitation still creates the access — it just does not notify.
        DJANGO_EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend
        DJANGO_EMAIL_BRAND_NAME: Office
        DJANGO_EMAIL_FROM: noreply@${BASE_DOMAIN}
        DJANGO_LANGUAGE_CODE: nl-nl    # prefixed, unlike Docs' bare LANGUAGE_CODE

        MEDIA_BASE_URL: https://drive.${BASE_DOMAIN}
        LOGIN_REDIRECT_URL: https://drive.${BASE_DOMAIN}
        LOGIN_REDIRECT_URL_FAILURE: https://drive.${BASE_DOMAIN}
        LOGOUT_REDIRECT_URL: https://drive.${BASE_DOMAIN}

        AWS_S3_SIGNATURE_VERSION: s3v4
        # AWS_S3_UPLOAD_ACL stays at its default `private`: Garage accepts a signed
        # x-amz-acl on a presigned PUT — measured, 200 with and without.

        # Defaults to TRUE, and there is no search service: the indexing task would fail
        # on every upload.
        FEATURES_INDEXED_SEARCH: "False"
        # Drive's app switcher is not ours to fill: it loads a widget script from
        # static.suite.anct.gouv.fr and reads the French government's service list, both
        # compiled into the frontend bundle (`cunningham-tokens.ts`), with no runtime
        # override. Hidden rather than left pointing at another country's services.
        # Docs' switcher is where this platform's inventory is stated.
        FRONTEND_HIDE_GAUFRE: "true"
        MALWARE_DETECTION_BACKEND: lasuite.malware_detection.backends.dummy.DummyBackend

        # WOPI. Each name in WOPI_CLIENTS is read back as WOPI_<NAME>_DISCOVERY_URL.
        # The fetch is internal; every URL inside the document it returns is Collabora's
        # public one, built from its own `server_name`. README.md has the table.
        WOPI_CLIENTS: collabora
        WOPI_COLLABORA_DISCOVERY_URL: http://collabora-online.office-collabora.svc.cluster.local:9980/hosting/discovery
        WOPI_SRC_BASE_URL: https://drive.${BASE_DOMAIN}   # Collabora calls back from outside
        WOPI_DISABLE_CHAT: "1"          # unmoderated side channel inside the editor
        # Every ten minutes, not nightly. The client configuration lives in the Django
        # cache, which is `allkeys-lru` and does not survive a Valkey restart — and on a
        # miss `get_wopi_configuration()` returns an empty default, so every document
        # reads as "unsupported format" until the next run. Upstream's default of 03:00
        # makes that outage up to a day long. The task is one in-cluster HTTP GET.
        WOPI_CONFIGURATION_CRONTAB_MINUTE: "*/10"
        WOPI_CONFIGURATION_CRONTAB_HOUR: "*"

        LOGGING_LEVEL_LOGGERS_APP: INFO
        LOGGING_LEVEL_LOGGERS_ROOT: INFO
        SPECTACULAR_SETTINGS_ENABLE_DJANGO_DEPLOY_CHECK: "false"
        # No staticfiles override, unlike Docs: `collectstatic` runs at image build with
        # whitenoise's manifest storage, so the default already works.

      # Upstream's command is wrong twice over: it fails once the account exists (and the
      # Job is not a Helm hook, so that is permanent noise), and Drive's USERNAME_FIELD is
      # `admin_email`, which `--email` does not set. Both addresses go to the same value so
      # the admin login and the OIDC identity are one account.
      createsuperuser:
        command:
          - /bin/sh
          - -c
          - |
            python manage.py shell <<'PY'
            import os
            from django.contrib.auth import get_user_model

            User = get_user_model()
            email = os.environ["DJANGO_SUPERUSER_EMAIL"]

            user = User.objects.filter(admin_email=email).first() or User(
                admin_email=email, language="nl-nl"
            )
            user.email = email
            user.is_active = True
            user.is_staff = True
            user.is_superuser = True
            user.set_password(os.environ["DJANGO_SUPERUSER_PASSWORD"])
            user.save()
            print("superuser ready:", email)
            PY

      # One worker. Upstream's dev values split work across `mirror` and
      # `malware_detection` queues, but that only applies if DJANGO_CELERY_TASK_ROUTES
      # sends tasks there, and it is not set.
      #
      # `probes` is not optional: the template dereferences `$worker.probes.liveness` with
      # no nil guard, and overriding this list drops upstream's defaults. Restated below.
      celeryWorkers:
        - name: default
          replicas: 1
          command: []
          args: ["celery", "-A", "drive.celery_app", "worker", "-l", "INFO",
                 "-n", "drive@%h", "--concurrency", "2"]
          resources:
            requests: {cpu: 50m, memory: 384Mi}
            limits: {memory: 1Gi}
          probes:
            liveness:
              exec:
                command: ["/bin/sh", "-c", "celery -A drive.celery_app inspect ping -d drive@$HOSTNAME"]
              initialDelaySeconds: 30
              periodSeconds: 60
              timeoutSeconds: 15
              failureThreshold: 3
            readiness:
              exec:
                command: ["/bin/sh", "-c", "celery -A drive.celery_app inspect ping -d drive@$HOSTNAME"]
              initialDelaySeconds: 20
              periodSeconds: 30
              timeoutSeconds: 15
              failureThreshold: 3

      # Beat re-runs the WOPI configuration on its crontab, so a Collabora upgrade is
      # picked up without a Drive deploy.
      celeryBeat:
        enabled: true
        replicas: 1
        resources:
          requests: {cpu: 25m, memory: 192Mi}
          limits: {memory: 512Mi}

    frontend:
      image: {tag: v0.21.2}
      replicas: 1
      pdb: {enabled: false}
      resources:
        requests: {cpu: 50m, memory: 128Mi}
        limits: {memory: 512Mi}
      envVars:
        PORT: "8080"
        NEXT_PUBLIC_API_ORIGIN: https://drive.${BASE_DOMAIN}

  # The chart has no `envFrom`, so drive-deps' five Secrets are attached after rendering
  # rather than as ~40 `secretKeyRef` entries.
  #
  # THE NAME SELECTOR IS THE SECURITY BOUNDARY. kustomize matches `name` as a FULL-STRING
  # regex: `drive-backend.*` selects ten workloads and NOT `drive-frontend`, which renders
  # for the browser and must never hold the database password or the client secret.
  # `./check-secrets.sh` asserts both after a chart bump.
  postRenderers:
    - kustomize:
        patches:
          - target: {kind: "Deployment|Job", name: "drive-backend.*"}
            patch: |
              - op: add
                path: /spec/template/spec/containers/0/envFrom
                value:
                  - {secretRef: {name: drive-postgres}}
                  - {secretRef: {name: drive-cache}}
                  - {secretRef: {name: drive-s3}}
                  - {secretRef: {name: drive-oidc}}
                  - {secretRef: {name: drive-django}}
          # A CronJob buries the pod spec a level deeper and no target spans both shapes.
          - target: {kind: CronJob, name: "drive-backend.*"}
            patch: |
              - op: add
                path: /spec/jobTemplate/spec/template/spec/containers/0/envFrom
                value:
                  - {secretRef: {name: drive-postgres}}
                  - {secretRef: {name: drive-cache}}
                  - {secretRef: {name: drive-s3}}
                  - {secretRef: {name: drive-oidc}}
                  - {secretRef: {name: drive-django}}
