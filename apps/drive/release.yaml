# Drive — release 2 of 3: the application, from the in-tree chart at the fork's git tag
# (adr/0104): upstream main plus document thumbnails (README.md, The fork). Conventions:
# apps/README.md.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: drive
  namespace: office-drive
spec:
  interval: 30m
  dependsOn:
    - {name: drive-deps}
    # The `configure-wopi` Job calls Collabora's /hosting/discovery at install.
    - {name: collabora, namespace: office-collabora}
  chart:
    spec:
      chart: src/helm/drive
      sourceRef: {kind: GitRepository, name: wqrld-drive, namespace: flux-system}
      reconcileStrategy: Revision
  install:
    disableWaitForJobs: true
  upgrade:
    disableWaitForJobs: true
    remediation:
      retries: 0
  # The chart has no `envFrom`. THE NAME SELECTOR IS THE SECURITY BOUNDARY: `drive-backend.*`
  # selects ten workloads and not `drive-frontend` (apps/README.md, Conventions).
  postRenderers:
    - kustomize:
        patches:
          - target: {kind: "Deployment|Job", name: "drive-backend.*"}
            patch: |
              - op: add
                path: /spec/template/spec/containers/0/envFrom
                value:
                  - {secretRef: {name: drive-postgres}}
                  - {secretRef: {name: drive-cache}}
                  - {secretRef: {name: drive-s3}}
                  - {secretRef: {name: drive-oidc}}
                  - {secretRef: {name: drive-django}}
                  - {secretRef: {name: drive-smtp}}
          - target: {kind: CronJob, name: "drive-backend.*"}
            patch: |
              - op: add
                path: /spec/jobTemplate/spec/template/spec/containers/0/envFrom
                value:
                  - {secretRef: {name: drive-postgres}}
                  - {secretRef: {name: drive-cache}}
                  - {secretRef: {name: drive-s3}}
                  - {secretRef: {name: drive-oidc}}
                  - {secretRef: {name: drive-django}}
                  - {secretRef: {name: drive-smtp}}
  valuesFrom: [{kind: ConfigMap, name: drive-sizes, valuesKey: "${SIZE}"}]
  values:
    # The fork's images, one tag with the chart (README.md, The fork).
    image:
      repository: ghcr.io/wqrld/drive-backend
      tag: v0.23.0-office.6

    ingress: {enabled: false}
    ingressAdmin: {enabled: false}
    ingressMedia: {enabled: false}
    ingressMediaPreview: {enabled: false}
    posthog:
      ingress: {enabled: false}
      ingressAssets: {enabled: false}

    serviceMedia:
      host: office-s3.office-data.svc.cluster.local
      port: 3900

    backend:
      pdb: {enabled: false}
      # The chart's default is null, so the whole restricted set; every backend-derived
      # workload reuses it verbatim.
      securityContext: &restricted
        allowPrivilegeEscalation: false
        capabilities: {drop: ["ALL"]}
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      persistence: &tmp {tmp: {type: emptyDir, mountPath: /tmp}}

      envVars:
        DJANGO_SETTINGS_MODULE: drive.settings
        DJANGO_CONFIGURATION: Production
        # gunicorn 25's control socket (gunicornc) defaults to $HOME/.gunicorn, and HOME is a
        # read-only /. Nothing here manages workers at runtime: Kubernetes owns the process.
        GUNICORN_CMD_ARGS: --no-control-socket
        DJANGO_ALLOWED_HOSTS: drive.${BASE_DOMAIN}
        DJANGO_CSRF_TRUSTED_ORIGINS: https://drive.${BASE_DOMAIN}
        DJANGO_CORS_ALLOWED_ORIGINS: https://drive.${BASE_DOMAIN}
        DJANGO_CORS_ALLOW_ALL_ORIGINS: "false"
        DJANGO_SUPERUSER_EMAIL: admin@${BASE_DOMAIN}
        DJANGO_EMAIL_BRAND_NAME: Office
        DJANGO_LANGUAGE_CODE: nl-nl    # prefixed, unlike Docs' bare LANGUAGE_CODE

        MEDIA_BASE_URL: https://drive.${BASE_DOMAIN}
        LOGIN_REDIRECT_URL: https://drive.${BASE_DOMAIN}
        LOGIN_REDIRECT_URL_FAILURE: https://drive.${BASE_DOMAIN}
        LOGOUT_REDIRECT_URL: https://drive.${BASE_DOMAIN}

        AWS_S3_SIGNATURE_VERSION: s3v4
        # AWS_S3_UPLOAD_ACL stays at its default `private`: Garage accepts a signed
        # x-amz-acl on a presigned PUT — measured, 200 with and without.

        # Defaults to TRUE; with no search service the indexing task fails on every upload.
        FEATURES_INDEXED_SEARCH: "False"
        # The built-in switcher is compiled to the French government's; ours comes in
        # through FRONTEND_JS_URL, the page's only hook (apps/README.md, The switcher).
        FRONTEND_HIDE_GAUFRE: "true"
        # On a 401, retry OIDC silently before showing the login page.
        FRONTEND_SILENT_LOGIN_ENABLED: "true"
        FRONTEND_JS_URL: https://drive.${BASE_DOMAIN}/custom/switcher.js
        MALWARE_DETECTION_BACKEND: lasuite.malware_detection.backends.dummy.DummyBackend

        # Each name in WOPI_CLIENTS is read back as WOPI_<NAME>_DISCOVERY_URL. Fetched
        # in-cluster; the URLs inside are Collabora's public ones (README.md).
        WOPI_CLIENTS: collabora
        WOPI_COLLABORA_DISCOVERY_URL: http://collabora-online.office-collabora.svc.cluster.local:9980/hosting/discovery
        WOPI_SRC_BASE_URL: https://drive.${BASE_DOMAIN}   # Collabora calls back from outside
        WOPI_DISABLE_CHAT: "1"          # unmoderated side channel inside the editor
        # Document thumbnails, the fork's feature (README.md, The fork).
        WOPI_COLLABORA_OPTIONS: '{"ThumbnailServiceUrl": "http://collabora-online.office-collabora.svc.cluster.local:9980/cool/convert-to"}'
        # Every ten minutes, not upstream's 03:00: the configuration lives in an evicting
        # cache, and until it is refilled every document is "unsupported format" (README.md).
        WOPI_CONFIGURATION_CRONTAB_MINUTE: "*/10"
        WOPI_CONFIGURATION_CRONTAB_HOUR: "*"

        LOGGING_LEVEL_LOGGERS_APP: INFO
        LOGGING_LEVEL_LOGGERS_ROOT: INFO
        SPECTACULAR_SETTINGS_ENABLE_DJANGO_DEPLOY_CHECK: "false"
        # No staticfiles override, unlike Docs (README.md).

      # USERNAME_FIELD is `admin_email`, which upstream's `--email` does not set. Both
      # addresses get the same value, so the admin and the OIDC identity are one account.
      createsuperuser:
        command:
          - /bin/sh
          - -c
          - |
            python manage.py shell <<'PY'
            import os
            from django.contrib.auth import get_user_model

            User = get_user_model()
            email = os.environ["DJANGO_SUPERUSER_EMAIL"]

            user = User.objects.filter(admin_email=email).first() or User(
                admin_email=email, language="nl-nl"
            )
            user.email = email
            user.is_active = True
            user.is_staff = True
            user.is_superuser = True
            user.set_password(os.environ["DJANGO_SUPERUSER_PASSWORD"])
            user.save()
            print("superuser ready:", email)
            PY

      # `celeryWorkers` is in sizes/: a list, restated whole per size (apps/README.md, Sizing).

      # Re-runs the WOPI configuration, so a Collabora upgrade needs no Drive deploy.
      celeryBeat:
        enabled: true

    frontend:
      image: {repository: ghcr.io/wqrld/drive-frontend, tag: v0.23.0-office.6}
      pdb: {enabled: false}
      securityContext: *restricted
      persistence: *tmp              # nginx's pid and temp paths
      envVars:
        PORT: "8080"
        NEXT_PUBLIC_API_ORIGIN: https://drive.${BASE_DOMAIN}
