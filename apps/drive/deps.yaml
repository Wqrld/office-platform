# Drive — release 1 of 3: what it needs before it starts. Conventions: apps/README.md.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata: {name: drive-deps, namespace: office-drive}
spec:
  interval: 30m
  chartRef: {kind: HelmChart, name: platform-deps, namespace: flux-system}
  values:
    app: drive
    env: lasuite
    baseDomain: ${BASE_DOMAIN}

    postgres: {enabled: true}

    cache: {enabled: true, uses: [cache, broker]}

    objectstore:
      enabled: true
      mode: ${S3_MODE}
      quota: {maxSize: 50Gi}
      # Makes this bucket internet-reachable — adr/0110. The browser PUTs to a presigned
      # URL, and a SigV4 signature covers the host, so it must be signed against the host
      # the browser uses. Published for the `/drive/` prefix only.
      publicEndpoint: https://s3.${BASE_DOMAIN}

    oidc: {enabled: true}

    # Same EMAIL_* spelling as Docs.
    smtp: {enabled: true}

    # No DJANGO_SERVER_TO_SERVER_API_TOKENS: upstream's dev values set it, but
    # SERVER_TO_SERVER_API_TOKENS appears nowhere in Drive v0.23.0-office.6.
    generated:
      drive-django:
        - {env: DJANGO_SECRET_KEY, draw: secretkey, generator: office-token-50}
        - {env: DJANGO_SUPERUSER_PASSWORD, draw: superuser}
