# Release 1 of 3: everything Drive must have before it starts.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata: {name: drive-deps, namespace: office-drive}
spec:
  interval: 30m
  chartRef: {kind: OCIRepository, name: platform-deps, namespace: flux-system}
  values:
    app: drive
    baseDomain: ${BASE_DOMAIN}

    postgres: {enabled: true, env: django}

    # Two instances: an evicting broker silently drops queued Celery tasks.
    cache: {enabled: true, env: django, uses: [cache, broker]}

    objectstore:
      enabled: true
      env: django-s3
      quota: {maxSize: 50Gi}
      # Makes this bucket internet-reachable — adr/0110. The browser PUTs to a presigned
      # URL, and a SigV4 signature covers the host, so it must be signed against the host
      # the browser uses. Published for the `/drive/` prefix only.
      publicEndpoint: https://s3.${BASE_DOMAIN}

    # Open provisioning, unlike Docs: Drive starts with an empty user table, so a realm
    # user who has never logged in has to be created on first login.
    oidc: {enabled: true, createUser: true}

    # Same spelling as Docs — the two settings modules are identical in the EMAIL_* block.
    # The relay account is applied by hand into office-data once; docs/bootstrap.md.
    smtp: {enabled: true, env: django-prefixed}

    # A list, not a map: `dataFrom` is ordered and Helm sorts map keys, so a map would let
    # a re-sort rewrite the object. This cannot gain an entry later — see platform-deps.
    #
    # No DJANGO_SERVER_TO_SERVER_API_TOKENS: upstream's dev values set it, but
    # SERVER_TO_SERVER_API_TOKENS appears nowhere in Drive v0.21.2.
    generated:
      drive-django:
        - {env: DJANGO_SECRET_KEY, draw: secretkey, generator: office-token-50}
        - {env: DJANGO_SUPERUSER_PASSWORD, draw: superuser}
