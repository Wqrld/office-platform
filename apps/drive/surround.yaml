# Drive's surround: routes, the media proxy, the static-file server.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata: {name: drive-platform, namespace: office-drive}
spec:
  interval: 30m
  dependsOn: [{name: drive}]
  chartRef: {kind: HelmChart, name: platform-app, namespace: flux-system}
  # The disruption budgets come with the size (sizes/platform-large.yaml; none below).
  valuesFrom: [{kind: ConfigMap, name: drive-sizes, valuesKey: "platform-${SIZE}"}]
  values:
    app: drive
    baseDomain: ${BASE_DOMAIN}

    routes:
      - backend: {name: drive-frontend, port: 80}
        paths: [/]

      - name: api
        backend: {name: drive-backend, port: 80}
        # /api carries the WOPI host endpoints that Collabora calls from OUTSIDE the
        # cluster, so this cannot become internal-only. /static is whitenoise serving
        # Django's admin CSS.
        paths: [/api, /admin, /static]
        # File bodies go straight to the object store, so what arrives here is metadata.
        requestBuffer: 25Mi
        timeout: 300s

      - name: media
        backend: {name: drive-media-proxy, port: 8080}
        # /media/preview is under /media and needs identical traffic treatment; the proxy
        # is what tells them apart.
        paths: [/media]
        timeout: 300s

    # The `/media` route's backend — adr/0109. Drive's media-auth lives under `items`,
    # not `documents`; that segment is the whole difference from Docs.
    mediaProxy:
      enabled: true
      auth: {service: drive-backend, port: 80, path: /api/v1.0/items/media-auth/}
      objectstore: {bucket: drive}
      locations:
        # nginx picks the longest matching prefix, so order here is presentational. The
        # preview renders inline; everything else is forced to download.
        - {path: "/media/preview/"}
        - {path: "/media/", headers: {Content-Disposition: attachment}}

    # Drive's own app switcher loads a widget script from static.suite.anct.gouv.fr and the
    # French government's service list, both compiled into the frontend bundle. It is hidden
    # (release.yaml) and replaced with ours, served from Drive's own origin through the only
    # hook the page offers, FRONTEND_JS_URL (apps/README.md, The switcher).
    staticFiles: {enabled: true, filesConfigMap: drive-switcher}

    networkPolicy:
      egress:
        - {datastore: postgres}
        - {datastore: cache}
        - {datastore: objectstore}
        - {identity: true}
        - {app: collabora, port: 9980}    # /hosting/discovery, server to server
        - {external: true, port: 443}

