# Drive. Chart lives in-tree at src/helm/drive. Until the thumbnails PR lands upstream,
# chart and images come from the FORK's git tag — the same tag publishes
# ghcr.io/wqrld/drive-{backend,frontend} (apps/drive/README.md, The fork), so one pin moves
# all three. When it lands, only the url changes back to suitenumerique/drive.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata: {name: wqrld-drive, namespace: flux-system}
spec:
  interval: 24h
  url: https://github.com/Wqrld/drive
  ref: {tag: v0.23.0-office.6}
  ignore: |
    /*
    !/src/helm
