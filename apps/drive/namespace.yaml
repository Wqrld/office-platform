apiVersion: v1
kind: Namespace
metadata:
  name: office-drive
  labels:
    # The Gateway's allowedRoutes selector. Without it every HTTPRoute below is silently
    # ignored — the route reports no error, it simply never attaches.
    office.haaijer.dev/gateway-access: "true"
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
# `defaultRequest` only — see platform/guardrails.yaml for why this shape and no other.
# Every container in this namespace already carries its own requests, so today this changes
# nothing; it is here for the container that arrives without them, which is how an upstream
# chart's new sidecar or Job silently lands as BestEffort and gets evicted first.
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: office-drive
spec:
  limits:
    - type: Container
      defaultRequest: {cpu: 25m, memory: 64Mi}
