apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../namespace.yaml
  - ../services.yaml
  - deps.yaml
  - release.yaml
  - surround.yaml

configMapGenerator:
  # The size files, one ConfigMap key each; each HelmRelease picks its key with `${SIZE}`.
  - name: drive-sizes
    namespace: office-drive
    files:
      - small=sizes/small.yaml
      - medium=sizes/medium.yaml
      - large=sizes/large.yaml
      - platform-small=sizes/platform-small.yaml
      - platform-medium=sizes/platform-medium.yaml
      - platform-large=sizes/platform-large.yaml
    options:
      disableNameSuffixHash: true
      labels: {reconcile.fluxcd.io/watch: Enabled}   # a size change upgrades now, not in 30m

  # The two switcher scripts (apps/README.md, The switcher), real .js files rather than
  # block scalars inside a HelmRelease; the surround serves them (`staticFiles`). Neither
  # carries a `${…}`, and `substitute: disabled` keeps it that way for whoever edits them.
  - name: drive-switcher
    namespace: office-drive
    files: [../switcher.js, ../gaufre.js]
    options:
      disableNameSuffixHash: true
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
