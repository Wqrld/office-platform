# Explicit resource list: dropping a file into this directory must not silently deploy it.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - deps.yaml
  - release.yaml
  - surround.yaml

# The switcher stays a real .js file rather than a block scalar inside a HelmRelease, so
# it can be read, linted and edited as what it is. It is shared with Meet, so it lives one
# level up; the surround points at the ConfigMap by name (`staticFiles.filesConfigMap`).
configMapGenerator:
  - name: drive-switcher
    namespace: office-drive
    files: [../switcher.js]
    options:
      disableNameSuffixHash: true
      annotations:
        # The file is full of $variables that postBuild substitution would blank.
        kustomize.toolkit.fluxcd.io/substitute: disabled
