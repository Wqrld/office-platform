apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../namespace.yaml
  - ../services.yaml
  - deps.yaml
  - release.yaml
  - surround.yaml

configMapGenerator:
  - name: drive-sizes
    namespace: office-drive
    files:
      - small=sizes/small.yaml
      - medium=sizes/medium.yaml
      - large=sizes/large.yaml
      - platform-small=../sizes-no-pdb.yaml
      - platform-medium=../sizes-no-pdb.yaml
      - platform-large=sizes/platform-large.yaml
    options:
      disableNameSuffixHash: true
      labels: {reconcile.fluxcd.io/watch: Enabled}

  # The two switcher scripts (apps/README.md, The switcher), served by the surround.
  - name: drive-switcher
    namespace: office-drive
    files: [../switcher.js, ../gaufre.js]
    options:
      disableNameSuffixHash: true
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
