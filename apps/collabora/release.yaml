# Release 2 of 3: Collabora Online, from its own Helm repository.
#
# The exception to adr/0104: Collabora is not a La Suite application and it DOES publish a
# chart repository, so this is a normal pinned HelmRelease rather than a git tag. Its
# appVersion and the image tag move together and only in a reviewed commit.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: collabora
  namespace: office-collabora
spec:
  interval: 30m
  dependsOn: [{name: collabora-deps}]
  chart:
    spec:
      chart: collabora-online
      version: "1.3.2"
      sourceRef: {kind: HelmRepository, name: collabora, namespace: flux-system}
  values:
    # Pinned, not left to the chart's appVersion, for the same reason every other image
    # here is pinned: a chart bump must not be able to move the application by itself.
    image: {tag: "26.04.3.2.1"}

    fullnameOverride: collabora-online

    # ONE REPLICA, AND IT IS NOT A SIZING CHOICE. Every viewer of a document must land on
    # the pod that holds it, which nginx does by hashing `$arg_WOPISrc`. Envoy Gateway's
    # consistent hash can key on a header, a cookie or the source IP — not on a query
    # parameter — so with more than one replica two people editing the same file get two
    # different pods and two divergent copies. The chart's own default is an HPA from 2 to
    # 100 replicas; that default is wrong for every reverse proxy that cannot express
    # WOPISrc affinity, and it is turned off here rather than tuned.
    replicaCount: 1
    autoscaling: {enabled: false}
    podDisruptionBudget: {enabled: false}   # one replica: a PDB can only block a drain

    collabora:
      # coolwsd derives the URLs it advertises in /hosting/discovery from this. Leave it
      # unset and discovery advertises `https://localhost:9980/browser/...`, which is what
      # the browser is then told to load the editor from — verified on this cluster.
      server_name: collabora.${BASE_DOMAIN}

      # `mode=groups` makes the alias list an ALLOW-LIST: coolwsd refuses a WOPI host that
      # is not below. Without it Collabora will fetch and edit a document from any host
      # that asks, which on a public address is an open document-conversion service.
      extra_params: >-
        --o:ssl.enable=false
        --o:ssl.termination=true
        --o:storage.wopi.alias_groups.mode=groups
      aliasgroups:
        - host: "https://drive.${BASE_DOMAIN}"

      # Generated by collabora-deps, never in git. The chart's default is
      # `admin`/`examplepass` base64'd out of its own values.yaml.
      existingSecret:
        enabled: true
        secretName: collabora-admin
        usernameKey: username
        passwordKey: password

      # Both proof-key options stay off. The chart's own generator reads the previous
      # Secret back from the live cluster, which `helm template` under Flux does not do —
      # so every reconcile would mint a new key and rotate it under the running pods. Drive
      # does not verify the X-WOPI-Proof header (its own tests pass `proof_keys: {}`), so
      # with one replica coolwsd's per-process ephemeral key is sufficient. Revisit
      # together with the replica count, never separately.
      proofKeyGeneration: {enabled: false}

    service: {port: 9980}
    deployment: {containerPort: 9980}

    # Routing is ours, on the shared Gateway — surround.yaml. Both of the chart's own
    # options are off. `route` would emit an HTTPRoute with no traffic policy and no deny
    # rule for the admin console.
    ingress: {enabled: false}
    route: {enabled: false}
    nginxDeny: {enabled: false}
    reverseProxy: {enabled: false}
    networkPolicy: {enabled: false}         # ours, in surround.yaml
    prometheus: {servicemonitor: {enabled: false}}

    priorityClassName: office-app

    # MEASURED ON THIS CLUSTER, not copied from a preset. coolwsd forks a LibreOffice kit
    # per document; idle it sits near 400Mi with one spare kit warm.
    resources:
      requests: {cpu: 100m, memory: 512Mi}
      limits: {memory: 2Gi}

    # THE CAPABILITY SET IS LOAD-BEARING. coolwsd builds a chroot jail per document, and
    # `/usr/bin/coolforkit-caps` carries file capabilities `cap_chown,cap_fowner,
    # cap_sys_chroot=ep`. A file capability can only grant what is already in the
    # container's BOUNDING set, and CRI-O's default bounding set has neither SYS_CHROOT nor
    # MKNOD — so the stock image fails on this cluster with `Failed to spawn coolforkit`
    # and shuts itself down, with or without an explicit securityContext. Verified both
    # ways. All four are inside PSA `baseline`; none is inside `restricted`.
    #
    # `allowPrivilegeEscalation` is deliberately NOT set to false: no_new_privs makes the
    # kernel ignore file capabilities on exec, which breaks this the same way dropping them
    # does. The container still runs as uid 1001 with an empty permitted set.
    securityContext:
      runAsNonRoot: true
      capabilities:
        drop: ["ALL"]
        add: ["CHOWN", "FOWNER", "MKNOD", "SYS_CHROOT"]
      seccompProfile: {type: RuntimeDefault}
