# Collabora — release 2 of 3: Collabora Online, from its own chart repository at a pinned
# version: not a La Suite application, so the exception to adr/0104. README.md for gotchas.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: collabora
  namespace: office-collabora
spec:
  interval: 30m
  dependsOn: [{name: collabora-deps}]
  chart:
    spec:
      chart: collabora-online
      version: "1.3.5"
      sourceRef: {kind: HelmRepository, name: collabora, namespace: flux-system}
  valuesFrom: [{kind: ConfigMap, name: collabora-sizes, valuesKey: "${SIZE}"}]
  values:
    image: {tag: "26.04.3.2.1"}   # pinned so a chart bump cannot move the application

    # The chart's own `route` would have no traffic policy and no deny rule.
    ingress: {enabled: false}
    route: {enabled: false}
    nginxDeny: {enabled: false}
    reverseProxy: {enabled: false}
    networkPolicy: {enabled: false}         # ours, in surround.yaml
    prometheus: {servicemonitor: {enabled: false}}

    fullnameOverride: collabora-online

    # ONE REPLICA, not a size: Envoy cannot hash on the `WOPISrc` query parameter
    # (apps/README.md, Sizing). The chart's 2-100 HPA is turned off, not tuned.
    replicaCount: 1
    autoscaling: {enabled: false}
    podDisruptionBudget: {enabled: false}   # one replica: a PDB can only block a drain

    collabora:
      # Without this, /hosting/discovery advertises `https://localhost:9980/...` as the
      # editor URL — which is what the browser is then told to load. Verified.
      server_name: collabora.${BASE_DOMAIN}

      # `mode=groups` makes the alias list an ALLOW-LIST; without it any host may have
      # documents edited, an open conversion service. The console is off at the source:
      # since the Gateway keeps `%2F` escaped (platform/gateway/traffic.yaml),
      # `/browser/dist%2Fadmin/admin.html` slips past its deny prefix (measured: a 401).
      extra_params: >-
        --o:ssl.enable=false
        --o:ssl.termination=true
        --o:storage.wopi.alias_groups.mode=groups
        --o:admin_console.enable=false
      aliasgroups:
        - host: "https://drive.${BASE_DOMAIN}"

      # Generated by collabora-deps; the chart's default is `admin`/`examplepass`.
      existingSecret:
        enabled: true
        secretName: collabora-admin
        usernameKey: username
        passwordKey: password

      # Off: the generator reads the live Secret back, which Flux's render cannot, so every
      # reconcile would mint a key. Drive does not verify X-WOPI-Proof. Revisit with replicas.
      proofKeyGeneration: {enabled: false}

    service: {port: 9980}
    deployment: {containerPort: 9980}

    priorityClassName: office-app

    # THE CAPABILITY SET IS LOAD-BEARING. `coolforkit-caps`' file capabilities only grant
    # what is in the bounding set, and CRI-O's default lacks SYS_CHROOT and MKNOD: `Failed
    # to spawn coolforkit`. All four are within PSA baseline. No `allowPrivilegeEscalation:
    # false`: no_new_privs ignores file capabilities, which breaks it the same way.
    securityContext:
      runAsNonRoot: true
      capabilities:
        drop: ["ALL"]
        add: ["CHOWN", "FOWNER", "MKNOD", "SYS_CHROOT"]
      seccompProfile: {type: RuntimeDefault}
