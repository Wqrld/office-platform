# Release 2 of 3: Collabora Online. The exception to adr/0104 — not a La Suite application,
# and it does publish a chart repository, so this is an ordinary pinned HelmRelease.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: collabora
  namespace: office-collabora
spec:
  interval: 30m
  dependsOn: [{name: collabora-deps}]
  chart:
    spec:
      chart: collabora-online
      version: "1.3.5"
      sourceRef: {kind: HelmRepository, name: collabora, namespace: flux-system}
  # Resources come from sizes/<size>.yaml, one key of the `collabora-sizes` ConfigMap.
  # `spec.values` would beat it, so no sizing key may live here.
  valuesFrom: [{kind: ConfigMap, name: collabora-sizes, valuesKey: "${SIZE}"}]
  values:
    image: {tag: "26.04.3.2.1"}   # pinned so a chart bump cannot move the application

    fullnameOverride: collabora-online

    # ONE REPLICA, AND NOT AS A SIZING CHOICE. Every viewer of a document must reach the
    # pod holding it, which needs affinity on the `WOPISrc` query parameter. Envoy
    # Gateway's consistent hash can key on a header, a cookie or the source IP — not a
    # query parameter — so two replicas means two divergent copies. The chart defaults to
    # an HPA from 2 to 100; it is turned off, not tuned.
    replicaCount: 1
    autoscaling: {enabled: false}
    podDisruptionBudget: {enabled: false}   # one replica: a PDB can only block a drain

    collabora:
      # Without this, /hosting/discovery advertises `https://localhost:9980/...` as the
      # editor URL — which is what the browser is then told to load. Verified.
      server_name: collabora.${BASE_DOMAIN}

      # `mode=groups` is what makes the alias list an ALLOW-LIST. Without it Collabora
      # edits a document from any host that asks — on a public address, an open
      # document-conversion service.
      #
      # `admin_console.enable=false` removes the console at the source. The Gateway denies
      # its paths too, but that is prefix matching on the raw path, and since the Gateway
      # stopped unescaping `%2F` (platform/gateway/traffic.yaml) a request for
      # `/browser/dist%2Fadmin/admin.html` slips past the prefix and reaches coolwsd —
      # measured, it answered 401 rather than 403. Nothing here needs the console.
      extra_params: >-
        --o:ssl.enable=false
        --o:ssl.termination=true
        --o:storage.wopi.alias_groups.mode=groups
        --o:admin_console.enable=false
      aliasgroups:
        - host: "https://drive.${BASE_DOMAIN}"

      # Generated by collabora-deps; the chart's default is `admin`/`examplepass`.
      existingSecret:
        enabled: true
        secretName: collabora-admin
        usernameKey: username
        passwordKey: password

      # Off: the chart's generator reads the previous Secret back from the live cluster,
      # which `helm template` under Flux does not do, so every reconcile would mint a new
      # key. Drive does not verify X-WOPI-Proof, and one replica needs no shared key.
      # Revisit with the replica count, never separately.
      proofKeyGeneration: {enabled: false}

    service: {port: 9980}
    deployment: {containerPort: 9980}

    # Routing is ours — surround.yaml. The chart's own `route` would emit an HTTPRoute
    # with no traffic policy and no deny rule for the admin console.
    ingress: {enabled: false}
    route: {enabled: false}
    nginxDeny: {enabled: false}
    reverseProxy: {enabled: false}
    networkPolicy: {enabled: false}         # ours, in surround.yaml
    prometheus: {servicemonitor: {enabled: false}}

    priorityClassName: office-app

    # THE CAPABILITY SET IS LOAD-BEARING. `coolforkit-caps` carries file capabilities, and
    # a file capability only grants what is already in the container's BOUNDING set —
    # CRI-O's default has neither SYS_CHROOT nor MKNOD, so the stock image dies with
    # `Failed to spawn coolforkit` with or without an explicit securityContext. All four
    # are inside PSA baseline; none is inside restricted.
    #
    # `allowPrivilegeEscalation: false` is deliberately absent: no_new_privs makes the
    # kernel ignore file capabilities on exec, which breaks this the same way.
    securityContext:
      runAsNonRoot: true
      capabilities:
        drop: ["ALL"]
        add: ["CHOWN", "FOWNER", "MKNOD", "SYS_CHROOT"]
      seccompProfile: {type: RuntimeDefault}
