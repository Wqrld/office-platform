# Collabora's prerequisites: only the admin credential — it is handed a WOPI token by Drive
# and never talks to Keycloak. Without this the chart ships `admin` / `examplepass`.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata: {name: collabora-deps, namespace: office-collabora}
spec:
  interval: 30m
  chartRef: {kind: HelmChart, name: platform-deps, namespace: flux-system}
  values:
    app: collabora
    baseDomain: ${BASE_DOMAIN}

    # The username is generated too — nothing types it by hand, and the console is 403'd at
    # the Gateway anyway (surround.yaml).
    generated:
      collabora-admin:
        - {env: username, draw: adminuser}
        - {env: password, draw: adminpassword}
