# Release 1 of 3. Collabora has no database, cache, bucket or OIDC client — it is handed a
# short-lived WOPI token by Drive and never talks to Keycloak. All that is left is the admin
# credential, which the chart otherwise base64s straight out of its own values.yaml
# (`admin` / `examplepass`).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata: {name: collabora-deps, namespace: office-collabora}
spec:
  interval: 30m
  chartRef: {kind: OCIRepository, name: platform-deps, namespace: flux-system}
  values:
    app: collabora
    baseDomain: ${BASE_DOMAIN}

    # The username is generated too — nothing types it by hand, and the console is 403'd at
    # the Gateway anyway (surround.yaml).
    generated:
      collabora-admin:
        - {env: username, draw: adminuser}
        - {env: password, draw: adminpassword}
