# Collabora's surround.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata: {name: collabora-platform, namespace: office-collabora}
spec:
  interval: 30m
  dependsOn: [{name: collabora}]
  chartRef: {kind: HelmChart, name: platform-app, namespace: flux-system}
  values:
    app: collabora
    baseDomain: ${BASE_DOMAIN}

    routes:
      - backend: {name: collabora-online, port: 9980}
        paths: [/]
        websocket: true                 # the editor holds one open all session

        # The admin console and metrics share the editor's port; `/cool/getMetrics` lists
        # every open document. The generated password is the second layer.
        deny:
          - /browser/dist/admin
          - /cool/adminws
          - /cool/getMetrics

    networkPolicy:
      egress:
        # Drive, at its PUBLIC name — that is the WOPISrc Drive signs into the token.
        - {external: true, port: 443}

