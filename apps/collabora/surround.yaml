# Release 3 of 3: the surround.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata: {name: collabora-platform, namespace: office-collabora}
spec:
  interval: 30m
  dependsOn: [{name: collabora}]
  chartRef: {kind: OCIRepository, name: platform-app, namespace: flux-system}
  values:
    app: collabora
    baseDomain: ${BASE_DOMAIN}

    routes:
      - host: collabora
        backend: {name: collabora-online, port: 9980}
        paths: [/]
        websocket: true                 # the editor holds one open all session

        # coolwsd puts its admin console and metrics on the same host and port as the
        # editor. `/cool/getMetrics` enumerates every open document. 403 at the edge; the
        # generated password is the second layer, not the first.
        deny:
          - /browser/dist/admin
          - /cool/adminws
          - /cool/getMetrics

    # Emitted, NOT enforced — Flannel has no policy controller (adr/0103). Do not cite it
    # as segmentation.
    networkPolicy:
      enabled: true
      egress:
        # Drive, at its PUBLIC name — that is the WOPISrc Drive signs into the token.
        - {external: true, port: 443}

    pdb: {enabled: false}
