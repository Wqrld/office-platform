apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../namespace.yaml
  - deps.yaml
  - release.yaml
  - surround.yaml

configMapGenerator:
  - name: collabora-sizes
    namespace: office-collabora
    files:
      - small=sizes/small.yaml
      - medium=sizes/medium.yaml
      - large=sizes/large.yaml
    options:
      disableNameSuffixHash: true
      labels: {reconcile.fluxcd.io/watch: Enabled}
