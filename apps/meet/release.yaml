# Meet, from La Suite's in-tree chart (`src/helm/meet`) at its pinned git tag (adr/0104).
# Nine Deployments, four at `replicas: 0` (workloads not deployed, not a size). The chart
# has no `envFrom`, so the patches below add it (apps/README.md, Conventions). `env` beating
# `envFrom` is relied on once, on purpose (AWS_S3_ENDPOINT_URL); any other overlap is a bug.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: meet
  namespace: office-meet
spec:
  interval: 30m
  # The patched-in Secrets come from meet-deps and summary-secret.yaml.
  dependsOn: [{name: meet-deps}]
  chart:
    spec:
      chart: src/helm/meet
      sourceRef: {kind: GitRepository, name: suitenumerique-meet, namespace: flux-system}
      reconcileStrategy: Revision
  install:
    disableWaitForJobs: true
  upgrade:
    disableWaitForJobs: true
    remediation:
      retries: 0

  valuesFrom: [{kind: ConfigMap, name: meet-sizes, valuesKey: "${SIZE}"}]
  postRenderers:
    - kustomize:
        patches:
          # The backend and what runs its code: migrate, createsuperuser, two CronJobs.
          - target: {kind: "Deployment|Job", name: "meet-backend.*"}
            patch: |
              - op: add
                path: /spec/template/spec/containers/0/envFrom
                value:
                  - {secretRef: {name: meet-postgres}}
                  - {secretRef: {name: meet-cache}}
                  - {secretRef: {name: meet-s3}}
                  - {secretRef: {name: meet-oidc}}
                  - {secretRef: {name: meet-smtp}}
                  - {secretRef: {name: meet-django}}
                  - {secretRef: {name: meet-tokens}}
          - target: {kind: CronJob, name: "meet-backend.*"}
            patch: |
              - op: add
                path: /spec/jobTemplate/spec/template/spec/containers/0/envFrom
                value:
                  - {secretRef: {name: meet-postgres}}
                  - {secretRef: {name: meet-cache}}
                  - {secretRef: {name: meet-s3}}
                  - {secretRef: {name: meet-oidc}}
                  - {secretRef: {name: meet-smtp}}
                  - {secretRef: {name: meet-django}}
                  - {secretRef: {name: meet-tokens}}
          # The transcript pipeline: the bucket and its own tokens, not the OIDC secret. NOT
          # `meet-celery-backend`, the backend's Celery: enabled, it belongs in the first patch.
          - target: {kind: Deployment, name: "meet-summary|meet-celery-(transcribe.*|summarize|summary-backend)"}
            patch: |
              - op: add
                path: /spec/template/spec/containers/0/envFrom
                value:
                  - {secretRef: {name: meet-s3}}
                  - {secretRef: {name: meet-summary}}

  values:
    # The backend's (and the Celery backend's); every other tag overrides it. All the same
    # version, moved together by updatecli/updatecli.d/meet.yaml.
    image: {tag: v1.34.0}

    ingress: {enabled: false}
    ingressWebhook: {enabled: false}
    ingressAdmin: {enabled: false}
    ingressMedia: {enabled: false}
    ingressMediaFiles: {enabled: false}
    posthog:
      ingress: {enabled: false}
      ingressAssets: {enabled: false}

    serviceMedia: {host: office-s3.office-data.svc.cluster.local, port: 3900}
    serviceMediaFiles: {host: office-s3.office-data.svc.cluster.local, port: 3900}

    # ---------------------------------------------------------------- backend
    backend:
      pdb: {enabled: false}
      # The chart's default is null for every component; every image runs as uid 1001.
      securityContext: &restricted
        allowPrivilegeEscalation: false
        capabilities: {drop: ["ALL"]}
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      persistence: &tmp {tmp: {type: emptyDir, mountPath: /tmp}}
      envVars:
        DJANGO_SETTINGS_MODULE: meet.settings
        DJANGO_CONFIGURATION: Production
        # Only the public name: SECURE_SSL_REDIRECT 301s plain http, so LiveKit's webhook
        # and the summary service's hook call it too.
        DJANGO_ALLOWED_HOSTS: meet.${BASE_DOMAIN}
        DJANGO_CSRF_TRUSTED_ORIGINS: https://meet.${BASE_DOMAIN}
        DJANGO_CORS_ALLOWED_ORIGINS: https://meet.${BASE_DOMAIN}
        DJANGO_SUPERUSER_EMAIL: admin@${BASE_DOMAIN}
        DJANGO_LANGUAGE_CODE: nl-nl
        DJANGO_EMAIL_BRAND_NAME: Office
        DJANGO_EMAIL_APP_BASE_URL: https://meet.${BASE_DOMAIN}
        # The backend's own Celery: nothing in the transcript path uses it (deps.yaml).
        CELERY_ENABLED: "false"
        # Upstream's public-service default is true: here only signed-in users make rooms.
        ALLOW_UNREGISTERED_ROOMS: "false"

        # ---- LiveKit. PUBLIC, because the browser gets it too; the backend hairpins.
        LIVEKIT_API_URL: https://livekit.${BASE_DOMAIN}
        LIVEKIT_FORCE_WSS_PROTOCOL: "true"

        # ---- Transcripts: this pair puts the button in the UI. No `screen_recording`: a
        # video egress is a much larger Chrome, and nothing serves its output.
        RECORDING_ENABLE: "true"
        RECORDING_WORKER_CLASSES: '{"transcript": "core.recording.worker.services.AudioCompositeEgressService"}'
        # `/recording/<id>`, SINGULAR (routes.ts): the link atop each transcript document,
        # whose download is the media proxy (surround.yaml).
        RECORDING_DOWNLOAD_BASE_URL: https://meet.${BASE_DOMAIN}/recording
        SUMMARY_SERVICE_VERSION: "2"
        SUMMARY_SERVICE_ENDPOINT: http://meet-summary/api/v2/async-jobs/transcribe/
        # What the transcript panel shows as "your transcript will be sent to".
        FRONTEND_TRANSCRIPTION_DESTINATION: https://docs.${BASE_DOMAIN}

        SESSION_COOKIE_AGE: "43200"
        LOGGING_LEVEL_LOGGERS_APP: INFO
        LOGGING_LEVEL_LOGGERS_ROOT: INFO

      # Upstream's `--email`/`--password` fail from the first run: USERNAME_FIELD is
      # `admin_email` and the stock command takes no password.
      createsuperuser:
        command:
          - /bin/sh
          - -c
          - |
            # `migrate --check`, not `check --database`: the migrate Job runs alongside
            # this one, and a connectable database with no tables yet is the first thing
            # this Job sees. Exits 0 only once every migration is applied.
            until python manage.py migrate --check > /dev/null 2>&1; do
              echo "Waiting for migrations"; sleep 5
            done
            python manage.py shell <<'PY'
            import os
            from django.contrib.auth import get_user_model

            User = get_user_model()
            email = os.environ["DJANGO_SUPERUSER_EMAIL"]

            # Build the whole object before the first save: Meet's BaseModel.save() calls
            # full_clean(), so an unsaved-then-set_password() order fails validation.
            user = User.objects.filter(admin_email=email).first() or User(
                admin_email=email, language="nl-nl"
            )
            user.is_active = True
            user.is_staff = True
            user.is_superuser = True
            user.set_password(os.environ["DJANGO_SUPERUSER_PASSWORD"])
            user.save()
            print("superuser ready:", email)
            PY
        restartPolicy: Never

    # ---------------------------------------------------------------- frontend
    frontend:
      image: {tag: v1.34.0}
      pdb: {enabled: false}
      securityContext: *restricted
      persistence: *tmp
      # THE GAUFRE, injected by nginx's `sub_filter` (README.md, The gaufre). default.conf
      # is a subPath (one file in the image's directory, read at start); /custom is a
      # directory mount, because a subPath copy is never refreshed.
      extraVolumes:
        - name: conf
          configMap: {name: meet-frontend, items: [{key: default.conf, path: default.conf}]}
        - name: custom
          projected:
            sources:
              - configMap: {name: meet-frontend, items: [{key: switcher.js, path: switcher.js}, {key: gaufre.js, path: gaufre.js}]}
              - configMap: {name: office-services}
      extraVolumeMounts:
        - {name: conf, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf, readOnly: true}
        - {name: custom, mountPath: /srv/custom, readOnly: true}

    # ---------------------------------------------------------------- transcript pipeline
    # One image run four ways: the API the backend POSTs jobs to, and three Celery workers,
    # one per queue. The env block is anchored: the chart has no shared env for them.
    summary:
      image: {tag: v1.34.0}
      pdb: {enabled: false}
      securityContext: *restricted
      persistence: *tmp
      envVars: &summaryEnv
        # The ONE deliberate env-over-envFrom override: the Minio client wants host:port and
        # a TLS flag, not the full URL `meet-s3` carries for Django.
        AWS_S3_ENDPOINT_URL: office-s3.office-data.svc.cluster.local:3900
        AWS_S3_SECURE_ACCESS: "false"
        # The model whisperx.yaml loaded: v1.2.0 404s any other. Language is auto-detected
        # among en/fr/de/nl by default.
        WHISPERX_BASE_URL: http://meet-whisperx:8000/v1
        WHISPERX_ASR_MODEL: small
        # No summaries: transcripts go to Docs as-is. The settings class requires LLM_*.
        IS_SUMMARY_ENABLED: "false"
        LLM_BASE_URL: http://disabled.invalid/v1
        LLM_API_KEY: disabled
        LLM_MODEL: disabled
        # Owned by whoever started it; the other end is `docs-meet` (apps/docs/deps.yaml).
        IS_LASUITE_DOCS_INTEGRATION_ENABLED: "true"
        LASUITE_DOCS_BASE_URL: https://docs.${BASE_DOMAIN}

    # `transcribe-queue`: download, ffmpeg (the pipeline's memory peak), whisperx, Docs.
    celeryTranscribe:
      image: {tag: v1.34.0}
      pdb: {enabled: false}
      securityContext: *restricted
      persistence: *tmp
      envVars:
        <<: *summaryEnv
        # summary-sitecustomize.py raises the call's hard-coded ten-minute read timeout.
        PYTHONPATH: /etc/office
        WHISPERX_READ_TIMEOUT: "3600"
      extraVolumes:
        - name: office
          configMap: {name: meet-patches}
      extraVolumeMounts:
        - {name: office, mountPath: /etc/office/sitecustomize.py, subPath: summary-sitecustomize.py, readOnly: true}
      instances:
        - {name: default, extraEnvVars: {}}

    # `call-webhook-queue`: tells the backend the job finished. Tiny.
    celerySummaryBackend:
      image: {tag: v1.34.0}
      pdb: {enabled: false}
      securityContext: *restricted
      persistence: *tmp
      envVars: *summaryEnv

    # `summarize-queue`: the LLM step, off.
    celerySummarize:
      image: {tag: v1.34.0}
      replicas: 0
      pdb: {enabled: false}
      securityContext: *restricted
      persistence: *tmp
      envVars: *summaryEnv

    # The backend's Celery: CELERY_ENABLED is false.
    celeryBackend:
      replicas: 0
      pdb: {enabled: false}
      securityContext: *restricted
      persistence: *tmp

    # ---------------------------------------------------------------- not deployed
    # `agentSubtitles` is live captions through Deepgram, a paid API. `agentMetadata` names
    # speakers in transcripts; diarization labels them already. Revisit if "Speaker 1" is
    # the complaint.
    agentMetadata:
      image: {tag: v1.34.0}
      replicas: 0
      pdb: {enabled: false}
      securityContext: *restricted
      persistence: *tmp
    agentSubtitles:
      image: {tag: v1.34.0}
      replicas: 0
      pdb: {enabled: false}
      securityContext: *restricted
      persistence: *tmp
