apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../namespace.yaml
  - ../services.yaml
  - deps.yaml
  - summary-secret.yaml
  - whisperx.yaml
  - release.yaml
  - surround.yaml

configMapGenerator:
  - name: meet-sizes
    namespace: office-meet
    files:
      - small=sizes/small.yaml
      - medium=sizes/medium.yaml
      - large=sizes/large.yaml
      - platform-small=../sizes-no-pdb.yaml
      - platform-medium=../sizes-no-pdb.yaml
      - platform-large=sizes/platform-large.yaml
    options:
      disableNameSuffixHash: true
      labels: {reconcile.fluxcd.io/watch: Enabled}

  # The switcher scripts and the nginx config that injects them (release.yaml). Not
  # substituted: default.conf has nginx `$uri` variables.
  - name: meet-frontend
    namespace: office-meet
    files: [../switcher.js, ../gaufre.js, default.conf]
    options:
      disableNameSuffixHash: true
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled

  # Two Python patches, each mounted as `sitecustomize.py` (the files say why).
  - name: meet-patches
    namespace: office-meet
    files: [summary-sitecustomize.py, whisperx-sitecustomize.py]
    options:
      disableNameSuffixHash: true
