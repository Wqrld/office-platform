apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../namespace.yaml
  - ../services.yaml
  - deps.yaml
  - summary-secret.yaml
  - whisperx.yaml
  - release.yaml
  - surround.yaml

configMapGenerator:
  # The size files, one ConfigMap key each; each HelmRelease picks its key with `${SIZE}`.
  - name: meet-sizes
    namespace: office-meet
    files:
      - small=sizes/small.yaml
      - medium=sizes/medium.yaml
      - large=sizes/large.yaml
      - platform-small=sizes/platform-small.yaml
      - platform-medium=sizes/platform-medium.yaml
      - platform-large=sizes/platform-large.yaml
    options:
      disableNameSuffixHash: true

  # The two switcher scripts (one level up — Drive's too; apps/README.md, The switcher),
  # plus the nginx config that injects them, mounted over the frontend image's own
  # default.conf (release.yaml). `substitute: disabled`: default.conf has nginx `$uri`
  # variables, and nothing in the scripts is a `${…}` either.
  - name: meet-frontend
    namespace: office-meet
    files: [../switcher.js, ../gaufre.js, default.conf]
    options:
      disableNameSuffixHash: true
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled

  # Two one-file Python patches, each imported at interpreter start by the process it is
  # mounted into as `sitecustomize.py` (the files say why). Nothing to substitute.
  - name: meet-patches
    namespace: office-meet
    files: [summary-sitecustomize.py, whisperx-sitecustomize.py]
    options:
      disableNameSuffixHash: true
