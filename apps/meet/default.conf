# Meet's frontend nginx config — upstream's src/frontend/default.conf at the pinned tag,
# plus the two blocks marked OURS. Mounted over the image's copy (release.yaml). Diff it
# against upstream on every chart bump.
server {
  listen 8080;
  server_name localhost;
  server_tokens off;

  root /usr/share/nginx/html;

  # OURS: the app switcher. nginx appends one <script> tag to every HTML response, and
  # serves the script from the same ConfigMap. `sub_filter` only touches text/html by
  # default, so the JS/CSS bundles are untouched.
  sub_filter '</body>' '<script src="/custom/switcher.js"></script></body>';
  sub_filter_once on;

  location /custom/ {
      alias /srv/custom/;
      add_header Cache-Control "public, max-age=300";
  }

  location ^~ /assets/mediapipe/wasm/ {
      expires 30d;
      add_header Cache-Control "public, max-age=2592000";
  }

  # Serve static files with caching
  location ~* ^/assets/.*\.(css|js|json|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
      expires 30d;
      add_header Cache-Control "public, max-age=2592000";
  }

  # Serve static files
  location / {
      try_files $uri $uri/ /index.html;
      # Add no-cache headers
      add_header Cache-Control "no-cache, no-store, must-revalidate";
      add_header Pragma "no-cache";  # HTTP 1.0 header for backward compatibility
      add_header Expires 0;
  }

  # Optionally, handle 404 errors by redirecting to index.html
  error_page 404 =200 /index.html;
}
