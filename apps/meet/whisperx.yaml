# Speech to text: suitenumerique/meet-whisperx, the OpenAI-compatible WhisperX API Meet's
# summary service is written against. Upstream ships no chart, so three plain objects.
# ON CPU, with `--model small`: large-v2, the default, is unusable without a GPU, and small
# runs at about real time (README.md, whisperx on CPU). The summary service must ask for
# the same model (WHISPERX_ASR_MODEL in release.yaml). Needs the by-hand HF_TOKEN
# (docs/install.md); the models download into the PVC on first start.
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: meet-whisperx-models, namespace: office-meet}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ${STORAGE_CLASS}
  resources: {requests: {storage: 10Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: meet-whisperx
  namespace: office-meet
  labels: {app.kubernetes.io/name: meet-whisperx, app.kubernetes.io/part-of: office}
spec:
  replicas: 1
  # One PVC, one model in memory: never two of these at once.
  strategy: {type: Recreate}
  selector: {matchLabels: {app.kubernetes.io/name: meet-whisperx}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: meet-whisperx, app.kubernetes.io/part-of: office}
    spec:
      priorityClassName: office-app
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: whisperx
          image: docker.io/lasuite/whisper-api:v1.2.0
          # `command` as well as `args`: the image's ENTRYPOINT is NVIDIA's wrapper script,
          # which execs whatever follows — args alone would make it exec `--model`.
          command: ["python3", "main.py"]
          args: ["--model", "small", "--logging-config", "logging-config.yaml"]
          envFrom: [{secretRef: {name: meet-whisperx}}]
          env:
            # Whisper v2 checkpoints fail torch's weights_only default; upstream's
            # Dockerfile sets this too.
            - {name: TORCH_FORCE_NO_WEIGHTS_ONLY_LOAD, value: "1"}
            # Eight of ten cores and no CPU limit: a transcript races the summary worker's
            # timeout, and the cost to calls alongside is accepted (README.md).
            - {name: OMP_NUM_THREADS, value: "8"}
            # whisperx-sitecustomize.py, mounted below: the image's CPU path is broken.
            - {name: PYTHONPATH, value: /etc/office}
          ports: [{name: http, containerPort: 8000}]
          # Loading on CPU takes minutes, the first start downloads too: 20 minutes' grace.
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 15
            failureThreshold: 80
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 30
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 30
          # Read-only root; torch and matplotlib write their caches under $HOME.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          # The same at every size — the model decides, not the head count (README.md).
          resources:
            requests: {cpu: 500m, memory: 3Gi}
            limits: {memory: 6Gi}
          volumeMounts:
            - {name: models, mountPath: /data/models}
            - {name: tmp, mountPath: /tmp}
            - {name: home, mountPath: /home/whisperuser}
            - {name: office, mountPath: /etc/office/sitecustomize.py, subPath: whisperx-sitecustomize.py, readOnly: true}
      volumes:
        - name: models
          persistentVolumeClaim: {claimName: meet-whisperx-models}
        - name: tmp
          emptyDir: {}
        - name: home
          emptyDir: {}
        - name: office
          configMap: {name: meet-patches}
---
apiVersion: v1
kind: Service
metadata: {name: meet-whisperx, namespace: office-meet}
spec:
  selector: {app.kubernetes.io/name: meet-whisperx}
  ports: [{name: http, port: 8000, targetPort: http}]
