# Meet — release 3 of 3: the surround. No staticFiles: the frontend pod serves /custom/
# itself (release.yaml).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata: {name: meet-platform, namespace: office-meet}
spec:
  interval: 30m
  dependsOn: [{name: meet}]
  chartRef: {kind: HelmChart, name: platform-app, namespace: flux-system}
  valuesFrom: [{kind: ConfigMap, name: meet-sizes, valuesKey: "platform-${SIZE}"}]
  values:
    app: meet
    baseDomain: ${BASE_DOMAIN}

    routes:
      - backend: {name: meet-frontend, port: 80}
        paths: [/]

      # Upstream's four backend prefixes. LiveKit's webhook and the summary service's hook
      # come in here too, from inside the cluster (summary-secret.yaml says why).
      - name: api
        backend: {name: meet-backend, port: 80}
        paths: [/api, /external-api, /admin, /static]
        timeout: 120s

      - name: media
        backend: {name: meet-media-proxy, port: 8080}
        paths: [/media]
        timeout: 300s

    # adr/0109: the recording behind the link atop every transcript document.
    mediaProxy:
      enabled: true
      auth: {service: meet-backend, port: 80, path: /api/v1.0/recordings/media-auth/}
      objectstore: {bucket: meet}
      locations:
        - {path: "/media/", headers: {Content-Disposition: attachment}}

    # The backend's API calls to the SFU go out to its public name (`external: 443`); the
    # `app: livekit` rule is for when that changes.
    networkPolicy:
      egress:
        - {datastore: postgres}
        - {datastore: cache}
        - {datastore: objectstore}
        - {identity: true}
        - {app: livekit, port: 7880}
        - {external: true, port: 443}

