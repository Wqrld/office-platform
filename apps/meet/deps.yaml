# Meet — release 1 of 3: what it needs before it starts. Conventions: apps/README.md.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata: {name: meet-deps, namespace: office-meet}
spec:
  interval: 30m
  chartRef: {kind: HelmChart, name: platform-deps, namespace: flux-system}
  values:
    app: meet
    env: lasuite
    baseDomain: ${BASE_DOMAIN}

    # DB_* with no prefix: Meet's settings module passes `environ_prefix=None` on every
    # database value (meet/settings.py), so the `django` profile fits as-is.
    postgres: {enabled: true}

    # `cache` only. The backend's own Celery is off (release.yaml) and would read
    # CELERY_BROKER_URL, not the profile's name. The summary service's broker URL is built
    # in summary-secret.yaml from the same `valkey-user-meet` draw, which is why the platform
    # still makes `meet` a broker password.
    cache: {enabled: true, uses: [cache]}

    # The audio egress lands here (with credentials the backend hands LiveKit per request),
    # and the summary service reads it by presigned URL. Nothing presigns to a browser, so
    # no `publicEndpoint` (adr/0110).
    objectstore:
      enabled: true
      mode: ${S3_MODE}
      quota: {maxSize: 20Gi}

    # Unprefixed OIDC_*, as the profile; the callback is /api/v1.0/callback/.
    oidc: {enabled: true}

    # DJANGO_EMAIL_*, django-configurations' default prefix, as Docs and Drive.
    smtp: {enabled: true}

    generated:
      meet-django:
        - {env: DJANGO_SECRET_KEY, draw: secretkey, generator: office-token-50}
        - {env: DJANGO_SUPERUSER_PASSWORD, draw: superuser}
    shared:
      meet-tokens:
        LIVEKIT_API_KEY: office              # the key NAME in LiveKit's `keys:`; the secret is drawn
        LIVEKIT_API_SECRET: {from: meet-service-tokens, key: livekit}
        SUMMARY_SERVICE_API_TOKEN: {from: meet-service-tokens, key: summary}
        SUMMARY_SERVICE_WEBHOOK_API_TOKEN: {from: meet-service-tokens, key: webhook}
      meet-whisperx:
        API_KEY: {from: meet-service-tokens, key: whisperx}
        HF_TOKEN: {from: huggingface, key: token}   # hand-applied, gated pyannote model (docs/install.md)
