# Meet's prerequisites.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata: {name: meet-deps, namespace: office-meet}
spec:
  interval: 30m
  chartRef: {kind: OCIRepository, name: platform-deps, namespace: flux-system}
  values:
    app: meet
    env: lasuite
    baseDomain: ${BASE_DOMAIN}

    # DB_* with no prefix: Meet's settings module passes `environ_prefix=None` on every
    # database value (meet/settings.py), so the `django` profile fits as-is.
    postgres: {enabled: true}

    # `cache` only. The backend's own Celery is OFF (CELERY_ENABLED=false in release.yaml):
    # nothing in the transcript pipeline goes through it, and Meet reads the URL as
    # CELERY_BROKER_URL, not the profile's DJANGO_CELERY_BROKER_URL. The SUMMARY service's
    # Celery does need a broker, with a password in the URL — that URL is assembled in
    # tokens.yaml from the same `valkey-user-meet` draw, which is why the platform still
    # creates a broker password for `meet` even though this block does not ask for one.
    cache: {enabled: true, uses: [cache]}

    # Bucket `meet`: the audio egress lands here (LiveKit's egress worker uploads with the
    # credentials Meet's backend hands it per request), the summary service reads it back
    # by presigned URL and writes the transcript beside it. NO `publicEndpoint`: nothing
    # presigns to a browser, so the bucket stays unpublished (adr/0110).
    objectstore:
      enabled: true
      mode: ${S3_MODE}     # the organisation's — see apps/docs/deps.yaml
      quota: {maxSize: 20Gi}

    # Open provisioning, like Drive and Calendars: a realm user who has never logged in
    # is created on first login. Meet's OIDC_* names carry no prefix and match
    # platform.oidc.env one for one; the callback is /api/v1.0/callback/ and the client's
    # redirect URI in platform/identity/realm.yaml is the wildcard.
    oidc: {enabled: true, createUser: true}

    # DJANGO_EMAIL_*: Meet's mail settings use django-configurations' default prefix
    # (meet/settings.py `EMAIL_HOST = values.Value(None)`), same as Docs and Drive.
    smtp: {enabled: true}

    # Ordered, and can never gain an entry — `refreshInterval: "0"` means written once.
    generated:
      meet-django:
        - {env: DJANGO_SECRET_KEY, draw: secretkey, generator: office-token-50}
        - {env: DJANGO_SUPERUSER_PASSWORD, draw: superuser}
    shared:
      meet-tokens:
        LIVEKIT_API_KEY: office              # the key NAME in LiveKit's `keys:`; the secret is drawn
        LIVEKIT_API_SECRET: {from: meet-service-tokens, key: livekit}
        SUMMARY_SERVICE_API_TOKEN: {from: meet-service-tokens, key: summary}
        SUMMARY_SERVICE_WEBHOOK_API_TOKEN: {from: meet-service-tokens, key: webhook}
      meet-whisperx:
        API_KEY: {from: meet-service-tokens, key: whisperx}
        HF_TOKEN: {from: huggingface, key: token}   # hand-applied, gated pyannote model (docs/install.md)
