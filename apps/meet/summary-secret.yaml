# The summary service's Secret — templated, so not a `shared:` entry in deps.yaml.
#
# AUTHORIZED_TENANTS is its whole client table as JSON (summary/core/config.py): who may
# submit jobs, where to report back, and whether transcripts may go to Docs. The webhook
# URL is the PUBLIC one: SECURE_SSL_REDIRECT 301s an in-cluster plain-http POST and the
# result never lands. The three Redis URLs all point at the BROKER (`noeviction`): a
# result lost here is a transcript that never reaches Docs.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: meet-summary, namespace: office-meet}
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: office-data}
  target:
    name: meet-summary
    creationPolicy: Owner
    template:
      data:
        AUTHORIZED_TENANTS: '[{"id": "office", "api_key": "{{ .summary }}", "webhook_url": "https://meet.${BASE_DOMAIN}/api/v1.0/recordings/external-process-hook/", "webhook_api_key": "{{ .webhook }}", "allowed_push_to_docs": true}]'
        WHISPERX_API_KEY: "{{ .whisperx }}"
        LASUITE_DOCS_SERVER_TO_SERVER_API_KEY: "{{ .docs }}"
        CELERY_BROKER_URL: "redis://meet:{{ .broker }}@valkey-broker.office-data.svc.cluster.local:6379/0"
        CELERY_RESULT_BACKEND: "redis://meet:{{ .broker }}@valkey-broker.office-data.svc.cluster.local:6379/0"
        TASK_TRACKER_REDIS_URL: "redis://meet:{{ .broker }}@valkey-broker.office-data.svc.cluster.local:6379/0"
  data:
    - {secretKey: summary, remoteRef: {key: meet-service-tokens, property: summary}}
    - {secretKey: webhook, remoteRef: {key: meet-service-tokens, property: webhook}}
    - {secretKey: whisperx, remoteRef: {key: meet-service-tokens, property: whisperx}}
    - {secretKey: docs, remoteRef: {key: meet-service-tokens, property: docs}}
    - {secretKey: broker, remoteRef: {key: valkey-user-meet, property: broker}}
