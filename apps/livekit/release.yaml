# LiveKit — release 2 of 3: the SFU and its egress worker, from livekit/livekit-helm at a
# pinned commit. No deps release: its Valkey user and API secret are assembled in
# secrets.yaml. What `postRenderers` does against the charts' grain: README.md.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata: {name: livekit, namespace: office-livekit}
spec:
  interval: 30m
  chart:
    spec:
      chart: livekit-server
      sourceRef: {kind: GitRepository, name: livekit-helm, namespace: flux-system}
      reconcileStrategy: Revision
  install:
    remediation: {retries: 3}
  upgrade:
    remediation: {retries: 3}
  postRenderers:
    - kustomize:
        patches:
          - target: {kind: Deployment, name: livekit}
            patch: |
              # Kubernetes injects `LIVEKIT_PORT=tcp://<clusterip>:80` for the Service of the
              # same name (and LIVEKIT_MEDIA_* for the media one), and livekit-server reads
              # LIVEKIT_PORT as its `--port` flag: "could not parse tcp://… as uint". Off.
              - op: add
                path: /spec/template/spec/enableServiceLinks
                value: false
              # LIVEKIT_CONFIG is the container's first and only unconditional env var.
              - op: replace
                path: /spec/template/spec/containers/0/env/0/valueFrom
                value:
                  secretKeyRef: {name: livekit-config, key: config.yaml}
              # The same ports the chart declares, minus hostPort. `metrics` is absent
              # because `prometheus_port` is unset below.
              - op: replace
                path: /spec/template/spec/containers/0/ports
                value:
                  - {name: http, containerPort: 7880, protocol: TCP}
                  - {name: rtc-udp, containerPort: 7882, protocol: UDP}
                  - {name: rtc-tcp, containerPort: 7881, protocol: TCP}
                  - {name: turn-udp, containerPort: 3478, protocol: UDP}
  valuesFrom: [{kind: ConfigMap, name: livekit-sizes, valuesKey: "${SIZE}"}]
  values:
    # The chart's appVersion lags what LiveKit ships; updatecli moves this.
    image:
      repository: livekit/livekit-server
      tag: v1.13.11

    # The Service's name, which surround.yaml and secrets.yaml use.
    fullnameOverride: livekit
    # ONE at every size, not a size: one address fronts one pod (apps/README.md, Sizing).
    replicaCount: 1

    # Only the ports, which the Service reads too: keep them equal to secrets.yaml's.
    livekit:
      port: 7880
      rtc: {tcp_port: 7881, udp_port: 7882}

    storeKeysInSecret: {enabled: false}
    podHostNetwork: false
    loadBalancer: {type: disable}
    turnLoadbalancer: {enable: false}
    autoscaling: {enabled: false}
    serviceMonitor: {create: false}

    # Not the chart's five hours: one replica has nothing to drain to, and a five-hour
    # Terminating pod is a stuck upgrade.
    terminationGracePeriodSeconds: 600

    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      seccompProfile: {type: RuntimeDefault}
    # The server writes nothing, not even /tmp.
    securityContext:
      allowPrivilegeEscalation: false
      capabilities: {drop: [ALL]}
      readOnlyRootFilesystem: true
---
# Egress, the recorder: it joins the room as a hidden participant, renders it in a headless
# Chrome (hence its memory, even for audio only) and uploads. Config from a Secret, as above.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata: {name: livekit-egress, namespace: office-livekit}
spec:
  interval: 30m
  dependsOn: [{name: livekit}]
  chart:
    spec:
      chart: egress
      sourceRef: {kind: GitRepository, name: livekit-helm, namespace: flux-system}
      reconcileStrategy: Revision
  install:
    remediation: {retries: 3}
  upgrade:
    remediation: {retries: 3}
  postRenderers:
    - kustomize:
        patches:
          - target: {kind: Deployment, name: livekit-egress}
            patch: |
              - op: replace
                path: /spec/template/spec/containers/0/env/0/valueFrom
                value:
                  secretKeyRef: {name: egress-config, key: config.yaml}
              # Read-only root (securityContext below). The chart has no volumes: Chrome,
              # PulseAudio and the entrypoint write only under $HOME and /tmp.
              - op: add
                path: /spec/template/spec/volumes
                value: [{name: home, emptyDir: {}}, {name: tmp, emptyDir: {}}]
              - op: add
                path: /spec/template/spec/containers/0/volumeMounts
                value: [{name: home, mountPath: /home/egress}, {name: tmp, mountPath: /tmp}]
  valuesFrom: [{kind: ConfigMap, name: livekit-sizes, valuesKey: "egress-${SIZE}"}]
  values:
    image:
      repository: livekit/egress
      tag: v1.15.0
    fullnameOverride: livekit-egress

    # The chart reads `health_port` to declare the probes' port. No `prometheus_port`:
    # nothing scrapes it.
    egress:
      log_level: info
      health_port: 8080
      prometheus_port: null

    autoscaling: {enabled: false}

    # The chart's hour: killing an egress mid-way loses the recording.
    terminationGracePeriodSeconds: 3600

    # The image's own `egress` user; stating it makes the PSA audit agree.
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1001
      seccompProfile: {type: RuntimeDefault}
    securityContext:
      allowPrivilegeEscalation: false
      capabilities: {drop: [ALL]}
      readOnlyRootFilesystem: true
