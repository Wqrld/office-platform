# LiveKit's and Egress's WHOLE configuration files, as Secrets: each holds the Redis
# password and the API secret, so release.yaml's postRenderers point the charts' config
# variable here instead of at their ConfigMaps. The API secret is the one Meet reads too
# (`meet-tokens`, apps/meet/deps.yaml). `{{ .x }}` is ESO's syntax; Flux's never collides.
#
# Why each setting (config-sample.yaml in livekit/livekit is the reference):
#   rtc.node_ip       what ICE candidates advertise: the Gateway's address, where the media
#                     listeners are (adr/0113); use_external_ip would STUN-find the node's.
#   rtc.udp_port      ONE multiplexed port: a range is 10k Service ports, which MetalLB and
#                     kube-proxy handle badly.
#   turn.udp_port     UDP only: TURN/TLS would need turn.* on the certificate (README.md).
#   webhook           signed with the key in `keys:`. The PUBLIC URL: SECURE_SSL_REDIRECT
#                     301s a pod-to-pod POST and egress_ended is lost.
#   redis.db 1        db 0 is the Celery queues; a FLUSHDB on one cannot reach the other.
#                     The ACL user is what isolates them.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: livekit-config, namespace: office-livekit}
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: office-data}
  target:
    name: livekit-config
    creationPolicy: Owner
    template:
      data:
        config.yaml: |
          port: 7880
          log_level: info
          rtc:
            tcp_port: 7881
            udp_port: 7882
            use_external_ip: false
            node_ip: ${GATEWAY_IP}
          redis:
            address: valkey-broker.office-data.svc.cluster.local:6379
            username: livekit
            password: "{{ .broker }}"
            db: 1
          keys:
            office: "{{ .livekit }}"
          webhook:
            api_key: office
            urls:
              - https://meet.${BASE_DOMAIN}/api/v1.0/rooms/webhooks-livekit/
          turn:
            enabled: true
            domain: turn.${BASE_DOMAIN}
            udp_port: 3478
  data:
    - {secretKey: broker, remoteRef: {key: valkey-user-livekit, property: broker}}
    - {secretKey: livekit, remoteRef: {key: meet-service-tokens, property: livekit}}
---
# Egress joins rooms at the in-cluster signaling address; `insecure` (TLS verification, not
# auth) lets it take `ws://`. No `s3:`: Meet's backend passes the bucket and credentials
# with every request (core/recording/worker/factories.py).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: egress-config, namespace: office-livekit}
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: office-data}
  target:
    name: egress-config
    creationPolicy: Owner
    template:
      data:
        config.yaml: |
          api_key: office
          api_secret: "{{ .livekit }}"
          ws_url: ws://livekit.office-livekit.svc.cluster.local:80
          insecure: true
          log_level: info
          health_port: 8080
          redis:
            address: valkey-broker.office-data.svc.cluster.local:6379
            username: livekit
            password: "{{ .broker }}"
            db: 1
  data:
    - {secretKey: broker, remoteRef: {key: valkey-user-livekit, property: broker}}
    - {secretKey: livekit, remoteRef: {key: meet-service-tokens, property: livekit}}
