# LiveKit's and Egress's WHOLE configuration files, as Secrets.
#
# Both charts pass their config as one YAML document in one environment variable
# (`LIVEKIT_CONFIG`, `EGRESS_CONFIG_BODY`) read from a ConfigMap the chart renders from
# `.Values.livekit` / `.Values.egress`. That document holds the Redis password and the API
# secret. Putting those in a HelmRelease's values puts them in git, so the chart's
# ConfigMap is left holding a placeholder and release.yaml's postRenderers point the
# variable at THESE Secrets instead. ESO assembles them from the platform's generated
# values: the API secret from meet-service-tokens (Meet's backend and egress read the same
# one — `meet-tokens` in apps/meet/deps.yaml) and the Valkey password from valkey-user-livekit.
#
# `{{ .x }}` is ESO's template syntax and `${X}` is Flux's; the two never collide.
#
# What the config says, and why (config-sample.yaml in livekit/livekit is the reference):
#   rtc.node_ip       the address ICE candidates advertise: the Gateway's, where the media
#                     listeners are (surround.yaml, adr/0113) — not the pod's, not the node's.
#   rtc.use_external_ip  off — it would STUN-discover the node's own address, which is
#                     not where the Gateway listens.
#   rtc.udp_port      ONE multiplexed UDP port rather than a range: a range is 10k
#                     Service ports, and MetalLB/kube-proxy scale badly with those.
#   turn.udp_port     TURN over UDP only. TURN/TLS would need turn.* on the certificate,
#                     and Envoy already terminates :443 — README.md.
#   webhook           LiveKit → Meet. Signed with the API key/secret pair, so `api_key`
#                     names the key in `keys:`, and Meet verifies with the same secret.
#                     The PUBLIC URL, not the backend Service: Meet's Production settings
#                     set SECURE_SSL_REDIRECT, so a plain-http pod-to-pod POST gets a 301
#                     and the egress_ended event is lost. Same hairpin Docs → Find uses.
#   redis.db 1        the broker's db 0 is the Celery queues (Docs, Drive, Meet summary);
#                     LiveKit's keyspace is its own db so `FLUSHDB` on one cannot reach
#                     the other. The ACL user is what actually isolates them.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: livekit-config, namespace: office-livekit}
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: office-data}
  target:
    name: livekit-config
    creationPolicy: Owner
    template:
      data:
        config.yaml: |
          port: 7880
          log_level: info
          rtc:
            tcp_port: 7881
            udp_port: 7882
            use_external_ip: false
            node_ip: ${GATEWAY_IP}
          redis:
            address: valkey-broker.office-data.svc.cluster.local:6379
            username: livekit
            password: "{{ .broker }}"
            db: 1
          keys:
            office: "{{ .livekit }}"
          webhook:
            api_key: office
            urls:
              - https://meet.${BASE_DOMAIN}/api/v1.0/rooms/webhooks-livekit/
          turn:
            enabled: true
            domain: turn.${BASE_DOMAIN}
            udp_port: 3478
  data:
    - {secretKey: broker, remoteRef: {key: valkey-user-livekit, property: broker}}
    - {secretKey: livekit, remoteRef: {key: meet-service-tokens, property: livekit}}
---
# Egress. `ws_url` is the in-cluster signaling address — egress joins rooms like any other
# participant, and there is no reason for that hop to go out through the Gateway.
# `insecure: true` is what makes it accept `ws://` (it is the TLS-verification flag, not
# an auth one). No `s3:` block: Meet's backend passes the bucket, endpoint and credentials
# in every egress request (core/recording/worker/factories.py), so egress holds none.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: egress-config, namespace: office-livekit}
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: office-data}
  target:
    name: egress-config
    creationPolicy: Owner
    template:
      data:
        config.yaml: |
          api_key: office
          api_secret: "{{ .livekit }}"
          ws_url: ws://livekit.office-livekit.svc.cluster.local:80
          insecure: true
          log_level: info
          health_port: 8080
          redis:
            address: valkey-broker.office-data.svc.cluster.local:6379
            username: livekit
            password: "{{ .broker }}"
            db: 1
  data:
    - {secretKey: broker, remoteRef: {key: valkey-user-livekit, property: broker}}
    - {secretKey: livekit, remoteRef: {key: meet-service-tokens, property: livekit}}
