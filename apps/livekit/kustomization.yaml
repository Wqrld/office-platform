apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../namespace.yaml
  - secrets.yaml
  - release.yaml
  - surround.yaml

configMapGenerator:
  - name: livekit-sizes
    namespace: office-livekit
    files:
      - small=sizes/small.yaml
      - medium=sizes/medium.yaml
      - large=sizes/large.yaml
      - egress-small=sizes/egress-small.yaml
      - egress-medium=sizes/egress-medium.yaml
      - egress-large=sizes/egress-large.yaml
      - platform-small=../sizes-no-pdb.yaml
      - platform-medium=../sizes-no-pdb.yaml
      - platform-large=sizes/platform-large.yaml
    options:
      disableNameSuffixHash: true
      labels: {reconcile.fluxcd.io/watch: Enabled}
