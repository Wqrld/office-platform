# LiveKit's surround: one HTTPRoute for signaling, three L4 routes for media.
#
# Everything enters through the Gateway on ${GATEWAY_IP}, media included (adr/0113): a
# TCPRoute and two UDPRoutes attach to the Gateway's media listeners and Envoy proxies
# the packets to the pod. The signaling WebSocket is an ordinary route like any app's —
# that is where the certificate is, and `wss://livekit.${BASE_DOMAIN}` is what Meet hands
# the browser. The chart's ClusterIP Service already carries 7880/7881/7882; TURN's 3478
# gets a Service of its own here. `extraObjects` because platform-app knows only HTTP
# routes (history/design/05-app-contract.md tier 3).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata: {name: livekit-platform, namespace: office-livekit}
spec:
  interval: 30m
  dependsOn: [{name: livekit}]
  chartRef: {kind: OCIRepository, name: platform-app, namespace: flux-system}
  # The disruption budget comes with the size (sizes/platform-large.yaml; none below).
  valuesFrom: [{kind: ConfigMap, name: livekit-sizes, valuesKey: "platform-${SIZE}"}]
  values:
    app: livekit
    baseDomain: ${BASE_DOMAIN}

    routes:
      # Signaling. `websocket: true` sets the connection idle timeout to the platform's
      # 24h rather than Envoy's default — a call is one WebSocket that lasts the meeting.
      # The chart's Service maps 80 → 7880.
      - backend: {name: livekit, port: 80}
        paths: [/]
        websocket: true

    extraObjects:
      # Port numbers duplicated from secrets.yaml's config on purpose: a route cannot read
      # a Secret, and a mismatch is "media never connects" with no error anywhere.
      - apiVersion: v1
        kind: Service
        metadata: {name: livekit-turn, namespace: office-livekit}
        spec:
          selector:
            app.kubernetes.io/name: livekit-server
            app.kubernetes.io/instance: livekit
          ports: [{name: turn-udp, port: 3478, targetPort: 3478, protocol: UDP}]
      - apiVersion: gateway.networking.k8s.io/v1alpha2
        kind: TCPRoute
        metadata: {name: livekit-rtc-tcp, namespace: office-livekit}
        spec:
          parentRefs: [{name: office, namespace: office-system, sectionName: rtc-tcp}]
          rules: [{backendRefs: [{name: livekit, port: 7881}]}]
      - apiVersion: gateway.networking.k8s.io/v1alpha2
        kind: UDPRoute
        metadata: {name: livekit-rtc-udp, namespace: office-livekit}
        spec:
          parentRefs: [{name: office, namespace: office-system, sectionName: rtc-udp}]
          rules: [{backendRefs: [{name: livekit, port: 7882}]}]
      - apiVersion: gateway.networking.k8s.io/v1alpha2
        kind: UDPRoute
        metadata: {name: livekit-turn-udp, namespace: office-livekit}
        spec:
          parentRefs: [{name: office, namespace: office-system, sectionName: turn-udp}]
          rules: [{backendRefs: [{name: livekit-turn, port: 3478}]}]

    # `cache` is the Valkey broker; `external: 443` is the webhook to Meet's backend, which
    # goes out through the Gateway (secrets.yaml says why).
    networkPolicy:
      egress:
        - {datastore: cache}
        - {external: true, port: 443}

