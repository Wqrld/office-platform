# One application's namespace. `gateway-access` is the Gateway's allowedRoutes selector:
# without it a route attaches to nothing, silently. PSA `baseline` for Collabora's
# capabilities (its README); `restricted` stays on audit/warn.
apiVersion: v1
kind: Namespace
metadata:
  name: office-${APP}
  labels:
    office.haaijer.dev/gateway-access: "true"
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
# Every pod runs as `default` and none calls the Kubernetes API.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: office-${APP}
automountServiceAccountToken: false
---
# `defaultRequest` only, so it refuses nothing (platform/guardrails.yaml).
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: office-${APP}
spec:
  limits:
    - type: Container
      defaultRequest: {cpu: 25m, memory: 64Mi}
