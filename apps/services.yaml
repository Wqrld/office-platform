# The suite's service list, served by each app as /custom/services.json (apps/README.md,
# The switcher). The "\n" is load-bearing: Flux substitutes on the YAML text, and a one-line
# value that starts with `{` would be read back as a map; with a newline it is a string.
apiVersion: v1
kind: ConfigMap
metadata:
  name: office-services
  namespace: office-${APP}
data:
  services.json: "${SERVICES_JSON}\n"
