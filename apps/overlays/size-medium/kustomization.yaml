# Size profile `medium` — the applications. 50-500 people.
#
# DELIBERATELY EMPTY, AND THAT IS THE POINT. The numbers in `apps/*/release.yaml` were
# measured against the running platform, and they are medium's numbers. Restating them here
# would put every resource figure in two places, which is the failure this whole layout
# exists to avoid.
#
# So `medium` is the identity profile: selecting it renders byte-for-byte what `path: ./apps`
# rendered before profiles existed. `config/measure.py --compare` asserts exactly that, and
# it is the check that makes switching prod onto the profile mechanism a no-op rather than a
# migration.
#
# The consequence to know: a `small` entry is a DIFF against these files, so changing a
# number in `apps/*/release.yaml` moves medium and large and leaves small where it was.
# That is the right default — small is the exception being carved out — but it means the
# small profile has to be re-read when a base number changes, not just when an app is added.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Kustomize refuses a component whose kustomization.yaml carries nothing but its own
# apiVersion and kind ("kustomization.yaml is empty"), so the empty profile has to say
# `patches: []` out loud. That is a tooling requirement, not a placeholder — do not read it
# as an invitation to fill it in.
patches: []
