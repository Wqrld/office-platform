# Size profile `small` — the applications. 5-50 people, one node, no HA. README.md is the
# mechanism; two things to know when editing:
#
# EVERY PATCH IS NAME-TARGETED. An untargeted `kind: HelmRelease` patch would apply one
# values path to every release, and a path a chart does not have is a silent no-op.
#
# Requests are what the scheduler reads, so requests are what this profile moves; memory
# limits move with them. CPU limits stay unset everywhere (throttling a demo is worse than
# letting it burst into idle capacity).
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

patches:
  # ---------------------------------------------------------------- docs
  # `celery.args` is a list, so the full command is restated with the size's concurrency.
  - target: {kind: HelmRelease, name: docs, namespace: office-docs}
    patch: |
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata: {name: docs, namespace: office-docs}
      spec:
        values:
          backend:
            resources:
              requests: {cpu: 50m, memory: 512Mi}
              limits: {memory: 1Gi}
            celery:
              args: ["celery", "-A", "impress.celery_app", "worker", "-l", "INFO",
                     "-n", "impress@%h", "--concurrency", "1"]
              resources:
                requests: {cpu: 25m, memory: 256Mi}
                limits: {memory: 768Mi}
          frontend:
            resources:
              requests: {cpu: 25m, memory: 96Mi}
              limits: {memory: 384Mi}
          yProvider:
            resources:
              requests: {cpu: 25m, memory: 160Mi}
              limits: {memory: 384Mi}
          docSpec:
            resources:
              requests: {cpu: 25m, memory: 192Mi}
              limits: {memory: 512Mi}

  # ---------------------------------------------------------------- drive
  # `celeryWorkers` is a LIST, and the list carries `probes` — the chart dereferences
  # `$worker.probes.liveness` with no nil guard, so a merge patch that replaces the list
  # with a resources-only entry is a render-time nil pointer, not a smaller worker.
  # JSON6902 addresses the element in place and leaves probes, args and name untouched.
  - target: {kind: HelmRelease, name: drive, namespace: office-drive}
    patch: |
      - op: replace
        path: /spec/values/backend/celeryWorkers/0/resources
        value:
          requests: {cpu: 25m, memory: 256Mi}
          limits: {memory: 768Mi}
      - op: replace
        path: /spec/values/backend/celeryWorkers/0/args
        value: ["celery", "-A", "drive.celery_app", "worker", "-l", "INFO",
                "-n", "drive@%h", "--concurrency", "1"]

  - target: {kind: HelmRelease, name: drive, namespace: office-drive}
    patch: |
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata: {name: drive, namespace: office-drive}
      spec:
        values:
          backend:
            resources:
              requests: {cpu: 50m, memory: 448Mi}
              limits: {memory: 1Gi}
            # Beat is a clock, not a worker: it holds one Django process and never more
            # than one replica, at any size.
            celeryBeat:
              replicas: 1
              resources:
                requests: {cpu: 10m, memory: 128Mi}
                limits: {memory: 384Mi}
          frontend:
            resources:
              requests: {cpu: 25m, memory: 96Mi}
              limits: {memory: 384Mi}

  # ---------------------------------------------------------------- find
  # One workload. Find holds a Django process and an OpenSearch client; the index itself
  # lives in office-data, so this pod stays small at every size.
  - target: {kind: HelmRelease, name: find, namespace: office-find}
    patch: |
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata: {name: find, namespace: office-find}
      spec:
        values:
          backend:
            resources:
              requests: {cpu: 25m, memory: 256Mi}
              limits: {memory: 768Mi}

  # ---------------------------------------------------------------- collabora
  # `replicaCount` is deliberately NOT in this profile, at any size. One replica is a
  # correctness constraint, not a sizing choice: viewers of one document must all reach the
  # pod holding it, which needs affinity on the WOPISrc query parameter, and Envoy Gateway's
  # consistent hash cannot key on a query parameter. Two replicas is two divergent
  # documents. See apps/collabora/release.yaml.
  - target: {kind: HelmRelease, name: collabora, namespace: office-collabora}
    patch: |
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata: {name: collabora, namespace: office-collabora}
      spec:
        values:
          resources:
            requests: {cpu: 50m, memory: 384Mi}
            limits: {memory: 1Gi}

  # ---------------------------------------------------------------- calendars
  # Four workloads, and the worker is the one that matters: `WORKER_CONCURRENCY` is a
  # sizing decision, not a tuning knob — worker.py's argparse default is 4 processes, each
  # a full Django. One is right at this size.
  #
  # The three install Jobs inherit `backend.resources` and run alongside the workloads, so
  # the install PEAK is roughly these numbers plus another backend's worth. Read the peak.
  - target: {kind: HelmRelease, name: calendars, namespace: office-calendars}
    patch: |
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata: {name: calendars, namespace: office-calendars}
      spec:
        values:
          backend:
            resources:
              requests: {cpu: 50m, memory: 384Mi}
              limits: {memory: 1Gi}
            envVars:
              WORKER_CONCURRENCY: "1"
            worker:
              resources:
                requests: {cpu: 25m, memory: 256Mi}
                limits: {memory: 768Mi}
          frontend:
            resources:
              requests: {cpu: 10m, memory: 64Mi}
              limits: {memory: 128Mi}
          caldav:
            resources:
              requests: {cpu: 25m, memory: 128Mi}
              limits: {memory: 384Mi}

  # ---------------------------------------------------------------- meet
  # Five sized workloads (four more run at zero replicas at every size). The summary
  # workers are `--pool=solo` upstream, so there is no concurrency to lower — memory is
  # the whole story, and the transcribe worker's is ffmpeg on a meeting's worth of audio.
  - target: {kind: HelmRelease, name: meet, namespace: office-meet}
    patch: |
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata: {name: meet, namespace: office-meet}
      spec:
        values:
          backend:
            resources:
              requests: {cpu: 50m, memory: 384Mi}
              limits: {memory: 1Gi}
          frontend:
            resources:
              requests: {cpu: 10m, memory: 64Mi}
              limits: {memory: 128Mi}
          summary:
            resources:
              requests: {cpu: 10m, memory: 128Mi}
              limits: {memory: 384Mi}
          celeryTranscribe:
            resources:
              requests: {cpu: 25m, memory: 192Mi}
              limits: {memory: 768Mi}
          celerySummaryBackend:
            resources:
              requests: {cpu: 10m, memory: 96Mi}
              limits: {memory: 256Mi}

  # The one non-chart workload with a profile: a plain Deployment, so a plain merge patch.
  # Whisper `small` needs ~2Gi resident; the limit is the ffmpeg-decoded audio on top.
  - target: {kind: Deployment, name: meet-whisperx, namespace: office-meet}
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: meet-whisperx, namespace: office-meet}
      spec:
        template:
          spec:
            containers:
              - name: whisperx
                resources:
                  requests: {cpu: 250m, memory: 2Gi}
                  limits: {memory: 4Gi}

  # ---------------------------------------------------------------- livekit
  # The SFU is one process at every size (its media ports are per node); egress is Chrome.
  - target: {kind: HelmRelease, name: livekit, namespace: office-livekit}
    patch: |
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata: {name: livekit, namespace: office-livekit}
      spec:
        values:
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 512Mi}

  - target: {kind: HelmRelease, name: livekit-egress, namespace: office-livekit}
    patch: |
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata: {name: livekit-egress, namespace: office-livekit}
      spec:
        values:
          resources:
            requests: {cpu: 100m, memory: 768Mi}
            limits: {memory: 2Gi}
