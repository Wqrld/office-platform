# Size profile `small` — the applications. 5-50 people, one node, no HA.
#
# THIS IS A KUSTOMIZE COMPONENT, NOT A PATCH FILE. The design set (03-repo-layout.md) says
# "one file per profile"; a plain patch file cannot hold both strategic-merge and JSON6902
# entries, and Drive needs JSON6902 — see `celeryWorkers` below. A Component is the same
# one-file-per-profile property with both patch kinds available, so the profile stays a
# single self-contained unit instead of splintering into a file per patch kind.
#
# WHY THIS IS NOT IN platform-lib. The numbers below land in DINUM's and Collabora's chart
# values, rendered by helm-controller from THEIR HelmReleases. Our library chart is not in
# that render at all, and the three charts share no values schema — `backend.resources`,
# `celeryWorkers[0].resources` and a bare `resources` are three different paths for the
# same concept. A profile that lived in platform-lib could not reach any of them.
# 00-start-here.md #13 already records this; it is restated here because the obvious
# refactor ("put the table in the library chart") looks right and silently no-ops.
#
# EVERY PATCH IS NAME-TARGETED. An untargeted `kind: HelmRelease` patch would apply one
# values path to every release, and a path a chart does not have is a silent no-op, not an
# error.
#
# Requests are what the scheduler reads, so requests are what this profile moves. Memory
# limits move with them because a limit far above a small request is an OOM the node
# absorbs rather than the pod; CPU limits stay unset everywhere (throttling a demo is worse
# than letting it burst into idle capacity).
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

patches:
  # ---------------------------------------------------------------- docs
  # Five workloads. Everything here is a map merge, except `celery.args`, which is a list:
  # a JSON merge patch replaces a list wholesale, so the full command is restated. That is
  # correct rather than lossy — the concurrency IS the sizing decision for a Celery worker,
  # and upstream's argless default preforks one process per CPU (ten on this node), which
  # is an OOMKill within seconds of a clean start.
  - target: {kind: HelmRelease, name: docs, namespace: office-docs}
    patch: |
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata: {name: docs, namespace: office-docs}
      spec:
        values:
          backend:
            resources:
              requests: {cpu: 50m, memory: 512Mi}
              limits: {memory: 1Gi}
            celery:
              args: ["celery", "-A", "impress.celery_app", "worker", "-l", "INFO",
                     "-n", "impress@%h", "--concurrency", "1"]
              resources:
                requests: {cpu: 25m, memory: 256Mi}
                limits: {memory: 768Mi}
          frontend:
            resources:
              requests: {cpu: 25m, memory: 96Mi}
              limits: {memory: 384Mi}
          yProvider:
            resources:
              requests: {cpu: 25m, memory: 160Mi}
              limits: {memory: 384Mi}
          docSpec:
            resources:
              requests: {cpu: 25m, memory: 192Mi}
              limits: {memory: 512Mi}

  # ---------------------------------------------------------------- drive
  # `celeryWorkers` is a LIST, and the list carries `probes` — the chart dereferences
  # `$worker.probes.liveness` with no nil guard, so a merge patch that replaces the list
  # with a resources-only entry is a render-time nil pointer, not a smaller worker.
  # JSON6902 addresses the element in place and leaves probes, args and name untouched.
  - target: {kind: HelmRelease, name: drive, namespace: office-drive}
    patch: |
      - op: replace
        path: /spec/values/backend/celeryWorkers/0/resources
        value:
          requests: {cpu: 25m, memory: 256Mi}
          limits: {memory: 768Mi}
      - op: replace
        path: /spec/values/backend/celeryWorkers/0/args
        value: ["celery", "-A", "drive.celery_app", "worker", "-l", "INFO",
                "-n", "drive@%h", "--concurrency", "1"]

  - target: {kind: HelmRelease, name: drive, namespace: office-drive}
    patch: |
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata: {name: drive, namespace: office-drive}
      spec:
        values:
          backend:
            resources:
              requests: {cpu: 50m, memory: 448Mi}
              limits: {memory: 1Gi}
            # Beat is a clock, not a worker: it holds one Django process and never more
            # than one replica, at any size.
            celeryBeat:
              replicas: 1
              resources:
                requests: {cpu: 10m, memory: 128Mi}
                limits: {memory: 384Mi}
          frontend:
            resources:
              requests: {cpu: 25m, memory: 96Mi}
              limits: {memory: 384Mi}

  # ---------------------------------------------------------------- find
  # One workload. Find holds a Django process and an OpenSearch client; the index itself
  # lives in office-data, so this pod stays small at every size.
  - target: {kind: HelmRelease, name: find, namespace: office-find}
    patch: |
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata: {name: find, namespace: office-find}
      spec:
        values:
          backend:
            resources:
              requests: {cpu: 25m, memory: 256Mi}
              limits: {memory: 768Mi}

  # ---------------------------------------------------------------- collabora
  # `replicaCount` is deliberately NOT in this profile, at any size. One replica is a
  # correctness constraint, not a sizing choice: viewers of one document must all reach the
  # pod holding it, which needs affinity on the WOPISrc query parameter, and Envoy Gateway's
  # consistent hash cannot key on a query parameter. Two replicas is two divergent
  # documents. See apps/collabora/release.yaml.
  - target: {kind: HelmRelease, name: collabora, namespace: office-collabora}
    patch: |
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata: {name: collabora, namespace: office-collabora}
      spec:
        values:
          resources:
            requests: {cpu: 50m, memory: 384Mi}
            limits: {memory: 1Gi}

  # ---------------------------------------------------------------- calendars
  # Four workloads, and the worker is the one that matters: `WORKER_CONCURRENCY` is a
  # sizing decision, not a tuning knob — worker.py's argparse default is 4 processes, each
  # a full Django. One is right at this size.
  #
  # The three install Jobs inherit `backend.resources` and run alongside the workloads, so
  # the install PEAK is roughly these numbers plus another backend's worth. Read the peak.
  - target: {kind: HelmRelease, name: calendars, namespace: office-calendars}
    patch: |
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata: {name: calendars, namespace: office-calendars}
      spec:
        values:
          backend:
            resources:
              requests: {cpu: 50m, memory: 384Mi}
              limits: {memory: 1Gi}
            envVars:
              WORKER_CONCURRENCY: "1"
            worker:
              resources:
                requests: {cpu: 25m, memory: 256Mi}
                limits: {memory: 768Mi}
          frontend:
            resources:
              requests: {cpu: 10m, memory: 64Mi}
              limits: {memory: 128Mi}
          caldav:
            resources:
              requests: {cpu: 25m, memory: 128Mi}
              limits: {memory: 384Mi}
