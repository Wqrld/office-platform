# Size profile `large` — the applications. 500-5,000 people.
#
# NOT VALIDATED AGAINST A RUNNING CLUSTER. This platform has one node; nothing below has
# ever been rendered against real load, and the replica counts are a shape, not a
# measurement. It is written anyway because the invariant it carries is checkable without a
# big cluster — `replicas > 1` must come with a PDB, in the same file, set by the same hand
# (history/design/05-app-contract.md) — and because an unwritten profile is where the 5-to-5,000 claim
# quietly stops being true.
#
# Treat the numbers as a starting point to measure from. Treat the replica/PDB pairing as
# load-bearing: the surround cannot read the upstream release's replica count, so nothing
# else can infer it.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

patches:
  - target: {kind: HelmRelease, name: docs, namespace: office-docs}
    patch: |
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata: {name: docs, namespace: office-docs}
      spec:
        values:
          backend:
            replicas: 3
            resources:
              requests: {cpu: 500m, memory: 1Gi}
              limits: {memory: 3Gi}
            celery:
              replicas: 2
              args: ["celery", "-A", "impress.celery_app", "worker", "-l", "INFO",
                     "-n", "impress@%h", "--concurrency", "4"]
              resources:
                requests: {cpu: 250m, memory: 768Mi}
                limits: {memory: 2Gi}
          frontend:
            replicas: 3
            resources:
              requests: {cpu: 100m, memory: 256Mi}
              limits: {memory: 768Mi}
          yProvider:
            replicas: 2
            resources:
              requests: {cpu: 250m, memory: 512Mi}
              limits: {memory: 1Gi}
          docSpec:
            replicas: 2
            resources:
              requests: {cpu: 250m, memory: 512Mi}
              limits: {memory: 2Gi}

  - target: {kind: HelmRelease, name: drive, namespace: office-drive}
    patch: |
      - op: replace
        path: /spec/values/backend/celeryWorkers/0/replicas
        value: 2
      - op: replace
        path: /spec/values/backend/celeryWorkers/0/resources
        value:
          requests: {cpu: 250m, memory: 768Mi}
          limits: {memory: 2Gi}

  - target: {kind: HelmRelease, name: drive, namespace: office-drive}
    patch: |
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata: {name: drive, namespace: office-drive}
      spec:
        values:
          backend:
            replicas: 3
            resources:
              requests: {cpu: 500m, memory: 1Gi}
              limits: {memory: 3Gi}
            # Still one. Two beats is two schedulers firing the same crontab, which for
            # Drive means two WOPI reconfigurations racing each other every ten minutes.
            celeryBeat:
              replicas: 1
          frontend:
            replicas: 3
            resources:
              requests: {cpu: 100m, memory: 256Mi}
              limits: {memory: 768Mi}

  # Collabora is absent on purpose at every size — see the note in size-small. Scaling it
  # needs the chart's `reverseProxy` sidecar and a WOPI proof key, which is a design change,
  # not a profile entry.

  - target: {kind: HelmRelease, name: find, namespace: office-find}
    patch: |
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata: {name: find, namespace: office-find}
      spec:
        values:
          backend:
            replicas: 3
            resources:
              requests: {cpu: 250m, memory: 512Mi}
              limits: {memory: 1536Mi}

  - target: {kind: HelmRelease, name: calendars, namespace: office-calendars}
    patch: |
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata: {name: calendars, namespace: office-calendars}
      spec:
        values:
          backend:
            replicas: 3
            resources:
              requests: {cpu: 500m, memory: 1Gi}
              limits: {memory: 3Gi}
            envVars:
              WORKER_CONCURRENCY: "4"
            worker:
              replicas: 2
              resources:
                requests: {cpu: 250m, memory: 768Mi}
                limits: {memory: 2Gi}
          frontend:
            replicas: 3
            resources:
              requests: {cpu: 100m, memory: 128Mi}
              limits: {memory: 384Mi}
          # caldav stays at ONE, and not because it is stateful — every byte it owns is in
          # Postgres. It stays at one because nothing here has ever run two of them, and a
          # second SabreDAV is only reached through Django's proxy anyway, so the capacity
          # it would add is capacity the backend has to feed it first. Raise it with the
          # backend, after measuring, and add its PDB in the same edit.
          caldav:
            resources:
              requests: {cpu: 100m, memory: 256Mi}
              limits: {memory: 1Gi}

  # ---------------------------------------------------------------- meet
  - target: {kind: HelmRelease, name: meet, namespace: office-meet}
    patch: |
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata: {name: meet, namespace: office-meet}
      spec:
        values:
          backend:
            replicas: 3
            resources:
              requests: {cpu: 250m, memory: 768Mi}
              limits: {memory: 2Gi}
          frontend:
            replicas: 3
            resources:
              requests: {cpu: 50m, memory: 128Mi}
              limits: {memory: 256Mi}
          summary:
            replicas: 2
            resources:
              requests: {cpu: 50m, memory: 256Mi}
              limits: {memory: 768Mi}
          # `replicas` here reaches the one instance in `instances` (the chart merges the
          # instance over these values), so no JSON6902 into the list is needed.
          celeryTranscribe:
            replicas: 2
            resources:
              requests: {cpu: 100m, memory: 512Mi}
              limits: {memory: 2Gi}
          celerySummaryBackend:
            resources:
              requests: {cpu: 10m, memory: 128Mi}
              limits: {memory: 384Mi}

  # Whisper on CPU does not scale out usefully — one transcript already takes most of a
  # node — and a second replica is a second PVC's worth of models. At this size the answer
  # is a GPU node or an external endpoint, not more of these.
  - target: {kind: Deployment, name: meet-whisperx, namespace: office-meet}
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: meet-whisperx, namespace: office-meet}
      spec:
        template:
          spec:
            containers:
              - name: whisperx
                resources:
                  requests: {cpu: "2", memory: 4Gi}
                  limits: {memory: 8Gi}

  # ---------------------------------------------------------------- livekit
  # The SFU stays at ONE replica at every size. Its media ports are bound per node and its
  # single MetalLB address fronts one pod; a second replica needs a second address and
  # LiveKit's multi-node routing, which is a design change, not a profile.
  - target: {kind: HelmRelease, name: livekit, namespace: office-livekit}
    patch: |
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata: {name: livekit, namespace: office-livekit}
      spec:
        values:
          resources:
            requests: {cpu: "2", memory: 1Gi}
            limits: {memory: 4Gi}

  # Egress scales out cleanly (each takes jobs off the shared Redis queue); two here is
  # two simultaneous transcripts.
  - target: {kind: HelmRelease, name: livekit-egress, namespace: office-livekit}
    patch: |
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata: {name: livekit-egress, namespace: office-livekit}
      spec:
        values:
          replicaCount: 2
          resources:
            requests: {cpu: 500m, memory: 1Gi}
            limits: {memory: 4Gi}

  # PDBs belong to the surround, not to the upstream chart: `platform-app` is the one
  # release that owns routes, policy and disruption budgets (history/design/05-app-contract.md), and the
  # upstream charts each spell their own PDB differently. Enabling both would give every
  # component two budgets with two selectors.
  #
  # `components` is name -> selector, because the surround has to name the workloads it is
  # protecting; the chart cannot discover them.
  - target: {kind: HelmRelease, name: docs-platform, namespace: office-docs}
    patch: |
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata: {name: docs-platform, namespace: office-docs}
      spec:
        values:
          pdb:
            enabled: true
            maxUnavailable: 1
            components:
              # Read off the live Deployments, not guessed. Note `yProvider`: DINUM's chart
              # puts the values key verbatim into the component label, camelCase and all,
              # so a sensible-looking `y-provider` here selects nothing and the PDB silently
              # protects zero pods.
              backend:
                {app.kubernetes.io/name: docs, app.kubernetes.io/instance: docs,
                 app.kubernetes.io/component: backend}
              frontend:
                {app.kubernetes.io/name: docs, app.kubernetes.io/instance: docs,
                 app.kubernetes.io/component: frontend}
              y-provider:
                {app.kubernetes.io/name: docs, app.kubernetes.io/instance: docs,
                 app.kubernetes.io/component: yProvider}
              # The two below are scaled above one in this same file, so they need a budget
              # in it too — tests/profiles.py asserts exactly that pairing. Their component
              # labels are `celery-worker` and `docspec`, neither of which is the values key
              # that sets their replicas (`celery`, `docSpec`): read off the render, never
              # guessed.
              celery-worker:
                {app.kubernetes.io/name: docs, app.kubernetes.io/instance: docs,
                 app.kubernetes.io/component: celery-worker}
              docspec:
                {app.kubernetes.io/name: docs, app.kubernetes.io/instance: docs,
                 app.kubernetes.io/component: docspec}

  - target: {kind: HelmRelease, name: drive-platform, namespace: office-drive}
    patch: |
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata: {name: drive-platform, namespace: office-drive}
      spec:
        values:
          pdb:
            enabled: true
            maxUnavailable: 1
            components:
              backend:
                {app.kubernetes.io/name: drive, app.kubernetes.io/instance: drive,
                 app.kubernetes.io/component: backend}
              frontend:
                {app.kubernetes.io/name: drive, app.kubernetes.io/instance: drive,
                 app.kubernetes.io/component: frontend}
              # Drive names its default Celery worker after the list entry it came from, so
              # the component label is `backend-celery-worker-default` and not `celery`.
              celery-default:
                {app.kubernetes.io/name: drive, app.kubernetes.io/instance: drive,
                 app.kubernetes.io/component: backend-celery-worker-default}

  # Find scales above one replica above, so it needs a budget here — the pairing
  # tests/profiles.py asserts. One component, so one entry.
  - target: {kind: HelmRelease, name: find-platform, namespace: office-find}
    patch: |
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata: {name: find-platform, namespace: office-find}
      spec:
        values:
          pdb:
            enabled: true
            maxUnavailable: 1
            components:
              backend:
                {app.kubernetes.io/name: find, app.kubernetes.io/instance: find,
                 app.kubernetes.io/component: backend}

  - target: {kind: HelmRelease, name: calendars-platform, namespace: office-calendars}
    patch: |
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata: {name: calendars-platform, namespace: office-calendars}
      spec:
        values:
          pdb:
            enabled: true
            maxUnavailable: 1
            components:
              # Read off the render, not guessed. The worker's component label is `worker`
              # even though its values key is `backend.worker`, and its Deployment is
              # `calendars-worker`, not `calendars-backend-worker`. `caldav` is absent on
              # purpose: it is still at one replica above, and tests/profiles.py fails a
              # PDB that selects a single-replica workload.
              backend:
                {app.kubernetes.io/name: calendars, app.kubernetes.io/instance: calendars,
                 app.kubernetes.io/component: backend}
              frontend:
                {app.kubernetes.io/name: calendars, app.kubernetes.io/instance: calendars,
                 app.kubernetes.io/component: frontend}
              worker:
                {app.kubernetes.io/name: calendars, app.kubernetes.io/instance: calendars,
                 app.kubernetes.io/component: worker}

  - target: {kind: HelmRelease, name: meet-platform, namespace: office-meet}
    patch: |
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata: {name: meet-platform, namespace: office-meet}
      spec:
        values:
          pdb:
            enabled: true
            maxUnavailable: 1
            components:
              # Read off the render. The transcribe worker's pods also carry
              # `instance: default`; the three labels below are enough to select them.
              backend:
                {app.kubernetes.io/name: meet, app.kubernetes.io/instance: meet,
                 app.kubernetes.io/component: backend}
              frontend:
                {app.kubernetes.io/name: meet, app.kubernetes.io/instance: meet,
                 app.kubernetes.io/component: frontend}
              summary:
                {app.kubernetes.io/name: meet, app.kubernetes.io/instance: meet,
                 app.kubernetes.io/component: summary}
              celery-transcribe:
                {app.kubernetes.io/name: meet, app.kubernetes.io/instance: meet,
                 app.kubernetes.io/component: celery-transcribe}

  - target: {kind: HelmRelease, name: livekit-platform, namespace: office-livekit}
    patch: |
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata: {name: livekit-platform, namespace: office-livekit}
      spec:
        values:
          pdb:
            enabled: true
            maxUnavailable: 1
            components:
              # egress only: the SFU is single-replica above.
              egress:
                {app.kubernetes.io/name: egress, app.kubernetes.io/instance: livekit-egress}
