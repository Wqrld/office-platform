# Projects — release 3 of 3. Routes split only where the treatment differs: uploads want a
# body limit, socket.io must not have one or a request timeout. No media proxy: the server
# streams files from the bucket itself.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata: {name: projects-platform, namespace: office-projects}
spec:
  interval: 30m
  dependsOn: [{name: projects}]
  chartRef: {kind: HelmChart, name: platform-app, namespace: flux-system}
  valuesFrom: [{kind: ConfigMap, name: projects-sizes, valuesKey: "platform-${SIZE}"}]
  values:
    app: projects
    baseDomain: ${BASE_DOMAIN}

    routes:
      # The SPA, attachments, avatars and background images.
      - backend: {name: projects-backend, port: 80}
        paths: [/]
        timeout: 300s               # a large attachment download is slow, not hung

      # Every upload is a POST under /api: attachments, avatars, background images.
      - name: api
        backend: {name: projects-backend, port: 80}
        paths: [/api]
        requestBuffer: 100Mi
        timeout: 300s

      # The realtime channel. Most of the UI's reads and writes go over it too, not only
      # the live updates, so a dropped socket is a UI that stops saving.
      - name: socket
        backend: {name: projects-backend, port: 80}
        paths: [/socket.io]
        websocket: true

    staticFiles: {enabled: true}

    # `external: 443` is OIDC discovery and token exchange over the public issuer
    # (deps.yaml) — openid-client is given no internal endpoint to use instead.
    networkPolicy:
      egress:
        - {datastore: postgres}
        - {datastore: cache}
        - {datastore: objectstore}
        - {external: true, port: 443}
