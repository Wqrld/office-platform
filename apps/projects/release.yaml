# Projects — release 2 of 3: the application, from the in-tree chart (`src/helm/projects`,
# copied from Docs') at the fork's git tag until the upstreaming PR lands (adr/0104). One
# workload, `backend`; migrations run in `start.sh`. README.md for pins.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: projects
  namespace: office-projects
spec:
  interval: 30m
  dependsOn: [{name: projects-deps}]
  chart:
    spec:
      chart: src/helm/projects
      sourceRef: {kind: GitRepository, name: wqrld-projects, namespace: flux-system}
      reconcileStrategy: Revision
  upgrade:
    remediation:
      retries: 0
  valuesFrom: [{kind: ConfigMap, name: projects-sizes, valuesKey: "${SIZE}"}]
  values:
    # The fork's image, until upstream tags both patches (README.md, Pins).
    image:
      repository: ghcr.io/wqrld/projects
      tag: "1.3.1"

    ingress: {enabled: false}

    backend:
      pdb: {enabled: false}

      # Upstream's `USER node` is a name the kubelet cannot check against `runAsNonRoot`;
      # 1000 is `node` (README.md, upstream change 3).
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        readOnlyRootFilesystem: true
      # The app also logs to /app/logs/projects.log.
      persistence:
        tmp: {type: emptyDir, mountPath: /tmp}
        logs: {type: emptyDir, mountPath: /app/logs}

      envFrom:
        - {secretRef: {name: projects-postgres}}
        - {secretRef: {name: projects-cache}}
        - {secretRef: {name: projects-s3}}
        - {secretRef: {name: projects-oidc}}
        - {secretRef: {name: projects-smtp}}
        - {secretRef: {name: projects-app}}

      envVars:
        BASE_URL: https://projects.${BASE_DOMAIN}
        # Behind the Gateway: otherwise rate limiting, the audit trail and `secure` cookies
        # all see Envoy.
        TRUST_PROXY: "1"
        TZ: Europe/Amsterdam
        DEFAULT_LANGUAGE: nl-NL
        SERVICE_NAME: Projects
        DISABLE_INDEXING: "true"

        # The fork's patch: the private bucket's avatars are streamed too (README.md).
        S3_PROXY_PUBLIC_FILES: "true"

        # SSO only. `OIDC_ENFORCED` hides the password form; without it a local account can
        # exist beside the realm and outlive a user the realm has disabled.
        OIDC_ENFORCED: "true"
        OIDC_USE_DEFAULT_RESPONSE_MODE: "true"
        OIDC_FULLNAME_ATTRIBUTES: name
        OIDC_IGNORE_USERNAME: "true"
        # No realm role maps to Projects' admin, so nobody is one through SSO. The first
        # admin is made by hand — README.md, Install order.
        OIDC_IGNORE_ROLES: "true"
        # FREE MODE: no `ORGANIZATION_ID_CLAIM`, which this realm does not issue. Like
        # Calendars' organizations, a decision for before the tables fill up.
        ALLOW_ALL_TO_CREATE_PROJECTS: "true"

        # THE GAUFRE (apps/README.md, The switcher). `widgetPath` is a DIRECTORY the
        # component appends `lagaufre.js` to; `variant` picks the icon. THEME REPLACES the
        # built-in theme, on purpose: that drops a French-government footer and a feedback
        # menu whose links are all `#`.
        THEME: '{"gaufre":{"variant":"anct","apiUrl":"https://projects.${BASE_DOMAIN}/custom/services.json","widgetPath":"https://projects.${BASE_DOMAIN}/custom/"}}'
