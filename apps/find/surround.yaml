# Find's surround: ONE route, not mijn-bureau's `/`, `/api` and `/admin`; the admin is
# port-forward only. Published at all because a pod-to-pod call carries no
# X-Forwarded-Proto: SECURE_SSL_REDIRECT 301s it, `requests` turns the POST into a GET,
# and indexing silently does nothing.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata: {name: find-platform, namespace: office-find}
spec:
  interval: 30m
  dependsOn: [{name: find}]
  chartRef: {kind: HelmChart, name: platform-app, namespace: flux-system}
  valuesFrom: [{kind: ConfigMap, name: find-sizes, valuesKey: "platform-${SIZE}"}]
  values:
    app: find
    baseDomain: ${BASE_DOMAIN}

    routes:
      - backend: {name: find-backend, port: 80}
        paths: [/api/v1.0/documents/]

    networkPolicy:
      egress:
        - {datastore: postgres}
        - {datastore: cache}
        - {datastore: opensearch}
        - {identity: true}
        - {external: true, port: 443}

