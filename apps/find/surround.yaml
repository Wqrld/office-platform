# Find's surround. ONE route. Not `/`, not `/api`, not `/admin` — the mijn-bureau reference publishes all
# three; here the Django admin is reachable by port-forward only.
#
# It has to be published at all (rather than reached pod-to-pod) because Find's Production
# settings set SECURE_SSL_REDIRECT with SECURE_PROXY_SSL_HEADER: a direct pod-to-pod call
# carries no X-Forwarded-Proto, so Django 301s and `requests` downgrades the 301'd POST to a
# GET. Indexing then silently does nothing.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata: {name: find-platform, namespace: office-find}
spec:
  interval: 30m
  dependsOn: [{name: find}]
  chartRef: {kind: HelmChart, name: platform-app, namespace: flux-system}
  # The disruption budget comes with the size (sizes/platform-large.yaml; none below).
  valuesFrom: [{kind: ConfigMap, name: find-sizes, valuesKey: "platform-${SIZE}"}]
  values:
    app: find
    baseDomain: ${BASE_DOMAIN}

    routes:
      - backend: {name: find-backend, port: 80}
        paths: [/api/v1.0/documents/]

    networkPolicy:
      egress:
        - {datastore: postgres}
        - {datastore: cache}
        - {datastore: opensearch}
        - {identity: true}
        - {external: true, port: 443}

