# Find at `medium` — measured (apps/README.md, Sizing). One workload: a Django process and
# an OpenSearch client; the index itself lives in office-data, so this pod stays small at
# every size.
backend:
  replicas: 1                    # the chart defaults to 3
  resources:
    requests: {cpu: 50m, memory: 384Mi}
    limits: {memory: 1Gi}
