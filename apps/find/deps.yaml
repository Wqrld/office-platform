# Find's prerequisites.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata: {name: find-deps, namespace: office-find}
spec:
  interval: 30m
  chartRef: {kind: HelmChart, name: platform-deps, namespace: flux-system}
  values:
    app: find
    env: find
    baseDomain: ${BASE_DOMAIN}

    postgres: {enabled: true}

    # Cache only. Find has no Celery tasks, so it never needs a broker.
    cache: {enabled: true, uses: [cache]}

    opensearch: {enabled: true, indexPrefix: find}

    # Find is a resource SERVER: it validates access tokens other clients issued, and logs
    # nobody in. The login half of this block is emitted and unused.
    oidc:
      enabled: true
      extraEnv:
        # Must equal Keycloak's `iss` BYTE FOR BYTE, which is the external issuer even on
        # the internal Service, so it and the endpoint below disagree on purpose. A mismatch
        # reads exactly like a wrong client secret.
        OIDC_OP_URL: https://id.${BASE_DOMAIN}/realms/office
        OIDC_OP_INTROSPECTION_ENDPOINT: http://keycloak-service.office-identity.svc.cluster.local:8080/realms/office/protocol/openid-connect/token/introspect   # mirrors oidc.internalUrl
        OIDC_RS_CLIENT_ID: find
        # Resolved by ESO, not Helm: the secret never reaches Helm values (history/design/adr/0005).
        OIDC_RS_CLIENT_SECRET: "{{ .secret }}"
        OIDC_RS_SCOPES: openid

    generated:
      find-django:
        - {env: DJANGO_SECRET_KEY, draw: secretkey, generator: office-token-50}
    shared:
      find-service-token: {FIND_SERVICE_TOKEN_DOCS: {from: find-service-tokens, key: docs}}
