# Docs, from DINUM's in-tree chart at the pinned git tag v5.5.0 (adr/0104). The chart
# path is `src/helm/impress`; the chart's own name is `docs`.
#
# Values keys verified against that tag's values.yaml, because the design set gets three
# of them wrong: it is `backend.envFrom` (not envVarsFrom), `backend.pdb.enabled` (not
# podDisruptionBudget.enabled), and there is no `serviceMonitor` key — the chart ships no
# ServiceMonitor template at all.
#
# One more correction, found by server dry-run: the chart's own comment documents envFrom
# entries as `- secret: {name: ...}`. That is NOT a Kubernetes EnvFromSource. The chart
# passes the list through `toYaml` verbatim, and Kubernetes 1.34 rejects it with
# `unknown field "envFrom[0].secret"`. The entries below use `secretRef`.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: docs
  namespace: office-docs
spec:
  interval: 30m
  chart:
    spec:
      chart: src/helm/impress
      sourceRef: {kind: GitRepository, name: suitenumerique-docs, namespace: flux-system}
      reconcileStrategy: Revision
  install:
    # The chart's migrate and createsuperuser Jobs are plain Jobs with
    # ttlSecondsAfterFinished, so waiting on them races garbage collection.
    disableWaitForJobs: true
  upgrade:
    disableWaitForJobs: true
    remediation:
      # A Helm rollback reverts the code and leaves the database schema migrated. Fail
      # forward, loudly, rather than silently running old code against a new schema.
      retries: 0
  values:
    image:
      # The chart declares appVersion: latest, which is useless as a pin. Every image tag
      # is set explicitly and moves only in a reviewed commit.
      tag: v5.5.0

    # Routing is ours: HTTPRoutes on the shared Gateway, in routes.yaml. All five of the
    # chart's Ingress objects are off. They are already false by default at this tag;
    # they are stated anyway so a default flip upstream cannot quietly publish a second,
    # unauthenticated path to the application.
    ingress: {enabled: false}
    ingressAdmin: {enabled: false}
    ingressMedia: {enabled: false}
    ingressCollaborationApi: {enabled: false}
    ingressCollaborationWS: {enabled: false}
    ingressRedirects: {enabled: false}
    posthog:
      ingress: {enabled: false}
      ingressAssets: {enabled: false}

    # Unused — our own media proxy talks to Garage directly — but the chart creates this
    # ExternalName Service unconditionally, so point it somewhere true.
    serviceMedia:
      host: office-s3.office-data.svc.cluster.local
      port: 3900

    backend:
      replicas: 1
      pdb: {enabled: false}          # one replica: a PDB here can only block a drain
      resources:
        # Measured, not guessed: the backend sits at ~960Mi resident when idle, so a 1Gi
        # limit is an OOMKill waiting for the first heavy request.
        requests: {cpu: 100m, memory: 768Mi}
        limits: {memory: 2Gi}
      envFrom:
        - {secretRef: {name: docs-postgres}}
        - {secretRef: {name: docs-cache}}
        - {secretRef: {name: docs-s3}}
        - {secretRef: {name: docs-oidc}}
        - {secretRef: {name: docs-django}}
        - {secretRef: {name: docs-collaboration}}
      envVars:
        DJANGO_SETTINGS_MODULE: impress.settings
        DJANGO_CONFIGURATION: Production
        DJANGO_ALLOWED_HOSTS: docs.${BASE_DOMAIN}
        DJANGO_CSRF_TRUSTED_ORIGINS: https://docs.${BASE_DOMAIN}
        DJANGO_CORS_ALLOWED_ORIGINS: https://docs.${BASE_DOMAIN}
        DJANGO_CORS_ALLOW_ALL_ORIGINS: "false"
        DJANGO_SUPERUSER_EMAIL: admin@${BASE_DOMAIN}
        DJANGO_EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend
        DJANGO_EMAIL_BRAND_NAME: Office
        DJANGO_EMAIL_FROM: noreply@${BASE_DOMAIN}
        LANGUAGE_CODE: nl-nl
        MEDIA_BASE_URL: https://docs.${BASE_DOMAIN}
        LOGIN_REDIRECT_URL: https://docs.${BASE_DOMAIN}
        LOGIN_REDIRECT_URL_FAILURE: https://docs.${BASE_DOMAIN}
        LOGOUT_REDIRECT_URL: https://docs.${BASE_DOMAIN}
        COLLABORATION_API_URL: https://docs.${BASE_DOMAIN}/collaboration/api/
        COLLABORATION_WS_URL: wss://docs.${BASE_DOMAIN}/collaboration/ws/
        COLLABORATION_WS_NOT_CONNECTED_READY_ONLY: "true"
        Y_PROVIDER_API_BASE_URL: http://docs-y-provider:443/api/
        DOCSPEC_API_URL: http://docs-docspec:4000/conversion
        CONVERSION_API_ENDPOINT: convert
        CONVERSION_API_CONTENT_FIELD: content
        CONVERSION_API_SECURE: "false"
        AI_FEATURE_ENABLED: "false"
        CACHES_DEFAULT_TIMEOUT: "30"
        SESSION_COOKIE_AGE: "43200"
        DOCUMENT_IMAGE_MAX_SIZE: "10485760"
        NO_WEBSOCKET_CACHE_TIMEOUT: "120"
        LOGGING_LEVEL_LOGGERS_APP: INFO
        LOGGING_LEVEL_LOGGERS_ROOT: INFO
        MALWARE_DETECTION_BACKEND: lasuite.malware_detection.backends.dummy.DummyBackend
        STORAGES_STATICFILES_BACKEND: django.contrib.staticfiles.storage.StaticFilesStorage
        SPECTACULAR_SETTINGS_ENABLE_DJANGO_DEPLOY_CHECK: "false"
        # The rendered theme JSON is cached in Redis for a day. Editing the values below
        # does NOT change what users see until this expires or the key is deleted:
        #   redis-cli --user docs -a <pw> -n 1 --scan --pattern 'docs*theme*' | xargs redis-cli ... del
        THEME_CUSTOMIZATION_CACHE_TIMEOUT: "86400"
      # `createsuperuser` upstream runs `manage.py createsuperuser`, which fails once the
      # account exists — and this chart's Job is not a Helm hook, so a failing Job is
      # permanent noise on every reconcile. Replaced with an idempotent equivalent.
      createsuperuser:
        command:
          - /bin/sh
          - -c
          - |
            python manage.py shell <<'PY'
            import os
            from django.contrib.auth import get_user_model

            User = get_user_model()
            email = os.environ["DJANGO_SUPERUSER_EMAIL"]

            # Build the whole object before the first save: Docs' User.save() calls
            # full_clean(), so an unsaved-then-set_password() order fails validation on
            # a blank password.
            user = User.objects.filter(email=email).first() or User(
                email=email, language="nl-nl"
            )
            user.is_active = True
            user.is_staff = True
            user.is_superuser = True
            user.set_password(os.environ["DJANGO_SUPERUSER_PASSWORD"])
            user.save()
            print("superuser ready:", email)
            PY
      celery:
        replicas: 1
        # The chart's default args carry no --concurrency, so Celery preforks one process
        # per CPU — ten on this node, each a full Django — and the container is OOMKilled
        # within seconds of a clean startup. The logs look perfect right up to exit 137.
        args: ["celery", "-A", "impress.celery_app", "worker", "-l", "INFO",
               "-n", "impress@%h", "--concurrency", "2"]
        resources:
          requests: {cpu: 50m, memory: 384Mi}
          limits: {memory: 1Gi}
      themeCustomization:
        enabled: true
        # Our ConfigMap is mounted over the whole theme directory, so it REPLACES
        # upstream's `backend/impress/configuration/theme/default.json` — it does not
        # merge with it. Every key the default carried has to be restated here or it is
        # silently lost. That is how the top-left logo vanished: with no `header.icon`,
        # LeftPanelHeader renders no <Image> at all and marks the "Docs" title `sr-only`.
        # The five keys below are upstream's defaults, restored verbatim.
        file_content:
          header:
            logo: {}                     # wide brand logo, home page only; upstream ships none
            icon:
              src: /assets/icon-docs.svg
              width: 36
              height: 42
              style: {width: 36px, height: auto}
              alt: ""
              withTitle: true            # renders the <h1> next to the icon; false = icon only
          favicon:
            light: {href: /assets/favicon-light.png, type: image/png}
            dark: {href: /assets/favicon-dark.png, type: image/png}
          home:
            with-proconnect: false
            icon-banner:
              src: /assets/icon-docs.svg
              width: 64
              height: 74
              style: {width: 64px, height: auto}
              alt: ""
          # Empty strings are falsy in the frontend, so every entry below renders nothing;
          # `onboarding.enabled` is what keeps the help menu present at all — HelpMenu.tsx
          # hides the whole menu when no help key is truthy.
          onboarding: {enabled: true, learn_more_url: "", ready_template_url: ""}
          help:
            documentation_url: ""
            support_mailto: ""
            legal_links:
              {personal_data: "", terms_of_use: "", accessibility_statement: "", legal_notice: ""}
          # THE GAUFRE. Without a `waffle` key the switcher does not render at all; with
          # `waffle.apiUrl` it renders the French government's service list. This is the
          # third option: our own services, served from our own domains, no call out to
          # lasuite.numerique.gouv.fr at any point.
          # Add an entry here as each application lands — it is the only place the suite's
          # inventory is stated to users.
          waffle:
            label: Office
            showMoreLimit: 9
            data:
              services:
                - name: Docs
                  url: https://docs.${BASE_DOMAIN}
                  maturity: stable
                  logo: https://docs.${BASE_DOMAIN}/assets/icon-docs.svg
                - name: Account
                  url: https://id.${BASE_DOMAIN}/realms/office/account
                  maturity: stable
                  logo: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%232323ff' d='M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10Zm0 2c-5 0-9 2.5-9 5.5V22h18v-2.5c0-3-4-5.5-9-5.5Z'/%3E%3C/svg%3E"
          footer:
            default:
              logo:
                src: /assets/icon-docs.svg
                alt: Docs
                style: {width: 54px, height: auto}
                withTitle: true
              externalLinks:
                - {label: Docs, href: "https://github.com/suitenumerique/docs/"}
            bottomInformation:
              label: Docs is open source software published by DINUM under
              link: {label: MIT licence, href: "https://github.com/suitenumerique/docs/blob/main/LICENSE"}

    frontend:
      image: {tag: v5.5.0}
      replicas: 1
      pdb: {enabled: false}
      resources:
        requests: {cpu: 50m, memory: 128Mi}
        limits: {memory: 512Mi}
      envVars:
        PORT: "8080"
        NEXT_PUBLIC_API_ORIGIN: https://docs.${BASE_DOMAIN}
        SW_DEACTIVATED: "false"
        PUBLISH_AS_MIT: "false"

    yProvider:
      image: {tag: v5.5.0}
      replicas: 1
      pdb: {enabled: false}
      resources:
        requests: {cpu: 50m, memory: 256Mi}
        limits: {memory: 512Mi}
      envFrom:
        - {secretRef: {name: docs-collaboration}}
      envVars:
        COLLABORATION_BACKEND_BASE_URL: https://docs.${BASE_DOMAIN}
        COLLABORATION_SERVER_ORIGIN: https://docs.${BASE_DOMAIN}
        COLLABORATION_LOGGING: "true"

    docSpec:
      enabled: true
      replicas: 1
      resources:
        requests: {cpu: 50m, memory: 256Mi}
        limits: {memory: 1Gi}
