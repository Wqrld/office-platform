# Docs — release 2 of 3: the application, from the fork's in-tree chart (`src/helm/impress`,
# named `docs`) at its pinned git tag (adr/0104). Conventions: apps/README.md.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: docs
  namespace: office-docs
spec:
  interval: 30m
  dependsOn: [{name: docs-deps}]
  chart:
    spec:
      chart: src/helm/impress
      sourceRef: {kind: GitRepository, name: wqrld-docs, namespace: flux-system}
      reconcileStrategy: Revision
  install:
    disableWaitForJobs: true
  upgrade:
    disableWaitForJobs: true
    remediation:
      retries: 0
  postRenderers:
    - kustomize:
        patches:
          - target: {kind: Deployment, name: docs-celery-worker}
            patch: |
              - {op: add, path: /spec/template/spec/containers/0/livenessProbe/periodSeconds, value: 300}
  valuesFrom: [{kind: ConfigMap, name: docs-sizes, valuesKey: "${SIZE}"}]
  values:
    # The fork's images, one tag with the chart (README.md, The fork).
    image:
      repository: ghcr.io/wqrld/docs-backend
      tag: v6.0.4-office.1

    ingress: {enabled: false}
    ingressAdmin: {enabled: false}
    ingressMedia: {enabled: false}
    ingressCollaborationApi: {enabled: false}
    ingressCollaborationWS: {enabled: false}
    ingressRedirects: {enabled: false}
    posthog:
      ingress: {enabled: false}
      ingressAssets: {enabled: false}

    serviceMedia:
      host: office-s3.office-data.svc.cluster.local
      port: 3900

    # The signing keys of the backend and of yhub, generated once into a secret the chart
    # makes (adr/0118). Their *_FILE settings are added by the chart.
    jwtKeys: {enabled: true}

    backend:
      pdb: {enabled: false}
      securityContext: &readOnly {readOnlyRootFilesystem: true}
      persistence: &tmp {tmp: {type: emptyDir, mountPath: /tmp}}
      envFrom:
        - {secretRef: {name: docs-postgres}}
        - {secretRef: {name: docs-cache}}
        - {secretRef: {name: docs-s3}}
        - {secretRef: {name: docs-oidc}}
        - {secretRef: {name: docs-django}}
        - {secretRef: {name: docs-collaboration}}
        - {secretRef: {name: docs-search}}
        - {secretRef: {name: docs-oidc-refresh}}
        - {secretRef: {name: docs-smtp}}
        - {secretRef: {name: docs-meet}}
      envVars:
        DJANGO_SETTINGS_MODULE: impress.settings
        DJANGO_CONFIGURATION: Production
        DJANGO_ALLOWED_HOSTS: docs.${BASE_DOMAIN}
        DJANGO_CSRF_TRUSTED_ORIGINS: https://docs.${BASE_DOMAIN}
        DJANGO_CORS_ALLOWED_ORIGINS: https://docs.${BASE_DOMAIN}
        DJANGO_CORS_ALLOW_ALL_ORIGINS: "false"
        DJANGO_SUPERUSER_EMAIL: admin@${BASE_DOMAIN}
        # No marketing homepage: an anonymous visitor gets the login page.
        FRONTEND_HOMEPAGE_FEATURE_ENABLED: "false"
        DJANGO_EMAIL_BRAND_NAME: Office
        LANGUAGE_CODE: nl-nl
        MEDIA_BASE_URL: https://docs.${BASE_DOMAIN}
        LOGIN_REDIRECT_URL: https://docs.${BASE_DOMAIN}
        LOGIN_REDIRECT_URL_FAILURE: https://docs.${BASE_DOMAIN}
        LOGOUT_REDIRECT_URL: https://docs.${BASE_DOMAIN}
        # yhub serves the websocket and the document routes; the y-provider is the converter
        # only (adr/0118). The room is the path's last segment, the org `docs` (YHUB_ORG).
        COLLABORATION_WS_URL: wss://docs.${BASE_DOMAIN}/collaboration/ws/v1/docs
        YHUB_API_BASE_URL: http://docs-yhub:443
        Y_PROVIDER_API_BASE_URL: http://docs-y-provider:443/api/
        DOCSPEC_API_URL: http://docs-docspec:4000/conversion
        CONVERSION_API_ENDPOINT: convert
        CONVERSION_API_CONTENT_FIELD: content
        CONVERSION_API_SECURE: "false"
        AI_FEATURE_ENABLED: "false"
        CACHES_DEFAULT_TIMEOUT: "30"
        SESSION_COOKIE_AGE: "43200"
        DOCUMENT_IMAGE_MAX_SIZE: "10485760"
        LOGGING_LEVEL_LOGGERS_APP: INFO
        LOGGING_LEVEL_LOGGERS_ROOT: INFO
        MALWARE_DETECTION_BACKEND: lasuite.malware_detection.backends.dummy.DummyBackend
        # Find at its PUBLIC url: pod-to-pod, a 301 turns the POST into a GET and indexes
        # nothing (apps/find/surround.yaml).
        SEARCH_INDEXER_CLASS: core.services.search_indexers.FindDocumentIndexer
        SEARCH_INDEXER_COUNTDOWN: "10"   # Celery debounce; 0 makes every save synchronous
        INDEXING_URL: https://find.${BASE_DOMAIN}/api/v1.0/documents/index/
        SEARCH_URL: https://find.${BASE_DOMAIN}/api/v1.0/documents/search/
        STORAGES_STATICFILES_BACKEND: django.contrib.staticfiles.storage.StaticFilesStorage
        SPECTACULAR_SETTINGS_ENABLE_DJANGO_DEPLOY_CHECK: "false"
        # A theme edit is invisible until this expires or the key is deleted (README.md).
        THEME_CUSTOMIZATION_CACHE_TIMEOUT: "86400"

      celery:
        probes: {readiness: null, liveness: {timeoutSeconds: 30}}

      createsuperuser:
        command:
          - /bin/sh
          - -c
          - |
            python manage.py shell <<'PY'
            import os
            from django.contrib.auth import get_user_model

            User = get_user_model()
            email = os.environ["DJANGO_SUPERUSER_EMAIL"]

            # Build the whole object before the first save: Docs' User.save() calls
            # full_clean(), so an unsaved-then-set_password() order fails validation on
            # a blank password.
            user = User.objects.filter(email=email).first() or User(
                email=email, language="nl-nl"
            )
            user.is_active = True
            user.is_staff = True
            user.is_superuser = True
            user.set_password(os.environ["DJANGO_SUPERUSER_PASSWORD"])
            user.save()
            print("superuser ready:", email)
            PY
      # Without this flag `_get_search_type()` returns TITLE and Docs never calls Find. The
      # ORM, because the `waffle_flag` CLI is unreliable.
      job:
        name: search-flags
        annotations:
          helm.sh/hook: post-install,post-upgrade
          helm.sh/hook-delete-policy: before-hook-creation
        command:
          - /bin/sh
          - -c
          - |
            python manage.py shell <<'PY'
            from waffle.models import Flag

            flag, _ = Flag.objects.update_or_create(
                name="flag_find_full_text_search",
                defaults={"everyone": True},
            )
            print("flag ready:", flag.name, flag.everyone)
            PY

      themeCustomization:
        enabled: true
        # REPLACES upstream's default.json rather than merging: every key it carried is
        # restated here at upstream's value, or it is gone (README.md).
        file_content:
          header:
            logo: {}                     # wide brand logo, home page only; upstream ships none
            icon:
              src: /assets/icon-docs.svg
              width: 36
              height: 42
              style: {width: 36px, height: auto}
              alt: ""
              withTitle: true            # renders the <h1> next to the icon; false = icon only
          favicon:
            light: {href: /assets/favicon-light.png, type: image/png}
            dark: {href: /assets/favicon-dark.png, type: image/png}
          home:
            with-proconnect: false
            icon-banner:
              src: /assets/icon-docs.svg
              width: 64
              height: 74
              style: {width: 64px, height: auto}
              alt: ""
          # Empty strings render nothing; `onboarding.enabled` alone keeps the help menu.
          onboarding: {enabled: true, learn_more_url: "", ready_template_url: ""}
          help:
            documentation_url: ""
            support_mailto: ""
            legal_links:
              {personal_data: "", terms_of_use: "", accessibility_statement: "", legal_notice: ""}
          # THE GAUFRE: without `waffle` no switcher renders (README.md, The waffle).
          waffle:
            label: Office
            showMoreLimit: 9
            widgetPath: https://docs.${BASE_DOMAIN}/custom/gaufre.js
            apiUrl: https://docs.${BASE_DOMAIN}/custom/services.json
          footer:
            default:
              logo:
                src: /assets/icon-docs.svg
                alt: Docs
                style: {width: 54px, height: auto}
                withTitle: true
              externalLinks:
                - {label: Docs, href: "https://github.com/suitenumerique/docs/"}
            bottomInformation:
              label: Docs is open source software published by DINUM under
              link: {label: MIT licence, href: "https://github.com/suitenumerique/docs/blob/main/LICENSE"}

    frontend:
      image: {repository: ghcr.io/wqrld/docs-frontend, tag: v6.0.4-office.1}
      pdb: {enabled: false}
      securityContext: *readOnly
      persistence: *tmp
      envVars:
        PORT: "8080"
        NEXT_PUBLIC_API_ORIGIN: https://docs.${BASE_DOMAIN}
        SW_DEACTIVATED: "false"
        PUBLISH_AS_MIT: "false"

    yProvider:
      image: {repository: ghcr.io/wqrld/docs-y-provider, tag: v6.0.4-office.1}
      pdb: {enabled: false}
      securityContext: *readOnly
      persistence: *tmp
      envFrom:
        - {secretRef: {name: docs-collaboration}}
      envVars:
        COLLABORATION_BACKEND_BASE_URL: https://docs.${BASE_DOMAIN}
        COLLABORATION_SERVER_ORIGIN: https://docs.${BASE_DOMAIN}
        COLLABORATION_LOGGING: "true"

    # The collaboration server (adr/0118). The live state of every document is in its redis
    # stream and its own database, `yhub` on the docs role's cluster (charts/platform-tenants).
    # Its schema is made by the init-db job the chart runs before it starts.
    yhub:
      image: {repository: ghcr.io/wqrld/docs-yhub, tag: v6.0.4-office.1}
      pdb: {enabled: false}          # the surround owns the budget (sizes/platform-large.yaml)
      securityContext: *readOnly
      persistence: *tmp
      envFrom:
        - {secretRef: {name: docs-collaboration}}
      # Keys are applied in sorted order, and $(VAR) refers to an earlier one: PG_* before
      # POSTGRES. The password is unescaped, like DATABASE_URL (apps/README.md).
      envVars:
        PG_HOST: {secretKeyRef: {name: docs-postgres, key: DB_HOST}}
        PG_PASSWORD: {secretKeyRef: {name: docs-postgres, key: DB_PASSWORD}}
        PG_PORT: {secretKeyRef: {name: docs-postgres, key: DB_PORT}}
        PG_USER: {secretKeyRef: {name: docs-postgres, key: DB_USER}}
        POSTGRES: "postgres://$(PG_USER):$(PG_PASSWORD)@$(PG_HOST):$(PG_PORT)/yhub"
        # Valkey's `cache` instance, db 1 as the backend, under the yhub key prefix.
        REDIS: {secretKeyRef: {name: docs-cache, key: REDIS_URL}}
        REDIS_PREFIX: yhub
        COLLABORATION_BACKEND_BASE_URL: https://docs.${BASE_DOMAIN}
        COLLABORATION_SERVER_ORIGIN: https://docs.${BASE_DOMAIN}
        # Migration of the legacy documents (UPGRADE.md, 6.0.0). Read from the docs bucket,
        # with the docs key: a read-only key of its own is still to do. SOFT_MIGRATION is
        # switched off once `migrate_documents` has covered the corpus.
        SOFT_MIGRATION: "true"
        LEGACY_S3_ENDPOINT_URL: {secretKeyRef: {name: docs-s3, key: AWS_S3_ENDPOINT_URL}}
        LEGACY_S3_ACCESS_KEY_ID: {secretKeyRef: {name: docs-s3, key: AWS_S3_ACCESS_KEY_ID}}
        LEGACY_S3_SECRET_ACCESS_KEY: {secretKeyRef: {name: docs-s3, key: AWS_S3_SECRET_ACCESS_KEY}}
        LEGACY_S3_BUCKET_NAME: {secretKeyRef: {name: docs-s3, key: AWS_STORAGE_BUCKET_NAME}}
        LEGACY_S3_REGION_NAME: {secretKeyRef: {name: docs-s3, key: AWS_S3_REGION_NAME}}
        LEGACY_S3_SIGNATURE_VERSION: s3v4

    docSpec:
      enabled: true
      securityContext: *readOnly
      extraVolumes: [{name: tmp, emptyDir: {}}]
      extraVolumeMounts: [{name: tmp, mountPath: /tmp}]
