apiVersion: v1
kind: Namespace
metadata:
  name: office-docs
  labels:
    # The Gateway's allowedRoutes selector. Without it every HTTPRoute below is silently
    # ignored — the route reports no error, it simply never attaches.
    office.haaijer.dev/gateway-access: "true"
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
