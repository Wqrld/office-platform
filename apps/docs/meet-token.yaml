# Meet → Docs. When a transcript finishes, Meet's summary service creates a Docs document
# for the user who asked for it, server-to-server (`POST /api/v1.0/documents/create-for-
# owner/`), authenticating with one of DJANGO_SERVER_TO_SERVER_API_TOKENS. The value is
# drawn once in office-data (platform/secrets/service-tokens.yaml, key `docs`) and read
# here and in apps/meet/tokens.yaml. Comma-separated on the Docs side; one entry for now.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: docs-meet, namespace: office-docs}
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: office-data}
  target:
    name: docs-meet
    creationPolicy: Owner
    template:
      data:
        DJANGO_SERVER_TO_SERVER_API_TOKENS: "{{ .meet }}"
  data:
    - {secretKey: meet, remoteRef: {key: meet-service-tokens, property: docs}}
