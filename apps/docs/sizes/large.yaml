# Docs at `large`. Not validated against a running cluster: a shape to measure from
# (apps/README.md, Sizing). Every component above one replica has a budget in
# platform-large.yaml; tests/profiles.py asserts the pairing.
backend:
  replicas: 3
  resources:
    requests: {cpu: 500m, memory: 1Gi}
    limits: {memory: 3Gi}
  celery:
    replicas: 2
    args: ["celery", "-A", "impress.celery_app", "worker", "-l", "INFO",
           "-n", "impress@%h", "--concurrency", "4"]
    resources:
      requests: {cpu: 250m, memory: 768Mi}
      limits: {memory: 2Gi}
frontend:
  replicas: 3
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 768Mi}
yProvider:
  replicas: 2
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {memory: 1Gi}
docSpec:
  replicas: 2
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {memory: 2Gi}
