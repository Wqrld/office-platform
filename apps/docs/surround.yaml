# Docs — release 3 of 3: the surround. Conventions: apps/README.md.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata: {name: docs-platform, namespace: office-docs}
spec:
  interval: 30m
  dependsOn: [{name: docs}]
  chartRef: {kind: HelmChart, name: platform-app, namespace: flux-system}
  valuesFrom: [{kind: ConfigMap, name: docs-sizes, valuesKey: "platform-${SIZE}"}]
  values:
    app: docs
    baseDomain: ${BASE_DOMAIN}

    routes:
      - backend: {name: docs-frontend, port: 80}
        paths: [/]

      - name: api
        backend: {name: docs-backend, port: 80}
        paths: [/api, /admin, /static]
        requestBuffer: 100Mi
        timeout: 300s               # uploads and conversion are slow, not hung

      - name: media
        backend: {name: docs-media-proxy, port: 8080}
        paths: [/media]
        timeout: 300s

      - name: collaboration
        backend: {name: docs-y-provider, port: 443}
        # The editor's websocket, and the API the backend calls at its PUBLIC url.
        paths: [/collaboration/ws, /collaboration/api]
        websocket: true             # setting requestBuffer here is a render-time error

    staticFiles: {enabled: true}

    mediaProxy:
      enabled: true
      auth: {service: docs-backend, port: 80, path: /api/v1.0/documents/media-auth/}
      objectstore: {bucket: docs}
      locations: [{path: /media/}]

    networkPolicy:
      egress:
        - {datastore: postgres}
        - {datastore: cache}
        - {datastore: objectstore}
        - {identity: true}
        # Covers Find, which Docs reaches at its PUBLIC url rather than pod-to-pod.
        - {external: true, port: 443}
