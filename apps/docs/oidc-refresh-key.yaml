# The Fernet key for the OIDC refresh token stored in the session (deps.yaml, for search).
# Without it the OIDC callback raises `OIDC_STORE_REFRESH_TOKEN_KEY setting is required`: a
# 500 on login. Fernet wants 32 bytes, url-safe base64: 32 of the 40 drawn characters, and
# the two `replace`s make the encoding url-safe.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: docs-oidc-refresh, namespace: office-docs}
spec:
  refreshInterval: "0"          # rotating it makes every stored refresh token undecryptable
  target:
    name: docs-oidc-refresh
    creationPolicy: Owner
    template:
      data:
        OIDC_STORE_REFRESH_TOKEN_KEY: '{{ .password | trunc 32 | b64enc | replace "+" "-" | replace "/" "_" }}'
  dataFrom:
    - sourceRef:
        generatorRef: {apiVersion: generators.external-secrets.io/v1alpha1, kind: ClusterGenerator, name: office-password}
