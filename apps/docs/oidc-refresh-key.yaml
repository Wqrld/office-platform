# The Fernet key that encrypts the OIDC refresh token in the Django session.
#
# `OIDC_STORE_REFRESH_TOKEN: true` is REQUIRED by full-text search (deps.yaml), and lasuite's
# backend raises `OIDC_STORE_REFRESH_TOKEN_KEY setting is required` at the OIDC callback
# without this — a 500 on login, not a degraded search.
#
# Fernet wants 32 bytes, url-safe base64. `office-password` draws 40 alphanumeric characters;
# 32 of them are the key material, and the two `replace`s make the encoding url-safe.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: docs-oidc-refresh, namespace: office-docs}
spec:
  refreshInterval: "0"          # rotating it makes every stored refresh token undecryptable
  target:
    name: docs-oidc-refresh
    creationPolicy: Owner
    template:
      data:
        OIDC_STORE_REFRESH_TOKEN_KEY: '{{ .password | trunc 32 | b64enc | replace "+" "-" | replace "/" "_" }}'
  dataFrom:
    - sourceRef:
        generatorRef: {apiVersion: generators.external-secrets.io/v1alpha1, kind: ClusterGenerator, name: office-password}
