# Secrets are generated once in-cluster and reshaped into the canonical key set; they
# are never derived at render time and never held in git (adr/0005, 07-identity).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata: {name: external-secrets, namespace: external-secrets}
spec:
  interval: 30m
  chart:
    spec:
      chart: external-secrets
      version: "2.14.0"
      sourceRef: {kind: HelmRepository, name: external-secrets, namespace: flux-system}
  install: {crds: Create, disableWaitForJobs: true}
  upgrade: {crds: CreateReplace, disableWaitForJobs: true}
  values:
    installCRDs: true
