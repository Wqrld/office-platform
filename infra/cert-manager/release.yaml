# Without `enableGatewayAPI` the HTTP-01 solver never reaches the Gateway and no
# certificate issues. Needs the Gateway API CRDs at start: the cluster's, or cluster/gateway.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata: {name: cert-manager, namespace: cert-manager}
spec:
  interval: 30m
  chart:
    spec:
      chart: cert-manager
      version: "v1.19.1"
      sourceRef: {kind: HelmRepository, name: jetstack, namespace: flux-system}
  install: {disableWaitForJobs: true}
  upgrade: {disableWaitForJobs: true}
  values:
    crds: {enabled: true, keep: true}
    config:
      apiVersion: controller.config.cert-manager.io/v1alpha1
      kind: ControllerConfiguration
      enableGatewayAPI: true
