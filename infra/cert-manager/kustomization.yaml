# The Garage operator's webhook certificates are cert-manager's, so it waits for this.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources: [namespace.yaml, release.yaml]
patches:
  - target: {kind: HelmRelease, name: garage-operator}
    patch: |
      - {op: add, path: /spec/dependsOn, value: [{name: cert-manager, namespace: cert-manager}]}
