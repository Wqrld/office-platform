apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: longhorn
  namespace: office-monitoring
  labels:
    office.haaijer.dev/monitoring: "true"
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
spec:
  groups:
    - name: longhorn
      rules:
        # longhorn_volume_robustness: 0 unknown, 1 healthy, 2 degraded, 3 faulted.
        - alert: OfficeVolumeDegraded
          expr: longhorn_volume_robustness == 2
          for: 10m
          labels: {severity: warning}
          annotations:
            summary: "Longhorn volume {{ $labels.volume }} ({{ $labels.pvc_namespace }}/{{ $labels.pvc }}) is degraded"
        - alert: OfficeVolumeDegraded
          expr: longhorn_volume_robustness == 3
          for: 10m
          labels: {severity: critical}
          annotations:
            summary: "Longhorn volume {{ $labels.volume }} ({{ $labels.pvc_namespace }}/{{ $labels.pvc }}) is faulted"
        - alert: OfficeLonghornDiskFilling
          expr: longhorn_disk_usage_bytes / longhorn_disk_capacity_bytes > 0.85
          for: 30m
          labels: {severity: warning}
          annotations:
            summary: "node {{ $labels.node }}: Longhorn disk {{ $labels.disk }} is {{ $value | humanizePercentage }} full"
