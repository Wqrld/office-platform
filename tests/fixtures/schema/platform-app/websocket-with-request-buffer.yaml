# expect: at '/routes/0': 'not' failed
# Buffering a request that never ends is how you break a websocket. The template also fails
# on this pair; the schema fails on it before anything renders, which is where the author is.
app: ws
baseDomain: example.test
routes:
  - host: ws
    backend: {name: ws, port: 80}
    paths: [/collaboration/ws]
    websocket: true
    requestBuffer: 100Mi
