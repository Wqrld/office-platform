# Every secret Docs reads is a Secret whose KEYS are already the env var names the
# application expects, so the upstream chart consumes them with `envFrom` and no value is
# ever spliced into Helm values (05-app-contract.md).
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: docs-postgres, namespace: office-docs}
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: office-data}
  target:
    name: docs-postgres
    creationPolicy: Owner
    template:
      data:
        DB_ENGINE: django.db.backends.postgresql_psycopg2
        DB_HOST: office-pg-rw.office-data.svc.cluster.local
        DB_PORT: "5432"
        DB_NAME: docs
        DB_USER: "{{ .username }}"
        DB_PASSWORD: "{{ .password }}"
  data:
    - {secretKey: username, remoteRef: {key: docs-db, property: username}}
    - {secretKey: password, remoteRef: {key: docs-db, property: password}}
---
# Two Valkey instances, two URLs. The cache evicts and does not persist; the broker does
# not evict — an evicting broker silently drops queued Celery tasks.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: docs-cache, namespace: office-docs}
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: office-data}
  target:
    name: docs-cache
    creationPolicy: Owner
    template:
      data:
        REDIS_URL: "redis://docs:{{ .cache }}@valkey-cache.office-data.svc.cluster.local:6379/1"
        DJANGO_CELERY_BROKER_URL: "redis://docs:{{ .broker }}@valkey-broker.office-data.svc.cluster.local:6379/0"
  data:
    - {secretKey: cache, remoteRef: {key: valkey-cache-users, property: docs}}
    - {secretKey: broker, remoteRef: {key: valkey-broker-users, property: docs}}
---
# The endpoint split that 07-identity-and-secrets.md exists to get right:
# browser-facing operations (authorize, logout) use the EXTERNAL host, because a browser
# has to reach them; server-to-server operations (token, userinfo, JWKS) use the INTERNAL
# Service, because the pod does. Keycloak accepts both because backchannelDynamic is on.
# Swapping them produces a login that works in the browser and fails at token exchange —
# a symptom that reads exactly like a wrong client secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: docs-oidc, namespace: office-docs}
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: office-identity}
  target:
    name: docs-oidc
    creationPolicy: Owner
    template:
      data:
        OIDC_RP_CLIENT_ID: docs
        OIDC_RP_CLIENT_SECRET: "{{ .secret }}"
        OIDC_RP_SIGN_ALGO: RS256
        # `profile` is needed for given_name/family_name — without it the userinfo
        # response has no name claims and every user's display name is their email.
        OIDC_RP_SCOPES: openid email profile
        OIDC_OP_AUTHORIZATION_ENDPOINT: https://id.${BASE_DOMAIN}/realms/office/protocol/openid-connect/auth
        OIDC_OP_LOGOUT_ENDPOINT: https://id.${BASE_DOMAIN}/realms/office/protocol/openid-connect/logout
        OIDC_OP_TOKEN_ENDPOINT: http://keycloak-service.office-identity.svc.cluster.local:8080/realms/office/protocol/openid-connect/token
        OIDC_OP_USER_ENDPOINT: http://keycloak-service.office-identity.svc.cluster.local:8080/realms/office/protocol/openid-connect/userinfo
        OIDC_OP_JWKS_ENDPOINT: http://keycloak-service.office-identity.svc.cluster.local:8080/realms/office/protocol/openid-connect/certs
        OIDC_REDIRECT_ALLOWED_HOSTS: https://docs.${BASE_DOMAIN}
        OIDC_REDIRECT_REQUIRE_HTTPS: "true"
        OIDC_USE_NONCE: "true"
        # The restored database already holds every user. Provisioning is closed, and
        # login matches an existing account by sub and then by email.
        OIDC_CREATE_USER: "false"
        OIDC_FALLBACK_TO_EMAIL_FOR_IDENTIFICATION: "true"
        OIDC_ALLOW_DUPLICATE_EMAILS: "false"
        OIDC_STORE_ACCESS_TOKEN: "true"
        OIDC_STORE_ID_TOKEN: "true"
        # Off deliberately: storing it requires a Fernet key we would have to generate in
        # a specific format, and nothing here does token exchange yet.
        OIDC_STORE_REFRESH_TOKEN: "false"
        OIDC_USERINFO_FULLNAME_FIELDS: given_name,family_name
        OIDC_USERINFO_SHORTNAME_FIELD: name
  data:
    - {secretKey: secret, remoteRef: {key: oidc-client-docs, property: secret}}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: docs-django, namespace: office-docs}
spec:
  refreshInterval: "0"
  target:
    name: docs-django
    creationPolicy: Owner
    template:
      data:
        DJANGO_SECRET_KEY: "{{ .secretkey }}"
        DJANGO_SUPERUSER_PASSWORD: "{{ .superuser }}"
  dataFrom:
    - sourceRef: {generatorRef: {apiVersion: generators.external-secrets.io/v1alpha1, kind: ClusterGenerator, name: office-password}}
      rewrite: [{regexp: {source: "password", target: "secretkey"}}]
    - sourceRef: {generatorRef: {apiVersion: generators.external-secrets.io/v1alpha1, kind: ClusterGenerator, name: office-password}}
      rewrite: [{regexp: {source: "password", target: "superuser"}}]
---
# Shared by the backend AND the y-provider — both sides must present the same values or
# collaborative editing fails with an authorisation error rather than a connection error.
# Kept apart from docs-django so the y-provider does not inherit Django's secret key.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: docs-collaboration, namespace: office-docs}
spec:
  refreshInterval: "0"
  target:
    name: docs-collaboration
    creationPolicy: Owner
    template:
      data:
        Y_PROVIDER_API_KEY: "{{ .apikey }}"
        COLLABORATION_SERVER_SECRET: "{{ .serversecret }}"
  dataFrom:
    - sourceRef: {generatorRef: {apiVersion: generators.external-secrets.io/v1alpha1, kind: ClusterGenerator, name: office-password}}
      rewrite: [{regexp: {source: "password", target: "apikey"}}]
    - sourceRef: {generatorRef: {apiVersion: generators.external-secrets.io/v1alpha1, kind: ClusterGenerator, name: office-password}}
      rewrite: [{regexp: {source: "password", target: "serversecret"}}]
