# Object storage for Docs' attachments and Yjs blobs.
#
# `secretTemplate` writes the application's env var names straight into the Secret, so
# the chart consumes it with `envFrom` and there is no ESO reshaping hop at all — the
# credential never exists in a second place to drift from.
---
apiVersion: garage.rajsingh.info/v1beta1
kind: GarageBucket
metadata: {name: docs, namespace: office-docs}
spec:
  clusterRef: {name: office-s3, namespace: office-data}
  # The legacy bucket was called `docs` and object keys are `<document-uuid>/...`; the
  # restored database refers to them by exactly that name.
  globalAlias: docs
  deletionPolicy: Retain
  quotas:
    maxSize: 20Gi
---
apiVersion: garage.rajsingh.info/v1beta1
kind: GarageKey
metadata: {name: docs, namespace: office-docs}
spec:
  clusterRef: {name: office-s3, namespace: office-data}
  name: docs
  neverExpires: true
  bucketPermissions:
    - bucketRef: {name: docs, namespace: office-docs}
      read: true
      write: true
      owner: true
  secretTemplate:
    name: docs-s3
    accessKeyIdKey: AWS_S3_ACCESS_KEY_ID
    secretAccessKeyKey: AWS_S3_SECRET_ACCESS_KEY
    includeEndpoint: true
    endpointKey: AWS_S3_ENDPOINT_URL
    includeRegion: true
    regionKey: AWS_S3_REGION_NAME
    includeBucketName: true
    bucketNameKey: AWS_STORAGE_BUCKET_NAME
    additionalData:
      # AWS SDKs since 2025 send checksum algorithms that non-AWS S3 implementations may
      # reject. Garage/SDK compatibility was flagged as unverified when the object store
      # landed; these two make boto3 ask for a checksum only when the operation needs one.
      AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
      AWS_RESPONSE_CHECKSUM_VALIDATION: WHEN_REQUIRED
