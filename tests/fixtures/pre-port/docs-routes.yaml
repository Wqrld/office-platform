# Six paths, one hostname, four routes. Gateway API resolves overlapping prefixes by
# specificity across every route attached to the same listener, so `/` living in its own
# object does not shadow `/api` in another.
#
# Split by backend rather than crammed into one HTTPRoute because the traffic policies
# below attach to an HTTPRoute: uploads want a body limit, websockets must not have one.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: docs, namespace: office-docs}
spec:
  parentRefs: [{name: office, namespace: office-system, sectionName: https}]
  hostnames: ["docs.${BASE_DOMAIN}"]
  rules:
    - matches: [{path: {type: PathPrefix, value: /}}]
      backendRefs: [{name: docs-frontend, port: 80}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: docs-api, namespace: office-docs}
spec:
  parentRefs: [{name: office, namespace: office-system, sectionName: https}]
  hostnames: ["docs.${BASE_DOMAIN}"]
  rules:
    - matches:
        - {path: {type: PathPrefix, value: /api}}
        - {path: {type: PathPrefix, value: /admin}}
        # Django's own static files. Not in the upstream ingress set, which is why
        # /admin renders unstyled there; the frontend has nothing under /static.
        - {path: {type: PathPrefix, value: /static}}
      backendRefs: [{name: docs-backend, port: 80}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: docs-media, namespace: office-docs}
spec:
  parentRefs: [{name: office, namespace: office-system, sectionName: https}]
  hostnames: ["docs.${BASE_DOMAIN}"]
  rules:
    - matches: [{path: {type: PathPrefix, value: /media}}]
      backendRefs: [{name: docs-media-proxy, port: 8080}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: docs-collaboration, namespace: office-docs}
spec:
  parentRefs: [{name: office, namespace: office-system, sectionName: https}]
  hostnames: ["docs.${BASE_DOMAIN}"]
  rules:
    - matches:
        # The websocket the editor holds open for the whole session.
        - {path: {type: PathPrefix, value: /collaboration/ws}}
        # Server-to-server: the backend calls COLLABORATION_API_URL, which is the public
        # URL, so this path has to be routable from outside as well as inside.
        - {path: {type: PathPrefix, value: /collaboration/api}}
      backendRefs: [{name: docs-y-provider, port: 443}]
---
# Body size, the Gateway API way. `requestBuffer` makes Envoy hold the whole request
# before forwarding it and reject anything larger — the equivalent of nginx's
# client_max_body_size — and it is only safe paired with a connection buffer large enough
# to hold it, which is set once on the Gateway (platform/gateway/traffic.yaml).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata: {name: docs-api, namespace: office-docs}
spec:
  targetRefs:
    - {group: gateway.networking.k8s.io, kind: HTTPRoute, name: docs-api}
  requestBuffer:
    limit: 100Mi
  timeout:
    http:
      # Attachment uploads and document conversion are slow, not hung.
      requestTimeout: 300s
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata: {name: docs-media, namespace: office-docs}
spec:
  targetRefs:
    - {group: gateway.networking.k8s.io, kind: HTTPRoute, name: docs-media}
  timeout:
    http:
      requestTimeout: 300s
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata: {name: docs-collaboration, namespace: office-docs}
spec:
  targetRefs:
    - {group: gateway.networking.k8s.io, kind: HTTPRoute, name: docs-collaboration}
  # NO requestBuffer here: buffering a request that never ends is how you break a
  # websocket. The timeouts are long on purpose — an editing session is one request that
  # legitimately lasts all day.
  timeout:
    http:
      requestTimeout: 0s
      connectionIdleTimeout: 24h
