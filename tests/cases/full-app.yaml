# Everything platform-app can emit, at once. Nothing deploys this shape; it exists so a
# template touching a branch no live app uses still has a golden to break.
app: full
tenant: office
baseDomain: haaijer.dev

routes:
  - host: full
    backend: {name: full-frontend, port: 80}
    paths: [/]

  - name: api
    host: full
    backend: {name: full-backend, port: 80}
    paths: [/api, /admin]
    # deny is evaluated ahead of paths and carries no backendRef, so an unresolved filter
    # fails closed rather than open.
    deny: [/admin/metrics, /api/internal]
    requestBuffer: 100Mi
    timeout: 300s

  - name: ws
    hostname: ws.full.haaijer.dev   # a FULL hostname, not the <host>.<baseDomain> form
    backend: {name: full-y-provider, port: 443}
    paths: [/collaboration/ws]
    websocket: true

mediaProxy:
  enabled: true
  auth: {service: full-backend, port: 80, path: /api/v1.0/media-auth/}
  objectstore: {bucket: full}
  maxBodySize: 20m
  locations:
    - {path: "/media/preview/"}
    - {path: "/media/", headers: {Content-Disposition: attachment, X-Extra: "1"}}

staticFiles:
  enabled: true
  filesConfigMap: full-switcher
  servicesConfigMap: office-services
  path: /custom/
  maxAge: 600

# Five components, PDBs on. Docs' shape, and the case that asserts one PDB per component.
pdb:
  enabled: true
  maxUnavailable: 1
  components:
    backend:    {app.kubernetes.io/component: backend}
    frontend:   {app.kubernetes.io/component: frontend}
    celery:     {app.kubernetes.io/component: celery}
    yprovider:  {app.kubernetes.io/component: y-provider}
    docspec:    {app.kubernetes.io/component: docspec}

networkPolicy:
  enabled: true
  egress:
    - {datastore: postgres}
    - {datastore: cache}
    - {datastore: objectstore}
    - {identity: true}
    - {app: collabora, port: 9980}
    - {external: true, port: 443}

extraObjects:
  - apiVersion: v1
    kind: ConfigMap
    metadata: {name: full-extra}
    data: {note: "extraObjects is a passthrough — it must render verbatim"}
