# Every application the platform knows, including the ones off by default — today that is
# Messages, which needs port 25 open both ways and so is no default (apps/messages/README.md).
# cluster-default's other choices, so the build, kubeconform and dns checks cover every app
# directory under apps/ on at least one cluster.
domain: example.org
storageClass: longhorn
gateway:
  ip: 192.0.2.10
  acmeEmail: ops@example.org
  tlsIssuer: letsencrypt-gateway
size: large
registry: {url: oci://registry.example.org/office}
smtp: {configured: true}
apps: {messages: true}
