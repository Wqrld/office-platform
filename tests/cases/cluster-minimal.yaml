domain: example.org
gateway:
  ip: 10.0.0.5
  acmeEmail: ops@example.org
size: small
apps: {drive: false, collabora: false, calendars: false, projects: false, meet: false}
objectStore: {mode: external}
cluster: {loadBalancer: {kind: none}}   # a cloud LB allocates; nothing is pinned
smtp: {configured: true}
# A private fork, read with a deploy key: the source is the organisation's choice too.
source: {url: "ssh://git@github.com/example-org/office-platform", secretRef: office-platform-git}
