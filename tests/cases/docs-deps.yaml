# Docs' dependencies, expressed against platform-deps. Replaces the 174 hand-written lines
# in config/apps/docs/{datastores,secrets}.yaml.
app: docs
baseDomain: haaijer.dev

postgres:
  enabled: true
  env: django

cache:
  enabled: true
  env: django
  uses: [cache, broker]

objectstore:
  enabled: true
  env: django-s3
  quota: {maxSize: 20Gi}

smtp:
  enabled: true
  env: django-prefixed

oidc:
  enabled: true
  # The restored database already holds every user; login matches by sub, then by email.
  createUser: false

# Draw names match the objects already in the cluster, so adopting them is a no-op. A
# changed spec here would make ESO draw new values — new Django secret key, new
# collaboration secrets — and log every user out.
generated:
  docs-django:
    - {env: DJANGO_SECRET_KEY, draw: secretkey}
    - {env: DJANGO_SUPERUSER_PASSWORD, draw: superuser}
  docs-collaboration:
    - {env: Y_PROVIDER_API_KEY, draw: apikey}
    - {env: COLLABORATION_SERVER_SECRET, draw: serversecret}
