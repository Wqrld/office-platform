---
# Source: platform-tenants/templates/opensearch.yaml
# What the server mounts as its first-boot config (platform/opensearch/cluster.yaml) and the
# Job's input: every file but the users' hashes, which only the Job writes. A Secret because
# the chart mounts nothing else there; nothing in it is secret. No `admin` user: cluster
# administration is the admin certificate only, so there is no all-access password to leak.
apiVersion: v1
kind: Secret
metadata:
  name: opensearch-security
  namespace: office-data
  labels:
    helm.sh/chart: platform-tenants-<version>
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: office
    app.kubernetes.io/name: tenants
    app.kubernetes.io/instance: tenants
stringData:
  action_groups.yml: |
    _meta: {type: actiongroups, config_version: 2}
  config.yml: |
    _meta: {type: config, config_version: 2}
    config:
      dynamic:
        authc:
          basic_internal_auth_domain:
            description: HTTP basic against the internal user database
            http_enabled: true
            transport_enabled: true
            order: 0
            http_authenticator: {type: basic, challenge: true}
            authentication_backend: {type: intern}
  internal_users.yml: |
    _meta: {type: internalusers, config_version: 2}
  roles.yml: |
    _meta: {type: roles, config_version: 2}
    find_service:
      reserved: false
      cluster_permissions: [cluster_composite_ops]
      index_permissions:
        - index_patterns: ["find-*"]
          allowed_actions: [indices_all]
    messages_service:
      reserved: false
      cluster_permissions: [cluster_composite_ops]
      index_permissions:
        - index_patterns: ["messages"]
          allowed_actions: [indices_all]
  roles_mapping.yml: |
    _meta: {type: rolesmapping, config_version: 2}
    find_service:
      reserved: false
      users: [find]
    messages_service:
      reserved: false
      users: [messages]
  tenants.yml: |
    _meta: {type: tenants, config_version: 2}
---
