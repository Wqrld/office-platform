# Source: platform-tenants/templates/opensearch.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: opensearch-security-<hash>
  namespace: office-data
  labels:
    helm.sh/chart: platform-tenants-<version>
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: office
    app.kubernetes.io/name: tenants
    app.kubernetes.io/instance: tenants
spec:
  # On a fresh install the server starts after this Job does; the retries wait it out.
  # Nothing waits on this Job (platform/tenants.yaml).
  backoffLimit: 10
  template:
    metadata:
      labels:
        helm.sh/chart: platform-tenants-<version>
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/part-of: office
        app.kubernetes.io/name: tenants
        app.kubernetes.io/instance: tenants
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: securityadmin
          image: docker.io/opensearchproject/opensearch:3.8.0
          command: [bash, -euo, pipefail, -c]
          args:
            - |
              tools=/usr/share/opensearch/plugins/opensearch-security/tools
              cp /security/*.yml /tmp/
              for app in find messages; do
                var="PASSWORD_${app^^}"
                hash="$("$tools/hash.sh" -p "${!var}" | tail -n1)"
                printf '%s:\n  hash: "%s"\n  reserved: false\n  description: "%s service account"\n' \
                  "$app" "$hash" "$app" >> /tmp/internal_users.yml
              done
              # Roles before the mapping that names them, users last.
              for t in config:config roles:roles rolesmapping:roles_mapping actiongroups:action_groups tenants:tenants internalusers:internal_users; do
                "$tools/securityadmin.sh" -f "/tmp/${t#*:}.yml" -t "${t%%:*}" \
                  -h opensearch-cluster-master.office-data.svc -icl -nhnv \
                  -cacert /admin/ca.crt -cert /admin/tls.crt -key /admin/tls.key
              done
          env:
            - {name: PASSWORD_FIND, valueFrom: {secretKeyRef: {name: opensearch-user-find, key: password}}}
            - {name: PASSWORD_MESSAGES, valueFrom: {secretKeyRef: {name: opensearch-user-messages, key: password}}}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 768Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: security, mountPath: /security, readOnly: true}
            - {name: admin, mountPath: /admin, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: security, secret: {secretName: opensearch-security}}
        - {name: admin, secret: {secretName: opensearch-admin-tls}}
        - {name: tmp, emptyDir: {}}
---
