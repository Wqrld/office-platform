# Source: platform-tenants/templates/keycloak.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: realm-<hash>
  namespace: office-identity
  labels:
    helm.sh/chart: platform-tenants-<version>
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: office
    app.kubernetes.io/name: tenants
    app.kubernetes.io/instance: tenants
spec:
  # On a fresh install Keycloak starts after this Job does; the availability check waits
  # ten minutes, the retries cover the rest. Nothing waits on this Job (platform/tenants.yaml).
  backoffLimit: 10
  template:
    metadata:
      labels:
        helm.sh/chart: platform-tenants-<version>
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/part-of: office
        app.kubernetes.io/name: tenants
        app.kubernetes.io/instance: tenants
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: keycloak-config-cli
          image: docker.io/adorsys/keycloak-config-cli:6.5.1-26.5.5
          args:
            - --import.files.locations=/config/realm.yaml
            - --import.var-substitution.enabled=true
            - --import.managed.client=no-delete
            - --import.managed.role=no-delete
            - --import.managed.client-scope=no-delete
            - --import.managed.scope-mapping=no-delete
            - --import.managed.client-scope-mapping=no-delete
            - --import.managed.group=no-delete
            - --import.managed.sub-group=no-delete
            - --import.managed.required-action=no-delete
            - --import.managed.component=no-delete
            - --import.managed.sub-component=no-delete
            - --import.managed.authentication-flow=no-delete
            - --import.managed.identity-provider=no-delete
            - --import.managed.identity-provider-mapper=no-delete
            - --import.managed.client-authorization-resources=no-delete
            - --import.managed.client-authorization-policies=no-delete
            - --import.managed.client-authorization-scopes=no-delete
            - --import.managed.message-bundles=no-delete
            - --import.managed.workflow=no-delete
          env:
            - {name: KEYCLOAK_URL, value: "http://keycloak-service.office-identity.svc:8080"}
            - {name: KEYCLOAK_AVAILABILITYCHECK_ENABLED, value: "true"}
            - {name: KEYCLOAK_AVAILABILITYCHECK_TIMEOUT, value: 600s}
            - {name: KEYCLOAK_USER, valueFrom: {secretKeyRef: {name: keycloak-bootstrap-admin, key: username}}}
            - {name: KEYCLOAK_PASSWORD, valueFrom: {secretKeyRef: {name: keycloak-bootstrap-admin, key: password}}}
            - {name: CLIENT_SECRET_CALENDARS, valueFrom: {secretKeyRef: {name: oidc-client-calendars, key: secret}}}
            - {name: CLIENT_SECRET_DOCS, valueFrom: {secretKeyRef: {name: oidc-client-docs, key: secret}}}
            - {name: CLIENT_SECRET_DRIVE, valueFrom: {secretKeyRef: {name: oidc-client-drive, key: secret}}}
            - {name: CLIENT_SECRET_FIND, valueFrom: {secretKeyRef: {name: oidc-client-find, key: secret}}}
            - {name: CLIENT_SECRET_MEET, valueFrom: {secretKeyRef: {name: oidc-client-meet, key: secret}}}
            - {name: CLIENT_SECRET_MESSAGES, valueFrom: {secretKeyRef: {name: oidc-client-messages, key: secret}}}
            - {name: CLIENT_SECRET_PROJECTS, valueFrom: {secretKeyRef: {name: oidc-client-projects, key: secret}}}
            - {name: SMTP_FROM, valueFrom: {secretKeyRef: {name: smtp-credentials, key: from}}}
            - {name: SMTP_HOST, valueFrom: {secretKeyRef: {name: smtp-credentials, key: host}}}
            - {name: SMTP_PASSWORD, valueFrom: {secretKeyRef: {name: smtp-credentials, key: password}}}
            - {name: SMTP_PORT, valueFrom: {secretKeyRef: {name: smtp-credentials, key: port}}}
            - {name: SMTP_SSL, valueFrom: {secretKeyRef: {name: smtp-credentials, key: useSSL}}}
            - {name: SMTP_STARTTLS, valueFrom: {secretKeyRef: {name: smtp-credentials, key: useTLS}}}
            - {name: SMTP_USER, valueFrom: {secretKeyRef: {name: smtp-credentials, key: username}}}
          resources:
            requests: {cpu: 50m, memory: 256Mi}
            limits: {memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: config, mountPath: /config, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: config, configMap: {name: realm-<hash>}}
        - {name: tmp, emptyDir: {}}
