  url: https://github.com/suitenumerique/find
  ref: {branch: main, commit: 025e6d02ea08c46ef831a70f0ae1a41036c5a7c9}
  ignore: |
    /*
    !/src/helm
---
# Source: control-plane/templates/sources.yaml
# Calendars. The same arrangement as Projects: the chart is src/helm/calendars in the fork,
# not in any upstream tag yet (v0.1.0 predates it; the upstreaming PR is open), and the
# fork's tag also publishes the images. Those have to be the fork's: upstream's images
# predate the `dockerflow` endpoints behind this chart's probes, and the fork's tags also
# carry the CI fix that makes them run non-root. When the PR lands, only the url changes.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: wqrld-calendars
  namespace: flux-system
  annotations: {helm.sh/resource-policy: keep}
spec:
  interval: 24h
  url: https://github.com/Wqrld/calendars
  ref: {tag: v0.1.1}
  ignore: |
    /*
    !/src/helm
---
# Source: control-plane/templates/sources.yaml
# Projects. suitenumerique/projects ships no chart; ours is written in the application's
# own repo (src/helm/projects, copied from Docs' so it reads as theirs) and the upstreaming
# PR is open. Until it lands, the chart comes from the FORK's git tag — the same tag that
# publishes the image (apps/projects/README.md, Pins) — so one pin moves both. When the PR
# lands, only the url changes: suitenumerique/projects at the tag that carries the chart.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: wqrld-projects
  namespace: flux-system
  annotations: {helm.sh/resource-policy: keep}
spec:
  interval: 24h
  url: https://github.com/Wqrld/projects
  ref: {tag: v1.3.1}
  ignore: |
    /*
    !/src/helm
