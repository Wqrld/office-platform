---
# Source: control-plane/templates/cluster-vars.yaml
# The scalars the layers substitute (`postBuild.substituteFrom`), derived from the typed
# values above rather than written by hand: one input, one artifact, nothing twice.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-vars
  namespace: flux-system
  annotations: {helm.sh/resource-policy: keep}
data:
  BASE_DOMAIN: "example.org"
  # Each app's HelmReleases pick their sizing from `<app>-sizes` by this key
  # (apps/README.md, Sizing); a size the ConfigMap lacks is a HelmRelease that says so.
  SIZE: "medium"
  STORAGE_CLASS: "longhorn"
  GATEWAY_IP: "192.0.2.10"
  GATEWAY_CLASS: "eg"
  LB_ANNOTATIONS: "{\"metallb.universe.tf/loadBalancerIPs\":\"192.0.2.10\"}"
  TLS_ISSUER: "letsencrypt-gateway"
  ACME_EMAIL: "ops@example.org"
  S3_MODE: "garage"
  TLS_HOSTS: "[\"id.example.org\",\"s3.example.org\",\"calendars.example.org\",\"collabora.example.org\",\"docs.example.org\",\"drive.example.org\",\"find.example.org\",\"livekit.example.org\",\"meet.example.org\",\"projects.example.org\"]"
  GATEWAY_CERTS: "[{\"kind\":\"Secret\",\"name\":\"office-tls\"}]"
  SERVICES_JSON: "{\"services\":[{\"logo\":\"https://calendars.example.org/favicon.png\",\"maturity\":\"beta\",\"name\":\"Calendars\",\"url\":\"https://calendars.example.org\"},{\"logo\":\"https://docs.example.org/assets/icon-docs.svg\",\"maturity\":\"stable\",\"name\":\"Docs\",\"url\":\"https://docs.example.org\"},{\"logo\":\"https://drive.example.org/assets/logo-icon_beta.svg\",\"maturity\":\"stable\",\"name\":\"Drive\",\"url\":\"https://drive.example.org\"},{\"logo\":\"https://meet.example.org/favicon-32x32.png\",\"maturity\":\"beta\",\"name\":\"Meet\",\"url\":\"https://meet.example.org\"},{\"logo\":\"https://projects.example.org/oss/light/logomark.svg\",\"maturity\":\"beta\",\"name\":\"Projects\",\"url\":\"https://projects.example.org\"},{\"maturity\":\"stable\",\"name\":\"Account\",\"url\":\"https://id.example.org/realms/office/account\"}]}"
  TENANTS_JSON: "{\"calendars\":{\"acl\":{\"broker\":\"+keys\"},\"cache\":[\"cache\",\"broker\"],\"oidc\":{\"description\":\"Calendars — agenda's delen en vergaderingen plannen\"},\"postgres\":{}},\"collabora\":{},\"docs\":{\"bucket\":true,\"cache\":[\"cache\",\"broker\"],\"oidc\":{\"accessTokenLifespan\":1200,\"audiences\":[\"find\"],\"description\":\"Docs — samen werken aan documenten\"},\"postgres\":{\"extensions\":[\"pg_trgm\",\"unaccent\"]}},\"drive\":{\"bucket\":true,\"cache\":[\"cache\",\"broker\"],\"oidc\":{\"description\":\"Drive — bestanden delen en samen bewerken\"},\"postgres\":{\"extensions\":[\"ltree\",\"pg_trgm\",\"unaccent\"]}},\"find\":{\"cache\":[\"cache\"],\"oidc\":{\"description\":\"Find — zoeken over alle applicaties\",\"shape\":\"resource-server\"},\"postgres\":{},\"search\":[\"find-*\"]},\"livekit\":{\"cache\":[\"broker\"]},\"meet\":{\"bucket\":true,\"cache\":[\"cache\",\"broker\"],\"oidc\":{\"description\":\"Meet — videovergaderen\"},\"postgres\":{\"extensions\":[\"pg_trgm\"]}},\"messages\":{\"bucket\":true,\"cache\":[\"cache\",\"broker\"],\"oidc\":{\"description\":\"Messages — gedeelde mailboxen\"},\"postgres\":{\"extensions\":[\"unaccent\"]},\"search\":[\"messages\"]},\"projects\":{\"acl\":{\"cache\":\"+info\"},\"bucket\":true,\"cache\":[\"cache\"],\"oidc\":{\"description\":\"Projects — borden, lijsten en kaarten voor projectbeheer\",\"redirect\":\"/oidc-callback\",\"shape\":\"login\"},\"postgres\":{}}}"
---
# Source: control-plane/templates/config.yaml
# The platform source: this repository at the tag of this chart's version. Every
# Kustomization this chart emits reads infra/, platform/ and apps/ from it, and the platform
# charts are built from its charts/ (sources.yaml). One tag, so the organisation's chart pin
# IS the platform version: there is no second pointer to keep in step (docs/adr/0114).
# Rendered here rather than shared with the GitRepository the organisation's cluster.yaml
# installs this chart from, so the config moves only once these templates have: a new
# layer never reaches the cluster before the cluster-vars it reads.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: office-config
  namespace: flux-system
  annotations: {helm.sh/resource-policy: keep}
spec:
  interval: 5m
  url: https://github.com/Wqrld/office-platform
  ref: {tag: "v<version>"}
---
# Source: control-plane/templates/sources.yaml
# Chart lives in-tree at src/helm/impress; the git tag is the pin.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: suitenumerique-docs
  namespace: flux-system
  annotations: {helm.sh/resource-policy: keep}
spec:
  interval: 24h
  url: https://github.com/suitenumerique/docs
  ref: {tag: v5.5.0}
  ignore: |
    /*
    !/src/helm
---
# Source: control-plane/templates/sources.yaml
# Drive. Chart lives in-tree at src/helm/drive. Until the thumbnails PR lands upstream,
# chart and images come from the FORK's git tag — the same tag publishes
# ghcr.io/wqrld/drive-{backend,frontend} (apps/drive/README.md, The fork), so one pin moves
# all three. When it lands, only the url changes back to suitenumerique/drive.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: wqrld-drive
  namespace: flux-system
  annotations: {helm.sh/resource-policy: keep}
spec:
  interval: 24h
  url: https://github.com/Wqrld/drive
  ref: {tag: v0.23.0-office.6}
  ignore: |
    /*
    !/src/helm
---
# Source: control-plane/templates/sources.yaml
# Chart lives in-tree at src/helm/find; there is no tag to pin. `suitenumerique/find` has
# never cut a release — zero git tags — so this is the one source pinned to a COMMIT, the
# single departure from adr/0104. See apps/find/README.md.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: suitenumerique-find
  namespace: flux-system
  annotations: {helm.sh/resource-policy: keep}
spec:
