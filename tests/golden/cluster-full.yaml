# Source: control-plane/templates/cluster-vars.yaml
# The scalars the layers substitute (`postBuild.substituteFrom`), derived from the typed
# values above rather than written by hand: one input, one artifact, nothing twice.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-vars
  namespace: flux-system
  annotations: {helm.sh/resource-policy: keep}
data:
  BASE_DOMAIN: "haaijer.dev"
  # Each app's HelmReleases pick their sizing from `<app>-sizes` by this key
  # (apps/README.md, Sizing); a size the ConfigMap lacks is a HelmRelease that says so.
  SIZE: "large"
  STORAGE_CLASS: "longhorn"
  GATEWAY_IP: "45.136.141.168"
  GATEWAY_CLASS: "eg"
  LB_ANNOTATIONS: "{\"metallb.universe.tf/loadBalancerIPs\":\"45.136.141.168\"}"
  TLS_ISSUER: "letsencrypt-gateway"
  ACME_EMAIL: "wereld03@gmail.com"
  S3_MODE: "garage"
  TLS_HOSTS: "[\"id.haaijer.dev\",\"s3.haaijer.dev\",\"calendars.haaijer.dev\",\"collabora.haaijer.dev\",\"docs.haaijer.dev\",\"drive.haaijer.dev\",\"find.haaijer.dev\",\"livekit.haaijer.dev\",\"meet.haaijer.dev\",\"messages.haaijer.dev\",\"projects.haaijer.dev\"]"
  SERVICES_JSON: "{\"services\":[{\"logo\":\"https://calendars.haaijer.dev/favicon.png\",\"maturity\":\"beta\",\"name\":\"Calendars\",\"url\":\"https://calendars.haaijer.dev\"},{\"logo\":\"https://docs.haaijer.dev/assets/icon-docs.svg\",\"maturity\":\"stable\",\"name\":\"Docs\",\"url\":\"https://docs.haaijer.dev\"},{\"logo\":\"https://drive.haaijer.dev/assets/logo-icon_beta.svg\",\"maturity\":\"stable\",\"name\":\"Drive\",\"url\":\"https://drive.haaijer.dev\"},{\"logo\":\"https://meet.haaijer.dev/favicon-32x32.png\",\"maturity\":\"beta\",\"name\":\"Meet\",\"url\":\"https://meet.haaijer.dev\"},{\"logo\":\"https://messages.haaijer.dev/images/pwa/icons/ios/32.png\",\"maturity\":\"alpha\",\"name\":\"Messages\",\"url\":\"https://messages.haaijer.dev\"},{\"logo\":\"https://projects.haaijer.dev/oss/light/logomark.svg\",\"maturity\":\"beta\",\"name\":\"Projects\",\"url\":\"https://projects.haaijer.dev\"},{\"maturity\":\"stable\",\"name\":\"Account\",\"url\":\"https://id.haaijer.dev/realms/office/account\"}]}"
