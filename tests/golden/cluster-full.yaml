# Source: control-plane/templates/layers.yaml
# The layers, in reconcile order. Each waits for the previous one to be healthy.
#
# cluster-*   what the cluster lacks and the platform was asked to install — Envoy Gateway,
#             MetalLB — as `cluster.*.install` chooses (adr/0112). Two Kustomizations each:
#             the chart, then its configuration (GatewayClass, IPAddressPool), because a
#             CR cannot be applied before the chart that brings its CRD. Not emitted when
#             the cluster brings its own.
# infra       operators — CNPG, External Secrets, the Garage operator, and cert-manager
#             when asked. Not sized by profile: one cert-manager is one cert-manager
#             whether it serves 5 people or 5,000, and an operator that is too small fails
#             as "nothing reconciles".
# platform    the shared stateful layer — gateway, postgres, cache, search, identity, and
#             the datastores and credentials of EVERY application, enabled or not, which
#             is what lets a disabled app come back with its data.
# objectstore Garage, only when the platform runs the object store itself.
#
# There is deliberately no `crds` layer yet. Every CRD relied on is either pre-existing in
# the cluster or installed by an operator chart on first install; the layer arrives the
# first time a CRD upgrade needs managing separately.

apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra
  namespace: flux-system
  annotations: {helm.sh/resource-policy: keep}
spec:
  interval: 30m
  retryInterval: 2m
  timeout: 10m
  prune: true
  wait: true
  sourceRef: {kind: OCIRepository, name: office-config}
  path: ./infra
  postBuild:
    substituteFrom: [{kind: ConfigMap, name: cluster-vars}]
---
# Source: control-plane/templates/layers.yaml
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform
  namespace: flux-system
  annotations: {helm.sh/resource-policy: keep}
spec:
  interval: 30m
  retryInterval: 2m
  timeout: 10m
  prune: true
  wait: true
  sourceRef: {kind: OCIRepository, name: office-config}
  path: ./platform
  components: ["./overlays/size-large"]
  dependsOn:
    - {name: infra}
  postBuild:
    substituteFrom: [{kind: ConfigMap, name: cluster-vars}]
---
# Source: control-plane/templates/layers.yaml
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: objectstore
  namespace: flux-system
  annotations: {helm.sh/resource-policy: keep}
spec:
  interval: 30m
  retryInterval: 2m
  timeout: 10m
  prune: true
  wait: true
  sourceRef: {kind: OCIRepository, name: office-config}
  path: ./platform/objectstore
  components: ["../overlays/size-large"]
  dependsOn:
    - {name: platform}
  postBuild:
    substituteFrom: [{kind: ConfigMap, name: cluster-vars}]
---
# Source: control-plane/templates/config.yaml
# The config artifact: infra/, platform/ and apps/, read by every Kustomization this chart
# emits — at this chart's version, like the charts above. release.sh publishes both under
# one number, so the organisation's chart pin IS the platform version: there is no second
# pointer to keep in step and no moving tag anywhere (the old `:latest` / `:X.Y.Z` split
# existed only because the pointer used to live inside the tree it pointed at).
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: office-config
  namespace: flux-system
  annotations: {helm.sh/resource-policy: keep}
spec:
  interval: 5m
  url: oci://harbor.mijnbureau.haaijer.dev/office/config
  ref: {tag: "<version>"}
  secretRef: {name: harbor-auth}
---
