---
# Source: platform-deps/templates/cache.yaml
# One Secret, one URL per use. The instances are separate on purpose: eviction policy and
# persistence are per-instance, and an evicting broker silently drops queued tasks
# (06-datastores.md). The ACL user is created by the 30-platform layer — adr/0107.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: drive-cache
  namespace: office-drive
  labels:
    helm.sh/chart: platform-deps-<version>
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: office
    app.kubernetes.io/name: drive-deps
    app.kubernetes.io/instance: drive-deps
spec:
  refreshInterval: "1h"
  secretStoreRef: {kind: ClusterSecretStore, name: office-data}
  target:
    name: drive-cache
    creationPolicy: Owner
    template:
      data:
        REDIS_URL: "redis://drive:{{ .cache }}@valkey-cache.office-data.svc.cluster.local:6379/1"
        DJANGO_CELERY_BROKER_URL: "redis://drive:{{ .broker }}@valkey-broker.office-data.svc.cluster.local:6379/0"
  data:
    - {secretKey: cache, remoteRef: {key: valkey-cache-acl, property: drive}}
    - {secretKey: broker, remoteRef: {key: valkey-broker-acl, property: drive}}
---
# Source: platform-deps/templates/objectstore.yaml
# External mode: any S3-compatible store the organisation already runs. Like the SMTP relay,
# the endpoint and the credential are applied by hand into office-data once (docs/bootstrap.md)
# and read back from here, so nothing about the provider is in git. The bucket is still the
# platform's name for it — the organisation creates `drive` there, and owns its CORS rule
# for a browser upload, which adr/0110 puts at the edge only when Garage is behind it.
#
# The Secret this produces has the same keys as the Garage path's, so the app cannot tell
# which mode it is in. A real `refreshInterval`, as for smtp: rotation is a re-read.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: drive-s3
  namespace: office-drive
  labels:
    helm.sh/chart: platform-deps-<version>
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: office
    app.kubernetes.io/name: drive-deps
    app.kubernetes.io/instance: drive-deps
spec:
  refreshInterval: "1h"
  secretStoreRef: {kind: ClusterSecretStore, name: office-data}
  target:
    name: drive-s3
    creationPolicy: Owner
    template:
      data:
        AWS_S3_ENDPOINT_URL: "{{ .endpoint }}"
        AWS_S3_REGION_NAME: "{{ .region }}"
        AWS_STORAGE_BUCKET_NAME: "drive"
        AWS_S3_ACCESS_KEY_ID: "{{ .accessKeyId }}"
        AWS_S3_SECRET_ACCESS_KEY: "{{ .secretAccessKey }}"
        AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
        AWS_RESPONSE_CHECKSUM_VALIDATION: WHEN_REQUIRED
        # An external endpoint is already the browser-reachable one, so a presigned URL is
        # signed against the same host the app itself uses. The value of `publicEndpoint`
        # is only a flag here; its text is Garage-mode's public address.
        AWS_S3_DOMAIN_REPLACE: "{{ .endpoint }}"
  data:
    - {secretKey: endpoint, remoteRef: {key: object-store, property: endpoint}}
    - {secretKey: region, remoteRef: {key: object-store, property: region}}
    - {secretKey: accessKeyId, remoteRef: {key: object-store, property: accessKeyId}}
    - {secretKey: secretAccessKey, remoteRef: {key: object-store, property: secretAccessKey}}
---
# Source: platform-deps/templates/postgres.yaml
# The role's password is generated by the 30-platform layer (adr/0107); this reshapes it
# into the key names django applications expect, so the app consumes the whole Secret
# with one `envFrom` and no credential passes through Helm values.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: drive-postgres
  namespace: office-drive
  labels:
    helm.sh/chart: platform-deps-<version>
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: office
    app.kubernetes.io/name: drive-deps
    app.kubernetes.io/instance: drive-deps
spec:
  refreshInterval: "1h"
  secretStoreRef: {kind: ClusterSecretStore, name: office-data}
  target:
    name: drive-postgres
    creationPolicy: Owner
    template:
      data:
        DB_ENGINE: "django.db.backends.postgresql_psycopg2"
        DB_HOST: "office-pg-rw.office-data.svc.cluster.local"
        DB_PORT: "5432"
        DB_NAME: "drive"
        DB_USER: "{{ .username }}"
        DB_PASSWORD: "{{ .password }}"
  data:
    - {secretKey: username, remoteRef: {key: drive-db, property: username}}
    - {secretKey: password, remoteRef: {key: drive-db, property: password}}
