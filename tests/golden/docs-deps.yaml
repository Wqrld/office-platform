---
# Source: platform-deps/templates/generated.yaml
# Generated once, in the cluster, never derived at render time (history/design/adr/0005). Each variable
# gets its OWN generator draw — reusing one draw would make two variables equal, which is
# the bug `derivePassword` shipped.
#
# `dataFrom` is an ORDERED list and its order is part of the spec. Changing the spec of a
# generated secret makes ESO draw again, so this is a list rather than a map: Helm sorts
# map keys, and a re-sort here silently rotates every secret in the object.
---
# Source: platform-deps/templates/cache.yaml
# One Secret, one URL per use. The instances are separate on purpose: eviction policy and
# persistence are per-instance, and an evicting broker silently drops queued tasks
# (history/design/06-datastores.md). The ACL user is created by the platform layer — adr/0107.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: docs-cache
  namespace: office-docs
  labels:
    helm.sh/chart: platform-deps-<version>
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: office
    app.kubernetes.io/name: docs-deps
    app.kubernetes.io/instance: docs-deps
spec:
  refreshInterval: "1h"
  secretStoreRef: {kind: ClusterSecretStore, name: office-data}
  target:
    name: docs-cache
    creationPolicy: Owner
    template:
      data:
        REDIS_URL: "redis://docs:{{ .cache }}@valkey-cache.office-data.svc.cluster.local:6379/1"
        DJANGO_CELERY_BROKER_URL: "redis://docs:{{ .broker }}@valkey-broker.office-data.svc.cluster.local:6379/0"
        DJANGO_CELERY_BROKER_TRANSPORT_OPTIONS: '{"global_keyprefix": "docs:"}'
  data:
    - {secretKey: cache, remoteRef: {key: valkey-cache-acl, property: docs}}
    - {secretKey: broker, remoteRef: {key: valkey-broker-acl, property: docs}}
---
# Source: platform-deps/templates/generated.yaml
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: docs-collaboration
  namespace: office-docs
  labels:
    helm.sh/chart: platform-deps-<version>
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: office
    app.kubernetes.io/name: docs-deps
    app.kubernetes.io/instance: docs-deps
spec:
  # Zero: a generated secret must never be re-drawn on refresh, or every pod holding it
  # is suddenly wrong.
  refreshInterval: "0"
  target:
    name: docs-collaboration
    creationPolicy: Owner
    template:
      data:
        Y_PROVIDER_API_KEY: "{{ .apikey }}"
        COLLABORATION_SERVER_SECRET: "{{ .serversecret }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ClusterGenerator
          name: office-password
      rewrite: [{regexp: {source: "password", target: "apikey"}}]
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ClusterGenerator
          name: office-password
      rewrite: [{regexp: {source: "password", target: "serversecret"}}]
