---
# Source: platform-deps/templates/generated.yaml
# Generated once, in the cluster, never derived at render time (history/design/adr/0005). Each variable
# gets its OWN generator draw — reusing one draw would make two variables equal, which is
# the bug `derivePassword` shipped.
#
# `dataFrom` is an ORDERED list and its order is part of the spec. Changing the spec of a
# generated secret makes ESO draw again, so this is a list rather than a map: Helm sorts
# map keys, and a re-sort here silently rotates every secret in the object.
---
# Source: platform-deps/templates/cache.yaml
# One Secret, one URL per use. The instances are separate on purpose: eviction policy and
# persistence are per-instance, and an evicting broker silently drops queued tasks
# (history/design/06-datastores.md). The ACL user is created by the platform layer — adr/0107.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: messages-cache
  namespace: office-messages
  labels:
    helm.sh/chart: platform-deps-<version>
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: office
    app.kubernetes.io/name: messages-deps
    app.kubernetes.io/instance: messages-deps
spec:
  refreshInterval: "1h"
  secretStoreRef: {kind: ClusterSecretStore, name: office-data}
  target:
    name: messages-cache
    creationPolicy: Owner
    template:
      data:
        REDIS_URL: "redis://messages:{{ .cache }}@valkey-cache.office-data.svc.cluster.local:6379/1"
        CELERY_BROKER_URL: "redis://messages:{{ .broker }}@valkey-broker.office-data.svc.cluster.local:6379/0"
        DJANGO_CELERY_BROKER_TRANSPORT_OPTIONS: '{"global_keyprefix": "messages:"}'
  data:
    - {secretKey: cache, remoteRef: {key: valkey-cache-acl, property: messages}}
    - {secretKey: broker, remoteRef: {key: valkey-broker-acl, property: messages}}
---
# Source: platform-deps/templates/generated.yaml
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: messages-mda
  namespace: office-messages
  labels:
    helm.sh/chart: platform-deps-<version>
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: office
    app.kubernetes.io/name: messages-deps
    app.kubernetes.io/instance: messages-deps
spec:
  # Zero: a generated secret must never be re-drawn on refresh, or every pod holding it
  # is suddenly wrong.
  refreshInterval: "0"
  target:
    name: messages-mda
    creationPolicy: Owner
    template:
      data:
        MDA_API_SECRET: "{{ .mda }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ClusterGenerator
          name: office-token-50
      rewrite: [{regexp: {source: "password", target: "mda"}}]
---
# Source: platform-deps/templates/oidc.yaml
# The client secret is generated in-cluster and read by BOTH Keycloak and the app from this
# one Secret — it is never in git and never passes through Helm values (history/design/adr/0005).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: messages-oidc
  namespace: office-messages
  labels:
    helm.sh/chart: platform-deps-<version>
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: office
    app.kubernetes.io/name: messages-deps
    app.kubernetes.io/instance: messages-deps
spec:
  refreshInterval: "1h"
  secretStoreRef: {kind: ClusterSecretStore, name: office-identity}
  target:
    name: messages-oidc
    creationPolicy: Owner
    template:
      data:
        OIDC_RP_CLIENT_ID: "messages"
        OIDC_RP_CLIENT_SECRET: "{{ .secret }}"
        OIDC_RP_SIGN_ALGO: "RS256"
        OIDC_RP_SCOPES: "openid email profile"
        OIDC_OP_AUTHORIZATION_ENDPOINT: "https://id.example.org/realms/office/protocol/openid-connect/auth"
        OIDC_OP_LOGOUT_ENDPOINT: "https://id.example.org/realms/office/protocol/openid-connect/logout"
        OIDC_OP_TOKEN_ENDPOINT: "http://keycloak-service.office-identity.svc.cluster.local:8080/realms/office/protocol/openid-connect/token"
        OIDC_OP_USER_ENDPOINT: "http://keycloak-service.office-identity.svc.cluster.local:8080/realms/office/protocol/openid-connect/userinfo"
        OIDC_OP_JWKS_ENDPOINT: "http://keycloak-service.office-identity.svc.cluster.local:8080/realms/office/protocol/openid-connect/certs"
        OIDC_REDIRECT_ALLOWED_HOSTS: "https://messages.example.org"
        OIDC_REDIRECT_REQUIRE_HTTPS: "true"
        OIDC_USE_NONCE: "true"
        OIDC_CREATE_USER: "true"
        OIDC_FALLBACK_TO_EMAIL_FOR_IDENTIFICATION: "true"
        OIDC_ALLOW_DUPLICATE_EMAILS: "false"
        OIDC_STORE_ACCESS_TOKEN: "true"
        OIDC_STORE_ID_TOKEN: "true"
        OIDC_STORE_REFRESH_TOKEN: "false"
        OIDC_USERINFO_FULLNAME_FIELDS: "given_name,family_name"
        OIDC_USERINFO_SHORTNAME_FIELD: "name"
  data:
    - {secretKey: secret, remoteRef: {key: oidc-client-messages, property: secret}}
---
# Source: platform-deps/templates/opensearch.yaml
# One shared instance; the index prefix is the tenant boundary, and the app's OpenSearch
# role grants `<prefix>-*` and nothing else (adr/0111). The server, user and role belong to
# the platform layer (adr/0107) — this only reshapes the password it generated.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: messages-opensearch
  namespace: office-messages
  labels:
    helm.sh/chart: platform-deps-<version>
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: office
    app.kubernetes.io/name: messages-deps
    app.kubernetes.io/instance: messages-deps
spec:
  refreshInterval: "1h"
  secretStoreRef: {kind: ClusterSecretStore, name: office-data}
  target:
    name: messages-opensearch
    creationPolicy: Owner
    template:
      data:
        OPENSEARCH_URL: "https://messages:{{ .password }}@opensearch-cluster-master.office-data.svc.cluster.local:9200"
        OPENSEARCH_CA_CERTS: "/etc/opensearch-ca/ca.crt"
  data:
    - {secretKey: password, remoteRef: {key: opensearch-user-messages, property: password}}
---
# Source: platform-deps/templates/opensearch.yaml
# The cluster-internal CA, for an app that verifies the server (Find does not). Its own
# Secret, not a key of the one above: that one is consumed whole with `envFrom`, and a
# `ca.crt` key there is an invalid env name. The app mounts this at `caPath`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: messages-opensearch-ca
  namespace: office-messages
  labels:
    helm.sh/chart: platform-deps-<version>
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: office
    app.kubernetes.io/name: messages-deps
    app.kubernetes.io/instance: messages-deps
spec:
  refreshInterval: "1h"
  secretStoreRef: {kind: ClusterSecretStore, name: office-data}
  target: {name: messages-opensearch-ca, creationPolicy: Owner}
  data:
    - {secretKey: ca.crt, remoteRef: {key: opensearch-ca, property: ca.crt}}
---
# Source: platform-deps/templates/postgres.yaml
# The role's password is generated by the platform layer (adr/0107); this reshapes it
# into the key names  applications expect, so the app consumes the whole Secret
# with one `envFrom` and no credential passes through Helm values.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: messages-postgres
  namespace: office-messages
  labels:
    helm.sh/chart: platform-deps-<version>
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: office
    app.kubernetes.io/name: messages-deps
    app.kubernetes.io/instance: messages-deps
spec:
  refreshInterval: "1h"
  secretStoreRef: {kind: ClusterSecretStore, name: office-data}
  target:
    name: messages-postgres
    creationPolicy: Owner
    template:
      data:
        DB_ENGINE: "django.db.backends.postgresql_psycopg2"
        DB_HOST: "office-pg-rw.office-data.svc.cluster.local"
        DB_PORT: "5432"
        DB_NAME: "messages"
        DB_USER: "{{ .username }}"
        DB_PASSWORD: "{{ .password }}"
  data:
    - {secretKey: username, remoteRef: {key: messages-db, property: username}}
    - {secretKey: password, remoteRef: {key: messages-db, property: password}}
---
# Source: platform-deps/templates/smtp.yaml
# The one credential on this platform that is neither generated in-cluster nor minted by an
# operator: an SMTP relay account is issued by somebody else, so it is applied by hand into
# office-data once (docs/install.md) and read back from here. Nothing about the relay is in
# git — not even the host — and this reshapes the whole of it into the key names 
# applications expect, so the app consumes it with one `envFrom`.
#
# `refreshInterval` is a real interval, not the `"0"` the generated Secrets use: this reads a
# Secret rather than drawing from a generator, so re-reading it is how rotation works. The
# consuming pods still need a restart afterwards — `envFrom` is read once, at pod start.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: messages-smtp
  namespace: office-messages
  labels:
    helm.sh/chart: platform-deps-<version>
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: office
    app.kubernetes.io/name: messages-deps
    app.kubernetes.io/instance: messages-deps
spec:
  refreshInterval: "1h"
  secretStoreRef: {kind: ClusterSecretStore, name: office-data}
  target:
    name: messages-smtp
    creationPolicy: Owner
    template:
      data:
        DJANGO_EMAIL_BACKEND: "django.core.mail.backends.smtp.EmailBackend"
        DJANGO_EMAIL_HOST: "{{ .host }}"
        DJANGO_EMAIL_PORT: "{{ .port }}"
        DJANGO_EMAIL_HOST_USER: "{{ .username }}"
        DJANGO_EMAIL_HOST_PASSWORD: "{{ .password }}"
        DJANGO_EMAIL_USE_TLS: "{{ .useTLS }}"
        DJANGO_EMAIL_USE_SSL: "{{ .useSSL }}"
        DJANGO_EMAIL_FROM: "{{ .from }}"
  data:
    - {secretKey: host, remoteRef: {key: smtp-credentials, property: host}}
    - {secretKey: port, remoteRef: {key: smtp-credentials, property: port}}
    - {secretKey: username, remoteRef: {key: smtp-credentials, property: username}}
    - {secretKey: password, remoteRef: {key: smtp-credentials, property: password}}
    - {secretKey: useTLS, remoteRef: {key: smtp-credentials, property: useTLS}}
    - {secretKey: useSSL, remoteRef: {key: smtp-credentials, property: useSSL}}
    - {secretKey: from, remoteRef: {key: smtp-credentials, property: from}}
---
# Source: platform-deps/templates/objectstore.yaml
# The only datastore this chart provisions rather than merely reshapes: GarageBucket and
# GarageKey are app-namespaced, so they belong to the app's release (adr/0107).
#
# `secretTemplate` emits the Secret directly with the key names the profile chose, so there
# is no ESO hop at all — the credential never exists in a second place to drift from.
apiVersion: garage.rajsingh.info/v1beta1
kind: GarageBucket
metadata:
  name: messages
  namespace: office-messages
  labels:
    helm.sh/chart: platform-deps-<version>
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: office
    app.kubernetes.io/name: messages-deps
    app.kubernetes.io/instance: messages-deps
spec:
  clusterRef: {name: office-s3, namespace: office-data}
  globalAlias: messages
  deletionPolicy: Retain
---
# Source: platform-deps/templates/objectstore.yaml
apiVersion: garage.rajsingh.info/v1beta1
kind: GarageKey
metadata:
  name: messages
  namespace: office-messages
  labels:
    helm.sh/chart: platform-deps-<version>
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: office
    app.kubernetes.io/name: messages-deps
    app.kubernetes.io/instance: messages-deps
spec:
  clusterRef: {name: office-s3, namespace: office-data}
  name: messages
  neverExpires: true
  bucketPermissions:
    - bucketRef: {name: messages, namespace: office-messages}
      read: true
      write: true
      owner: true
  secretTemplate:
    name: messages-s3
    accessKeyIdKey: AWS_S3_ACCESS_KEY_ID
    secretAccessKeyKey: AWS_S3_SECRET_ACCESS_KEY
    includeEndpoint: true
    endpointKey: AWS_S3_ENDPOINT_URL
    includeRegion: true
    regionKey: AWS_S3_REGION_NAME
    includeBucketName: true
    bucketNameKey: AWS_STORAGE_BUCKET_NAME
    additionalData:
      AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
      AWS_RESPONSE_CHECKSUM_VALIDATION: WHEN_REQUIRED
