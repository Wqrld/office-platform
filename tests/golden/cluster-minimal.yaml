---
# Source: control-plane/templates/cluster-vars.yaml
# The scalars the layers substitute (`postBuild.substituteFrom`), derived from the typed
# values above rather than written by hand: one input, one artifact, nothing twice.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-vars
  namespace: flux-system
  annotations: {helm.sh/resource-policy: keep}
data:
  BASE_DOMAIN: "example.org"
  # Each app's HelmReleases pick their sizing from `<app>-sizes` by this key
  # (apps/README.md, Sizing); a size the ConfigMap lacks is a HelmRelease that says so.
  SIZE: "small"
  STORAGE_CLASS: "longhorn"
  GATEWAY_IP: "10.0.0.5"
  GATEWAY_CLASS: "eg"
  LB_ANNOTATIONS: "{}"
  TLS_ISSUER: "letsencrypt-gateway"
  ACME_EMAIL: "ops@example.org"
  S3_MODE: "external"
  TLS_HOSTS: "[\"id.example.org\",\"docs.example.org\",\"find.example.org\"]"
  MONITORING_MODE: "platform"
  ALERT_EMAIL: ""
  PROBE_TARGETS: "[\"https://id.example.org/\",\"https://docs.example.org/\",\"https://find.example.org/\"]"
  GATEWAY_CERTS: "[{\"kind\":\"Secret\",\"name\":\"office-tls\"}]"
  SERVICES_JSON: "{\"services\":[{\"logo\":\"https://docs.example.org/assets/icon-docs.svg\",\"maturity\":\"stable\",\"name\":\"Docs\",\"url\":\"https://docs.example.org\"},{\"maturity\":\"stable\",\"name\":\"Account\",\"url\":\"https://id.example.org/realms/office/account\"}]}"
  TENANTS_JSON: "{\"calendars\":{\"acl\":{\"broker\":\"+keys\"},\"cache\":[\"cache\",\"broker\"],\"oidc\":{\"description\":\"Calendars — agenda's delen en vergaderingen plannen\"},\"postgres\":{}},\"collabora\":{},\"docs\":{\"acl\":{\"cache\":\"+info +keys\"},\"bucket\":true,\"cache\":[\"cache\",\"broker\"],\"oidc\":{\"accessTokenLifespan\":1200,\"audiences\":[\"find\"],\"description\":\"Docs — samen werken aan documenten\"},\"postgres\":{\"databases\":[\"yhub\"],\"extensions\":[\"pg_trgm\",\"unaccent\"]}},\"drive\":{\"bucket\":true,\"cache\":[\"cache\",\"broker\"],\"oidc\":{\"description\":\"Drive — bestanden delen en samen bewerken\"},\"postgres\":{\"extensions\":[\"ltree\",\"pg_trgm\",\"unaccent\"]}},\"find\":{\"cache\":[\"cache\"],\"oidc\":{\"description\":\"Find — zoeken over alle applicaties\",\"shape\":\"resource-server\"},\"postgres\":{},\"search\":[\"find-*\"]},\"livekit\":{\"cache\":[\"broker\"]},\"meet\":{\"bucket\":true,\"cache\":[\"cache\",\"broker\"],\"oidc\":{\"description\":\"Meet — videovergaderen\"},\"postgres\":{\"extensions\":[\"pg_trgm\"]}},\"messages\":{\"bucket\":true,\"cache\":[\"cache\",\"broker\"],\"oidc\":{\"description\":\"Messages — gedeelde mailboxen\"},\"postgres\":{\"extensions\":[\"unaccent\"]},\"search\":[\"messages\"]},\"projects\":{\"acl\":{\"cache\":\"+info\"},\"bucket\":true,\"cache\":[\"cache\"],\"oidc\":{\"description\":\"Projects — borden, lijsten en kaarten voor projectbeheer\",\"redirect\":\"/oidc-callback\",\"shape\":\"login\"},\"postgres\":{}}}"
---
# Source: control-plane/templates/config.yaml
# The platform source: this repository at the tag of this chart's version. Every
# Kustomization this chart emits reads infra/, platform/ and apps/ from it, and the platform
# charts are built from its charts/ (sources.yaml). One tag, so the organisation's chart pin
# IS the platform version: there is no second pointer to keep in step (docs/adr/0114).
# Rendered here rather than shared with the GitRepository the organisation's cluster.yaml
# installs this chart from, so the config moves only once these templates have: a new
# layer never reaches the cluster before the cluster-vars it reads.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: office-config
  namespace: flux-system
  annotations: {helm.sh/resource-policy: keep}
spec:
  interval: 5m
  url: ssh://git@github.com/example-org/office-platform
  ref: {tag: "v<version>"}
  secretRef: {name: office-platform-git}
---
# Source: control-plane/templates/sources.yaml
# Our own charts, built from the platform source at this chart's version (config.yaml), so a
# control plane can only ever pair with the platform charts it was released with.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmChart
metadata:
  name: platform-deps
  namespace: flux-system
  annotations: {helm.sh/resource-policy: keep}
spec:
  interval: 30m
  chart: ./charts/platform-deps
  sourceRef: {kind: GitRepository, name: office-config}
---
# Source: control-plane/templates/sources.yaml
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmChart
metadata:
  name: platform-app
  namespace: flux-system
  annotations: {helm.sh/resource-policy: keep}
spec:
  interval: 30m
  chart: ./charts/platform-app
  sourceRef: {kind: GitRepository, name: office-config}
---
# Source: control-plane/templates/sources.yaml
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmChart
metadata:
  name: platform-tenants
  namespace: flux-system
  annotations: {helm.sh/resource-policy: keep}
spec:
  interval: 30m
  chart: ./charts/platform-tenants
  sourceRef: {kind: GitRepository, name: office-config}
---
# Source: control-plane/templates/sources.yaml
# Chart sources the layers before the apps read, and the chart repositories. An app's own
# git source is in apps/<app>/source.yaml, applied with its release: from here the control
# plane moved every app's chart at once, before its layer applied the values that go with it,
# so each bumped app upgraded twice and ran a new chart with old images in between. Upstream
# pins are literal: updatecli rewrites them (updatecli/README.md). La Suite publishes no Helm
# repository, so its charts come from pinned git tags — see docs/adr/0104.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: cloudnative-pg
  namespace: flux-system
  annotations: {helm.sh/resource-policy: keep}
spec:
  interval: 1h
  url: https://cloudnative-pg.github.io/charts
---
# Source: control-plane/templates/sources.yaml
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: external-secrets
  namespace: flux-system
  annotations: {helm.sh/resource-policy: keep}
spec:
  interval: 1h
  url: https://charts.external-secrets.io
---
# Source: control-plane/templates/sources.yaml
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: valkey
  namespace: flux-system
  annotations: {helm.sh/resource-policy: keep}
spec:
  interval: 1h
  url: https://valkey.io/valkey-helm/
---
# Source: control-plane/templates/sources.yaml
# kube-prometheus-stack (under monitoring.mode: platform) and the blackbox exporter.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: prometheus-community
  namespace: flux-system
  annotations: {helm.sh/resource-policy: keep}
spec:
  interval: 1h
  url: https://prometheus-community.github.io/helm-charts
---
# Source: control-plane/templates/sources.yaml
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: opensearch
  namespace: flux-system
  annotations: {helm.sh/resource-policy: keep}
spec:
  interval: 1h
  url: https://opensearch-project.github.io/helm-charts
---
# Source: control-plane/templates/sources.yaml
# Collabora is the exception to adr/0104: it is not a La Suite application and it DOES
# publish a chart repository, so it is an ordinary pinned HelmRelease.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: collabora
  namespace: flux-system
  annotations: {helm.sh/resource-policy: keep}
spec:
  interval: 1h
  url: https://collaboraonline.github.io/online
---
# Source: control-plane/templates/sources.yaml
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: garage-operator
  namespace: flux-system
  annotations: {helm.sh/resource-policy: keep}
spec:
  interval: 24h
  type: oci
  url: oci://ghcr.io/rajsinghtech/charts
---
# Source: control-plane/templates/apps.yaml
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app-docs
  namespace: flux-system
spec:
  interval: 30m
  retryInterval: 2m
  timeout: 10m
  prune: true
  wait: true
  sourceRef: {kind: GitRepository, name: office-config}
  path: ./apps/docs
  dependsOn:
    - {name: platform}
    - {name: app-find}
  postBuild:
    substitute: {"APP":"docs"}
    substituteFrom: [{kind: ConfigMap, name: cluster-vars}]
---
# Source: control-plane/templates/apps.yaml
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app-find
  namespace: flux-system
spec:
  interval: 30m
  retryInterval: 2m
  timeout: 10m
  prune: true
  wait: true
  sourceRef: {kind: GitRepository, name: office-config}
  path: ./apps/find
  dependsOn:
    - {name: platform}
  postBuild:
    substitute: {"APP":"find"}
    substituteFrom: [{kind: ConfigMap, name: cluster-vars}]
---
# Source: control-plane/templates/layers.yaml
# The layers, in reconcile order. Each waits for the previous one to be healthy.
#
# cluster-*   what the cluster lacks and the platform was asked to install — Envoy Gateway,
#             MetalLB — as `cluster.*.install` chooses (adr/0112). Two Kustomizations each:
#             the chart, then its configuration (GatewayClass, IPAddressPool), because a
#             CR cannot be applied before the chart that brings its CRD. Not emitted when
#             the cluster brings its own.
# infra       operators — CNPG, External Secrets, the Garage operator, and cert-manager
#             when asked. Not sized by profile: one cert-manager is one cert-manager
#             whether it serves 5 people or 5,000, and an operator that is too small fails
#             as "nothing reconciles".
# platform    the shared stateful layer — gateway, postgres, cache, search, identity, and
#             the datastores and credentials of EVERY application, enabled or not, which
#             is what lets a disabled app come back with its data.
# objectstore Garage, only when the platform runs the object store itself.
#
# Monitoring is a leaf (adr/0119): nothing depends on either of its layers, so a stack that
# will not start blocks no release.
# cluster-monitoring  kube-prometheus-stack, under `monitoring.mode: platform`.
# monitoring  the rules, the probes and the blackbox exporter, under platform or external;
#             with the alert routing under platform, the namespace under external.
#
# There is deliberately no `crds` layer yet. Every CRD relied on is either pre-existing in
# the cluster or installed by an operator chart on first install; the layer arrives the
# first time a CRD upgrade needs managing separately.

apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra
  namespace: flux-system
  annotations: {helm.sh/resource-policy: keep}
spec:
  interval: 30m
  retryInterval: 2m
  timeout: 10m
  prune: true
  wait: true
  sourceRef: {kind: GitRepository, name: office-config}
  path: ./infra
  postBuild:
    substituteFrom: [{kind: ConfigMap, name: cluster-vars}]
---
# Source: control-plane/templates/layers.yaml
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform
  namespace: flux-system
  annotations: {helm.sh/resource-policy: keep}
spec:
  interval: 30m
  retryInterval: 2m
  timeout: 10m
  prune: true
  wait: true
  sourceRef: {kind: GitRepository, name: office-config}
  path: ./platform
  components: ["./overlays/size-small"]
  dependsOn:
    - {name: infra}
  postBuild:
    substituteFrom: [{kind: ConfigMap, name: cluster-vars}]
---
# Source: control-plane/templates/layers.yaml
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-monitoring
  namespace: flux-system
  annotations: {helm.sh/resource-policy: keep}
spec:
  interval: 30m
  retryInterval: 2m
  timeout: 10m
  prune: true
  wait: true
  sourceRef: {kind: GitRepository, name: office-config}
  path: ./cluster/monitoring
  postBuild:
    substituteFrom: [{kind: ConfigMap, name: cluster-vars}]
---
# Source: control-plane/templates/layers.yaml
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring
  namespace: flux-system
  annotations: {helm.sh/resource-policy: keep}
spec:
  interval: 30m
  retryInterval: 2m
  timeout: 10m
  prune: true
  wait: true
  sourceRef: {kind: GitRepository, name: office-config}
  path: ./monitoring
  components: ["./longhorn","./alerting"]
  dependsOn:
    - {name: cluster-monitoring}
  postBuild:
    substituteFrom: [{kind: ConfigMap, name: cluster-vars}]
