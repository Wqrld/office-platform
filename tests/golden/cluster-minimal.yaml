# Source: control-plane/templates/apps.yaml
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app-docs
  namespace: flux-system
spec:
  interval: 30m
  retryInterval: 2m
  timeout: 10m
  prune: true
  wait: true
  sourceRef: {kind: OCIRepository, name: office-config}
  path: ./apps/docs
  components: ["../overlays/size-small"]
  dependsOn:
    - {name: platform}
    - {name: app-find}
  postBuild:
    substitute: {"APP":"docs"}
    substituteFrom: [{kind: ConfigMap, name: cluster-vars}]
---
# Source: control-plane/templates/apps.yaml
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app-find
  namespace: flux-system
spec:
  interval: 30m
  retryInterval: 2m
  timeout: 10m
  prune: true
  wait: true
  sourceRef: {kind: OCIRepository, name: office-config}
  path: ./apps/find
  components: ["../overlays/size-small"]
  dependsOn:
    - {name: platform}
  postBuild:
