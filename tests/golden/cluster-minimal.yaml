---
# Source: control-plane/templates/cluster-vars.yaml
# The scalars the layers substitute (`postBuild.substituteFrom`), derived from the typed
# values above rather than written by hand: one input, one artifact, nothing twice.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-vars
  namespace: flux-system
  annotations: {helm.sh/resource-policy: keep}
data:
  BASE_DOMAIN: "example.org"
  STORAGE_CLASS: "longhorn"
  GATEWAY_IP: "10.0.0.5"
  TLS_ISSUER: "letsencrypt-gateway"
  ACME_EMAIL: "ops@example.org"
  S3_MODE: "external"
  TLS_HOSTS: "[\"id.example.org\",\"docs.example.org\",\"find.example.org\"]"
---
