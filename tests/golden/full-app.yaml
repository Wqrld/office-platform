spec:
  parentRefs:
    - name: office
      namespace: office-system
      sectionName: https
  hostnames: ["full.haaijer.dev"]
  rules:
    # Gateway API resolves overlapping matches by specificity, so the longest prefix wins
    # regardless of order here. No backendRef on purpose: if the filter fails to resolve,
    # the request 500s rather than reaching the backend it was meant to be kept from.
    - matches:
        - {path: {type: PathPrefix, value: /admin/metrics}}
        - {path: {type: PathPrefix, value: /api/internal}}
      filters:
        - type: ExtensionRef
          extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: full-api-deny
    - matches:
        - {path: {type: PathPrefix, value: /api}}
        - {path: {type: PathPrefix, value: /admin}}
      backendRefs:
        - {name: full-backend, port: 80}
