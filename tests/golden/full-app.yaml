# Source: platform-app/templates/traffic.yaml
# Body size and timeouts, the Gateway API way. `requestBuffer` makes Envoy hold the whole
# request before forwarding and reject anything larger — nginx's client_max_body_size — and
# it is only safe paired with a connection buffer large enough to hold it, set once on the
# Gateway in platform/gateway/traffic.yaml.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: full-api
  namespace: office-full
  labels:
    helm.sh/chart: platform-app-<version>
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: office
    app.kubernetes.io/name: full-platform
    app.kubernetes.io/instance: full-platform
spec:
  targetRefs:
    - {group: gateway.networking.k8s.io, kind: HTTPRoute, name: full-api}
  requestBuffer:
    limit: 100Mi
  timeout:
    http:
      requestTimeout: 300s
