# Source: platform-app/templates/mediaproxy.yaml
# The `/media` route's backend — adr/0109 for why a running pod lives in the surround.
#
# La Suite authorises an attachment by SUBREQUEST: ask the backend "may this session read
# this key?", then replay the S3 authorization headers it answers with onto the bucket.
# Envoy Gateway's extAuth cannot express it — `extAuth.http.path` is a prefix and Envoy
# appends the original path, so the check 404s and denies everything.
#
# WHAT WOULD REMOVE THIS: media served through the application's own backend, or a fixed
# (non-prefixed) ext-auth path in Envoy Gateway.
apiVersion: v1
kind: ConfigMap
metadata:
  name: full-media-proxy
  namespace: office-full
  labels:
    app.kubernetes.io/instance: full-platform
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: full-media-proxy
    app.kubernetes.io/part-of: office
    helm.sh/chart: platform-app-<version>
  annotations:
    # nginx configuration is full of $variables and Flux's postBuild substitution would
    # expand every one of them to the empty string — $host, $request_uri and the
    # auth_request_set values all vanish, and the proxy silently serves 403s.
    kustomize.toolkit.fluxcd.io/substitute: disabled
data:
  default.conf: |
    
    server {
      listen 8080;
      charset utf-8;
      server_tokens off;
    
      location = /healthz { access_log off; return 200 "ok\n"; }
    
      client_max_body_size 20m;
    
      location /media/preview/ {
        auth_request /media-auth;
        auth_request_set $authHeader        $upstream_http_authorization;
        auth_request_set $authDate          $upstream_http_x_amz_date;
        auth_request_set $authContentSha256 $upstream_http_x_amz_content_sha256;
    
        proxy_set_header Authorization        $authHeader;
        proxy_set_header X-Amz-Date           $authDate;
        proxy_set_header X-Amz-Content-SHA256 $authContentSha256;
    
        # Path-style, so the bucket name is part of the path.
        proxy_pass       http://office-s3.office-data.svc.cluster.local:3900/full/;
        proxy_set_header Host office-s3.office-data.svc.cluster.local:3900;
    
        # Not optional: these are user uploads on the application's own origin, so
        # without it a stored .html or .svg is a stored-XSS primitive.
        add_header Content-Security-Policy "default-src 'none'" always;
      }
    
      location /media/ {
        auth_request /media-auth;
        auth_request_set $authHeader        $upstream_http_authorization;
        auth_request_set $authDate          $upstream_http_x_amz_date;
        auth_request_set $authContentSha256 $upstream_http_x_amz_content_sha256;
    
        proxy_set_header Authorization        $authHeader;
        proxy_set_header X-Amz-Date           $authDate;
        proxy_set_header X-Amz-Content-SHA256 $authContentSha256;
    
        # Path-style, so the bucket name is part of the path.
        proxy_pass       http://office-s3.office-data.svc.cluster.local:3900/full/;
        proxy_set_header Host office-s3.office-data.svc.cluster.local:3900;
    
        # Not optional: these are user uploads on the application's own origin, so
        # without it a stored .html or .svg is a stored-XSS primitive.
        add_header Content-Security-Policy "default-src 'none'" always;
        proxy_hide_header Content-Disposition;
        add_header Content-Disposition "attachment" always;
        proxy_hide_header X-Extra;
        add_header X-Extra "1" always;
      }
    
      location /media-auth {
        internal;
        # The session cookie rides along, which is how the backend knows who is asking;
        # X-Original-URL is how it learns which attachment.
        proxy_pass              http://full-backend.office-full.svc.cluster.local:80/api/v1.0/media-auth/;
        proxy_set_header        X-Forwarded-Proto https;
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header        X-Original-URL    $request_uri;
        proxy_set_header        X-Original-Method $request_method;
        proxy_pass_request_body off;
        proxy_set_header        Content-Length "";
      }
    }
---
# Source: platform-app/templates/static.yaml
# A few files served from the application's own origin.
#
# It exists because some upstream frontends take a URL rather than content: Drive's
# `FRONTEND_JS_URL` injects a <script> tag, and there is no other way to reach that page.
# Serving it from our own host keeps the application free of a third-party CDN.
#
# The files come from a ConfigMap someone else made — `filesConfigMap` — rather than from
# values, so they can stay real files in the config repo instead of block scalars inside a
# HelmRelease. nginx reads from disk per request and a mounted ConfigMap updates in place,
# so editing them does not need a restart.
#
# Not a general web server: everything here is public, cached and read-only.
apiVersion: v1
kind: ConfigMap
metadata:
  name: full-static-conf
  namespace: office-full
  labels:
    app.kubernetes.io/instance: full-platform
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: full-static
    app.kubernetes.io/part-of: office
    helm.sh/chart: platform-app-<version>
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
data:
  default.conf: |
    server {
      listen 8080;
      charset utf-8;
      server_tokens off;
      location = /healthz { access_log off; return 200 "ok\n"; }
      location /custom/ {
        alias /srv/;
        # Everything here is ours and public, but it is still served from the application's
        # origin, so it gets the same treatment as any other asset.
        add_header Cache-Control "public, max-age=600" always;
        add_header X-Content-Type-Options nosniff always;
        types { application/javascript js; text/css css; image/svg+xml svg; }
      }
    }
---
