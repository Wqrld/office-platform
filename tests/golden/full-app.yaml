apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: full-api
  namespace: office-full
  labels:
    helm.sh/chart: platform-app-<version>
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: office
    app.kubernetes.io/name: full-platform
