apiVersion: apps/v1
kind: Deployment
metadata:
  name: full-media-proxy
  namespace: office-full
  labels:
    app.kubernetes.io/instance: full-platform
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: full-media-proxy
    app.kubernetes.io/part-of: office
    helm.sh/chart: platform-app-<version>
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: full-media-proxy
  template:
    metadata:
      annotations:
        # nginx reads its config once at startup, so a ConfigMap change needs a restart.
        checksum/config: 28a252dcf3a43f569882da4e1f48398aefd5874ecd50387bb632cbe12f3925bd
      labels:
        app.kubernetes.io/name: full-media-proxy
    spec:
      priorityClassName: office-app
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: nginx
          # Fully qualified: this cluster's CRI-O resolves a bare name against quay.io.
          # The unprivileged image listens on 8080 as uid 101 — no root, no capabilities.
          image: docker.io/nginxinc/nginx-unprivileged:1.29-alpine
          ports:
            - {name: http, containerPort: 8080}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            limits:
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 32Mi
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
            initialDelaySeconds: 3
          volumeMounts:
            - {name: conf, mountPath: /etc/nginx/conf.d}
            - {name: cache, mountPath: /var/cache/nginx}
            - {name: run, mountPath: /var/run}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: conf
          configMap: {name: full-media-proxy}
        - {name: cache, emptyDir: {}}
        - {name: run, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
